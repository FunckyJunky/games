<style>
  :root { --fg: #39ff7a; --dim: #1b7a3c; --bg: #031208; --glow: rgba(57,255,122,.55); }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body {
    display: grid; place-items: center;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent; touch-action: none;
    cursor: default;
  }

  /* the picture tube */
  #tube {
    position: relative; overflow: hidden; background: #000;
    border-radius: 18px / 22px;
    box-shadow: 0 0 0 3px #0c0c0c, 0 0 0 7px #161616, 0 0 80px rgba(0,0,0,.9);
  }
  #tube.flat { border-radius: 3px; }
  #crt { position: absolute; inset: 0; background: var(--bg); transform-origin: 50% 50%; }
  #crt.flicker { animation: flicker .12s steps(2) infinite; }
  @keyframes flicker { 50% { opacity: .965; } }

  #logo { position: absolute; z-index: 1; display: block; }
  #flow { position: absolute; z-index: 1; display: none; touch-action: none; }
  #boxes { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
  .box { position: absolute; border: 3px double var(--fg); box-shadow: 0 0 6px var(--glow), inset 0 0 6px var(--glow); }
  .box.panel { background: var(--bg); }
  #text {
    position: absolute; inset: 0; z-index: 3;
    font-family: 'VT323', ui-monospace, monospace; color: var(--fg);
    text-shadow: 0 0 5px var(--glow);
    white-space: pre;
  }
  #text .row { display: block; overflow: hidden; }
  #text .i { background: var(--fg); color: var(--bg); text-shadow: none; box-shadow: 0 0 6px var(--glow); }
  #text .d { color: var(--dim); text-shadow: none; }
  #text .m { background: var(--bg); }
  #text.rgb { text-shadow: -2px 0 rgba(255,40,80,.85), 2px 0 rgba(40,140,255,.85); }

  /* glass effects */
  #fx { position: absolute; inset: 0; z-index: 5; pointer-events: none; }
  #scan {
    position: absolute; inset: 0; z-index: 6; pointer-events: none;
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,.30) 0 1px, rgba(0,0,0,0) 1px 3px);
  }
  #roll {
    position: absolute; left: 0; right: 0; height: 14%; z-index: 7; pointer-events: none;
    background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,.045) 60%, rgba(255,255,255,0));
    animation: roll 7s linear infinite;
  }
  @keyframes roll { from { top: -15%; } to { top: 101%; } }
  #glass {
    position: absolute; inset: 0; z-index: 8; pointer-events: none;
    background:
      radial-gradient(ellipse 120% 90% at 30% 10%, rgba(255,255,255,.06), rgba(255,255,255,0) 40%),
      radial-gradient(ellipse at center, rgba(0,0,0,0) 58%, rgba(0,0,0,.55) 100%);
    box-shadow: inset 0 0 70px rgba(0,0,0,.85);
    border-radius: inherit;
  }
  #tube.flat #glass { background: radial-gradient(ellipse at center, rgba(0,0,0,0) 70%, rgba(0,0,0,.35) 100%); box-shadow: inset 0 0 25px rgba(0,0,0,.6); }
  #noise { position: absolute; inset: 0; z-index: 9; pointer-events: none; width: 100%; height: 100%; }
  #glitch { position: absolute; inset: 0; z-index: 4; pointer-events: none; }
  #glitch .band { position: absolute; inset: 0; background: var(--bg); }
  #glitch .inv { position: absolute; left: 0; right: 0; background: #fff; mix-blend-mode: difference; }

  /* glitch moves */
  #crt.jitter { animation: jitter .07s steps(2) infinite; }
  @keyframes jitter { 0% { transform: translate(1.5px, 0); } 100% { transform: translate(-1.5px, 1px); } }
  #crt.rollslip { animation: rollslip .45s cubic-bezier(.3,.7,.4,1); }
  @keyframes rollslip { 0% { transform: translateY(0); } 25% { transform: translateY(-22%); } 26% { transform: translateY(16%); } 100% { transform: translateY(0); } }

  /* power */
  #crt.off { animation: poweroff .42s ease-in forwards; }
  @keyframes poweroff {
    0% { transform: scale(1, 1); filter: brightness(1); }
    55% { transform: scale(1, .004); filter: brightness(4); }
    85% { transform: scale(.12, .004); filter: brightness(6); }
    100% { transform: scale(0, 0); filter: brightness(0); }
  }
  #crt.on { animation: poweron .5s ease-out; }
  @keyframes poweron {
    0% { transform: scale(0, .004); filter: brightness(6); }
    35% { transform: scale(1, .004); filter: brightness(4); }
    100% { transform: scale(1, 1); filter: brightness(1); }
  }
  noscript { color: #39ff7a; font-family: monospace; }

  /* ---------- access code for locked programs: a DOS window with a number pad ---------- */
  #lock { position: absolute; inset: 0; z-index: 6; display: none; place-items: center; background: rgba(3,18,8,.72);
    font-family: 'VT323', ui-monospace, monospace; color: var(--fg); text-shadow: 0 0 5px var(--glow); touch-action: manipulation; }
  #lock.show { display: grid; }
  #lock .win { background: var(--bg); border: 3px double var(--fg); box-shadow: 0 0 10px var(--glow), inset 0 0 8px var(--glow);
    width: min(88vw, 340px); padding: 10px 14px 12px; box-sizing: border-box; text-align: center; }
  #lock .win.shake { animation: lockshake .38s; }
  @keyframes lockshake { 20%, 60% { transform: translateX(-7px); } 40%, 80% { transform: translateX(7px); } }
  #lock h2 { margin: -10px -14px 8px; padding: 2px 0; background: var(--fg); color: var(--bg); text-shadow: none; font-weight: normal; font-size: clamp(22px, 5.4vmin, 28px); letter-spacing: 1px; }
  #lock .say { margin: 2px 0; font-size: clamp(19px, 4.6vmin, 24px); }
  #lock .slots { display: flex; gap: 8px; justify-content: center; margin: 8px 0 6px; }

  #lock .slot.cur { box-shadow: inset 0 -5px 0 var(--fg); animation: lockcur 1.06s steps(1) infinite; }
  @keyframes lockcur { 50% { box-shadow: none; } }
  #lock .msg { min-height: 1.15em; font-size: clamp(18px, 4.4vmin, 22px); }
  #lock .msg.err { color: #ff5a6a; text-shadow: 0 0 6px rgba(255,90,106,.6); }

    box-shadow: inset 0 0 6px var(--glow); touch-action: manipulation; }
  #lock .pad div.fn { font-size: clamp(18px, 4.4vmin, 22px); display: grid; place-items: center; }
  #lock .pad div.on { background: var(--fg); color: var(--bg); text-shadow: none; }
  #lock .back { margin-top: 8px; font-size: clamp(18px, 4.2vmin, 21px); cursor: pointer; opacity: .85; }

<script>
(() => {
'use strict';

// ===================================================================
// settings
// ===================================================================
const SCHEMES = [
  { name: 'GREEN',    fg: '#39ff7a', dim: '#1b7a3c', bg: '#031208', glow: 'rgba(57,255,122,.55)' },
  { name: 'AMBER',    fg: '#ffb43a', dim: '#8a5a12', bg: '#120a02', glow: 'rgba(255,180,58,.5)' },
  { name: 'WHITE',    fg: '#e9f0ff', dim: '#6b7080', bg: '#08090d', glow: 'rgba(233,240,255,.4)' },
  { name: 'DOS BLUE', fg: '#f2f2ff', dim: '#8d98ff', bg: '#0019a6', glow: 'rgba(200,210,255,.35)' },
  { name: 'CYAN',     fg: '#45f0ff', dim: '#157a85', bg: '#021014', glow: 'rgba(69,240,255,.5)' },
];
const GLITCH = ['OFF', 'LOW', 'MEDIUM', 'HIGH'];
const BOOT = ['FULL', 'SHORT', 'OFF'];
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
// settings saved by the old FK-DOS name move over to ERROR-DOS
try {
  for (const k of ['settings', 'stats', 'sel']) {
    const o = localStorage.getItem('fk' + 'dos-' + k);
    if (o != null && localStorage.getItem('errordos-' + k) == null) localStorage.setItem('errordos-' + k, o);
    if (o != null) localStorage.removeItem('fk' + 'dos-' + k);
  }
} catch (e) {}
const S = Object.assign({ color: 0, glitch: 1, curved: true, sound: true, boot: 0, full: false, view: 0 }, store.get('errordos-settings', {}));
const stats = store.get('errordos-stats', {});
function saveSettings() { store.set('errordos-settings', S); }

// ===================================================================
// elements and layout
// ===================================================================
const $ = id => document.getElementById(id);
const tube = $('tube'), crt = $('crt'), textEl = $('text'), boxesEl = $('boxes'), glitchEl = $('glitch');
const logoCv = $('logo'), lctx = logoCv.getContext('2d');
const flowCv = $('flow'), fctx = flowCv.getContext('2d');
const noiseCv = $('noise'), nctx = noiseCv.getContext('2d');

let COLS = 40, ROWS = 32, CW = 10, LH = 20, PADX = 12, PADY = 10, WIDE = false, LAY = null;
let charRatio = 0.4;

function measureFont() {
  const s = document.createElement('span');
  s.style.cssText = 'position:absolute;visibility:hidden;font:100px VT323,monospace;white-space:pre';
  s.textContent = 'MMMMMMMMMM';
  document.body.appendChild(s);
  charRatio = s.getBoundingClientRect().width / 1000 || 0.4;
  s.remove();
}

function layout() {
  const vw = window.innerWidth, vh = window.innerHeight;
  WIDE = vw / vh > 1.05 && vw > 620;
  const margin = Math.min(vw, vh) < 500 ? 8 : 28;
  const availW = vw - margin * 2, availH = vh - margin * 2;
  if (WIDE) { COLS = 80; ROWS = 25; }
  else {
    // a phone is tall: keep 40 columns and use as many rows as fit
    COLS = 40;
    const fsW = availW / ((COLS + 2.4) * charRatio);
    ROWS = Math.max(30, Math.min(44, Math.floor(availH / fsW - 1.6)));
  }
  // padding inside the tube is about one character
  let fs = Math.min(availW / ((COLS + 2.4) * charRatio), availH / (ROWS + 1.6));
  fs = Math.max(8, Math.floor(fs * 2) / 2);
  CW = fs * charRatio; LH = fs;
  PADX = Math.round(CW * 1.2); PADY = Math.round(LH * 0.8);
  const W = Math.round(COLS * CW + PADX * 2), H = Math.round(ROWS * LH + PADY * 2);
  tube.style.width = W + 'px'; tube.style.height = H + 'px';
  textEl.style.fontSize = fs + 'px';
  textEl.style.lineHeight = LH + 'px';
  textEl.style.left = boxesEl.style.left = PADX + 'px';
  textEl.style.top = boxesEl.style.top = PADY + 'px';
  textEl.style.right = textEl.style.bottom = 'auto';
  noiseCv.width = W; noiseCv.height = H;

  if (S.view) {
    // 3D view: one large panel across the screen, the picked program's name under it
    const pr1 = WIDE ? 19 : ROWS - 8;
    LAY = {
      status: 0,
      tabs: { r: 2, c0: 0, c1: COLS - 1 },
      panel: { r0: 3, c0: 0, r1: pr1, c1: COLS - 1 },
      caption: pr1 + 1,
      desc: { r: pr1 + 2, c0: 0, c1: COLS - 1 },
      prompt: WIDE ? 22 : ROWS - 4, msg: WIDE ? 23 : ROWS - 3, fkeys: ROWS - 1,
    };
    LAY.logo = LAY.panel;
  } else if (WIDE) {
    LAY = {
      status: 0,
      logo: { r0: 2, c0: 0, r1: 16, c1: 43 },
      tabs: { r: 2, c0: 46, c1: 79 },
      list: { r0: 4, r1: 13, c0: 46, c1: 79 },
      summary: { r: 15, c0: 46 },
      desc: { r: 18, c0: 0, c1: 79 },
      prompt: 20, msg: 21, fkeys: 24,
    };
  } else {
    const extra = Math.max(0, ROWS - 32), lr1 = 13 + Math.floor(extra * 0.5);
    LAY = {
      status: 0,
      logo: { r0: 2, c0: 0, r1: lr1, c1: 39 },
      tabs: { r: lr1 + 2, c0: 0, c1: 39 },
      list: { r0: lr1 + 4, r1: ROWS - 9, c0: 0, c1: 39 },
      summary: { r: ROWS - 8, c0: 0 },
      desc: { r: ROWS - 6, c0: 0, c1: 39 },
      prompt: ROWS - 4, msg: ROWS - 3, fkeys: ROWS - 1,
    };
  }
  placeLogo();
  dirty = true;
}

function cellRect(r0, c0, r1, c1) {
  return { x: PADX + c0 * CW, y: PADY + r0 * LH, w: (c1 - c0 + 1) * CW, h: (r1 - r0 + 1) * LH };
}
function placeLogo() {
  const b = LAY.logo;
  const r = cellRect(b.r0 + 1, b.c0 + 1, b.r1 - 1, b.c1 - 1);
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const cv = S.view ? flowCv : logoCv;
  cv.style.left = r.x + 'px'; cv.style.top = r.y + 'px';
  cv.style.width = r.w + 'px'; cv.style.height = r.h + 'px';
  cv.width = Math.round(r.w * dpr); cv.height = Math.round(r.h * dpr);
  logoCv.style.display = S.view ? 'none' : 'block';
  flowCv.style.display = S.view ? 'block' : 'none';
  L.reveal = 0;
}

// ===================================================================
// colours
// ===================================================================
let COL = SCHEMES[0];
function applyColors() {
  COL = SCHEMES[S.color % SCHEMES.length];
  const st = document.documentElement.style;
  st.setProperty('--fg', COL.fg); st.setProperty('--dim', COL.dim);
  st.setProperty('--bg', COL.bg); st.setProperty('--glow', COL.glow);
  tube.classList.toggle('flat', !S.curved);
  lctx.fillStyle = COL.bg; lctx.fillRect(0, 0, logoCv.width, logoCv.height);
  fctx.fillStyle = COL.bg; fctx.fillRect(0, 0, flowCv.width, flowCv.height);
  if (typeof FL !== 'undefined') FL.cards.forEach(k => { k.fresh = true; });
  dirty = true;
}

// ===================================================================
// text grid
// ===================================================================
let grid = [], attr = [], boxes = [], dirty = true;
function clear() {
  grid = []; attr = []; boxes = [];
  for (let r = 0; r < ROWS; r++) { grid.push(new Array(COLS).fill(' ')); attr.push(new Array(COLS).fill('')); }
}
function put(r, c, s, a) {
  if (r < 0 || r >= ROWS) return;
  s = String(s);
  for (let i = 0; i < s.length; i++) {
    const cc = c + i;
    if (cc < 0 || cc >= COLS) continue;
    grid[r][cc] = s[i];
    attr[r][cc] = a || '';
  }
}
function fill(r, c0, c1, a, ch) { for (let c = c0; c <= c1; c++) { if (c < 0 || c >= COLS) continue; grid[r][c] = ch || ' '; attr[r][c] = a || ''; } }
function box(r0, c0, r1, c1, title, panel) {
  boxes.push({ r0, c0, r1, c1, panel });
  if (panel) for (let r = r0; r <= r1; r++) fill(r, c0, c1, '');
  if (title) put(r0, c0 + 2, ' ' + title + ' ', 'm');
}
const GARBLE = '#$%&@*+=?/\\|~^<>{}[]';
let garbleUntil = 0;
function render() {
  const g = performance.now() < garbleUntil;
  let html = '';
  for (let r = 0; r < ROWS; r++) {
    let line = '', cur = null, run = '';
    for (let c = 0; c < COLS; c++) {
      let ch = grid[r][c];
      if (g && ch !== ' ' && Math.random() < 0.06) ch = GARBLE[(Math.random() * GARBLE.length) | 0];
      const a = attr[r][c];
      if (a !== cur) {
        if (run) line += cur ? '<span class="' + cur + '">' + esc(run) + '</span>' : esc(run);
        cur = a; run = '';
      }
      run += ch;
    }
    if (run) line += cur ? '<span class="' + cur + '">' + esc(run) + '</span>' : esc(run);
    html += '<span class="row" style="height:' + LH + 'px">' + line + '</span>';
  }
  textEl.innerHTML = html;
  let bh = '';
  for (const b of boxes) {
    const x = (b.c0 + 0.5) * CW, y = (b.r0 + 0.5) * LH, w = (b.c1 - b.c0) * CW, h = (b.r1 - b.r0) * LH;
    bh += '<div class="box' + (b.panel ? ' panel' : '') + '" style="left:' + x + 'px;top:' + y + 'px;width:' + w + 'px;height:' + h + 'px"></div>';
  }
  boxesEl.innerHTML = bh;
  dirty = false;
}
function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

// ===================================================================
// sound: all synthesized
// ===================================================================
let ac = null, audioUnlocked = false;
function audio() {
  if (!S.sound || !audioUnlocked) return null;
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
  if (ac.state === 'suspended') ac.resume();
  return ac;
}
function tone(freq, dur, vol, type, when) {
  const a = audio(); if (!a) return;
  const t = a.currentTime + (when || 0);
  const o = a.createOscillator(), g = a.createGain();
  o.type = type || 'square'; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + 0.02);
}
let noiseBuf = null;
function noise(dur, vol, freq, q, when) {
  const a = audio(); if (!a) return;
  if (!noiseBuf) {
    noiseBuf = a.createBuffer(1, a.sampleRate, a.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const t = a.currentTime + (when || 0);
  const src = a.createBufferSource(); src.buffer = noiseBuf;
  const f = a.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
  const g = a.createGain();
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(f).connect(g).connect(a.destination);
  src.start(t, Math.random() * 0.5); src.stop(t + dur + 0.02);
}
const SND = {
  beep() { tone(988, 0.16, 0.06, 'square'); },
  key() { noise(0.025, 0.25, 3500, 0.8); tone(1800, 0.01, 0.015, 'square'); },
  move() { tone(1200, 0.018, 0.025, 'square'); },
  crackle() { for (let i = 0; i < 4; i++) noise(0.03 + Math.random() * 0.05, 0.05 + Math.random() * 0.08, 900 + Math.random() * 3000, 0.6, Math.random() * 0.12); },
  floppy(sec) {
    const a = audio(); if (!a) return;
    tone(58, sec, 0.03, 'sawtooth');
    for (let t = 0; t < sec; t += 0.07 + Math.random() * 0.09) { tone(95 + Math.random() * 30, 0.03, 0.05, 'square', t); noise(0.02, 0.06, 1800, 1, t); }
  },
  thud() { tone(70, 0.12, 0.08, 'sine'); },
};

// ===================================================================
// games
// ===================================================================
let games = [], folders = { games: [], online: [], apps: [] };
const FOLDERS = ['games', 'online', 'apps'];
let folder = 0, sel = { games: 0, online: 0, apps: 0 }, scroll = { games: 0, online: 0, apps: 0 };
function dosName(g) {
  if (g.dos) return String(g.dos).toUpperCase().slice(0, 8);
  const base = String(g.title || g.id || '?').toUpperCase().replace(/[^A-Z0-9]/g, '');
  return base.length <= 8 ? base : base.slice(0, 6) + '~1';
}
function dosDate(iso) {
  const d = iso ? new Date(iso) : new Date();
  if (isNaN(d)) return '01-01-26  12:00a';
  const p = n => String(n).padStart(2, '0');
  let h = d.getHours(); const ap = h >= 12 ? 'p' : 'a'; h = h % 12 || 12;

function glitchTear(n) {
  const H = tube.clientHeight;
  for (let i = 0; i < (n || 2); i++) {
    const y = Math.random() * H, h = 3 + Math.random() * H * 0.08, dx = (Math.random() - 0.5) * 50;
    const band = document.createElement('div');
    band.className = 'band';
    band.style.clipPath = 'inset(' + y + 'px 0 ' + Math.max(0, H - y - h) + 'px 0)';
    band.style.transform = 'translateX(' + dx + 'px)';
    band.appendChild(boxesEl.cloneNode(true));
    band.appendChild(textEl.cloneNode(true));
    glitchEl.appendChild(band);
    setTimeout(() => band.remove(), 60 + Math.random() * 140);
  }
}
function glitchBlock() {
  const W = tube.clientWidth, H = tube.clientHeight;
  const x = Math.random() * W * 0.7, y = Math.random() * H * 0.8, w = 40 + Math.random() * W * 0.3, h = 10 + Math.random() * H * 0.15;
  const band = document.createElement('div');
  band.className = 'band';
  band.style.clipPath = 'inset(' + y + 'px ' + Math.max(0, W - x - w) + 'px ' + Math.max(0, H - y - h) + 'px ' + x + 'px)';
  band.style.transform = 'translate(' + ((Math.random() - 0.5) * 120) + 'px,' + ((Math.random() - 0.5) * 60) + 'px)';
  band.appendChild(textEl.cloneNode(true));
  glitchEl.appendChild(band);
  setTimeout(() => band.remove(), 90 + Math.random() * 200);
}
function glitchInvert() {
  const H = tube.clientHeight, d = document.createElement('div');
  d.className = 'inv';
  d.style.top = Math.random() * H + 'px'; d.style.height = (4 + Math.random() * H * 0.1) + 'px';
  glitchEl.appendChild(d);
  setTimeout(() => d.remove(), 50 + Math.random() * 120);
}
let staticUntil = 0;
function glitchStatic(ms) { staticUntil = performance.now() + (ms || 150); }
function drawStatic() {
  const W = noiseCv.width, H = noiseCv.height;
  nctx.clearRect(0, 0, W, H);
  if (performance.now() > staticUntil) return;
  nctx.fillStyle = COL.fg;
  for (let i = 0; i < 26; i++) {
    nctx.globalAlpha = Math.random() * 0.5;
    const y = Math.random() * H;
    nctx.fillRect(Math.random() * W * 0.5, y, Math.random() * W, 1 + Math.random() * 2);

}
function cls(el, c, ms) { el.classList.add(c); setTimeout(() => el.classList.remove(c), ms); }
function glitch(kind) {
  const k = kind || ['tear', 'tear', 'roll', 'jitter', 'block', 'rgb', 'static', 'invert', 'garble'][(Math.random() * 9) | 0];
  if (k === 'tear') glitchTear(1 + (Math.random() * 3 | 0));
  else if (k === 'roll') { crt.classList.remove('rollslip'); void crt.offsetWidth; cls(crt, 'rollslip', 460); }
  else if (k === 'jitter') cls(crt, 'jitter', 260);
  else if (k === 'block') { glitchBlock(); glitchBlock(); }
  else if (k === 'rgb') cls(textEl, 'rgb', 180);

// ----- running a program -----
async function run(unlocked) {
