<style>
  :root { --fg: #39ff7a; --dim: #1b7a3c; --bg: #031208; --glow: rgba(57,255,122,.55); }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body {
    display: grid; place-items: center;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent; touch-action: none;
    cursor: default;
  }

  /* the picture tube */
  #tube {
    position: relative; overflow: hidden; background: #000;
    border-radius: 18px / 22px;
    box-shadow: 0 0 0 3px #0c0c0c, 0 0 0 7px #161616, 0 0 80px rgba(0,0,0,.9);
  }
  #tube.flat { border-radius: 3px; }
  #crt { position: absolute; inset: 0; background: var(--bg); transform-origin: 50% 50%; }
  #crt.flicker { animation: flicker .12s steps(2) infinite; }
  @keyframes flicker { 50% { opacity: .965; } }

  #logo { position: absolute; z-index: 1; display: block; }
  #boxes { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
  .box { position: absolute; border: 3px double var(--fg); box-shadow: 0 0 6px var(--glow), inset 0 0 6px var(--glow); }
  .box.panel { background: var(--bg); }
  #text {
    position: absolute; inset: 0; z-index: 3;
    font-family: 'VT323', ui-monospace, monospace; color: var(--fg);
    text-shadow: 0 0 5px var(--glow);
    white-space: pre;
  }
  #text .row { display: block; overflow: hidden; }
  #text .i { background: var(--fg); color: var(--bg); text-shadow: none; box-shadow: 0 0 6px var(--glow); }
  #text .d { color: var(--dim); text-shadow: none; }
  #text .m { background: var(--bg); }
  #text.rgb { text-shadow: -2px 0 rgba(255,40,80,.85), 2px 0 rgba(40,140,255,.85); }

  /* glass effects */
  #fx { position: absolute; inset: 0; z-index: 5; pointer-events: none; }
  #scan {
    position: absolute; inset: 0; z-index: 6; pointer-events: none;
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,.30) 0 1px, rgba(0,0,0,0) 1px 3px);
  }
  #roll {
    position: absolute; left: 0; right: 0; height: 14%; z-index: 7; pointer-events: none;
    background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,.045) 60%, rgba(255,255,255,0));
    animation: roll 7s linear infinite;
  }
  @keyframes roll { from { top: -15%; } to { top: 101%; } }
  #glass {
    position: absolute; inset: 0; z-index: 8; pointer-events: none;
    background:
      radial-gradient(ellipse 120% 90% at 30% 10%, rgba(255,255,255,.06), rgba(255,255,255,0) 40%),
      radial-gradient(ellipse at center, rgba(0,0,0,0) 58%, rgba(0,0,0,.55) 100%);
    box-shadow: inset 0 0 70px rgba(0,0,0,.85);
    border-radius: inherit;
  }
  #tube.flat #glass { background: radial-gradient(ellipse at center, rgba(0,0,0,0) 70%, rgba(0,0,0,.35) 100%); box-shadow: inset 0 0 25px rgba(0,0,0,.6); }
  #noise { position: absolute; inset: 0; z-index: 9; pointer-events: none; width: 100%; height: 100%; }
  #glitch { position: absolute; inset: 0; z-index: 4; pointer-events: none; }
  #glitch .band { position: absolute; inset: 0; background: var(--bg); }
  #glitch .inv { position: absolute; left: 0; right: 0; background: #fff; mix-blend-mode: difference; }

  /* glitch moves */
  #crt.jitter { animation: jitter .07s steps(2) infinite; }
  @keyframes jitter { 0% { transform: translate(1.5px, 0); } 100% { transform: translate(-1.5px, 1px); } }
  #crt.rollslip { animation: rollslip .45s cubic-bezier(.3,.7,.4,1); }
  @keyframes rollslip { 0% { transform: translateY(0); } 25% { transform: translateY(-22%); } 26% { transform: translateY(16%); } 100% { transform: translateY(0); } }

  /* power */
  #crt.off { animation: poweroff .42s ease-in forwards; }
  @keyframes poweroff {
    0% { transform: scale(1, 1); filter: brightness(1); }
    55% { transform: scale(1, .004); filter: brightness(4); }
    85% { transform: scale(.12, .004); filter: brightness(6); }
    100% { transform: scale(0, 0); filter: brightness(0); }
  }
  #crt.on { animation: poweron .5s ease-out; }
  @keyframes poweron {
    0% { transform: scale(0, .004); filter: brightness(6); }
    35% { transform: scale(1, .004); filter: brightness(4); }
    100% { transform: scale(1, 1); filter: brightness(1); }
  }

<body>
<div id="tube">
  <div id="crt">
    <canvas id="logo"></canvas>
    <div id="boxes"></div>
    <div id="text"></div>
    <div id="glitch"></div>
  </div>

</div>
<noscript>ERROR-DOS needs JavaScript. Bad command or file name.</noscript>

<script>
(() => {
'use strict';

// ===================================================================
// settings
// ===================================================================
const SCHEMES = [
  { name: 'GREEN',    fg: '#39ff7a', dim: '#1b7a3c', bg: '#031208', glow: 'rgba(57,255,122,.55)' },
  { name: 'AMBER',    fg: '#ffb43a', dim: '#8a5a12', bg: '#120a02', glow: 'rgba(255,180,58,.5)' },
  { name: 'WHITE',    fg: '#e9f0ff', dim: '#6b7080', bg: '#08090d', glow: 'rgba(233,240,255,.4)' },
  { name: 'DOS BLUE', fg: '#f2f2ff', dim: '#8d98ff', bg: '#0019a6', glow: 'rgba(200,210,255,.35)' },
  { name: 'CYAN',     fg: '#45f0ff', dim: '#157a85', bg: '#021014', glow: 'rgba(69,240,255,.5)' },
];
const GLITCH = ['OFF', 'LOW', 'MEDIUM', 'HIGH'];
const BOOT = ['FULL', 'SHORT', 'OFF'];
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
// settings saved by the old FK-DOS name move over to ERROR-DOS
try {
  for (const k of ['settings', 'stats', 'sel']) {
    const o = localStorage.getItem('fk' + 'dos-' + k);
    if (o != null && localStorage.getItem('errordos-' + k) == null) localStorage.setItem('errordos-' + k, o);
    if (o != null) localStorage.removeItem('fk' + 'dos-' + k);
  }
} catch (e) {}
const S = Object.assign({ color: 0, glitch: 1, curved: true, sound: true, boot: 0 }, store.get('errordos-settings', {}));
const stats = store.get('errordos-stats', {});
function saveSettings() { store.set('errordos-settings', S); }

// ===================================================================
// elements and layout
// ===================================================================
const $ = id => document.getElementById(id);
const tube = $('tube'), crt = $('crt'), textEl = $('text'), boxesEl = $('boxes'), glitchEl = $('glitch');
const logoCv = $('logo'), lctx = logoCv.getContext('2d');
const noiseCv = $('noise'), nctx = noiseCv.getContext('2d');

let COLS = 40, ROWS = 32, CW = 10, LH = 20, PADX = 12, PADY = 10, WIDE = false, LAY = null;
let charRatio = 0.4;

function measureFont() {
  const s = document.createElement('span');
  s.style.cssText = 'position:absolute;visibility:hidden;font:100px VT323,monospace;white-space:pre';
  s.textContent = 'MMMMMMMMMM';
  document.body.appendChild(s);
  charRatio = s.getBoundingClientRect().width / 1000 || 0.4;
  s.remove();
}

function layout() {
  const vw = window.innerWidth, vh = window.innerHeight;
  WIDE = vw / vh > 1.05 && vw > 620;
  const margin = Math.min(vw, vh) < 500 ? 8 : 28;
  const availW = vw - margin * 2, availH = vh - margin * 2;
  if (WIDE) { COLS = 80; ROWS = 25; }
  else {
    // a phone is tall: keep 40 columns and use as many rows as fit
    COLS = 40;
    const fsW = availW / ((COLS + 2.4) * charRatio);
    ROWS = Math.max(30, Math.min(44, Math.floor(availH / fsW - 1.6)));
  }
  // padding inside the tube is about one character
  let fs = Math.min(availW / ((COLS + 2.4) * charRatio), availH / (ROWS + 1.6));
  fs = Math.max(8, Math.floor(fs * 2) / 2);
  CW = fs * charRatio; LH = fs;
  PADX = Math.round(CW * 1.2); PADY = Math.round(LH * 0.8);
  const W = Math.round(COLS * CW + PADX * 2), H = Math.round(ROWS * LH + PADY * 2);
  tube.style.width = W + 'px'; tube.style.height = H + 'px';
  textEl.style.fontSize = fs + 'px';
  textEl.style.lineHeight = LH + 'px';
  textEl.style.left = boxesEl.style.left = PADX + 'px';
  textEl.style.top = boxesEl.style.top = PADY + 'px';
  textEl.style.right = textEl.style.bottom = 'auto';
  noiseCv.width = W; noiseCv.height = H;

  if (WIDE) {
    LAY = {
      status: 0,
      logo: { r0: 2, c0: 0, r1: 16, c1: 43 },
      tabs: { r: 2, c0: 46, c1: 79 },
      list: { r0: 4, r1: 13, c0: 46, c1: 79 },
      summary: { r: 15, c0: 46 },
      desc: { r: 18, c0: 0, c1: 79 },
      prompt: 20, msg: 21, fkeys: 24,
    };
  } else {
    const extra = Math.max(0, ROWS - 32), lr1 = 13 + Math.floor(extra * 0.5);
    LAY = {
      status: 0,
      logo: { r0: 2, c0: 0, r1: lr1, c1: 39 },
      tabs: { r: lr1 + 2, c0: 0, c1: 39 },
      list: { r0: lr1 + 4, r1: ROWS - 9, c0: 0, c1: 39 },
      summary: { r: ROWS - 8, c0: 0 },
      desc: { r: ROWS - 6, c0: 0, c1: 39 },
      prompt: ROWS - 4, msg: ROWS - 3, fkeys: ROWS - 1,
    };
  }
  placeLogo();
  dirty = true;
}

function cellRect(r0, c0, r1, c1) {
  return { x: PADX + c0 * CW, y: PADY + r0 * LH, w: (c1 - c0 + 1) * CW, h: (r1 - r0 + 1) * LH };
}
function placeLogo() {
  const b = LAY.logo;
  const r = cellRect(b.r0 + 1, b.c0 + 1, b.r1 - 1, b.c1 - 1);
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  logoCv.style.left = r.x + 'px'; logoCv.style.top = r.y + 'px';
  logoCv.style.width = r.w + 'px'; logoCv.style.height = r.h + 'px';
  logoCv.width = Math.round(r.w * dpr); logoCv.height = Math.round(r.h * dpr);
  L.reveal = 0;
}

// ===================================================================
// colours
// ===================================================================
let COL = SCHEMES[0];
function applyColors() {
  COL = SCHEMES[S.color % SCHEMES.length];
  const st = document.documentElement.style;
  st.setProperty('--fg', COL.fg); st.setProperty('--dim', COL.dim);
  st.setProperty('--bg', COL.bg); st.setProperty('--glow', COL.glow);
  tube.classList.toggle('flat', !S.curved);
  lctx.fillStyle = COL.bg; lctx.fillRect(0, 0, logoCv.width, logoCv.height);
  dirty = true;
}

// ===================================================================
// text grid
// ===================================================================
let grid = [], attr = [], boxes = [], dirty = true;
function clear() {
  grid = []; attr = []; boxes = [];
  for (let r = 0; r < ROWS; r++) { grid.push(new Array(COLS).fill(' ')); attr.push(new Array(COLS).fill('')); }
}
function put(r, c, s, a) {
  if (r < 0 || r >= ROWS) return;
  s = String(s);
  for (let i = 0; i < s.length; i++) {
    const cc = c + i;
    if (cc < 0 || cc >= COLS) continue;
    grid[r][cc] = s[i];
    attr[r][cc] = a || '';
  }
}
function fill(r, c0, c1, a, ch) { for (let c = c0; c <= c1; c++) { if (c < 0 || c >= COLS) continue; grid[r][c] = ch || ' '; attr[r][c] = a || ''; } }
function box(r0, c0, r1, c1, title, panel) {
  boxes.push({ r0, c0, r1, c1, panel });
  if (panel) for (let r = r0; r <= r1; r++) fill(r, c0, c1, '');
  if (title) put(r0, c0 + 2, ' ' + title + ' ', 'm');
}
const GARBLE = '#$%&@*+=?/\\|~^<>{}[]';
let garbleUntil = 0;
function render() {
  const g = performance.now() < garbleUntil;
  let html = '';
  for (let r = 0; r < ROWS; r++) {
    let line = '', cur = null, run = '';
    for (let c = 0; c < COLS; c++) {
      let ch = grid[r][c];
      if (g && ch !== ' ' && Math.random() < 0.06) ch = GARBLE[(Math.random() * GARBLE.length) | 0];
      const a = attr[r][c];
      if (a !== cur) {
        if (run) line += cur ? '<span class="' + cur + '">' + esc(run) + '</span>' : esc(run);
        cur = a; run = '';
      }
      run += ch;
    }
    if (run) line += cur ? '<span class="' + cur + '">' + esc(run) + '</span>' : esc(run);
    html += '<span class="row" style="height:' + LH + 'px">' + line + '</span>';
  }
  textEl.innerHTML = html;
  let bh = '';
  for (const b of boxes) {
    const x = (b.c0 + 0.5) * CW, y = (b.r0 + 0.5) * LH, w = (b.c1 - b.c0) * CW, h = (b.r1 - b.r0) * LH;
    bh += '<div class="box' + (b.panel ? ' panel' : '') + '" style="left:' + x + 'px;top:' + y + 'px;width:' + w + 'px;height:' + h + 'px"></div>';
  }
  boxesEl.innerHTML = bh;
  dirty = false;
}
function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

// ===================================================================
// sound: all synthesized
// ===================================================================
let ac = null, audioUnlocked = false;
function audio() {
  if (!S.sound || !audioUnlocked) return null;
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
  if (ac.state === 'suspended') ac.resume();
  return ac;
}
function tone(freq, dur, vol, type, when) {
  const a = audio(); if (!a) return;
  const t = a.currentTime + (when || 0);
  const o = a.createOscillator(), g = a.createGain();
  o.type = type || 'square'; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + 0.02);
}
let noiseBuf = null;
function noise(dur, vol, freq, q, when) {
  const a = audio(); if (!a) return;
  if (!noiseBuf) {
    noiseBuf = a.createBuffer(1, a.sampleRate, a.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const t = a.currentTime + (when || 0);
  const src = a.createBufferSource(); src.buffer = noiseBuf;
  const f = a.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
  const g = a.createGain();
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(f).connect(g).connect(a.destination);
  src.start(t, Math.random() * 0.5); src.stop(t + dur + 0.02);
}
const SND = {
  beep() { tone(988, 0.16, 0.06, 'square'); },
  key() { noise(0.025, 0.25, 3500, 0.8); tone(1800, 0.01, 0.015, 'square'); },
  move() { tone(1200, 0.018, 0.025, 'square'); },
  crackle() { for (let i = 0; i < 4; i++) noise(0.03 + Math.random() * 0.05, 0.05 + Math.random() * 0.08, 900 + Math.random() * 3000, 0.6, Math.random() * 0.12); },
  floppy(sec) {
    const a = audio(); if (!a) return;
    tone(58, sec, 0.03, 'sawtooth');
    for (let t = 0; t < sec; t += 0.07 + Math.random() * 0.09) { tone(95 + Math.random() * 30, 0.03, 0.05, 'square', t); noise(0.02, 0.06, 1800, 1, t); }
  },
  thud() { tone(70, 0.12, 0.08, 'sine'); },
};

// ===================================================================
// games
// ===================================================================
let games = [], folders = { games: [], online: [], apps: [] };
const FOLDERS = ['games', 'online', 'apps'];
let folder = 0, sel = { games: 0, online: 0, apps: 0 }, scroll = { games: 0, online: 0, apps: 0 };
function dosName(g) {
  if (g.dos) return String(g.dos).toUpperCase().slice(0, 8);
  const base = String(g.title || g.id || '?').toUpperCase().replace(/[^A-Z0-9]/g, '');
  return base.length <= 8 ? base : base.slice(0, 6) + '~1';
}
function dosDate(iso) {
  const d = iso ? new Date(iso) : new Date();
  if (isNaN(d)) return '01-01-26  12:00a';
  const p = n => String(n).padStart(2, '0');
  let h = d.getHours(); const ap = h >= 12 ? 'p' : 'a'; h = h % 12 || 12;
  return p(d.getMonth() + 1) + '-' + p(d.getDate()) + '-' + String(d.getFullYear()).slice(2) + '  ' + String(h).padStart(2) + ':' + p(d.getMinutes()) + ap;
}
function current() { const list = folders[FOLDERS[folder]]; return list[sel[FOLDERS[folder]]] || null; }

// ===================================================================
// 3D logo window
// ===================================================================
const L = { t: 0, reveal: 0, tear: 0, kind: null, lit: [] };
function rotY(p, a) { const c = Math.cos(a), s = Math.sin(a); return [p[0] * c + p[2] * s, p[1], -p[0] * s + p[2] * c]; }
function rotX(p, a) { const c = Math.cos(a), s = Math.sin(a); return [p[0], p[1] * c - p[2] * s, p[1] * s + p[2] * c]; }
function rotZ(p, a) { const c = Math.cos(a), s = Math.sin(a); return [p[0] * c - p[1] * s, p[0] * s + p[1] * c, p[2]]; }
function cubeEdges(cx, cy, cz, sx, sy, sz, ry, out) {
  const v = [];
  for (let i = 0; i < 8; i++) {
    let p = [(i & 1 ? 1 : -1) * sx / 2, (i & 2 ? 1 : -1) * sy / 2, (i & 4 ? 1 : -1) * sz / 2];
    if (ry) p = rotY(p, ry);
    v.push([p[0] + cx, p[1] + cy, p[2] + cz]);
  }
  const e = [[0,1],[2,3],[4,5],[6,7],[0,2],[1,3],[4,6],[5,7],[0,4],[1,5],[2,6],[3,7]];
  for (const [a, b] of e) out.push([v[a], v[b]]);
}
function sceneHop(t, seg) {
  for (let z = -2; z <= 2; z++) seg.push([[-6, 0, z], [6, 0, z]]);
  const off = (t * 2.2) % 1;
  for (let i = -6; i <= 6; i++) seg.push([[i - off, 0, -2], [i - off, 0, 2]]);
  for (let k = 0; k < 3; k++) {
    const x = ((k * 4.1 - t * 2.2) % 12 + 12) % 12 - 6;
    const h = 0.5 + (k % 2) * 0.4;
    cubeEdges(x, h / 2, 0, 0.55, h, 0.55, 0, seg);
  }
  const ph = (t * 1.1) % 1, y = Math.sin(ph * Math.PI) * 1.6;
  cubeEdges(-1.6, 0.35 + y, 0, 0.7, 0.7, 0.7, y > 0.05 ? ph * Math.PI : 0, seg);
  return { yaw: -0.55 + Math.sin(t * 0.3) * 0.25, pitch: 0.32, dist: 8.5, ty: 1.0 };
}
function scenParty(t, seg) {
  for (let i = -4; i <= 4; i++) { seg.push([[-4, 0, i], [4, 0, i]]); seg.push([[i, 0, -4], [i, 0, 4]]); }
  for (let i = 0; i < 4; i++) {
    const a = t * 0.55 + i * Math.PI / 2, r = 1.7 + Math.sin(t * 0.9 + i) * 0.7;
    const x = Math.cos(a) * r, z = Math.sin(a) * r, bob = Math.abs(Math.sin(t * 7 + i * 1.3)) * 0.15;
    cubeEdges(x, 0.45 + bob, z, 0.55, 0.9, 0.4, -a, seg);
    cubeEdges(x, 1.15 + bob, z, 0.38, 0.38, 0.38, -a, seg);
  }
  return { yaw: t * 0.18, pitch: 0.5, dist: 9.5, ty: 0.4 };
}
function sceneWall(t, seg, quads) {
  const N = 8, s = 0.55, x0 = -N * s / 2, y0 = 0.2;
  for (let i = 0; i <= N; i++) {
    seg.push([[x0 + i * s, y0, 0], [x0 + i * s, y0 + N * s, 0]]);
    seg.push([[x0, y0 + i * s, 0], [x0 + N * s, y0 + i * s, 0]]);
  }
  if (Math.random() < 0.08) L.lit.push({ x: (Math.random() * N) | 0, y: (Math.random() * N) | 0, life: 1 });
  L.lit = L.lit.filter(c => (c.life -= 0.004) > 0);
  for (const c of L.lit) {
    const a = x0 + c.x * s + 0.06, b = y0 + c.y * s + 0.06, w = s - 0.12;

function openSetup() { if (mode !== 'main') return; mode = 'setup'; setupSel = 0; SND.key(); dirty = true; }
function drawSetup() {
  drawMain(); hits = [];
  const rows = setupRows(), w = Math.min(COLS - 4, 30), h = rows.length + 4;
  const c0 = Math.floor((COLS - w) / 2), r0 = Math.max(2, Math.floor((ROWS - h) / 2) - 1);
  box(r0, c0, r0 + h - 1, c0 + w - 1, 'SETUP', true);
  rows.forEach(([name, val, act], i) => {
    const r = r0 + 2 + i, on = i === setupSel;
    const line = ' ' + name.padEnd(9) + (val ? '< ' + val.padEnd(9) + ' >' : '');
    if (on) fill(r, c0 + 2, c0 + w - 3, 'i');
    put(r, c0 + 2, line, on ? 'i' : '');
    hits.push({ r, c0: c0 + 1, c1: c0 + w - 2, act: () => { setupSel = i; act(1); saveSettings(); SND.key(); dirty = true; } });
  });
  put(r0 + h - 1, c0 + w - 14, ' ESC: close ', 'm');
}
function setupKey(k) {
  const rows = setupRows();
  if (k === 'up') setupSel = (setupSel + rows.length - 1) % rows.length;
  else if (k === 'down') setupSel = (setupSel + 1) % rows.length;
  else if (k === 'left' || k === 'right' || k === 'enter') rows[setupSel][2](k === 'left' ? -1 : 1);
  else if (k === 'back') closeOverlay();
  saveSettings(); SND.key(); dirty = true;
}
function closeOverlay() { mode = 'main'; SND.key(); dirty = true; L.reveal = 0; }

// ----- properties -----
function openInfo() {
  const g = current(); if (mode !== 'main' || !g) return;
  mode = 'info'; SND.key();
  const st = stats[g.id] || {};
  infoData = {
    lines: [
      ['Name', g.title],
      ['File', dosName(g) + '.HTM'],
      ['Folder', 'C:\\' + FOLDERS[folder].toUpperCase()],
      ['Path', '/' + g.path],
      ['Added', dosDate(g.added)],
      ['Run', (st.runs || 0) + ' time(s)'],
      ['Last', st.last ? dosDate(st.last) : 'never'],
      ['Hi-score', g.scores ? 'loading...' : '-'],
    ],
    desc: g.description || '',
  };
  if (g.scores) {
    fetch('/api/scores?game=' + encodeURIComponent(g.id) + '&limit=1')
      .then(r => r.json())
      .then(j => { const s = j.scores && j.scores[0]; infoData.lines[7][1] = s ? s.name + ' ' + s.score : 'none yet'; dirty = true; })
      .catch(() => { infoData.lines[7][1] = 'offline'; dirty = true; });
  }
  dirty = true;
}
function drawInfo() {
  drawMain(); hits = [];
  const w = Math.min(COLS - 2, 38), inner = w - 4;
  const desc = wrap(infoData.desc, inner);
  const h = infoData.lines.length + desc.length + 6;
  const c0 = Math.floor((COLS - w) / 2), r0 = Math.max(1, Math.floor((ROWS - h) / 2));
  box(r0, c0, r0 + h - 1, c0 + w - 1, 'PROPERTIES', true);
  infoData.lines.forEach(([k, v], i) => put(r0 + 2 + i, c0 + 2, (k + ':').padEnd(10) + String(v).slice(0, inner - 10), ''));
  desc.forEach((line, i) => put(r0 + 3 + infoData.lines.length + i, c0 + 2, line, 'd'));
  const ok = '  OK  ';
  const okc = c0 + Math.floor((w - ok.length) / 2), okr = r0 + h - 2;
  put(okr, okc, ok, 'i');
  hits.push({ r: okr, c0: c0, c1: c0 + w - 1, act: closeOverlay });
  hits.push({ r: -1, all: true, act: closeOverlay });
}
function wrap(s, w) {
  const out = []; let line = '';
  for (const word of String(s).split(/\s+/)) {
    if ((line + ' ' + word).trim().length > w) { out.push(line.trim()); line = word; } else line += ' ' + word;
  }
  if (line.trim()) out.push(line.trim());
  return out;
}

// ----- boot -----
const sleep = ms => new Promise(r => setTimeout(r, bootSkip ? 0 : ms));
function bootPrint(s, a) { bootLines.push([s, a || '']); if (bootLines.length > ROWS - 1) bootLines.shift(); dirty = true; }
function drawBoot() {
  clear(); hits = [];
  bootLines.forEach(([s, a], i) => put(i, 0, s, a));
  if ((performance.now() / 530 | 0) % 2 === 0) put(bootLines.length, 0, ' ', 'i');
}
async function boot(kind) {
  mode = 'boot'; bootLines = []; bootSkip = false;
  if (kind === 0) {
    SND.beep();
    bootPrint('ERROR-BIOS (C) 2026 ' + (location.host || 'error.blue').toUpperCase(), '');
    bootPrint('');
    bootPrint('CPU     : Cloudflare Edge Worker');
    await sleep(250);
    const mem = Math.round((navigator.deviceMemory || 4) * 1024);
    bootPrint('');
    for (let m = 0; m <= mem; m += Math.max(64, mem / 18 | 0)) {
      bootLines[bootLines.length - 1] = ['Memory  : ' + Math.min(m, mem) + 'K', ''];
      dirty = true; await sleep(30);
    }
    bootLines[bootLines.length - 1] = ['Memory  : ' + mem + 'K OK', ''];
    await sleep(150);
    bootPrint('Display : ' + screen.width + 'x' + screen.height + ' ' + (S.curved ? 'curved' : 'flat') + ' CRT, ' + SCHEMES[S.color].name.toLowerCase());
    await sleep(120);
    bootPrint('Input   : ' + (('ontouchstart' in window) ? 'touch + ' : '') + 'keyboard' + (navigator.getGamepads ? ' + gamepad' : ''));
    await sleep(120);
    bootPrint('Sound   : PC speaker (synth)');
    await sleep(120);
    bootPrint('Drive C : ' + (location.host || 'error.blue'));
    await sleep(120);
    bootPrint('Network : ' + (navigator.onLine === false ? 'offline' : 'online'));
    bootPrint('Mode    : ' + (isApp() ? 'installed app' : 'browser'));
    await sleep(350);
    bootPrint('');
  }
  bootPrint('Starting ERROR-DOS...');
  await sleep(kind === 0 ? 500 : 200);
  bootPrint('');
  await typeLine('C:\\>', 'SCAN *.HTM /S');
  for (const g of games) {
    bootPrint('  ' + (dosName(g) + '.HTM').padEnd(14) + '<' + ({ online: 'ONLINE', apps: 'APP' }[g.folder] || 'GAME') + '>');
    SND.move(); await sleep(110);
  }
  bootPrint('  ' + games.length + ' program(s) found');
  bootPrint('');
  await typeLine('C:\\>', 'CD ' + FOLDERS[folder].toUpperCase());
  await sleep(250);
  enterMain(true);
}
async function typeLine(prompt, cmd) {
  bootPrint(prompt);
  for (let i = 1; i <= cmd.length; i++) {
    bootLines[bootLines.length - 1] = [prompt + cmd.slice(0, i), ''];
    dirty = true; SND.key(); await sleep(45 + Math.random() * 50);
  }
  await sleep(150);
}
function enterMain(withGlitch) {
  mode = 'main'; L.reveal = 0; dirty = true;
  if (withGlitch) burst(3);
}

// ----- running a program -----
async function run() {
  const g = current();
  if (mode !== 'main' || !g) return;
  mode = 'run';
  const name = dosName(g);
  typed = '';
  for (let i = 1; i <= name.length; i++) { typed = name.slice(0, i); dirty = true; SND.key(); await wait(55 + Math.random() * 45); }
  await wait(160);
  SND.floppy(1.0);
  for (let i = 0; i <= 20; i++) {
    message = 'Loading ' + name + '.HTM ';
    dirty = true;
    loadBar = i / 20;
    if (Math.random() < 0.3) glitch('tear');
    await wait(45);
  }
  burst(8);
  await wait(320);
  const st = stats[g.id] || (stats[g.id] = { runs: 0 });
  st.runs++; st.last = new Date().toISOString();
  store.set('errordos-stats', stats);
  try { sessionStorage.setItem('errordos-ran', name); } catch (e) {}
  crt.classList.remove('on'); crt.classList.add('off');
  tone(60, 0.4, 0.05, 'sine');
  await wait(470);
  location.href = '/' + g.path;
}
let loadBar = -1;
function wait(ms) { return new Promise(r => setTimeout(r, ms)); }
function drawLoadBar() {
  if (mode !== 'run' || loadBar < 0) return;
  const r = LAY.msg, start = message.length, w = Math.min(20, COLS - start - 1);
  put(r, 0, message, '');
  put(r, start, '[', '');
  const n = Math.round(loadBar * w);
  fill(r, start + 1, start + n, 'i');
  put(r, start + w + 1, ']', '');
}
function powerOn(msg) {
  crt.classList.remove('off'); void crt.offsetWidth;
  cls(crt, 'on', 520);
  tone(1500, 0.05, 0.02, 'sine');
  typed = ''; loadBar = -1;
  if (msg) { message = msg; messageUntil = performance.now() + 4500; }
  enterMain(false);
  setTimeout(() => burst(2), 520);
}

// ===================================================================
// input
// ===================================================================
function unlock() { if (!audioUnlocked) { audioUnlocked = true; audio(); } }
function key(k) {
  unlock();
  if (mode === 'boot') { bootSkip = true; return; }
  if (mode === 'setup') return setupKey(k === 'esc' || k === 'setup' ? 'back' : k);
  if (mode === 'info') { if (k === 'enter' || k === 'back' || k === 'esc' || k === 'info') closeOverlay(); return; }
  if (mode !== 'main') return;
  const F = FOLDERS[folder];
  if (k === 'up') select(sel[F] - 1);
  else if (k === 'down') select(sel[F] + 1);
  else if (k === 'left') setFolder((folder + FOLDERS.length - 1) % FOLDERS.length);
  else if (k === 'right') setFolder((folder + 1) % FOLDERS.length);
  else if (k === 'enter') run();
  else if (k === 'color') nextColor();
  else if (k === 'info') openInfo();
  else if (k === 'setup' || k === 'esc') openSetup();
  else if (k === 'glitch') burst(6);
  else if (k === 'pgup') select(sel[F] - 5);
  else if (k === 'pgdn') select(sel[F] + 5);
}
const KEYMAP = {
  ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
  Enter: 'enter', Space: 'enter', NumpadEnter: 'enter', KeyC: 'color', KeyY: 'color', KeyI: 'info', KeyX: 'info',
  Escape: 'esc', Backspace: 'back', KeyO: 'setup', F2: 'setup', KeyG: 'glitch', PageUp: 'pgup', PageDown: 'pgdn',
};
addEventListener('keydown', e => {
  let k = KEYMAP[e.code];
  if (!k) { if (mode === 'boot') { bootSkip = true; unlock(); } return; }
  e.preventDefault();
  key(k);
});

tube.addEventListener('pointerdown', e => {
  unlock();
  if (mode === 'boot') { bootSkip = true; return; }
  const rect = textEl.getBoundingClientRect();
  const r = Math.floor((e.clientY - rect.top) / LH), c = Math.floor((e.clientX - rect.left) / CW);
  const hit = hits.find(h => h.r === r && c >= h.c0 && c <= h.c1) || hits.find(h => h.all);
  if (hit) { e.preventDefault(); hit.act(); dirty = true; return; }
  // swipe on the logo window changes program
  swipeStart = { x: e.clientX, y: e.clientY };
});
let swipeStart = null;
addEventListener('pointerdown', () => { unlock(); if (mode === 'boot') bootSkip = true; });
tube.addEventListener('pointerup', e => {
  if (!swipeStart || mode !== 'main') { swipeStart = null; return; }
  const dx = e.clientX - swipeStart.x, dy = e.clientY - swipeStart.y;
  swipeStart = null;
  if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) key(dx < 0 ? 'down' : 'up');
  else if (Math.abs(dy) > 40) key(dy < 0 ? 'down' : 'up');
});

// game controller
const padPrev = {};
let padRepeat = 0;
function pollPad(now) {
  if (!navigator.getGamepads) return;
  for (const p of navigator.getGamepads()) {
    if (!p) continue;
    const b = i => !!(p.buttons[i] && p.buttons[i].pressed);
    const ax = p.axes || [];
    const state = {
      up: b(12) || ax[1] < -0.6, down: b(13) || ax[1] > 0.6, left: b(14) || ax[0] < -0.6, right: b(15) || ax[0] > 0.6,
      enter: b(0), back: b(1), info: b(2), color: b(3), pgup: b(4), pgdn: b(5), glitch: b(8), setup: b(9),
    };
    const prev = padPrev[p.index] || {};
    for (const k in state) {
      if (state[k] && !prev[k]) { key(k); if (k === 'up' || k === 'down') padRepeat = now + 380; }
      else if (state[k] && (k === 'up' || k === 'down') && now > padRepeat) { key(k); padRepeat = now + 110; }
    }
    padPrev[p.index] = state;
  }
}

// ===================================================================
// main loop
// ===================================================================
let last = performance.now(), lastText = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  pollPad(now);
  if (mode === 'main' || mode === 'run') marquee += dt * 7;
  if (now - lastText > 90 || dirty) {
    if (mode === 'boot') drawBoot();
    else if (mode === 'setup') drawSetup();
    else if (mode === 'info') drawInfo();
    else { drawMain(); drawLoadBar(); }
    render();
    lastText = now;
  }
  drawLogo(dt);
  logoCv.style.visibility = (mode === 'setup' || mode === 'info' || mode === 'boot') ? 'hidden' : 'visible';
  drawStatic();
  if (now > nextGlitch && (mode === 'main' || mode === 'setup')) { glitch(); scheduleGlitch(now); }
  requestAnimationFrame(frame);
}

// ===================================================================
// start
// ===================================================================
async function start() {
  try { await document.fonts.load('20px VT323'); } catch (e) {}
  measureFont();
  applyColors();
  layout();
  addEventListener('resize', () => { layout(); applyColors(); });
  crt.classList.add('flicker');
  scheduleGlitch(performance.now());
  requestAnimationFrame(frame);

  try {
    games = await fetch('/games.json', { cache: 'no-store' }).then(r => r.json());
  } catch (e) { games = []; }
  folders = { games: [], online: [], apps: [] };
  for (const g of games) (folders[FOLDERS.includes(g.folder) ? g.folder : 'games']).push(g);
  const saved = store.get('errordos-sel', null);
  if (saved) {
    folder = Math.min(FOLDERS.length - 1, Math.max(0, saved.folder | 0));
    for (const F of FOLDERS) sel[F] = Math.min(Math.max(0, (saved.sel && saved.sel[F]) | 0), Math.max(0, folders[F].length - 1));
  }
  if (!folders[FOLDERS[folder]].length) folder = 0;

  let ran = null;
  try { ran = sessionStorage.getItem('errordos-ran'); sessionStorage.removeItem('errordos-ran'); } catch (e) {}
  if (ran) powerOn('Program ended normally');
  else if (S.boot === 2) enterMain(true);
  else {
    let seen = false;
    try { seen = !!sessionStorage.getItem('errordos-booted'); sessionStorage.setItem('errordos-booted', '1'); } catch (e) {}
    boot(S.boot === 0 && seen ? 1 : S.boot);
  }
}
// ----- web app -----
let installPrompt = null;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); installPrompt = e; });
addEventListener('appinstalled', () => { installPrompt = null; message = 'ERROR-DOS installed'; messageUntil = performance.now() + 4000; dirty = true; });
function isApp() {
  return (window.matchMedia && (matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: fullscreen)').matches)) || navigator.standalone === true;
}
function installApp() {
  closeOverlay();
  if (installPrompt) { installPrompt.prompt(); installPrompt.userChoice.finally(() => { installPrompt = null; }); return; }
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  message = ios ? 'Safari: Share > Add to Home Screen' : 'Browser menu > Install app / Add to Home screen';
  messageUntil = performance.now() + 7000; dirty = true;
}
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));

// coming back with the browser's back button
addEventListener('pageshow', e => {
  if (e.persisted) {
    try { sessionStorage.removeItem('errordos-ran'); } catch (er) {}
    powerOn('Program ended normally');
  }
});
start();
})();
</script>
