<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ERROR-CUBE web app · try it</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=block" rel="stylesheet">
<style>
:root { --fg: #39ff7a; --dim: #1b7a3c; --bg: #031208; }
* { box-sizing: border-box; }
body { margin: 0; background: #0b0d0b; color: var(--fg); font: 20px/1.25 'VT323', monospace; text-shadow: 0 0 5px rgba(57,255,122,.45); }
header { display: flex; justify-content: space-between; align-items: center; background: var(--fg); color: var(--bg); text-shadow: none; padding: 4px 12px; }
header h1 { margin: 0; font-size: 24px; font-weight: normal; }
header a { color: var(--bg); text-decoration: none; }
main { display: flex; flex-wrap: wrap; gap: 18px; justify-content: center; padding: 16px 10px 40px; }
.cube { background: linear-gradient(160deg, #f4f4ee, #d9d9d0); border-radius: 46px; padding: 26px; box-shadow: 0 20px 50px #000a, inset 0 2px 0 #fff; position: relative; }
.cube .keys { position: absolute; top: -12px; left: 50%; transform: translateX(-50%); display: flex; gap: 38px; }
.cube .keys button { width: 46px; height: 18px; border-radius: 8px 8px 3px 3px; border: 0; background: linear-gradient(#fff, #d8d8d0); box-shadow: 0 -2px 0 #bbb inset; cursor: pointer; font: 14px monospace; color: #777; }
.cube .keys button:active { transform: translateY(3px); }
canvas { display: block; width: min(86vw, 480px); height: min(86vw, 480px); border-radius: 30px; background: #000; touch-action: none; }
.side { width: min(92vw, 340px); }
.side h2 { font-size: 20px; font-weight: normal; margin: 12px 0 6px; border-bottom: 3px double var(--dim); }
select, input, button.b { font: inherit; background: #000; color: var(--fg); border: 2px solid var(--fg); padding: 6px 10px; width: 100%; margin: 3px 0; }
button.b { cursor: pointer; }
button.b:active { background: var(--fg); color: var(--bg); }
.log { height: 120px; overflow: auto; border: 1px solid var(--dim); padding: 4px 6px; font-size: 17px; color: #b8ffd0; }
.dim { color: var(--dim); text-shadow: none; font-size: 17px; }
#err { color: #ff5a6a; white-space: pre-wrap; }
.tilt { width: 140px; height: 140px; border: 2px solid var(--dim); border-radius: 50%; position: relative; margin: 6px auto; touch-action: none; }
.tilt i { position: absolute; width: 22px; height: 22px; border-radius: 50%; background: var(--fg); left: 59px; top: 59px; box-shadow: 0 0 8px var(--fg); }
</style>
</head>
<body>
<header><h1>C:\WEB&gt;<span id="appName">APP</span></h1><a href="/cube/">&lt; ERROR-CUBE</a></header>
<main>
  <div class="cube">
    <div class="keys"><button id="kMinus" title="- (hold = BACK)">-</button><button id="kPwr" title="restart the app">PWR</button><button id="kPlus" title="+ (hold = OK)">+</button></div>
    <canvas id="cv" width="480" height="480"></canvas>
  </div>
  <div class="side">
    <h2>APP</h2>
    <select id="pick"></select>
    <button class="b" id="openCube">OPEN ON MY CUBE</button>
    <div id="err"></div>
    <h2>TILT (DRAG THE DOT)</h2>
    <div class="tilt" id="tilt"><i id="tiltDot"></i></div>
    <div class="dim">On a phone: tilts with the phone. Keys: arrows = - / +, ENTER = OK, ESC = BACK.</div>
    <h2>THE PHONE TALKS TO THE APP</h2>
    <input id="msg" placeholder="text -> onmsg({text})"><button class="b" id="msgBtn">SEND TO APP</button>
    <div class="log" id="log"></div>
    <a class="dim" id="src" href="#" target="_blank">source</a> · <a class="dim" href="README.md" target="_blank">API</a>
  </div>
</main>
<script>
// The ERROR-CUBE web app API, for the browser. Same names and numbers as on the cube (src/js/jsapp.cpp there).
(() => {
'use strict';
const cv = document.getElementById('cv'), gMain = cv.getContext('2d');
let g = gMain, kept = null, keepOn = false;   // keep(true): the app draws into a kept picture, overlay() on top
const FONTS = { 1: [37.5, 15, 25], 2: [50, 20, 33], 3: [150, 60, 90] };   // size: font px, cell width, baseline
const css = c => '#' + ((c === undefined ? FG : c) >>> 0 & 0xffffff).toString(16).padStart(6, '0');
let glowOn = true, exitAsked = false, fpsWant = 30;
const W = window;
Object.assign(W, {
  W: 480, H: 480, FG: 0x39ff7a, DIM: 0x1b7a3c, BG: 0x031208, RED: 0xff5a6a, WARN: 0xffb43a, WHITE: 0xffffff, BLACK: 0, VERSION: 'browser',
  cls(c) { g.fillStyle = css(c === undefined ? BG : c); g.fillRect(0, 0, 480, 480); },
  rect(x, y, w, h, c) { g.fillStyle = css(c); g.fillRect(x | 0, y | 0, w | 0, h | 0); },
  frame(x, y, w, h, c) { g.strokeStyle = css(c); g.lineWidth = 1; g.strokeRect((x | 0) + .5, (y | 0) + .5, (w | 0) - 1, (h | 0) - 1); },
  line(x0, y0, x1, y1, c) { g.strokeStyle = css(c); g.lineWidth = 1; g.beginPath(); g.moveTo((x0 | 0) + .5, (y0 | 0) + .5); g.lineTo((x1 | 0) + .5, (y1 | 0) + .5); g.stroke(); },
  thick(x0, y0, x1, y1, t, c) { g.strokeStyle = css(c); g.lineWidth = t || 3; g.lineCap = 'round'; g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke(); },
  circ(x, y, r, c) { g.fillStyle = css(c); g.beginPath(); g.arc(x, y, Math.max(0, r), 0, 7); g.fill(); },
  ring(x, y, r, c, t) { g.strokeStyle = css(c); g.lineWidth = t || 2; g.beginPath(); g.arc(x, y, Math.max(0, r + (t || 2) / 2), 0, 7); g.stroke(); },
  pset(x, y, c) { g.fillStyle = css(c); g.fillRect(x | 0, y | 0, 1, 1); },
  fade(x, y, w, h, c, a) { g.globalAlpha = a === undefined ? .5 : a; rect(x, y, w, h, c); g.globalAlpha = 1; },
  text(s, x, y, c, size, align, glow) {
    s = String(s); const f = FONTS[size >= 3 ? 3 : size == 2 ? 2 : 1], w = s.length * f[1];
    if (align == 1) x -= w / 2; else if (align == 2) x -= w;
    g.font = f[0] + 'px VT323'; g.fillStyle = css(c); g.textBaseline = 'alphabetic';
    if (glow !== false && glowOn) { g.shadowColor = css(c); g.shadowBlur = f[0] / 5; }
    for (let i = 0; i < s.length; i++) g.fillText(s[i], x + i * f[1], y + f[2]);
    g.shadowBlur = 0;
    return w;
  },
  textw(s, size) { return String(s).length * FONTS[size >= 3 ? 3 : size == 2 ? 2 : 1][1]; },
  box(x, y, w, h, c) {
    g.strokeStyle = css(c); g.shadowColor = css(c); g.shadowBlur = 8; g.lineWidth = 2;
    g.strokeRect(x + 1, y + 1, w - 2, h - 2); g.strokeRect(x + 5, y + 5, w - 10, h - 10); g.shadowBlur = 0;
  },
  button(s, x, y, w, h, on) {
    if (on) { rect(x, y, w, h, FG); text(s, x + w / 2, y + (h - 32) / 2, BG, 1, 1, false); }
    else { g.strokeStyle = css(FG); g.lineWidth = 2; g.strokeRect(x + 1, y + 1, w - 2, h - 2); text(s, x + w / 2, y + (h - 32) / 2, FG, 1, 1); }
  },
  bar(x, y, w, h, pct) {
    pct = Math.max(0, Math.min(100, pct)); g.strokeStyle = css(FG); g.lineWidth = 1; g.strokeRect(x + .5, y + .5, w - 1, h - 1);
    rect(x + 3, y + 3, (w - 6) * pct / 100, h - 6, FG);
  },
  tilt() { return tiltV.slice(); },
  gyro() { return [0, 0, 0]; },
  tone(hz, ms, vol) { beepNow(hz || 440, ms || 100, 'square', 0.06 * (vol === undefined ? 100 : vol) / 100); },
  beep(n) { const T = { key: [1800, 10], move: [1200, 18], beep: [988, 160], thud: [70, 120], ok: [1320, 120], err: [220, 260], msg: [1500, 200], alarm: [1000, 400], disk: [95, 300], crackle: [3000, 30] }; const t = T[n] || T.beep; beepNow(t[0], t[1], 'square', .05); },
  ms() { return Math.round(performance.now()); },
  clock() { const d = new Date(); return { h: d.getHours(), m: d.getMinutes(), s: d.getSeconds(), day: d.getDate(), mon: d.getMonth() + 1, year: d.getFullYear(), wday: d.getDay() }; },
  battery() { return -1; },
  exit() { exitAsked = true; },
  fps(n) { fpsWant = Math.max(1, Math.min(60, n | 0)); },
  keep(on) {
    keepOn = on === undefined ? true : !!on;
    if (keepOn && !kept) { kept = document.createElement('canvas'); kept.width = kept.height = 480; const k = kept.getContext('2d'); k.fillStyle = '#000'; k.fillRect(0, 0, 480, 480); }
    return true;
  },
  print(s) { console.log('[app]', s); log('print: ' + s); },
  save(k, v) { const st = JSON.parse(localStorage.getItem('cubeapp.' + APP) || '{}'); st[k] = v; localStorage.setItem('cubeapp.' + APP, JSON.stringify(st)); return true; },
  load(k, d) { const st = JSON.parse(localStorage.getItem('cubeapp.' + APP) || '{}'); return k in st ? st[k] : d; },
  get(path, cb) { fetch(String(path).startsWith('/') ? path : '/' + path).then(async r => cb && cb(r.status, await r.text())).catch(() => cb && cb(0, '')); },
  send(o) { log('to the phone: ' + JSON.stringify(o)); },
});
// 3D lines, as on the cube
const P3 = { x: 0, y: 0, z: 0, cy: 1, sy: 0, cp: 1, sp: 0, cr: 1, sr: 0, f: 240, cx: 240, cyy: 240, ox: 0, oy: 0, oz: 0, oc: 1, os: 0, ok: 1, X: 0, Y: 0, Z: 0 };
W.P3 = P3;
W.cam3 = (x, y, z, yaw, pitch, roll, f, cx, cy) => { Object.assign(P3, { x, y, z, cy: Math.cos(yaw || 0), sy: Math.sin(yaw || 0), cp: Math.cos(pitch || 0), sp: Math.sin(pitch || 0), cr: Math.cos(roll || 0), sr: Math.sin(roll || 0), f: f || 240, cx: cx === undefined ? 240 : cx, cyy: cy === undefined ? 240 : cy, ox: 0, oy: 0, oz: 0, oc: 1, os: 0, ok: 1 }); };
W.xf3 = (x, y, z, a, k) => { P3.ox = x || 0; P3.oy = y || 0; P3.oz = z || 0; P3.oc = Math.cos(a || 0); P3.os = Math.sin(a || 0); P3.ok = k === undefined ? 1 : k; };
function tc3(x, y, z) {
  const lx = x * P3.oc + z * P3.os, lz = z * P3.oc - x * P3.os;
  const dx = P3.ox + lx * P3.ok - P3.x, dy = P3.oy + y * P3.ok - P3.y, dz = P3.oz + lz * P3.ok - P3.z;
  const x1 = dx * P3.cy - dz * P3.sy, z1 = dx * P3.sy + dz * P3.cy, y2 = dy * P3.cp - z1 * P3.sp;
  P3.Z = dy * P3.sp + z1 * P3.cp; P3.X = x1 * P3.cr - y2 * P3.sr; P3.Y = x1 * P3.sr + y2 * P3.cr;
}
W.line3 = (ax, ay, az, bx, by, bz, c) => {
  tc3(ax, ay, az); let X0 = P3.X, Y0 = P3.Y, Z0 = P3.Z; tc3(bx, by, bz); let X1 = P3.X, Y1 = P3.Y, Z1 = P3.Z, f;
  if (Z0 < 1 && Z1 < 1) return;
  if (Z0 < 1) { f = (1 - Z0) / (Z1 - Z0); X0 += (X1 - X0) * f; Y0 += (Y1 - Y0) * f; Z0 = 1; }
  else if (Z1 < 1) { f = (1 - Z1) / (Z0 - Z1); X1 += (X0 - X1) * f; Y1 += (Y0 - Y1) * f; Z1 = 1; }
  line(P3.cx + X0 * P3.f / Z0, P3.cyy - Y0 * P3.f / Z0, P3.cx + X1 * P3.f / Z1, P3.cyy - Y1 * P3.f / Z1, c);
};
W.proj3 = (x, y, z) => { tc3(x, y, z); return P3.Z < 0.05 ? null : [P3.cx + P3.X * P3.f / P3.Z, P3.cyy - P3.Y * P3.f / P3.Z, P3.Z]; };

// sound
let ac = null;
function beepNow(hz, ms, type, vol) {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), gn = ac.createGain(), t = ac.currentTime;
    o.type = type; o.frequency.value = hz; gn.gain.setValueAtTime(vol, t); gn.gain.exponentialRampToValueAtTime(0.0001, t + ms / 1000);
    o.connect(gn).connect(ac.destination); o.start(t); o.stop(t + ms / 1000 + .02);
  } catch (e) {}
}

// tilt: drag the dot, or the phone's own sensor ([x right, y down, z into the screen], in g)
let tiltV = [0, 1, 0];
const tp = document.getElementById('tilt'), td = document.getElementById('tiltDot');
function setTilt(x, y) { x = Math.max(-1, Math.min(1, x)); y = Math.max(-1, Math.min(1, y)); tiltV = [x, 1 - Math.abs(x) * .3, y]; td.style.left = (59 + x * 55) + 'px'; td.style.top = (59 + y * 55) + 'px'; }
tp.addEventListener('pointermove', e => { if (!e.buttons) return; const r = tp.getBoundingClientRect(); setTilt((e.clientX - r.left) / r.width * 2 - 1, (e.clientY - r.top) / r.height * 2 - 1); });
tp.addEventListener('dblclick', () => setTilt(0, 0));
window.addEventListener('devicemotion', e => { const a = e.accelerationIncludingGravity; if (a && a.x !== null) tiltV = [-a.x / 9.81, a.y / 9.81, -a.z / 9.81]; });

// input
const call = (fn, ...a) => {
  // keep(true): drawing from touch(), key(), swipe()... goes into the kept picture too (like on the cube)
  const g0 = g; if (keepOn && kept && fn !== 'overlay' && g === gMain) g = kept.getContext('2d');
  try { return typeof W[fn] === 'function' ? W[fn](...a) : undefined; } catch (e) { crash(fn, e); } finally { g = g0; }
};
let down = null;
function pos(e) { const r = cv.getBoundingClientRect(); return [Math.round((e.clientX - r.left) * 480 / r.width), Math.round((e.clientY - r.top) * 480 / r.height)]; }
cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); const [x, y] = pos(e); down = { x, y, t: performance.now(), moved: false }; call('touch', 'down', x, y); });
cv.addEventListener('pointermove', e => { if (!down) return; const [x, y] = pos(e); if (Math.abs(x - down.x) + Math.abs(y - down.y) > 14) down.moved = true; if (down.moved) call('touch', 'move', x, y); });
cv.addEventListener('pointerup', e => {
  if (!down) return; const [x, y] = pos(e), dt = performance.now() - down.t, dx = x - down.x, dy = y - down.y;
  if (!down.moved) call('touch', 'tap', down.x, down.y);
  call('touch', 'up', x, y);
  if (down.moved && dt < 450) {
    if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.4) { if (dx > 0 && down.x < 40) restart(); else call('swipe', dx > 0 ? 'right' : 'left'); }
    else if (Math.abs(dy) > 70) call('swipe', dy > 0 ? 'down' : 'up');
  }
  down = null;
});
function key(k) { const used = call('key', k); if (!used && k === 'back') log('BACK: the cube would go back to the menu'); }
addEventListener('keydown', e => { const k = { ArrowUp: 'prev', ArrowLeft: 'prev', ArrowDown: 'next', ArrowRight: 'next', Enter: 'ok', Escape: 'back' }[e.key]; if (k) { e.preventDefault(); key(k); } });
function hold(el, short, long) {
  let t = 0, done = false;
  el.addEventListener('pointerdown', () => { done = false; t = setTimeout(() => { done = true; key(long); }, 600); });
  el.addEventListener('pointerup', () => { clearTimeout(t); if (!done) key(short); });
}
hold(document.getElementById('kPlus'), 'next', 'ok');
hold(document.getElementById('kMinus'), 'prev', 'back');
document.getElementById('kPwr').onclick = () => restart();

// the log + messages from "the phone"
function log(t) { const el = document.getElementById('log'); el.textContent += t + '\n'; el.scrollTop = 1e9; }
document.getElementById('msgBtn').onclick = () => { const v = document.getElementById('msg').value; if (typeof W.onmsg === 'function') call('onmsg', { text: v }); else log('this app has no onmsg()'); };

// run
let APP = new URLSearchParams(location.search).get('app') || 'hello', apps = [], last = 0, dead = false;
function crash(fn, e) { dead = true; document.getElementById('err').textContent = 'THE APP STOPPED in ' + fn + '():\n' + (e && e.message); cls(0x140306); text('THE APP STOPPED', 240, 200, RED, 1, 1); text(String(e && e.message).slice(0, 28), 240, 240, FG, 1, 1, false); }
function frame(t) {
  requestAnimationFrame(frame);
  if (dead || exitAsked) { if (exitAsked) { cls(BG); text('exit(): BACK TO THE MENU', 240, 220, DIM, 1, 1); } return; }
  if (t - last < 1000 / fpsWant - 2) return;
  const dt = Math.min(250, last ? t - last : 16); last = t;
  call('update', dt); call('draw');
  if (keepOn && kept) gMain.drawImage(kept, 0, 0);
  call('overlay');
  // the cube's scanlines
  g.fillStyle = 'rgba(0,0,0,.22)'; for (let y = 0; y < 480; y += 3) g.fillRect(0, y, 480, 1);
}
function restart() { location.reload(); }
async function start() {
  try { apps = (await fetch('apps.json', { cache: 'no-store' }).then(r => r.json())).apps; } catch (e) {}
  const pick = document.getElementById('pick');
  pick.innerHTML = apps.map(a => '<option value="' + a.id + '"' + (a.id === APP ? ' selected' : '') + '>' + a.name + ' · ' + (a.info || '') + '</option>').join('');
  pick.onchange = () => { location.search = '?app=' + pick.value; };
  const a = apps.find(x => x.id === APP) || { id: APP, name: APP, file: APP + '.js' };
  document.getElementById('appName').textContent = a.name;
  document.getElementById('src').href = a.file;
  W.APP = a.id;
  await document.fonts.load('37px VT323');
  const src = await fetch(a.file + '?v=' + Date.now()).then(r => r.text());
  try { (0, eval)(src); } catch (e) { crash('load', e); return; }
  call('init');
  requestAnimationFrame(frame);
}
document.getElementById('openCube').onclick = () => {
  let devs = []; try { devs = JSON.parse(localStorage.getItem('cube.devices') || '[]'); } catch (e) {}
  const code = localStorage.getItem('cube.sel') ? JSON.parse(localStorage.getItem('cube.sel')) : devs[0] && devs[0].code;
  if (!code) { alert('Add your cube first on error.blue/cube'); return; }
  const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/api/room/error-cube/' + code + '?name=PANEL');
  ws.onopen = () => { ws.send(JSON.stringify({ t: 'app', id: APP })); log('opened on cube ' + code); setTimeout(() => ws.close(), 800); };
};
start();
})();
</script>
</body>
</html>
