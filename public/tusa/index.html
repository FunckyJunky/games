<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Туса У Берліні</title>
<meta name="theme-color" content="#000000">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect width=%2716%27 height=%2716%27 rx=%273%27 fill=%27%23111%27/%3E%3Ctext x=%278%27 y=%2712%27 font-size=%2711%27 text-anchor=%27middle%27 fill=%27%23ffe23a%27%3EH%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Pixelify+Sans:wght@400;600&display=block" rel="stylesheet">
<style>
  :root { --fg: #39ff7a; --dim: #1b7a3c; --bg: #031208; --glow: rgba(57,255,122,.55); --neon: #ffe23a; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body {
    height: 100dvh; display: flex; flex-direction: column;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: none;
    font-family: 'Pixelify Sans', 'VT323', ui-monospace, monospace; color: #f4efe0;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    box-sizing: border-box;
  }
  button { font: inherit; }

  /* ---------- top bar ---------- */
  #hud { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 8px; height: 38px; box-sizing: border-box; }
  .hbtn {
    all: unset; cursor: pointer; padding: 4px 10px; border: 2px solid #3a3326; border-radius: 6px; color: #ffe9b8;
    font-family: 'Pixelify Sans', monospace; font-size: 14px; background: #15120d; white-space: nowrap;
  }
  .hbtn:active { background: var(--neon); color: #111; }
  #clock {
    font-family: 'VT323', monospace; font-size: 26px; color: var(--neon); letter-spacing: 2px;
    text-shadow: 0 0 6px rgba(255,226,58,.7), 0 0 14px rgba(255,170,40,.4); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #clock small { font-size: 15px; letter-spacing: 0; color: #ffd98a; }

  /* ---------- the game picture ---------- */
  #stage { flex: 1; min-height: 0; display: grid; place-items: center; position: relative; }
  #view { display: block; image-rendering: pixelated; border-radius: 6px; box-shadow: 0 0 0 2px #1d1810, 0 0 40px rgba(255,190,80,.08); }

  /* ---------- touch controls ---------- */
  #pad { flex: none; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; padding: 8px 10px 12px; }
  #pad.hidden { display: none; }
  .dpad { display: grid; grid-template-columns: repeat(3, 52px); grid-template-rows: repeat(3, 44px); gap: 4px; justify-self: start; }
  .dpad .b { grid-column: 2; }
  .dpad .l { grid-row: 2; grid-column: 1; } .dpad .r { grid-row: 2; grid-column: 3; } .dpad .d { grid-row: 3; grid-column: 2; } .dpad .u { grid-row: 1; grid-column: 2; }
  .pb {
    display: grid; place-items: center; border-radius: 10px; border: 2px solid #4a3f2c; border-bottom-width: 5px;
    background: linear-gradient(#2a241a, #17130d); color: #ffe9b8; font-family: 'Pixelify Sans', monospace; font-size: 18px; cursor: pointer;
  }
  .pb.on { background: var(--neon); color: #1a1405; border-color: #b8a020; transform: translateY(2px); border-bottom-width: 3px; }
  .emotes { display: flex; flex-direction: column; gap: 6px; }
  .emotes .pb { width: 64px; height: 38px; font-size: 14px; gap: 0; line-height: 1; text-align: center; }
  .emotes .pb span { font-size: 18px; display: block; }
  .ab { display: grid; grid-template-columns: 58px 70px; grid-template-rows: 70px 46px; gap: 6px; justify-self: end; align-items: end; }
  .ab .A { grid-column: 2; grid-row: 1 / 3; height: 78px; border-radius: 50%; font-size: 26px; background: radial-gradient(circle at 40% 35%, #ffe86a, #d4a514); color: #2a1d00; border-color: #8a6a0a; }
  .ab .B { grid-column: 1; grid-row: 2; height: 52px; border-radius: 50%; font-size: 20px; background: radial-gradient(circle at 40% 35%, #ff8a8a, #b8323a); color: #fff; border-color: #6a1418; }
  .ab .A.on, .ab .B.on { filter: brightness(1.3); transform: translateY(3px); }
  #keys { flex: none; text-align: center; font-size: 13px; color: #a89a7a; padding: 4px 0 8px; display: none; }
  @media (orientation: landscape) and (pointer: coarse) {
    #pad { position: absolute; left: 0; right: 0; bottom: 0; background: none; pointer-events: none; }
    #pad > * { pointer-events: auto; opacity: .82; }
  }

  /* ---------- DOS overlays: login, dialogs, menus ---------- */
  .dos {
    position: absolute; inset: 0; z-index: 20; display: none; flex-direction: column;
    background: var(--bg); color: var(--fg); font-family: 'VT323', 'Pixelify Sans', monospace;
    text-shadow: 0 0 5px var(--glow); padding: 14px 14px 10px; box-sizing: border-box;
  }
  .dos.show { display: flex; }
  .dos::after { content: ''; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(to bottom, rgba(0,0,0,.28) 0 1px, transparent 1px 3px); }
  #term { flex: 1; min-height: 0; overflow: hidden; white-space: pre-wrap; font-size: clamp(19px, 5vw, 28px); line-height: 1.12; }
  #term .big { font-family: 'Pixelify Sans', monospace; font-size: 1.35em; color: var(--neon); text-shadow: 0 0 8px rgba(255,226,58,.7); }
  #term .dim { color: var(--dim); text-shadow: none; }
  #term .err { color: #ff5a6a; text-shadow: 0 0 6px rgba(255,90,106,.6); }
  #term .cur { background: var(--fg); color: var(--bg); animation: blink 1.06s steps(1) infinite; }
  @keyframes blink { 50% { background: transparent; } }
  #loginKbd { flex: none; margin-top: 8px; }

  #dlg {
    position: absolute; z-index: 30; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: min(92vw, 420px); max-height: 86%; overflow: auto; display: none;
    background: rgba(3,18,8,.96); color: var(--fg); border: 3px double var(--fg); border-radius: 4px;
    box-shadow: 0 0 18px var(--glow); font-family: 'Pixelify Sans', 'VT323', monospace; padding: 12px 14px; box-sizing: border-box;
    text-shadow: 0 0 4px var(--glow);
  }
  #dlg.show { display: block; }
  #dlg h3 { margin: 0 0 6px; font-size: 19px; color: var(--neon); text-shadow: 0 0 8px rgba(255,226,58,.6); font-weight: 600; }
  #dlg p { margin: 4px 0 10px; font-size: 15px; line-height: 1.3; color: #d8ffe4; }
  #dlg .opts { display: flex; flex-direction: column; gap: 7px; }
  #dlg .opt {
    all: unset; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 2px solid var(--dim); border-radius: 4px;
    font-size: 16px; color: #e8ffe8;
  }
  #dlg .opt .ico { font-size: 22px; width: 28px; text-align: center; }
  #dlg .opt small { display: block; font-size: 12px; color: #9ad8aa; }
  #dlg .opt.sel, #dlg .opt:active { background: var(--fg); color: var(--bg); text-shadow: none; }
  #dlg .opt.sel small, #dlg .opt:active small { color: #0b3a18; }
  #dlg .opt .k { margin-left: auto; font-family: 'VT323', monospace; font-size: 18px; opacity: .8; }
</style>
</head>
<body>
  <div id="hud">
    <button class="hbtn" id="dosBtn">◄ DOS</button>
    <div id="clock">HOONGY</div>
    <button class="hbtn" id="radioBtn">📻 RADIO</button>
  </div>
  <div id="stage">
    <canvas id="view"></canvas>
    <div class="dos" id="login">
      <div id="term"></div>
      <div id="loginKbd"></div>
    </div>
    <div id="dlg"></div>
  </div>
  <div id="pad">
    <div class="dpad">
      <div class="pb u" data-k="up">▲</div><div class="pb l" data-k="left">◄</div>
      <div class="pb r" data-k="right">►</div><div class="pb d" data-k="down">▼</div>
    </div>
    <div class="emotes">
      <div class="pb" data-k="hug"><span>🤗</span>KNUF</div>
      <div class="pb" data-k="heart"><span>❤️</span>HART</div>
      <div class="pb" data-k="joke"><span>😂</span>ЖАРТ</div>
    </div>
    <div class="ab">
      <div class="pb A" data-k="a">A</div>
      <div class="pb B" data-k="b">B</div>
    </div>
  </div>
  <div id="keys">arrows / WASD walk · ENTER = A · ESC = B · H hug · L heart · J joke · R radio</div>

  <script src="/lib/errorkbd.js"></script>
  <script src="art.js"></script>
  <script src="tusa.js"></script>
</body>
</html>
