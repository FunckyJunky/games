<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, viewport-fit=cover, user-scalable=no">
<title>Туса У Берліні</title>
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Туса">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/tusa-180.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect width=%2716%27 height=%2716%27 rx=%273%27 fill=%27%23111%27/%3E%3Ctext x=%278%27 y=%2712%27 font-size=%2711%27 text-anchor=%27middle%27 fill=%27%23ffe23a%27%3EH%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Pixelify+Sans:wght@400;600&family=M+PLUS+Rounded+1c:wght@500;700;800;900&display=block" rel="stylesheet">
<style>
  :root { --fg: #39ff7a; --dim: #1b7a3c; --bg: #031208; --glow: rgba(57,255,122,.55); --neon: #ffe23a;
          --ink: #33241b; --paper: #fbf4e2; --paper2: #f1e4c4; --red: #cf3a2a; --round: 'M PLUS Rounded 1c', 'Pixelify Sans', sans-serif; }
  html, body { margin: 0; height: 100%; background: #1c1612; overflow: hidden; overscroll-behavior: none; }
  /* behaves like an app: no double-tap zoom, no pinch zoom, no text selection */
  * { touch-action: manipulation; -webkit-touch-callout: none; }
  #view, #pad, #pad * { touch-action: none; }
  body {
    height: 100dvh; display: flex; flex-direction: column;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: none;
    font-family: var(--round); color: #f4efe0;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    box-sizing: border-box;
  }
  button { font: inherit; }

  /* ---------- top bar ---------- */
  #hud { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 7px; padding: 5px 8px; height: 60px; box-sizing: border-box; }
  /* the dot-matrix DOS screen at the top: where you are, the time, and everything else that is going on */
  #dmx { flex: 1; min-width: 0; height: 50px; display: block; border-radius: 6px; background: #020a05;
    box-shadow: 0 0 0 2px #0f2a18, 0 0 0 4px #050505, inset 0 0 14px rgba(0,0,0,.9); }
  /* the DOS button: a small 3D ERROR-DOS logo on a black screen */
  #dosBtn { all: unset; cursor: pointer; flex: none; width: 70px; height: 50px; border-radius: 6px; background: #000; overflow: hidden;
    box-shadow: 0 0 0 2px #0f2a18, 0 0 0 4px #050505, 0 0 10px rgba(57,255,122,.25); }
  #dosBtn canvas { display: block; width: 100%; height: 100%; }
  #dosBtn:active { filter: brightness(1.4); transform: translateY(1px); }
  .hbtn {
    all: unset; cursor: pointer; padding: 3px 10px; border: 2px solid var(--ink); border-radius: 9px; color: var(--ink);
    font-family: var(--round); font-weight: 800; font-size: 14px; background: var(--paper); white-space: nowrap;
    box-shadow: 0 2px 0 var(--ink);
  }
  .hspace { width: 64px; flex: none; }  /* keeps the clock in the middle */
  .hbtn.live { background: #cf3a2a; color: #fbf4e2; animation: live 1.2s ease-in-out infinite; }
  @keyframes live { 50% { box-shadow: 0 2px 0 var(--ink), 0 0 0 4px rgba(207,58,42,.35); } }
  /* friends at your table: the mic button flashes and sends out rings, so you see you can talk */
  .hbtn.call { animation: callflash .8s steps(1) infinite, callring 1.1s ease-out infinite; }
  @keyframes callflash { 0% { background: #39ff7a; color: #021a0a; } 50% { background: var(--paper); color: var(--ink); } }
  @keyframes callring {
    0% { transform: scale(1); box-shadow: 0 2px 0 var(--ink), 0 0 0 0 rgba(57,255,122,.85); }
    30% { transform: scale(1.18); }
    60% { transform: scale(1); }
    100% { transform: scale(1); box-shadow: 0 2px 0 var(--ink), 0 0 0 12px rgba(57,255,122,0); }
  }
  .hbtn:active { transform: translateY(2px); box-shadow: none; background: #ffe7a8; }

  /* ---------- the game picture ---------- */
  #stage { flex: 1; min-height: 0; display: grid; place-items: center; position: relative; }
  #view { display: block; border-radius: 8px; box-shadow: 0 0 0 2px var(--ink), 0 6px 24px rgba(0,0,0,.45); }

  /* ---------- touch controls ---------- */
  /* every size follows --u, so the whole pad always fits the width of the screen */
  #pad {
    --u: min(11.5vw, 52px); flex: none; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    gap: calc(var(--u) * 0.16); padding: calc(var(--u) * 0.16) max(8px, env(safe-area-inset-right)) calc(var(--u) * 0.24) max(8px, env(safe-area-inset-left));
    box-sizing: border-box; width: 100%;
  }
  #pad.hidden, body.at-login #pad { display: none; }
  .dpad { display: grid; grid-template-columns: repeat(3, var(--u)); grid-template-rows: repeat(3, calc(var(--u) * 0.85)); gap: calc(var(--u) * 0.08); justify-self: start; }
  .dpad .b { grid-column: 2; }
  .dpad .l { grid-row: 2; grid-column: 1; } .dpad .r { grid-row: 2; grid-column: 3; } .dpad .d { grid-row: 3; grid-column: 2; } .dpad .u { grid-row: 1; grid-column: 2; }
  .pb {
    display: grid; place-items: center; border-radius: 12px; border: 2px solid var(--ink); border-bottom-width: 5px;
    background: linear-gradient(var(--paper), var(--paper2)); color: var(--ink); font-family: var(--round); font-weight: 900; font-size: calc(var(--u) * 0.36); cursor: pointer;
    box-sizing: border-box;
  }
  .pb.on { background: #ffe7a8; transform: translateY(2px); border-bottom-width: 3px; }
  .emotes { display: flex; flex-direction: column; gap: calc(var(--u) * 0.1); }
  .emotes .pb { width: calc(var(--u) * 1.3); height: calc(var(--u) * 0.76); font-size: calc(var(--u) * 0.24); gap: 0; line-height: 1; text-align: center; border-bottom-width: 4px; }
  .emotes .pb span { font-size: calc(var(--u) * 0.34); display: block; }
  /* Vito and Oleksiy close together: a fourth button, and all four a bit flatter so the pad keeps its height */
  .emotes.four { gap: calc(var(--u) * 0.07); }
  .emotes.four .pb { height: calc(var(--u) * 0.62); font-size: calc(var(--u) * 0.2); border-bottom-width: 3px; }
  .emotes.four .pb span { font-size: calc(var(--u) * 0.27); }
  .emotes .pb.nose { background: linear-gradient(#ffe0e6, #f7b8c6); }
  .ab { display: grid; grid-template-columns: calc(var(--u) * 1.08) calc(var(--u) * 1.4); grid-template-rows: calc(var(--u) * 1.3) calc(var(--u) * 0.9); gap: calc(var(--u) * 0.1); justify-self: end; align-items: end; }
  .ab .A { grid-column: 2; grid-row: 1 / 3; height: calc(var(--u) * 1.5); border-radius: 50%; font-size: calc(var(--u) * 0.5); background: radial-gradient(circle at 40% 35%, #ffe08a, #e8a838); color: var(--ink); }
  .ab .B { grid-column: 1; grid-row: 2; height: calc(var(--u) * 1.0); border-radius: 50%; font-size: calc(var(--u) * 0.38); background: radial-gradient(circle at 40% 35%, #ff8a7a, #cf3a2a); color: var(--paper); }
  .ab .A.on, .ab .B.on { filter: brightness(1.3); transform: translateY(3px); }
  #keys { flex: none; text-align: center; font-size: 13px; color: #a89a7a; padding: 4px 0 8px; display: none; }
  @media (orientation: landscape) and (pointer: coarse) {
    #pad { --u: min(6.5vw, 13vh, 52px); position: absolute; left: 0; right: 0; bottom: 0; background: none; pointer-events: none; }
    #pad > * { pointer-events: auto; opacity: .82; }
  }
  @media (max-width: 340px) { #hud .hbtn { padding: 4px 6px; font-size: 12px; } }

  /* ---------- DOS overlays: login, dialogs, menus ---------- */
  .dos {
    position: absolute; inset: 0; z-index: 20; display: none; flex-direction: column;
    background: var(--bg); color: var(--fg); font-family: 'VT323', 'Pixelify Sans', monospace;
    text-shadow: 0 0 5px var(--glow); padding: 14px 14px 10px; box-sizing: border-box;
  }
  .dos.show { display: flex; }
  .dos::after { content: ''; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(to bottom, rgba(0,0,0,.28) 0 1px, transparent 1px 3px); }
  /* get a notification when a friend starts TUSA */
  #pushBtn { all: unset; cursor: pointer; position: relative; z-index: 2; align-self: flex-end; flex: none; margin-bottom: 6px; padding: 3px 8px; border: 2px solid var(--fg);
    color: var(--fg); font-family: 'VT323', monospace; font-size: 20px; line-height: 1; background: var(--bg); text-shadow: 0 0 5px var(--glow); }
  #pushBtn.on { background: var(--fg); color: var(--bg); text-shadow: none; }
  #pushBtn:active { filter: brightness(1.4); }
  #term { flex: 1; min-height: 0; overflow: hidden; white-space: pre-wrap; font-size: clamp(16px, min(5vw, 3.3vh), 28px); line-height: 1.12; }
  #term .big { font-family: 'Pixelify Sans', monospace; font-size: 1.35em; color: var(--neon); text-shadow: 0 0 8px rgba(255,226,58,.7); }
  #term .dim { color: var(--dim); text-shadow: none; }
  #term .err { color: #ff5a6a; text-shadow: 0 0 6px rgba(255,90,106,.6); }
  #term .cur { background: var(--fg); color: var(--bg); animation: blink 1.06s steps(1) infinite; }
  @keyframes blink { 50% { background: transparent; } }
  #loginKbd { flex: none; margin-top: 8px; }

  /* dialogs: a sheet of washi paper with an ink border and a red seal line */
  #dlg {
    position: absolute; z-index: 30; left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(-0.4deg);
    width: min(92vw, 420px); max-height: 86%; overflow: auto; display: none;
    background: var(--paper); color: var(--ink); border: 3px solid var(--ink); border-radius: 14px 10px 16px 9px;
    box-shadow: 0 5px 0 var(--ink), 0 14px 30px rgba(0,0,0,.45); font-family: var(--round); padding: 14px 16px; box-sizing: border-box;
    background-image: radial-gradient(circle at 20% 15%, rgba(214,190,150,.25), transparent 40%), radial-gradient(circle at 80% 85%, rgba(214,190,150,.2), transparent 45%);
  }
  #dlg.show { display: block; }
  #dlg.low { top: auto; bottom: 4%; transform: translate(-50%, 0) rotate(-0.4deg); }
  #dlg h3 { margin: 0 0 6px; font-size: 19px; font-weight: 900; color: var(--ink); border-bottom: 3px solid var(--red); padding-bottom: 4px; }
  #dlg p { margin: 6px 0 10px; font-size: 15px; font-weight: 700; line-height: 1.35; color: #5a4030; }
  #dlg .opts { display: flex; flex-direction: column; gap: 8px; }
  #dlg .opt {
    all: unset; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 2px solid var(--ink); border-radius: 10px;
    font-size: 16px; font-weight: 800; color: var(--ink); background: #fffaf0; box-shadow: 0 2px 0 var(--ink);
  }
  #dlg .opt .ico { font-size: 22px; width: 28px; text-align: center; }
  #dlg .opt small { display: block; font-size: 12px; font-weight: 700; color: #8a6a50; }
  #dlg .opt.sel, #dlg .opt:active { background: #ffe7a8; }
  #dlg .opt .k { margin-left: auto; font-size: 15px; font-weight: 900; color: var(--paper); background: var(--red); border-radius: 50%; width: 24px; height: 24px; display: grid; place-items: center; }
</style>
<script src="/lib/nozoom.js"></script>
<script src="/lib/fullscreen.js"></script>
<script src="/lib/online.js" defer></script>
</head>
<body>
  <div id="hud">
    <button id="dosBtn" aria-label="terug naar ERROR-DOS"><canvas id="dosLogo"></canvas></button>
    <canvas id="dmx" aria-label="status"></canvas>
    <button class="hbtn" id="micBtn" style="visibility:hidden" aria-label="praten">🎙</button>
  </div>
  <div id="stage">
    <canvas id="view"></canvas>
    <div class="dos" id="login">
      <button id="pushBtn" aria-label="meldingen">🔔 MELDINGEN: UIT</button>
      <div id="term"></div>
      <div id="loginKbd"></div>
    </div>
    <div id="dlg"></div>
  </div>
  <div id="pad">
    <div class="dpad">
      <div class="pb u" data-k="up">▲</div><div class="pb l" data-k="left">◄</div>
      <div class="pb r" data-k="right">►</div><div class="pb d" data-k="down">▼</div>
    </div>
    <div class="emotes">
      <div class="pb" data-k="hug"><span>🤗</span>KNUF</div>
      <div class="pb" data-k="heart"><span>❤️</span>СЕРЦЕ</div>
      <div class="pb" data-k="joke"><span>😂</span>ЖАРТ</div>
      <div class="pb nose" data-k="nose" id="noseBtn" style="display:none"><span>👃</span>NEUSJE</div>
    </div>
    <div class="ab">
      <div class="pb A" data-k="a">A</div>
      <div class="pb B" data-k="b">B</div>
    </div>
  </div>
  <div id="keys">Pijltjes / WASD: lopen · ENTER: A · ESC: B · H: knuffel · L: hart · J: grap · N: neusje (Vito + Oleksiy) · M: praten</div>

  <script>
    // no zooming in by double-tapping or pinching, like a real app
    (() => {
      let last = 0;
      document.addEventListener('touchend', e => { const n = Date.now(); if (n - last < 320 && e.cancelable && !e.target.closest('#dlg, .hbtn')) e.preventDefault(); last = n; }, { passive: false });
      for (const ev of ['gesturestart', 'gesturechange', 'dblclick']) document.addEventListener(ev, e => e.preventDefault(), { passive: false });
      document.addEventListener('touchmove', e => { if (e.touches.length > 1 && e.cancelable) e.preventDefault(); }, { passive: false });
    })();
  </script>
  <script src="/lib/errorkbd.js"></script>
  <script src="art.js"></script>
  <script src="tusa.js"></script>
</body>
</html>
