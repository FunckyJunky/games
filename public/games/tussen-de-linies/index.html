<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Tussen de Linies · ERROR-DOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --fg:#39ff7a; --dim:#1b7a3c; --bg:#000; --glow:rgba(57,255,122,.55); --amber:#ffd23f; --red:#ff5a4d; --blue:#4dd4ff; }
  html, body { margin:0; height:100%; background:#000; overflow:hidden; color:var(--fg);
    font-family:VT323, ui-monospace, monospace; -webkit-user-select:none; user-select:none; touch-action:none; }
  #cv { position:fixed; inset:0; width:100vw; height:100vh; display:block; }
  #crt { position:fixed; inset:0; pointer-events:none; z-index:6;
    background:repeating-linear-gradient(to bottom, rgba(0,0,0,.20) 0 1px, rgba(0,0,0,0) 1px 3px); }
  #crt.off, #vig.off { display:none; }
  #vig { position:fixed; inset:0; pointer-events:none; z-index:6; background:radial-gradient(ellipse at center, rgba(0,0,0,0) 62%, rgba(0,0,0,.55)); }
  .hidden { display:none !important; }

  /* DOS panels */
  .panel { position:fixed; z-index:10; left:50%; top:50%; transform:translate(-50%,-50%);
    width:min(600px, 94vw); max-height:92vh; overflow:auto; box-sizing:border-box;
    background:rgba(0,10,4,.95); border:3px double var(--fg); padding:12px 18px 14px;
    box-shadow:0 0 14px var(--glow), inset 0 0 12px rgba(57,255,122,.22);
    font-size:22px; line-height:1.15; text-shadow:0 0 5px var(--glow); touch-action:pan-y; }
  .panel.side { left:auto; right:max(10px, env(safe-area-inset-right)); top:44px; transform:none; width:min(300px, 46vw); font-size:19px; padding:8px 12px; }
  .panel.low { top:auto; bottom:12px; transform:translateX(-50%); }
  .panel h1 { margin:0 0 2px; font-weight:normal; font-size:44px; letter-spacing:2px; color:var(--fg); line-height:1; }
  .panel h2 { margin:0 0 8px; font-weight:normal; font-size:26px; color:var(--amber); text-shadow:0 0 6px rgba(255,210,63,.5); }
  .panel .d { color:var(--dim); text-shadow:none; }
  .panel .a { color:var(--amber); text-shadow:0 0 6px rgba(255,210,63,.45); }
  .panel .r { color:var(--red); text-shadow:0 0 6px rgba(255,90,77,.45); }
  .panel .b { color:var(--blue); text-shadow:0 0 6px rgba(77,212,255,.45); }
  .panel p { margin:6px 0; }
  .panel pre { margin:0; font:inherit; white-space:pre; overflow:hidden; }
  .bar { border-top:1px dashed var(--dim); margin:8px 0; }
  .mi { display:block; width:100%; text-align:left; margin:2px 0; padding:3px 8px; box-sizing:border-box;
    font:inherit; font-size:24px; color:var(--fg); background:transparent; border:0; cursor:pointer; text-shadow:inherit; }
  .mi:hover, .mi.on { background:var(--fg); color:#000; text-shadow:none; box-shadow:0 0 8px var(--glow); }
  .mi .k { color:var(--dim); }
  .mi.on .k, .mi:hover .k { color:#063; }
  .row2 { display:flex; gap:10px; flex-wrap:wrap; }
  .row2 .mi { flex:1; text-align:center; min-width:140px; }
  input.dos { font:inherit; font-size:26px; background:#000; color:var(--fg); border:1px solid var(--dim); padding:3px 8px;
    width:100%; box-sizing:border-box; outline:none; text-shadow:0 0 5px var(--glow); text-transform:uppercase; user-select:text; -webkit-user-select:text; }
  input.dos:focus { border-color:var(--fg); box-shadow:0 0 8px var(--glow); }
  .big { font-size:54px; letter-spacing:8px; color:var(--amber); text-shadow:0 0 10px rgba(255,210,63,.6); }
  table.t { border-collapse:collapse; width:100%; font-size:21px; }
  table.t td { padding:1px 6px 1px 0; }
  table.t td.n { text-align:right; }
  .panel h1.title { font-size:clamp(40px, 9vw, 64px); letter-spacing:3px; text-shadow:0 0 10px var(--glow), 3px 3px 0 #063a1a; margin:2px 0 4px; }
  .logo { color:var(--fg); font-size:12px; line-height:12px; margin:2px 0 6px; white-space:pre; text-shadow:0 0 6px var(--glow); }
  .say { font-family:"Pixelify Sans", VT323, sans-serif; }
  .blink { animation:blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity:0; } }

  /* quiz */
  #quiz { position:fixed; z-index:9; left:50%; bottom:max(10px, env(safe-area-inset-bottom)); transform:translateX(-50%);
    width:min(640px, 96vw); box-sizing:border-box; background:rgba(0,10,4,.96); border:3px double var(--amber);
    box-shadow:0 0 14px rgba(255,210,63,.4); padding:8px 12px 10px; font-size:20px; color:var(--fg); text-shadow:0 0 4px var(--glow); }
  #quiz .hd { display:flex; justify-content:space-between; color:var(--amber); font-size:20px; }
  #quiz .heard { font-family:"Pixelify Sans", VT323, sans-serif; font-size:21px; color:#fff; text-shadow:none; margin:4px 0 2px; }
  #quiz .heard .x { color:#ff6b5a; }
  #quiz .tl { font-size:18px; color:var(--dim); text-shadow:none; margin-bottom:4px; }
  #quiz button { display:flex; gap:10px; align-items:baseline; width:100%; text-align:left; margin:4px 0 0; padding:6px 10px; box-sizing:border-box;
    background:#04140a; border:1px solid var(--dim); color:#fff; cursor:pointer; font-family:"Pixelify Sans", VT323, sans-serif; font-size:20px; text-shadow:none; }
  #quiz button .n { font-family:VT323, monospace; color:var(--amber); font-size:22px; }
  #quiz button small { display:block; font-family:VT323, monospace; color:#7fbf95; font-size:17px; }
  #quiz button.on { border-color:var(--fg); box-shadow:0 0 8px var(--glow); background:#08301a; }
  #quiz button.good { background:#0b5a2a; border-color:var(--fg); }
  #quiz button.wrong { background:#5a1410; border-color:var(--red); }
  #quiz .tm { height:4px; background:var(--amber); margin-top:6px; transform-origin:left; }

  /* touch */
  #touch { position:fixed; inset:0; z-index:8; pointer-events:none; }
  #touch .btn { position:absolute; pointer-events:auto; border-radius:50%; display:grid; place-items:center;
    font-family:VT323, monospace; color:var(--fg); background:rgba(0,30,12,.55); border:2px solid var(--fg);
    box-shadow:0 0 10px var(--glow), inset 0 0 10px rgba(57,255,122,.25); text-shadow:0 0 6px var(--glow); touch-action:none; }
  #touch .btn.on { background:rgba(57,255,122,.45); color:#000; }
  #bTolk { width:96px; height:96px; font-size:28px; }
  #bWacht { width:66px; height:66px; font-size:20px; border-color:var(--amber) !important; color:var(--amber) !important; }
  #bPause { width:40px; height:40px; font-size:20px; border-radius:6px !important; }
  #stick { position:absolute; width:110px; height:110px; margin:-55px 0 0 -55px; border-radius:50%; border:2px dashed rgba(57,255,122,.6); display:none; }
  #knob { position:absolute; left:50%; top:50%; width:46px; height:46px; margin:-23px 0 0 -23px; border-radius:50%; background:rgba(57,255,122,.35); border:2px solid var(--fg); }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="vig"></div>
<div id="crt"></div>
<div id="touch" class="hidden">
  <div id="stick"><div id="knob"></div></div>
  <div class="btn" id="bTolk">TOLK</div>
  <div class="btn" id="bWacht">WACHT</div>
  <div class="btn" id="bPause">II</div>
</div>
<div id="quiz" class="hidden"></div>
<div id="panel" class="panel hidden"></div>

<script src="/lib/gamelab.js"></script>
<script>
'use strict';
/* =====================================================================================
   TUSSEN DE LINIES  -  LINIES.EXE for ERROR-DOS (error.blue)
   You are the interpreter (de tolk) on a training field where Dutch instructors train
   Ukrainian trainees. Be close when someone speaks (you only hear what's said while
   you're in their circle), keep it in your head (3 slots, they fade), bring it to the
   other side and pick the right translation. Several people talk at once: choose, run,
   and raise your hand (WACHT) to make the others wait.
   Multiplayer: GameLab room "tussen-de-linies/<CODE>". The oldest player is the host and
   runs the simulation; it sends the whole state 8x a second. Everyone sends their own
   position ("pos") to all, and actions ("act") to the host. If the host leaves, the next
   oldest player carries on from the last state.
   ===================================================================================== */

const GAME = 'tussen-de-linies';
const W = 320, H = 200, TOP = 14, BOT = 172;          // world = VGA mode 13h
const LISTEN_R = 30, DELIVER_R = 32, WACHT_R = 100, MEM_MAX = 3, SPEED = 70;
const PCOL = ['#ffd23f', '#4dd4ff', '#ff6bd6', '#ff9a3c'];
const F_UI = 'VT323, ui-monospace, monospace';
const F_SAY = '"Pixelify Sans", VT323, sans-serif';

const $ = (q) => document.querySelector(q);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const hyp = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function loadJ(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } }
function saveJ(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const CFG = Object.assign({ mode: 'quiz', tr: true, snd: true, crt: true, diff: 1 }, loadJ('linies-settings') || {});
function saveCfg() { saveJ('linies-settings', CFG); }

/* ---------------------------------------------------------------- phrases
   [station, kind, Dutch, Ukrainian, wrong option]
   kind: i = instruction, s = safety (urgent), p = small talk   (instructor: Dutch -> Ukrainian)
         q = question,    pq = small talk                       (trainee: Ukrainian -> Dutch)
   wrong option: for i/s/p [Ukrainian, Dutch meaning]; for q/pq a Dutch sentence          */
const PHR = [

  ['sb', 'i', 'Rustig uitademen, dan schieten.', 'Спокійно видихніть, потім стріляйте.', ['Глибоко вдихніть і не стріляйте.', 'Diep inademen en niet schieten.']],
  ['sb', 'i', 'Drie schoten, enkel vuur.', 'Три постріли, одиночним вогнем.', ['Три магазини, автоматичним вогнем.', 'Drie magazijnen, automatisch vuur.']],
  ['sb', 'i', 'Magazijn wisselen!', 'Змінити магазин!'],
  ['sb', 'i', 'Ontladen en wapen tonen.', 'Розрядити й показати зброю.'],

  ['sb', 's', 'Wapen op veilig!', 'Зброю на запобіжник!', ['Зброю зняти із запобіжника!', 'Wapen van veilig!']],
  ['sb', 's', 'Loop naar de doelen!', 'Ствол у бік мішеней!', ['Ствол у бік людей!', 'Loop naar de mensen!']],
  ['sb', 'q', 'Kunt u dat herhalen?', 'Можна повторити?', 'Mag ik naar huis?'],
  ['sb', 'q', 'Mijn wapen heeft een storing!', 'Мій автомат заклинило!', 'Mijn wapen is kwijt!'],
  ['sb', 'q', 'Mijn munitie is op.', 'У мене закінчилися набої.', 'Ik heb te veel munitie.'],
  ['sb', 'q', 'Welk doel is van mij?', 'Яка ціль моя?', 'Wie heeft mijn wapen?'],
  ['sb', 'q', 'Mag ik al schieten?', 'Можна вже стріляти?', 'Moet ik stoppen met schieten?'],
  ['sb', 'p', 'Mooi schot, goed zo!', 'Гарний постріл, молодець!'],

  ['eh', 'i', 'Leg de tourniquet aan!', 'Накладіть турнікет!'],
  ['eh', 'i', 'Hoog en strak boven de wond.', 'Високо й туго, вище рани.', ['Низько й слабко, нижче рани.', 'Laag en los onder de wond.']],
  ['eh', 'i', 'Schrijf de tijd op de tourniquet.', 'Напишіть час на турнікеті.', ['Напишіть своє ім’я на руці.', 'Schrijf je naam op je hand.']],
  ['eh', 'i', 'Druk hard op de wond.', 'Сильно тисніть на рану.'],
  ['eh', 'i', 'Controleer de ademhaling.', 'Перевірте дихання.'],
  ['eh', 'i', 'Leg hem op zijn zij.', 'Покладіть його на бік.', ['Посадіть його на стілець.', 'Zet hem op een stoel.']],
  ['eh', 'i', 'Handschoenen aan!', 'Одягніть рукавички!'],
  ['eh', 'i', 'Praat met het slachtoffer.', 'Говоріть із пораненим.'],
  ['eh', 's', 'Slagaderlijke bloeding! Nu afbinden!', 'Артеріальна кровотеча! Негайно турнікет!', ['Артеріальна кровотеча! Зачекайте!', 'Slagaderlijke bloeding! Even wachten!']],
  ['eh', 's', 'Eerst je eigen veiligheid!', 'Спершу власна безпека!', ['Безпека — потім!', 'Veiligheid komt later!']],
  ['eh', 's', 'Zijn hoofd niet bewegen!', 'Не рухайте йому голову!', ['Поверніть йому голову!', 'Draai zijn hoofd!']],
  ['eh', 'q', 'Hoe strak moet ik aandraaien?', 'Як туго затягувати?', 'Hoe laat is het?'],
  ['eh', 'q', 'Waar leg ik de tourniquet aan?', 'Куди накладати турнікет?', 'Waar is de wc?'],
  ['eh', 'q', 'Hij ademt. Wat nu?', 'Він дихає. Що далі?', 'Hij ademt niet. Wat nu?'],
  ['eh', 'q', 'Hoe lang mag een tourniquet blijven zitten?', 'Скільки можна тримати турнікет?', 'Hoeveel tourniquets hebben we?'],
  ['eh', 'q', 'Ik heb geen handschoenen.', 'У мене немає рукавичок.', 'Ik heb twee handschoenen.'],
  ['eh', 'p', 'Goed werk, jullie redden levens.', 'Гарна робота, ви рятуєте життя.'],

  ['dk', 'i', 'Volg mij!', 'За мною!', ['Чекайте тут!', 'Wacht hier!']],
  ['dk', 'i', 'Laag blijven!', 'Тримайтеся низько!'],
  ['dk', 'i', 'Wacht op mijn teken.', 'Чекайте на мій сигнал.', ['Біжіть без сигналу.', 'Ren zonder teken.']],
  ['dk', 'i', 'Twee man naar links.', 'Двоє — ліворуч.', ['Двоє — праворуч.', 'Twee man naar rechts.']],
  ['dk', 'i', 'Om de beurt verplaatsen, ik geef dekking.', 'Переміщайтеся по черзі, я прикриваю.'],
  ['dk', 'i', 'Kruip naar de loopgraaf.', 'Повзіть до окопу.'],
  ['dk', 'i', 'Vijf meter afstand houden.', 'Тримайте дистанцію п’ять метрів.', ['Тримайтеся разом, без дистанції.', 'Blijf dicht bij elkaar.']],
  ['dk', 's', 'Dekking!', 'В укриття!', ['Встати!', 'Opstaan!']],
  ['dk', 's', 'Granaat! Liggen!', 'Граната! Лягай!', ['Граната! Встань!', 'Granaat! Opstaan!']],

  ['dk', 'q', 'Hoeveel man gaan er naar voren?', 'Скільки людей іде вперед?', 'Hoeveel man blijven er achter?'],

  ['dk', 'q', 'Mogen we even rusten?', 'Можна хвилинку відпочити?', 'Mogen we naar huis?'],

  ['vr', 'i', 'Opstijgen!', 'По машинах!', ['Вийти з машини!', 'Uitstijgen!']],
  ['vr', 'i', 'Radio op kanaal drie.', 'Рацію на третій канал.', ['Рацію на тринадцятий канал.', 'Radio op kanaal dertien.']],

  ['vr', 'i', 'Uitstijgen en spreiden!', 'Вийти з машини й розосередитися!', ['Вийти з машини й зібратися разом!', 'Uitstijgen en bij elkaar staan!']],
  ['vr', 's', 'Niet achter het voertuig lopen!', 'Не ходіть позаду машини!', ['Ходіть позаду машини!', 'Loop achter het voertuig!']],
  ['vr', 's', 'Stilte op de radio!', 'Тиша в ефірі!', ['Говоріть в ефірі!', 'Praat op de radio!']],
  ['vr', 's', 'Stop! Voertuig rijdt achteruit!', 'Стоп! Машина здає назад!', ['Стоп! Машина їде вперед!', 'Stop! Voertuig rijdt vooruit!']],
  ['vr', 'q', 'Wat is onze roepnaam?', 'Який у нас позивний?', 'Wat is onze kleur?'],
  ['vr', 'q', 'De radio werkt niet.', 'Рація не працює.', 'De motor werkt niet.'],
  ['vr', 'q', 'Wie gaat er rijden?', 'Хто сідає за кермо?', 'Wie gaat er slapen?'],
  ['vr', 'q', "Hoe zeg je 'over' in het Nederlands?", 'Як сказати «прийом» нідерландською?', "Hoe zeg je 'stop' in het Engels?"],
  ['vr', 'p', 'Wie rijdt, trakteert op koffie.', 'Хто за кермом — той пригощає кавою.'],

  ['*', 'p', 'Wie wil er koffie?', 'Хто хоче кави?'],
  ['*', 'p', 'Goed gedaan, jongens!', 'Молодці, хлопці!'],
  ['*', 'p', 'Tien minuten pauze!', 'Перекур — десять хвилин!'],
  ['*', 'p', 'Het regent weer. Welkom in Nederland!', 'Знову дощ. Ласкаво просимо до Нідерландів!'],
  ['*', 'p', 'Morgen om zes uur verzamelen.', 'Завтра збір о шостій.', ['Завтра вихідний.', 'Morgen is het vrij.']],
  ['*', 'pq', 'Dank u, instructeur!', 'Дякую, пане інструкторе!', 'Sorry, instructeur!'],
  ['*', 'pq', 'Wanneer is het eten?', 'Коли обід?', 'Wanneer is het appèl?'],
  ['*', 'pq', 'De koffie is hier erg lekker.', 'Кава тут дуже смачна.', 'De koffie is hier erg koud.'],
  ['*', 'pq', 'Waar is de wc?', 'Де туалет?', 'Waar is de bus?'],
  ['*', 'q', 'Ik heb het niet begrepen.', 'Я не зрозумів.', 'Ik heb het al gedaan.'],
  ['*', 'q', 'Kunt u langzamer praten?', 'Можна говорити повільніше?', 'Kunt u harder praten?'],

const PH = PHR.map(([st, k, nl, uk, bad], i) => ({ i, st, k, nl, uk, bad }));
const fromNL = (k) => k === 'i' || k === 's' || k === 'p';
const srcOf = (ph) => fromNL(ph.k) ? ph.nl : ph.uk;
const KIND = {
  i: { tag: 'INSTRUCTIE', col: '#ff8a1e', base: 100, miss: 5, wrong: 5, gain: 3 },
  s: { tag: 'VEILIGHEID!', col: '#ff3b30', base: 150, miss: 12, wrong: 10, gain: 5 },
  p: { tag: 'PRAATJE', col: '#a7a7a7', base: 50, miss: 0, wrong: 2, gain: 1 },
  q: { tag: 'VRAAG', col: '#4d9dff', base: 100, miss: 4, wrong: 4, gain: 3 },
  pq: { tag: 'PRAATJE', col: '#a7a7a7', base: 50, miss: 0, wrong: 2, gain: 1 },
};

/* ---------------------------------------------------------------- transliteration (KMU-2010 style) */
const TRL = { а: 'a', б: 'b', в: 'v', г: 'h', ґ: 'g', д: 'd', е: 'e', ж: 'zh', з: 'z', и: 'y', і: 'i', к: 'k', л: 'l', м: 'm', н: 'n', о: 'o', п: 'p',
  р: 'r', с: 's', т: 't', у: 'u', ф: 'f', х: 'kh', ц: 'ts', ч: 'ch', ш: 'sh', щ: 'shch', ь: '', '\'': '', '’': '' };

function translit(s) {
  let out = '';
  for (let i = 0; i < s.length; i++) {
    const ch = s[i], lo = ch.toLowerCase(), prev = i ? s[i - 1].toLowerCase() : ' ';
    const start = !/[а-яіїєґ'’]/.test(prev);
    let r;
    if (lo in TRL) r = TRL[lo]; else if (lo in TRS) r = start ? TRS[lo] : TRM[lo]; else r = ch;
    if (lo === 'г' && prev === 'з') r = 'gh';
    if (ch !== lo && r) r = r[0].toUpperCase() + r.slice(1);
    out += r;
  }
  return out;
}

function followOf(x, y) {

  const ins = st + '.I';

  const opts = [];
  if (insFree) opts.push(['i', D.w.i], ['s', D.w.s], ['p', D.w.p]);
  if (trFree.length) opts.push(['q', D.w.q], ['pq', D.w.p * 0.6]);
  if (!opts.length) return false;
  const k = weighted(opts);
  let pool = PH.filter((ph) => ph.k === k && (ph.st === st || ph.st === '*') && !S.recent.includes(ph.i));
  if (!pool.length) pool = PH.filter((ph) => ph.k === k && (ph.st === st || ph.st === '*'));

}
function spawnEvent(D) {

    if (Math.random() < D.burst) {           // two at once: another post, or a second voice at the same post
      const other = sts.find((x) => x !== st);
      if (other && Math.random() < 0.55) tryEvent(other, D) || tryEvent(st, D, true);

function begin(id, ph, D) {

function step(dt) {

    const p = S.players[pid];

    S.next -= dt;
    if (S.next <= 0) {
      spawnEvent(D);
      S.next = 1 / (D.rate * S.diff * (1 + 0.55 * (np - 1))) * rand(0.65, 1.35);
    }
  }
  for (const id in S.sp) {
    const s = S.sp[id];
    if (s.s === 'rest') { s.rt -= dt; if (s.rt <= 0) delete S.sp[id]; continue; }
    if (s.s === 'rep') {
      s.rt -= dt;
      if (s.rt <= 0) {
        const n = NPC[id];
        if (!S.done.includes(s.uid)) { resolve(s.uid); penalty(s.k, n.st, n.cx, n.top - 6, KIND[s.k].miss ? 'GEMIST!' : 'gemist'); }
        s.s = 'rest'; s.rt = 1.2;

      continue;
    }
    if (s.pz > 0) { s.pz -= dt; continue; }
    if (s.s === 'prep') { s.pr -= dt; if (s.pr <= 0) { s.s = 'talk'; s.t = 0; s.pc = 0; } continue; }

      s.t += dt;

          if (S.players[pid].fol !== id) continue;
          const h = s.h[pid] || '0'.repeat(L);
          s.h[pid] = h.slice(0, s.pc) + '1'.repeat(cur - s.pc) + h.slice(cur);
        }
        s.pc = cur;

      if (s.t >= s.dur) endSpeech(id, s);

  for (const pid in S.players) {
    const p = S.players[pid];
    for (let i = p.mem.length - 1; i >= 0; i--) {
      const it = p.mem[i];
      if (it.hold > 0) { it.hold -= dt; continue; }
      it.life -= dt;
      if (it.life > 0) continue;
      p.mem.splice(i, 1);
      const others = Object.values(S.players).some((o) => o.mem.some((m) => m.uid === it.uid));
      if (!others && !S.done.includes(it.uid)) {
        resolve(it.uid); p.miss++;

    const p = S.players[pid];
    if (hyp(p.x, p.y, 160, 104) < 14) { S.cof.on = false; S.cof.t = rand(30, 45); p.boost = 10; fx({ k: 'txt', x: 160, y: 88, t: 'KOFFIE! SNELLER', c: '#ffd23f', snd: 'coffee' }); break; }

function endDay() {

// an action from a player (the host's own actions come straight here)
function handleAct(pid, m) {
  if (!S || !m) return;
  const p = S.players[pid];
  if (m.a === 'start' && pid === Net.host && (S.phase === 'lobby' || S.phase === 'over' || S.phase === 'done')) {
    if (S.phase !== 'lobby') newGame();
    S.diff = CFG.diff; startDay(1); return;
  }
  if (m.a === 'next' && pid === Net.host && S.phase === 'report') { startDay(S.day + 1); return; }
  if (m.a === 'lobby' && pid === Net.host) { newGame(); return; }
  if (!p || S.phase !== 'play') return;
  if (m.a === 'hold') { const it = p.mem.find((x) => x.id === m.id); if (it) it.hold = 9; return; }
  if (m.a === 'deliver') {
    const it = p.mem.find((x) => x.id === m.id);
    if (!it) { fx({ k: 'txt', x: p.x, y: p.y - 18, t: 'TE LAAT', c: '#ffd23f', pid }); return; }
    const tp = tgtPos(it.tgt);
    if (hyp(p.x, p.y - 6, tp.x, tp.y) > DELIVER_R + 14) { it.hold = 0; fx({ k: 'txt', x: p.x, y: p.y - 18, t: 'TE VER WEG', c: '#ffd23f', pid }); return; }

    resolve(it.uid);
    const K = KIND[it.k], st = it.tgt.split('.')[0];

      S.combo++; S.best = Math.max(S.best, S.combo);
      const pts = Math.round(K.base * (0.55 + 0.45 * it.q) * (1 + 0.1 * Math.min(S.combo, 10)) * (m.arc ? 0.8 : 1) + 40 * clamp(it.life / it.max, 0, 1));
      p.pts += pts; p.ok++; S.stats.ok++; S.ds.ok++;
      S.trust = Math.min(100, S.trust + K.gain);
      fx({ k: 'txt', x: tp.x, y: tp.y - 16, t: '+' + pts + (S.combo > 1 ? '  x' + S.combo : ''), c: '#39ff7a', snd: 'ok', ok: 1, pid });
    } else {
      p.bad++; S.stats.bad++; S.ds.bad++; S.combo = 0;
      S.trust = Math.max(0, S.trust - K.wrong);
      fx({ k: 'txt', x: tp.x, y: tp.y - 16, t: 'VERKEERD VERTAALD!', c: '#ff5a4d', snd: 'bad', pid });
      if (it.k === 's') { S.stats.inc++; S.ds.inc++; fx({ k: 'inc', st }); }
    }
    return;

  if (m.a === 'rep') {
    const s = S.sp[m.sp], n = NPC[m.sp];

    s.s = 'prep'; s.pr = 0.8; s.t = 0; s.pc = 0; s.h = {}; s.rep++; s.pzd = 0;
    S.trust = Math.max(0, S.trust - 2);
    fx({ k: 'txt', x: n.cx, y: n.top - 6, t: 'NOG EEN KEER...', c: '#ffd23f', snd: 'rep2' });
    return;
  }
  if (m.a === 'wacht') {
    if (p.cd > 0) return;
    const fol = followOf(p.x, p.y - 6);

      if (id === fol || s.pzd || (s.s !== 'prep' && s.s !== 'talk')) continue;
      if (hyp(p.x, p.y - 6, n.cx, n.cy) > WACHT_R) continue;
      s.pz = 4.5; s.pzd = 1; any++;

const AU = {

function bubble(id, s, isF) {
  const n = NPC[id], ph = PH[s.ph], K = KIND[s.k], src = srcOf(ph);
  const ins = n.role === 'I';
  const fs = fsSay(), lh = fs * 1.15, pad = 2.5;
  const border = s.k === 's' ? '#ff3b30' : (s.k === 'p' || s.k === 'pq') ? '#9a9a9a' : ins ? '#ff8a1e' : '#2f6fd6';
  const ax = n.cx, ay = n.top - 2;
  let held = false;
  if (s.s === 'rest') {
    for (const pid in S.players) if (S.players[pid].mem.some((m) => m.sp === id && m.uid === s.uid)) held = true;
    if (!held) return;
  }
  const box = (x, y, w, h, bg) => {
    x = clamp(x, 1, W - w - 1);
    const b = Math.max(0.6, 1 / sd);
    R(x - b, y - b, w + 2 * b, h + 2 * b, border); R(x, y, w, h, bg || '#f4f1e6');
    return x;
  };
  const tail = (x, y) => { R(ax - 1, y, 3, 1, border); R(ax, y + 1, 1, 1, border); };
  if (s.s === 'prep') {
    const on = Math.sin(T * 14) > -0.2, c = s.k === 's' ? '#ff3b30' : '#ff8a1e';
    const w = s.k === 's' ? 12 : 8, x = box(ax - w / 2, ay - 12, w, 9, on ? '#fff' : '#f4f1e6');
    text(s.k === 's' ? '!!' : '!', x + w / 2, ay - 4.6, 9, c, 'center');
    tail(ax, ay - 3);
    if (s.pz > 0) text('WACHT', ax, ay - 14, 6.5, '#ffd23f', 'center');
    return;
  }
  if (s.s === 'rep') {
    const x = box(ax - 5, ay - 12, 10, 9);
    text('?', x + 5, ay - 4.5, 9.5, '#c03030', 'center');
    tail(ax, ay - 3);
    if (hyp(LP.x, LP.y - 6, n.cx, n.cy) < LISTEN_R + 6) text('TOLK = herhalen', ax, ay - 14, 6.5, '#ffd23f', 'center');
    return;
  }
  if (s.s === 'rest') {
    const x = box(ax - 7, ay - 9, 14, 6, '#d8d4c6');
    text('...', x + 7, ay - 4.3, 7, '#555', 'center');
    return;
  }
  // talking
  const h = s.h[Net.me];
  const L = src.length, cur = Math.min(L, Math.floor(s.t / s.dur * L));
  if (!isF && !h) {
    const x = box(ax - 11, ay - 13, 22, 10);
    const dots = Math.floor(T * 6) % 4;
    for (let i = 0; i < 3; i++) R(x + 5 + i * 5, ay - 8, 2, 2, i < dots ? '#333' : '#bbb');
    R(x, ay - 4, 22 * (1 - s.t / s.dur), 1, border);
    tail(ax, ay - 2);
    if (s.k === 's') text('!', x + 23.5, ay - 10, 8, '#ff3b30', 'left');
    if (s.pz > 0) text('WACHT ' + Math.ceil(s.pz), ax, ay - 15, 6.5, '#ffd23f', 'center');
    return;
  }
  const font = Math.round(fs * sd) + 'px ' + F_SAY;
  const maxW = Math.round(104 * (fs / 6.6) * sd);
  const Ly = layout(src, font, maxW);
  const hdr = (ins ? n.name : n.name + (CFG.tr ? ' (' + translit(n.name) + ')' : '')) + '  ' + K.tag;
  const hw = textW(hdr, 6.2, F_SAY) + (h ? textW('100%', 6.2) + 6 : 4);
  const tw = Math.max(Ly.w / sd + pad * 2, hw, 30);
  const th = Ly.lines.length * lh + pad * 2 + 6;
  let bx = ax - tw / 2, by = ay - th - 3;
  if (by < TOP + 1) by = TOP + 1;
  bx = box(bx, by, tw, th);
  R(bx, by, tw, 6, border);
  text(hdr, bx + 2, by + 4.8, 6.2, '#fff', 'left', F_SAY);
  if (h) {
    const q = Math.round((h.split('1').length - 1) / L * 100);
    text(q + '%', bx + tw - 2, by + 4.8, 6.2, q >= 60 ? '#b6ffcf' : '#ffd0c8', 'right');
  }
  ctx.font = font; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  Ly.lines.forEach((l, li) => {
    const yy = WY(by + 6 + pad + (li + 0.82) * lh);
    for (let i = 0; i < l.txt.length; i++) {
      const gi = l.s + i, ch = l.txt[i];
      if (ch === ' ') continue;
      const xx = WX(bx + pad) + l.xs[i];
      if (h && h[gi] === '1') { ctx.fillStyle = '#141414'; ctx.fillText(ch, xx, yy); }
      else if (gi < cur) { ctx.fillStyle = '#c0392b'; ctx.fillText('·', xx + (l.xs[i + 1] - l.xs[i]) / 2 - ctx.measureText('·').width / 2, yy); }
    }
  });
  R(bx, by + th - 1.2, tw * (1 - s.t / s.dur), 1.2, border);
  if (s.pz > 0) text('WACHT ' + Math.ceil(s.pz), bx + tw / 2, by - 1.5, 6.5, '#ffd23f', 'center');
  if (by + th + 3 <= ay + 1) tail(ax, by + th + 0.5);
}

function hud() {

  if (Net.mode === 'room') {

  const p = me();
  for (let i = 0; i < MEM_MAX; i++) {

    text(String(i + 1), x + 3, y + 8.5, 9, it ? KIND[it.k].col : dim);

    const ph = PH[it.ph], src = srcOf(ph);
    let s = ''; for (let j = 0; j < src.length; j++) s += it.m[j] === '1' || src[j] === ' ' ? src[j] : '·';
    let fsz = 6.6, max = w - 12;
    while (s.length > 3 && textW(s, fsz, F_SAY) > max) s = s.slice(0, -2) + '…';
    text(s, x + 10, y + 8.5, fsz, '#ffffff', 'left', F_SAY);
    const tp = tgtPos(it.tgt), inR = hyp(LP.x, LP.y - 6, tp.x, tp.y) <= DELIVER_R;
    text(inR ? '▶ NU TOLKEN!' : '→ ' + tgtName(it.tgt), x + 10, y + 16, 6.6, inR ? '#39ff7a' : '#7fbf95');
    const f = clamp(it.life / it.max, 0, 1);
    R(x + 10, y + 19, (w - 13) * f, 2, f < 0.3 ? (Math.sin(T * 12) > 0 ? '#ff3b30' : '#7a1410') : f < 0.55 ? '#ffd23f' : '#39ff7a');
  }
  // WACHT gauge
  const cd = p ? p.cd : 0;
  const wx = 292, wy = BOT + 3;

  if (cd > 0) { R(wx + 2, wy + 19, 21 * (1 - cd / 12), 2, '#ffd23f'); text(Math.ceil(cd) + 's', wx + 12.5, wy + 18, 6.5, '#ffd23f', 'center'); }
  else text(usedTouch ? 'WACHT' : 'E', wx + 12.5, wy + 20, 6.5, '#ffd23f', 'center');
  // banners (hints, messages)
  let by = TOP + 9;
  for (const b of banners) {

    text(b.t, W / 2, by, 8, b.c, 'center', F_UI, a);
    by += 11;
  }

function setScreen() {
  const md = { quiz: 'QUIZ (echte vertaling kiezen)', hulp: 'QUIZ + HULP (betekenis erbij)', arcade: 'ARCADE (geen quiz)' };
  const df = { 0.75: 'TRAINING', 1: 'NORMAAL', 1.3: 'ZWAAR' };
  setPanel('<h2>INSTELLINGEN</h2>' +
    mi('s-mode', 'Vertalen: <span class="a">' + md[CFG.mode] + '</span>', '1') +
    mi('s-tr', 'Latijnse letters onder Oekraïens: <span class="a">' + (CFG.tr ? 'AAN' : 'UIT') + '</span>', '2') +
    mi('s-diff', 'Drukte: <span class="a">' + (df[CFG.diff] || 'NORMAAL') + '</span>', '3') +
    mi('s-snd', 'Geluid: <span class="a">' + (CFG.snd ? 'AAN' : 'UIT') + '</span>', '4') +
    mi('s-crt', 'Beeldbuis (scanlijnen): <span class="a">' + (CFG.crt ? 'AAN' : 'UIT') + '</span>', '5') +
    '<div class="bar"></div>' + mi('back', 'TERUG', 'ESC').replace('class="mi"', 'class="mi" data-back'));
}
let backTo = 'main';
async function scoreScreen() {
  setPanel('<h2>TOPTOLKEN</h2><p class="d">laden...</p><div class="bar"></div>' + mi('back', 'TERUG', 'ESC').replace('class="mi"', 'class="mi" data-back'));
  let rows = '';
  try {
    const top = await GameLab.topScores(GAME, 10);
    rows = top.length ? '<table class="t">' + top.map((s, i) => '<tr><td class="d">' + (i + 1) + '.</td><td>' + esc(s.name) + '</td><td class="n a">' + s.score + '</td></tr>').join('') + '</table>' : '<p class="d">Nog niemand. Wees de eerste!</p>';
  } catch (e) { rows = '<p class="r">Offline: geen scores.</p>'; }
  if (scr === 'scores') setPanel('<h2>TOPTOLKEN</h2>' + rows + '<div class="bar"></div>' + mi('back', 'TERUG', 'ESC').replace('class="mi"', 'class="mi" data-back'));
}
function onlineScreen() {
  const pre = (new URLSearchParams(location.search).get('room') || '').toUpperCase();
  setPanel('<h2>SAMEN TOLKEN</h2>' +
    '<p class="d">Speel met 2 tot 4 tolken op hetzelfde terrein. Meer tolken = meer posten en meer drukte. De score is van het team.</p>' +
    '<p>Je naam</p><input class="dos" id="inName" maxlength="12" value="' + esc(myName() === 'TOLK' ? '' : myName()) + '" placeholder="TOLK">' +
    '<div class="bar"></div>' +
    mi('mk', 'NIEUWE KAMER MAKEN', '1') +
    '<p>Of doe mee met een code</p><input class="dos" id="inCode" maxlength="8" value="' + esc(pre) + '" placeholder="ABCD">' +
    '<button class="mi" data-a="join" data-enter><span class="k">2</span> MEEDOEN</button>' +
    '<div class="bar"></div>' + mi('back', 'TERUG', 'ESC').replace('class="mi"', 'class="mi" data-back'));
}
function readName() { const el = $('#inName'); if (el) { const v = el.value.trim(); if (v) GameLab.setPlayerName(v.toUpperCase()); } }
function lobbyPanel() {
  if (Net.mode !== 'room') return hidePanel();
  const url = location.origin + location.pathname + '?room=' + Net.code;
  const ps = Object.entries(S.players).map(([id, p]) => '<span style="color:' + PCOL[p.c] + '">■ ' + esc(p.n) + (id === Net.host ? ' (host)' : '') + (id === Net.me ? ' ←' : '') + '</span>').join('<br>');
  setPanel('<div class="d">KAMER</div><div class="big">' + esc(Net.code) + '</div>' +
    '<p class="d" style="font-size:16px;word-break:break-all">' + esc(url) + '</p>' +
    '<p>' + ps + '</p>' +
    '<p class="d">Loop alvast rond. ' + (isHost() ? 'Start als iedereen er is.' : 'De host start het spel.') + '</p>' +
    (isHost() ? mi('mstart', 'START DAG 1', '1') : '') +
    mi('share', 'LINK DELEN / KOPIËREN', '2') +
    mi('leave', 'KAMER VERLATEN', 'ESC').replace('class="mi"', 'class="mi" data-back'), 'side');
}
function introCard() {
  const D = DAYS[S.day - 1];
  const names = S.stations.map((k) => ST[k].name).join(' · ');
  panel.className = 'panel'; panel.classList.remove('hidden');
  panel.innerHTML = '<div style="text-align:center"><div class="d">08:00 · OEFENTERREIN</div><h1>' + D.name + '</h1><h2>' + esc(D.sub) + '</h2><p>' + esc(names) + '</p>' +
    (S.day === 1 ? '<p class="d">Luister in de cirkel · onthoud · breng het naar de pijl · tolk</p>' : '') + '</div>';
}
function statsTable() {
  const ps = Object.values(S.players).sort((a, b) => b.pts - a.pts);
  if (ps.length < 2) return '';
  return '<table class="t">' + ps.map((p) => '<tr><td style="color:' + PCOL[p.c] + '">■ ' + esc(p.n) + '</td><td class="n">' + p.ok + ' goed</td><td class="n d">' + p.bad + ' fout</td><td class="n a">' + p.pts + '</td></tr>').join('') + '</table><div class="bar"></div>';
}
function reportScreen() {
  const d = S.ds, done = d.ok + d.bad + d.miss;
  const acc = done ? d.ok / done : 0;
  const host = isHost();
  setPanel('<h2>DAGRAPPORT ' + DAYS[S.day - 1].name + '</h2>' +
    '<table class="t"><tr><td>Goed getolkt</td><td class="n">' + d.ok + '</td></tr><tr><td>Fout vertaald</td><td class="n r">' + d.bad + '</td></tr>' +
    '<tr><td>Gemist of vergeten</td><td class="n r">' + d.miss + '</td></tr><tr><td>Incidenten</td><td class="n r">' + d.inc + '</td></tr>' +
    '<tr><td>Punten vandaag</td><td class="n a">' + d.pts + '</td></tr><tr><td>Vertrouwen</td><td class="n">' + Math.round(S.trust) + '%  <span class="d">(+35 morgen)</span></td></tr></table>' +
    '<p>Beoordeling: <span class="a">' + rankOf(acc) + '</span> <span class="d">(' + Math.round(acc * 100) + '% goed)</span></p>' +
    '<div class="bar"></div>' + statsTable() +
    '<p class="d">Morgen: ' + esc(DAYS[S.day].name + ' · ' + DAYS[S.day].sub) + '</p>' +
    (host ? mi('next', 'VOLGENDE DAG', '1') : '<p class="a">Wachten tot de host doorgaat...</p>') +
    mi(Net.mode === 'room' ? 'leave' : 'menu', 'STOPPEN', 'ESC').replace('class="mi"', 'class="mi" data-back'));
}
let submitted = '';
function endScreen() {
  const st = S.stats, done = st.ok + st.bad + st.miss, acc = done ? st.ok / done : 0;
  const p = me(), won = S.phase === 'done';
  const myPts = p ? p.pts : 0;
  setPanel((won ? '<h2>OPLEIDING VOLTOOID</h2><p>De trainees vertrekken naar huis, met een tolk om nooit te vergeten.</p>'
    : '<h2 class="r">TERUG NAAR DE KAZERNE</h2><p>Het vertrouwen is op. De instructeurs zoeken een andere tolk... voor nu.</p>') +
    '<table class="t"><tr><td>Dagen</td><td class="n">' + S.day + ' / ' + DAYS.length + '</td></tr>' +
    '<tr><td>Goed / fout / gemist</td><td class="n">' + st.ok + ' / <span class="r">' + st.bad + '</span> / <span class="r">' + st.miss + '</span></td></tr>' +
    '<tr><td>Langste reeks</td><td class="n">x' + S.best + '</td></tr>' +
    '<tr><td>' + (Net.mode === 'room' ? 'Jouw punten' : 'Score') + '</td><td class="n a">' + myPts + '</td></tr>' +
    (Net.mode === 'room' ? '<tr><td>Team</td><td class="n a">' + totalPts() + '</td></tr>' : '') + '</table>' +
    '<p>Rang: <span class="a">' + rankOf(acc) + '</span></p>' +
    '<div class="bar"></div>' + statsTable() +
    '<p id="subm" class="d">' + (submitted === S.gid ? 'Score opgeslagen bij TOPTOLKEN.' : myPts > 0 ? 'Score opslaan...' : '') + '</p>' +
    ((Net.mode === 'solo' || isHost()) ? mi('again', 'NOG EEN KEER', '1') : '<p class="a">De host kan opnieuw starten.</p>') +
    mi('scores', 'TOPTOLKEN', '2') +
    mi(Net.mode === 'room' ? 'leave' : 'menu', 'NAAR HET MENU', 'ESC').replace('class="mi"', 'class="mi" data-back'));
  if (submitted !== S.gid && myPts > 0) {
    submitted = S.gid;
    const nm = myName();
    GameLab.submitScore(GAME, nm, myPts).then((r) => { const el = $('#subm'); if (el) el.textContent = 'Opgeslagen als ' + nm + (r && r.rank ? ': plek ' + r.rank : '') + '.'; })
      .catch(() => { const el = $('#subm'); if (el) el.textContent = 'Score niet opgeslagen (offline).'; });
  }
}
function pauseScreen() {
  const solo = Net.mode === 'solo';
  setPanel('<h2>' + (solo ? 'PAUZE' : 'MENU') + '</h2>' + (solo ? '' : '<p class="d">Het spel loopt door voor de anderen.</p>') +
    mi('resume', 'VERDER', 'ESC').replace('class="mi"', 'class="mi" data-back') +
    mi('setp', 'INSTELLINGEN', '2') +
    mi('how', 'HOE SPEEL JE?', '3') +
    (solo ? mi('restart', 'OPNIEUW BEGINNEN', '4') : '') +
    mi(solo ? 'menu' : 'leave', solo ? 'STOPPEN (naar menu)' : 'KAMER VERLATEN', '5'));
}
function openPause() {
  if (!S || scr) return;
  if (S.phase !== 'play' && S.phase !== 'intro' && S.phase !== 'lobby') return;
  closeQuiz(); scr = 'pause'; renderUI(true);
}
function act(a) {
  if (a === 'solo') { goSolo(); return; }
  if (a === 'back') { scr = backTo; backTo = 'main'; renderUI(true); return; }
  if (a === 'online') { backTo = 'main'; scr = 'online'; renderUI(true); setTimeout(() => { const el = $('#inName'); if (el && !usedTouch) el.focus(); }, 30); return; }
  if (a === 'how' || a === 'set' || a === 'setp' || a === 'scores') { backTo = scr; scr = a === 'setp' ? 'set' : a; renderUI(true); return; }
  if (a === 'pause') { scr = 'pause'; renderUI(true); return; }
  if (a === 'dos') { try { sessionStorage.setItem('errordos-ran', document.title); } catch (e) {} location.href = '/'; return; }
  if (a === 'menu') { leaveRoom(); Net.mode = 'solo'; Net.me = Net.host = 'local'; S = null; closeQuiz(); scr = 'main'; renderUI(true); return; }
  if (a === 'resume') { scr = null; renderUI(true); return; }
  if (a === 'restart') { goSolo(); return; }
  if (a === 'again') { if (Net.mode === 'solo') goSolo(); else { toHost({ a: 'start' }); } return; }
  if (a === 'next') { toHost({ a: 'next' }); return; }
  if (a === 'mstart') { toHost({ a: 'start' }); return; }
  if (a === 'mk') { readName(); joinRoom(GameLab.newRoomCode()); return; }
  if (a === 'join') { readName(); const c = ($('#inCode') || {}).value || ''; if (c.trim().length < 3) { toast('Typ eerst een code'); $('#inCode') && $('#inCode').focus(); return; } joinRoom(c); return; }
  if (a === 'rejoin') { joinRoom(Net.code); return; }
  if (a === 'leave') { leaveRoom(); Net.mode = 'solo'; Net.me = Net.host = 'local'; S = null; closeQuiz(); try { history.replaceState(null, '', location.pathname); } catch (e) {} scr = 'main'; renderUI(true); return; }
  if (a === 'share') {
    const url = location.origin + location.pathname + '?room=' + Net.code;
    if (navigator.share) navigator.share({ title: 'Tussen de Linies', text: 'Kom tolken! Kamer ' + Net.code, url }).catch(() => {});
    else if (navigator.clipboard) navigator.clipboard.writeText(url).then(() => toast('Link gekopieerd'), () => toast(url));
    return;
  }
  if (a === 's-mode') { CFG.mode = { quiz: 'hulp', hulp: 'arcade', arcade: 'quiz' }[CFG.mode]; }
  if (a === 's-tr') CFG.tr = !CFG.tr;
  if (a === 's-diff') CFG.diff = CFG.diff === 1 ? 1.3 : CFG.diff === 1.3 ? 0.75 : 1;
  if (a === 's-snd') { CFG.snd = !CFG.snd; AU.vol(); }
  if (a === 's-crt') { CFG.crt = !CFG.crt; applyCrt(); }
  if (a.startsWith('s-')) { saveCfg(); renderUI(true); }
}
function applyCrt() { $('#crt').classList.toggle('off', !CFG.crt); $('#vig').classList.toggle('off', !CFG.crt); }
panel.addEventListener('pointerdown', (e) => e.stopPropagation());

/* =====================================================================================
   MAIN LOOP
   ===================================================================================== */
let last = performance.now(), lastFrame = performance.now();
function hostTick(dt) {
  if (!S || !isHost()) return;
  const p = S.players[Net.me];
  if (p) { p.x = LP.x; p.y = LP.y; p.f = LP.f; }
  if (Net.mode === 'solo' && scr) return;           // paused / in a menu
  if (S.phase === 'intro') { S.it -= dt; if (S.it <= 0) { S.phase = 'play'; fx({ k: 'day' }); } }
  if (S.phase === 'play') { let left = dt; while (left > 0) { const h = Math.min(left, 0.05); step(h); left -= h; if (S.phase !== 'play') break; } }
}
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; lastFrame = now;
  T += dt;
  if (scr === 'boot') { bootT += dt; renderUI(true); }
  pollPad();
  movePlayer(dt);
  hostTick(dt);
  if (S && !isHost()) { const m = S.players[Net.me]; if (m) { m.x = LP.x; m.y = LP.y; } }
  sendPos(); sendState();
  processFx(); audioTick(dt); quizTick(dt); speakTick(dt);
  for (const id in Net.peers) { const p = Net.peers[id]; p.x += (p.tx - p.x) * Math.min(1, dt * 14); p.y += (p.ty - p.y) * Math.min(1, dt * 14); }
  for (let i = floats.length - 1; i >= 0; i--) { floats[i].age += dt; if (floats[i].age > 1.6) floats.splice(i, 1); }
  for (let i = banners.length - 1; i >= 0; i--) { banners[i].age += dt; if (banners[i].age > banners[i].dur) banners.splice(i, 1); }
  for (const k in redFlash) redFlash[k] = Math.max(0, redFlash[k] - dt);
  for (const k in muzzle) muzzle[k] -= dt;
  shake = Math.max(0, shake - dt);
  uiTimer -= dt;
  if (uiTimer <= 0) {
    uiTimer = 0.5; setOnline();
    if (S && S.phase === 'lobby' && !scr) { const sig = Net.host + Object.keys(S.players).join() + Object.values(S.players).map((p) => p.n).join(); if (sig !== lobbySig) { lobbySig = sig; renderUI(true); } }
  }
  renderUI();
  render();
  requestAnimationFrame(frame);
}
// a host in a background tab still has to run the game for the others
setInterval(() => {
  const now = performance.now();
  if (now - lastFrame < 400 || !S || !isHost() || Net.mode !== 'room') return;
  const dt = Math.min(1, (now - last) / 1000); last = now;
  hostTick(dt); sendState(true);
}, 250);

resize(); applyCrt();
if (matchMedia('(pointer: coarse)').matches) showTouch();
if (document.fonts && document.fonts.load) {
  Promise.all([document.fonts.load('16px VT323'), document.fonts.load('16px "Pixelify Sans"', 'Тест'), document.fonts.load('16px "Pixelify Sans"', 'Test')])
    .then(() => { layCache.clear(); }).catch(() => {});
}
{
  const room = new URLSearchParams(location.search).get('room');
  if (room) { scr = 'online'; bootT = 9; }
}
renderUI(true);
requestAnimationFrame(frame);
</script>
</body>
</html>
