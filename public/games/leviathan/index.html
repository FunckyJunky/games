<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leviathan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#03060b">
<meta name="description" content="LEVIATHAN: captain a 260 m airship over an endless land. Controller-first, full screen.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=B612+Mono:ital,wght@0,400;0,700;1,400&family=B612:wght@400;700&display=swap">
<style>
/* Layout: full-bleed 3D view; instrument glass panels pinned to safe-area corners; menus and the Ship's Log as a centred tablet */
:root{
  --ink:#03060b;
  --glass:rgba(8,15,28,.72);
  --glass-hi:rgba(14,27,47,.9);
  --line:rgba(110,205,255,.24);
  --line-hi:rgba(110,205,255,.6);
  --amber:#FFB028;
  --amber-dim:#9a6a19;
  --cyan:#6ECDFF;
  --ok:#7CF29C;
  --warn:#FF4F4A;
  --mag:#FF5BD8;
  --text:#dde7f1;
  --dim:#8494a8;
  --f-inst:"B612 Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --f-body:"B612", "Segoe UI", system-ui, sans-serif;
  --u:max(11px, calc(2.45vh * var(--ui, 1)));
  --gut-l:max(16px, env(safe-area-inset-left, 0px));
  --gut-r:max(16px, env(safe-area-inset-right, 0px));
  --gut-t:max(14px, env(safe-area-inset-top, 0px));
  --gut-b:max(14px, env(safe-area-inset-bottom, 0px));
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--ink);color:var(--text);overflow:hidden;overscroll-behavior:none;
  font-family:var(--f-inst);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
canvas{display:block}
[hidden]{display:none!important}
#gl{position:fixed;inset:0;width:100%;height:100%;outline:none}
#bootc{position:fixed;inset:0;width:100%;height:100%;z-index:50;background:#000}
.layer{position:fixed;inset:0;pointer-events:none}
.layer.int{pointer-events:auto}
.up{text-transform:uppercase;letter-spacing:.08em}
.glass{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(8px) saturate(1.2);-webkit-backdrop-filter:blur(8px) saturate(1.2);
  box-shadow:0 0 0 1px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.05);position:relative}
.glass::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px);mix-blend-mode:screen}
.amb{color:var(--amber)} .cy{color:var(--cyan)} .okc{color:var(--ok)} .wr{color:var(--warn)} .mg{color:var(--mag)} .dim{color:var(--dim)}
.tnum{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){ *{animation-duration:0s!important;transition-duration:0s!important} }

/* ---------- glyphs ---------- */
.gl{display:inline-grid;place-items:center;min-width:1.55em;height:1.55em;padding:0 .3em;border-radius:999px;font-family:var(--f-body);
  font-weight:700;font-size:.82em;line-height:1;vertical-align:-.28em;color:#0b0f15;background:#cfd8e3;box-sizing:border-box;position:relative;
  box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}
.gl.sq{border-radius:.35em} .gl.key{border-radius:.3em;background:#e8edf3;color:#111;font-family:var(--f-inst);min-width:1.7em;box-shadow:inset 0 -3px 0 #9aa6b4}
.gl.xa{background:#5fd068} .gl.xb{background:#ff5a52} .gl.xx{background:#3f9cff;color:#fff} .gl.xy{background:#ffd23f}
.gl.ps{background:#1b2230;color:#e6edf6;font-size:.95em}
.gl.pa{color:#8fb3ff} .gl.pb{color:#ff7a7a} .gl.px{color:#ff8ad6} .gl.py{color:#5fe0b0}
.gl.nin{background:#2a2f36;color:#fff}
.gl.sh{border-radius:.3em;background:#3a4452;color:#e9eef5;font-family:var(--f-inst);font-size:.72em;min-width:2.2em}
.gl .fill{position:absolute;inset:-4px;border-radius:999px;background:conic-gradient(var(--amber) calc(var(--p,0)*1turn),transparent 0);
  -webkit-mask:radial-gradient(circle,transparent 58%,#000 60%);mask:radial-gradient(circle,transparent 58%,#000 60%)}

/* ---------- press / title ---------- */
#press{display:grid;place-items:center;z-index:40;background:radial-gradient(ellipse at 50% 60%,rgba(255,176,40,.08),transparent 60%),#000}
#press .pk{font-size:calc(var(--u)*1.05);letter-spacing:.42em;color:var(--amber);animation:blink 1.6s steps(2) infinite;text-align:center;padding-inline:var(--gut-l) var(--gut-r)}
#press .sub{margin-top:1.4em;color:var(--dim);font-size:calc(var(--u)*.62);letter-spacing:.2em;text-align:center;line-height:1.7}
@keyframes blink{50%{opacity:.25}}

#title{z-index:30;display:grid;grid-template-columns:minmax(0,1fr);align-content:end;padding:var(--gut-t) var(--gut-r) calc(var(--gut-b) + 2vh) var(--gut-l);
  background:linear-gradient(90deg,rgba(2,5,10,.82) 0%,rgba(2,5,10,.35) 42%,transparent 70%),linear-gradient(0deg,rgba(2,5,10,.7),transparent 45%)}
.logo{font-family:var(--f-inst);font-weight:700;font-size:min(13vw,calc(var(--u)*4.4));letter-spacing:.32em;line-height:.9;color:#f3efe6;
  text-shadow:0 0 .35em rgba(255,176,40,.35);margin:0 0 .15em -.04em}
.tagline{color:var(--amber);font-size:calc(var(--u)*.68);letter-spacing:.34em;margin-bottom:5vh}
.menu{display:flex;flex-direction:column;gap:.18em;font-size:calc(var(--u)*1.0);width:min(100%,28em)}
.mi{display:flex;align-items:center;gap:.8em;padding:.42em .7em;color:var(--dim);letter-spacing:.14em;text-transform:uppercase;cursor:pointer;
  border-left:3px solid transparent;transition:background .12s,color .12s}
.mi .val{margin-left:auto;color:var(--cyan)}
.mi.sel{color:#fff;background:linear-gradient(90deg,rgba(255,176,40,.18),rgba(255,176,40,.02));border-left-color:var(--amber)}
.mi.sel .arrow{visibility:visible}
.mi.off{opacity:.35}
.mi .arrow{visibility:hidden;color:var(--amber)}
.titlefoot{display:flex;flex-wrap:wrap;gap:1.4em;margin-top:4vh;color:var(--dim);font-size:calc(var(--u)*.6);letter-spacing:.14em}
.padstat{display:flex;align-items:center;gap:.6em}
.dot{width:.55em;height:.55em;border-radius:50%;background:var(--warn);box-shadow:0 0 .6em currentColor}
.dot.on{background:var(--ok)}

/* ---------- HUD ---------- */
#hud{z-index:10;font-size:var(--u);padding:var(--gut-t) var(--gut-r) var(--gut-b) var(--gut-l)}
#hud.hide{opacity:0}
.hpanel{position:absolute;padding:.5em .75em}
#h-warn,#h-toasts,#h-prompt,#h-clock{position:absolute}
#h-step{left:var(--gut-l);top:var(--gut-t);max-width:min(46vw,24em);font-size:.78em;line-height:1.45}
#h-step .k{color:var(--amber);letter-spacing:.12em}
#h-step .t{color:var(--text)}
#h-step .s{color:var(--dim);font-size:.85em;margin-top:.25em}
#h-suit{left:var(--gut-l);top:calc(var(--gut-t) + 6.2em);font-size:.7em}
#h-compass{left:50%;top:var(--gut-t);transform:translateX(-50%);width:min(44vw,30em);height:2.3em;padding:0}
#h-compass canvas{width:100%;height:100%}
#h-deck{position:absolute;left:50%;top:calc(var(--gut-t) + 3.0em);transform:translateX(-50%);font-size:.6em;letter-spacing:.3em;color:var(--dim)}
#h-mini{right:var(--gut-r);top:var(--gut-t);width:min(22vh,32vw);height:min(22vh,32vw);padding:0;border-radius:50%;overflow:hidden}
#h-mini canvas{width:100%;height:100%;border-radius:50%}
#h-clock{right:var(--gut-r);top:calc(var(--gut-t) + min(22vh,32vw) + .5em);font-size:.66em;text-align:right;color:#c3cfdc;letter-spacing:.1em;line-height:1.5;text-shadow:0 1px 2px #000,0 0 6px rgba(0,0,0,.9)}
#h-helm{left:50%;bottom:var(--gut-b);transform:translateX(-50%);display:grid;grid-template-columns:repeat(6,auto);gap:.15em 1.25em;
  padding:.55em 1em .5em;align-items:end}
.ins{display:flex;flex-direction:column;align-items:flex-start;min-width:3.6em}
.ins .l{font-size:.5em;letter-spacing:.24em;color:var(--dim)}
.ins .v{font-size:1.2em;color:var(--amber);line-height:1.05}
.ins .v small{font-size:.5em;color:var(--dim);margin-left:.2em}
.ins.c .v{color:var(--cyan)}
.bar{height:.28em;width:100%;background:rgba(255,255,255,.08);margin-top:.18em;position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--amber)}
#h-ap{grid-column:1/-1;display:flex;gap:1.1em;font-size:.6em;letter-spacing:.16em;color:var(--dim);border-top:1px solid var(--line);padding-top:.4em;flex-wrap:wrap}
#h-ap b{color:var(--cyan);font-weight:400}
#h-ap .on{color:var(--ok)}
#h-warn{left:50%;top:22vh;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:.3em;font-size:1.05em;letter-spacing:.24em}
#h-warn .w{color:var(--warn);padding:.15em .6em;border:1px solid var(--warn);background:rgba(60,0,0,.45);animation:wf .5s steps(2) infinite}
#h-warn .c{color:var(--amber);padding:.15em .6em;border:1px solid var(--amber-dim);background:rgba(40,25,0,.45)}
@keyframes wf{50%{opacity:.35}}
#h-prompt{right:var(--gut-r);bottom:calc(var(--gut-b) + .2em);display:flex;flex-direction:column;align-items:flex-end;gap:.35em;font-size:.78em;letter-spacing:.1em}
#h-prompt .p{display:flex;gap:.55em;align-items:center;padding:.3em .55em .3em .7em}
#h-prompt .p.main{font-size:1.12em;color:#fff}
#h-reticle{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:rgba(255,255,255,.8);box-shadow:0 0 6px rgba(0,0,0,.7)}
#h-target{position:absolute;width:2.6em;height:2.6em;margin:-1.3em 0 0 -1.3em;border:2px solid var(--amber);transform:rotate(45deg);
  box-shadow:0 0 10px rgba(255,176,40,.6);transition:left .06s linear,top .06s linear}
#h-target.hide{display:none}
#h-toasts{left:50%;bottom:calc(var(--gut-b) + 10.2em);transform:translateX(-50%);display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:.3em;width:min(90vw,36em)}
.toast{padding:.38em .9em;font-size:.68em;letter-spacing:.13em;text-align:center;color:var(--text);animation:tin .25s ease-out}
#h-sub{position:absolute;left:50%;bottom:calc(var(--gut-b) + 6.3em);transform:translateX(-50%);width:min(92vw,40em);text-align:center;font-family:var(--f-body);font-size:.8em;line-height:1.45;
  color:#fff;text-shadow:0 1px 3px #000,0 0 8px rgba(0,0,0,.8);transition:opacity .4s}
#h-sub b{color:var(--cyan);font-family:var(--f-inst);font-weight:400;letter-spacing:.14em;margin-right:.5em;font-size:.85em}
#h-hint{position:absolute;left:var(--gut-l);top:calc(var(--gut-t) + 7.2em);max-width:min(40vw,21em);font-size:.66em;line-height:1.55;padding:.6em .8em;color:var(--text);transition:opacity .5s}
#h-hint .k{color:var(--cyan);letter-spacing:.2em;display:block;margin-bottom:.2em}
.toast.a{color:var(--amber)} .toast.c{color:var(--cyan)} .toast.r{color:var(--warn)} .toast.g{color:var(--ok)} .toast.m{color:var(--mag)}
.toast.big{font-size:1.15em;letter-spacing:.3em}
@keyframes tin{from{opacity:0;transform:translateY(.5em)}}
#h-chip{left:50%;top:calc(var(--gut-t) + 4.4em);transform:translateX(-50%);font-size:.7em;letter-spacing:.32em;padding:.35em .9em;color:var(--cyan);transition:opacity .4s}
#h-carry{left:var(--gut-l);bottom:var(--gut-b);font-size:.68em;letter-spacing:.12em;display:flex;align-items:center;gap:.6em}
#h-alarm{position:absolute;inset:0;box-shadow:inset 0 0 0 .5em var(--warn),inset 0 0 6em rgba(255,40,40,.5);display:grid;place-items:start center;
  padding-top:12vh;font-size:1.4em;letter-spacing:.3em;color:var(--warn);animation:wf .45s steps(2) infinite}
#h-drone{position:absolute;inset:var(--gut-t) var(--gut-r) var(--gut-b) var(--gut-l)}
.corner{position:absolute;width:3.5em;height:3.5em;border:2px solid rgba(255,255,255,.75)}
.corner.tl{left:6vw;top:10vh;border-right:0;border-bottom:0}.corner.tr{right:6vw;top:10vh;border-left:0;border-bottom:0}
.corner.bl{left:6vw;bottom:14vh;border-right:0;border-top:0}.corner.br{right:6vw;bottom:14vh;border-left:0;border-top:0}
#d-rec{position:absolute;left:calc(6vw + 4.3em);top:10vh;font-size:.8em;letter-spacing:.2em}
#d-rec i{display:inline-block;width:.7em;height:.7em;border-radius:50%;background:var(--warn);margin-right:.45em;animation:wf 1s steps(2) infinite}
#d-info{position:absolute;right:calc(6vw + 4.3em);top:10vh;text-align:right;font-size:.72em;line-height:1.55;letter-spacing:.12em}
#d-scan{position:absolute;left:50%;top:60%;transform:translateX(-50%);font-size:.85em;letter-spacing:.2em;text-align:center}
#d-cross{position:absolute;left:50%;top:50%;width:4em;height:4em;margin:-2em 0 0 -2em;opacity:.8}
#d-cross::before,#d-cross::after{content:"";position:absolute;background:rgba(255,255,255,.8)}
#d-cross::before{left:50%;top:0;bottom:0;width:1px}#d-cross::after{top:50%;left:0;right:0;height:1px}
.sig{display:inline-flex;gap:2px;align-items:flex-end;height:.9em;vertical-align:-.1em;margin-left:.4em}
.sig i{width:.25em;background:rgba(255,255,255,.25)}
.sig i.on{background:var(--ok)}
#h-thr{position:absolute;left:calc(6vw);bottom:calc(14vh + 4.5em);width:.6em;height:20vh;border:1px solid rgba(255,255,255,.5)}
#h-thr i{position:absolute;left:0;right:0;bottom:0;background:var(--amber)}

/* ---------- wheel ---------- */
#wheel{display:grid;place-items:center;z-index:25;background:radial-gradient(circle,rgba(0,0,0,.55),rgba(0,0,0,.2) 60%,transparent)}
#wheel svg{width:min(70vh,92vw);height:min(70vh,92vw);overflow:visible}
#wheel .seg{fill:rgba(10,20,36,.78);stroke:rgba(110,205,255,.3);stroke-width:1}
#wheel .seg.sel{fill:rgba(255,176,40,.28);stroke:var(--amber);stroke-width:2}
#wheel .seg.dis{fill:rgba(10,14,20,.6)}
#wheel text{font-family:var(--f-inst);fill:#e7eef6;font-size:15px;letter-spacing:.12em;text-anchor:middle;dominant-baseline:middle}
#wheel text.dis{fill:#56606e}
#wheel text.why{font-size:10px;fill:var(--warn)}
#wheel .hub{fill:rgba(3,6,11,.9);stroke:var(--line)}
#wheel text.hubt{fill:var(--amber);font-size:13px}

/* ---------- tablet (log, pause, panels) ---------- */
.veil{z-index:20;display:grid;place-items:center;background:rgba(2,5,10,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);pointer-events:auto;
  padding:var(--gut-t) var(--gut-r) var(--gut-b) var(--gut-l)}
.tablet{width:min(100%,62em);height:min(100%,40em);display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;font-size:calc(var(--u)*.78);
  background:linear-gradient(180deg,#0d1828,#070d17);border:1px solid var(--line-hi);border-radius:.9em;box-shadow:0 2em 6em rgba(0,0,0,.7),inset 0 0 0 .35em #121c2a,inset 0 0 0 .45em #0a111b;overflow:hidden}
.tab-head{display:flex;align-items:center;gap:1em;padding:.9em 1.4em .5em}
.tab-head .ttl{color:var(--amber);letter-spacing:.3em;font-weight:700}
.tab-head .meta{margin-left:auto;color:var(--dim);letter-spacing:.14em;font-size:.85em}
.tabs{display:flex;gap:.2em;padding:0 1.1em;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs .t{padding:.55em .8em;color:var(--dim);letter-spacing:.16em;white-space:nowrap;border-bottom:2px solid transparent;cursor:pointer}
.tabs .t.sel{color:#fff;border-bottom-color:var(--amber)}
.tabs .gl{margin:0 .3em}
.tab-body{padding:1.1em 1.4em;overflow:auto;min-height:0;scrollbar-width:thin;scrollbar-color:#2a3a52 transparent}
.tab-foot{display:flex;gap:1.5em;justify-content:flex-end;padding:.6em 1.4em;border-top:1px solid var(--line);color:var(--dim);font-size:.85em;letter-spacing:.1em;flex-wrap:wrap}
.tab-foot span{display:flex;align-items:center;gap:.45em}
.now-big{font-size:1.5em;color:#fff;line-height:1.35;margin:.2em 0 .5em;max-width:30em;text-wrap:balance}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:.35em 1.4em;align-items:baseline}
.kv .k{color:var(--dim);letter-spacing:.14em;font-size:.85em}
.kv .v{color:var(--amber)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,15em),1fr));gap:1em}
.card{border:1px solid var(--line);background:rgba(110,205,255,.03);padding:.8em .9em;border-radius:.4em;display:flex;flex-direction:column;gap:.35em;min-width:0}
.card.sel{border-color:var(--amber);background:rgba(255,176,40,.08)}
.card.done{border-color:rgba(124,242,156,.5)}
.card h4{margin:0;font-weight:400;letter-spacing:.18em;color:#fff;font-size:1em}
.card p{margin:0;color:var(--dim);line-height:1.45;font-family:var(--f-body);font-size:.95em}
.pill{display:inline-block;padding:.08em .55em;border-radius:999px;border:1px solid currentColor;font-size:.75em;letter-spacing:.14em;width:max-content}
.list .row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:.9em;align-items:center;padding:.55em .7em;border-bottom:1px solid rgba(110,205,255,.08);cursor:pointer}
.list .row.sel{background:rgba(255,176,40,.12);outline:1px solid rgba(255,176,40,.5)}
.list .row .sub{color:var(--dim);font-size:.85em}
.mapwrap{display:grid;place-items:center;height:100%}
.mapwrap canvas{max-width:100%;max-height:100%;border:1px solid var(--line);border-radius:.3em}
.manual h3{color:var(--amber);letter-spacing:.24em;font-weight:400;margin:.2em 0 .6em}
.manual p,.manual li{font-family:var(--f-body);color:#c8d3df;line-height:1.6;max-width:44em}
.manual table{border-collapse:collapse;width:100%;max-width:44em;margin:.4em 0 1em}
.manual td{padding:.35em .5em;border-bottom:1px solid rgba(110,205,255,.1);vertical-align:middle}
.manual td:first-child{white-space:nowrap;width:1%}

.panel{width:min(100%,46em);max-height:100%;overflow:auto;padding:1.2em 1.4em;font-size:calc(var(--u)*.8);border-radius:.6em;
  background:linear-gradient(180deg,rgba(13,24,40,.96),rgba(6,11,20,.96));border:1px solid var(--line-hi);box-shadow:0 1.5em 5em rgba(0,0,0,.7)}
.panel .ph{display:flex;align-items:baseline;gap:1em;margin-bottom:.8em}
.panel .ph .ttl{color:var(--amber);letter-spacing:.3em}
.panel .ph .meta{margin-left:auto;color:var(--dim);font-size:.85em;letter-spacing:.12em}
.panel .foot{display:flex;gap:1.4em;justify-content:flex-end;margin-top:1em;color:var(--dim);font-size:.85em;flex-wrap:wrap}
.panel .foot span{display:flex;align-items:center;gap:.45em}
.radio{font-size:.9em;line-height:1.6;max-height:9em;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;
  border:1px solid var(--line);padding:.6em .8em;margin-bottom:.8em;background:rgba(0,0,0,.3)}
.radio .in{color:var(--cyan)} .radio .out{color:var(--amber)}
.dial{display:flex;align-items:center;gap:1em;margin:.6em 0}
.cookbar{position:relative;height:1.3em;background:linear-gradient(90deg,#2b3a4d 0 55%,#2e5a37 55% 74%,#5a2b2b 74%);border:1px solid var(--line)}
.cookbar i{position:absolute;top:-.35em;bottom:-.35em;width:3px;background:#fff;box-shadow:0 0 8px #fff}
.cookbar .lab{position:absolute;top:1.6em;font-size:.7em;color:var(--dim);letter-spacing:.14em}
.heat{display:flex;gap:3px;align-items:flex-end;height:3em}
.heat i{flex:1;background:#223047}
.heat i.band{background:#2e5a37}
.heat i.on{background:var(--amber)}
.heat i.on.band{background:var(--ok)}
.stars{color:var(--amber);letter-spacing:.2em;font-size:1.3em}
.bigprompt{font-size:1.6em;letter-spacing:.3em;text-align:center;color:#fff;margin:.4em 0;min-height:1.4em}
.bigprompt.hot{color:var(--amber);animation:wf .3s steps(2) infinite}

/* =========================================================================

/* ---- leg IK ---- */
const _d = new V3(), _pole = new V3(), _pp = new V3();
function solveLeg(L, target, L1 = 7.4, L2 = 7.2) {
  const H = L.hip; _d.subVectors(target, H); let d = _d.length(); const dir = _d.multiplyScalar(1 / Math.max(d, 1e-4));
  d = clamp(d, 1.2, L1 + L2 - 0.02);
  const F = L.foot.copy(H).addScaledVector(dir, d);
  const cosA = clamp((L1 * L1 + d * d - L2 * L2) / (2 * L1 * d), -1, 1); const sinA = Math.sqrt(1 - cosA * cosA);
  _pole.set(0.25, 0.75, L.s * 0.85).normalize();
  _pp.copy(_pole).addScaledVector(dir, -_pole.dot(dir)).normalize();
  L.knee.copy(H).addScaledVector(dir, L1 * cosA).addScaledVector(_pp, L1 * sinA);
  placeBetween(L.boom, H, L.knee, 0.42); placeBetween(L.stick, L.knee, F, 0.34);
  const rA = new V3().copy(H).add(new V3(-1.6, 0.6, 0)); const rB = new V3().lerpVectors(H, L.knee, 0.55);
  placeBetween(L.ram, rA, rB, 0.16);
  const rC = new V3().lerpVectors(H, L.knee, 0.7).add(new V3(0, 0.4, 0)); const rD = new V3().lerpVectors(L.knee, F, 0.45);
  placeBetween(L.ram2, rC, rD, 0.13);
  L.pinK.position.copy(L.knee); L.pad.position.copy(F).add(new V3(0, 0.15, 0));
}

function shipStep(dt) {
  const D = diff(); const massK = 1 / D.mass;

  const reserve = ship.cells > 0 ? 1 : 0.3;

  const lag = 2.3;
  ship.spool += (thr * reserve - ship.spool) * (1 - Math.exp(-dt / lag));
  if (ship.landed) {

      const fg = feetGround(); ship.pos.y = damp(ship.pos.y, fg.reduce((s, f) => s + f.g, 0) / 4, 8, dt);
    }
    if (climb > 0.35 && powered) liftOff();

  }
  fwdOf(ship.heading, _f); rightOf(ship.heading, _r); windVec(_wind).multiplyScalar(ship.agl < 30 ? 0.5 : 1);
  const ax = ship.vel.x - _wind.x, az = ship.vel.z - _wind.z;
  const af = ax * _f.x + az * _f.z, as = ax * _r.x + az * _r.z;
  const accT = (ship.spool >= 0 ? 1.7 : 1.05) * ship.spool * massK;

  const dS = -(0.05 * as * Math.abs(as) + 0.10 * as) * D.drag;
  const sl = slide * 0.32 * massK;
  ship.accF = accT + dF;
  ship.vel.x += (_f.x * (accT + dF) + _r.x * (dS + sl)) * dt;
  ship.vel.z += (_f.z * (accT + dF) + _r.z * (dS + sl)) * dt;

  ship.yawRate += (rud * 0.0315 * rudEff * massK * (powered ? 1 : 0.3) - ship.yawRate * 0.45) * dt;
  ship.heading = wrapPi(ship.heading + ship.yawRate * dt);
  let tvs = climb * 5.5;
  if (ship.holdHeight && Math.abs(climb) < 0.1) tvs = clamp((ship.holdY - ship.pos.y) * 0.3, -3, 3);
  if (ship.pos.y > 2650) tvs = Math.min(tvs, -0.5);
  ship.vs += (tvs - ship.vs) * (1 - Math.exp(-dt * 0.55 * massK));
  ship.vs += Math.sin(G.time * 0.9 + 1.7) * WX.wind * 0.0025 * dt * 60 * (WX.state === 'STORM' ? 2.5 : 1) * 0.02;

function contactCheck(dt) {

  }

  for (const c of CONTACTS) {

    if (feetWater && ship.vs < 0) { ship.pos.y += feetPen; ship.vs = 0.6; if (G.time - ship.lastWater > 4) { ship.lastWater = G.time; toast('WATER BELOW: CANNOT LAND', 'a'); } return; }
    if (ship.vs < -3.2) { ship.pos.y += feetPen; ship.vs = -ship.vs * 0.3; ship.airframe = Math.max(30, ship.airframe - 2); toast('HARD LANDING', 'r'); SFX.knock(); IN.rumble(0.9, 0.6, 400); return; }
    if (hs < 2.6) { touchDown(false); return; }
    ship.pos.y += feetPen; ship.vel.multiplyScalar(Math.exp(-dt * 1.2)); ship.vs = Math.max(0, ship.vs);
    if (G.time - ship.lastWater > 2) { ship.lastWater = G.time; toast('SKIDDING: SLOW DOWN TO LAND', 'a'); IN.rumble(0.3, 0.5, 200); }
    return;
  }

function updateBases(dt, focus) {
  const night = ENV.uNightLights.value;

    const d = Math.hypot(b.x - focus.x, b.z - focus.z);
    if (!b.obj && d < 4500) buildBase(b);
    if (b.obj && d > 5200) { scene.remove(b.obj); b.obj = null; }
    if (!b.obj) continue;
    const moored = ship.moored === b; const near = !ship.landed && Math.hypot(padPose(b).x - ship.pos.x, padPose(b).z - ship.pos.z) < 900;
    const charging = charger.base === b && charger.state === 'charging';
    const col = new THREE.Color(); const t = G.time;
    for (let i = 0; i < 64; i++) {
      if (charging) col.setRGB(3, 1.6, 0.2).multiplyScalar(0.4 + 0.6 * (Math.sin(t * 4) * 0.5 + 0.5));
      else if (moored) col.setRGB(0.3, 3, 0.8).multiplyScalar(0.5 + 0.5 * Math.sin(t * 1.5));
      else if (near || (ship.al && ship.al.base === b)) { const k = ((i - t * 30) % 64 + 64) % 64; col.setRGB(0.4, 2.2, 3.2).multiplyScalar(k < 8 ? 1.6 : 0.15); }
      else col.setRGB(0.15, 0.3, 1.2).multiplyScalar(0.5 + night * 0.5);
      b.edge.setColorAt(i, col);
    }
    b.edge.instanceColor.needsUpdate = true;
    b.ringMat.color.setRGB(0.4, 1.6, 2.6).multiplyScalar(moored ? 0.4 : 1);
    const clampT = moored ? 1 : 0; b.clampT = damp(b.clampT || 0, clampT, 2, dt);
    b.cradles.forEach(([j1, j2]) => { j1.rotation.z = b.clampT * 0.6; j2.rotation.z = -b.clampT * 0.6; });
    b.beacons.forEach((bl) => { if (bl.userData.flood) bl.material.color.setRGB(3, 3, 2.6).multiplyScalar(night); else bl.material.color.setRGB(4, 0.2, 0.1).multiplyScalar((t % 1.5) < 0.2 ? 2 : 0.15); });
    b.winMat.emissiveIntensity = 0.1 + night * 1.6; (b.doors || []).forEach((d2) => (d2.material.emissiveIntensity = night * 1.2));
    if (b.sock) { b.sock.rotation.y = -(WX.windDir - b.heading) - Math.PI / 2; b.sock.children[0].rotation.x = Math.sin(t * 3) * 0.1; b.sock.children[0].scale.y = 0.6 + Math.min(1, WX.wind / 10) * 0.4; }
    if (b.jet) { const ext = moored ? 1 : 0; b.jetT = damp(b.jetT || 0, ext, 0.5, dt); b.jet.scale.z = 1 + b.jetT * 27; b.jet.position.z = 36 - b.jetT * 13.5; }
  }
}

  charger.base = b; charger.state = 'out'; charger.obj.visible = true;
  const s = Math.sin(b.heading), c = Math.cos(b.heading);
  charger.home = new V3(b.x + s * 40 + c * 62, 0, b.z - c * 40 + s * 62); charger.pos.copy(charger.home);

function chargerWarn() { return charger.state === 'wait' && ship.power; }
function updateCharger(dt) {
  if (!charger.obj || charger.state === 'idle') { if (charger.obj) charger.obj.visible = false; return; }
  const g = charger.obj; g.visible = true;
  const target = shipL2W(59.5, 0, -11.5, new V3()); const socket = shipL2W(59.5, 5.2, -6.75, new V3());
  const go = (dest, then) => { const d = new V3(dest.x - charger.pos.x, 0, dest.z - charger.pos.z); const L = d.length(); if (L < 0.5) { then(); return; } d.multiplyScalar(Math.min(L, 5 * dt) / L); charger.pos.add(d); charger.yaw = Math.atan2(d.x, -d.z); };
  if (charger.state === 'out') go(target, () => { charger.state = 'wait'; SFX.warn(); toast('WARNING: CHARGER: MAIN POWER OFF', 'r'); });
  else if (charger.state === 'wait') { if (!ship.power) { charger.state = 'plugging'; charger.t = 0; } }
  else if (charger.state === 'plugging') { charger.t += dt; charger.arm = Math.min(1, charger.t / 2); if (charger.arm >= 1) { charger.state = 'charging'; SFX.clunk(); toast('CHARGER CONNECTED: CHARGING', 'a'); } }
  else if (charger.state === 'charging') { ship.cells = Math.min(100, ship.cells + dt * 100 / 90); if (ship.cells >= 100) { charger.state = 'full'; toast('CELLS FULL: SET MAIN', 'g'); SFX.chime(); } if (ship.power) { charger.state = 'full'; } }
  else if (charger.state === 'full') { if (ship.power) { charger.state = 'leaving'; radio('CHARGER DISCONNECTED. YOU ARE GOOD TO GO.', 'in', false); } }
  else if (charger.state === 'leaving') { charger.arm = Math.max(0, charger.arm - dt); go(charger.home, () => { charger.state = 'idle'; }); }
  charger.pos.y = surfaceAt(charger.pos.x, charger.pos.z);
  g.position.copy(charger.pos); g.rotation.y = Math.PI / 2 - (charger.yaw || 0);
  // arm: two bones from shoulder to socket
  const sh = g.localToWorld(new V3(0.4, 1.6, 0)); const end = new V3().lerpVectors(g.localToWorld(new V3(0.9, 2.2, 0)), socket, charger.arm);
  const mid = new V3().lerpVectors(sh, end, 0.5).add(new V3(0, 1.4 * (1 - Math.abs(charger.arm - 0.5)), 0));
  const tmp = new THREE.Group(); // compute in world then convert
  const toLocal = (v) => g.worldToLocal(v.clone());
  placeBetween(charger.a1, toLocal(sh), toLocal(mid), 0.16); placeBetween(charger.a2, toLocal(mid), toLocal(end), 0.13);
  charger.plug.position.copy(toLocal(end));
  charger.lamp.material.color.setRGB(3, 1.6, 0.2).multiplyScalar((G.time % 0.8) < 0.4 ? 1 : 0.1);
}

const missions = { offers: [], active: null, prog: 0, done: 0 };
function genOffers() {
  missions.offers = [];
  for (let i = 0; i < 3; i++) {
    let best = null;
    for (let k = 0; k < 12 && !best; k++) {
      const brg = rand(0, 360), dist = rand(3000, 9000); const x = ship.pos.x + Math.sin(brg * DEG) * dist, z = ship.pos.z - Math.cos(brg * DEG) * dist;
      const b = biomeName(x, z);
      const fits = MISSION_TYPES.filter((m) => m.biomes && m.biomes.includes(b) && !missions.offers.some((o) => o.name === m.name));
      if (fits.length) { const m = pick(fits); best = { name: m.name, line: m.line, data: m.data, x, z, biome: b }; }
    }
    if (!best) { const brg = rand(0, 360), dist = rand(3000, 9000); best = { name: 'LOST BALLOON', line: MISSION_TYPES[8].line, data: 2, x: ship.pos.x + Math.sin(brg * DEG) * dist, z: ship.pos.z - Math.cos(brg * DEG) * dist, biome: '' }; }
    missions.offers.push(best);

}

/* =========================================================================
   SCREENS — painters for the in-world displays, shared terrain map renderer
   ========================================================================= */
class TerrainMap {
  constructor(w, h) { this.w = w; this.h = h; this.cv = document.createElement('canvas'); this.cv.width = w; this.cv.height = h; this.ctx = this.cv.getContext('2d'); this.img = this.ctx.createImageData(w, h); this.hs = new Float32Array(w * h); this.row = h; this.cx = 1e9; this.cz = 1e9; this.mpp = 0; this.done = false; }
  view(cx, cz, mpp) {

  }
  start() { if (this.ncx == null) return; this.gcx = this.ncx; this.gcz = this.ncz; this.gm = this.nmpp; this.ncx = null; this.row = 0; }
  step(rows = 6) {
    if (this.row >= this.h || !TER.lib) { if (this.row >= this.h && this.ncx != null) this.start(); return; }
    const L = TER.lib, w = this.w, h = this.h, m = this.gm;
    const end = Math.min(h, this.row + rows);
    for (let j = this.row; j < end; j++) for (let i = 0; i < w; i++) { const x = this.gcx + (i - w / 2) * m, z = this.gcz + (j - h / 2) * m; this.hs[j * w + i] = L.height(x, z); }
    this.row = end;
    if (this.row >= h) this.paint();
  }
  paint() {
    const w = this.w, h = this.h, hs = this.hs, d = this.img.data, m = this.gm;
    for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
      const k = j * w + i, v = hs[k]; const vx = hs[Math.min(w - 1, i + 1) + j * w] - hs[Math.max(0, i - 1) + j * w], vz = hs[i + Math.min(h - 1, j + 1) * w] - hs[i + Math.max(0, j - 1) * w];
      let r, g, b;
      if (v < WATER) { const dd = clamp((WATER - v) / 30, 0, 1); r = 20 - dd * 10; g = 60 - dd * 25; b = 82 - dd * 20; }
      else { const t = clamp((v - 200) / 900, 0, 1); const ramp = [[58, 92, 48], [92, 112, 58], [128, 118, 78], [118, 104, 92], [150, 146, 140], [230, 234, 238]]; const f = t * (ramp.length - 1); const a = Math.floor(f), fr = f - a; const c0 = ramp[a], c1 = ramp[Math.min(ramp.length - 1, a + 1)]; r = c0[0] + (c1[0] - c0[0]) * fr; g = c0[1] + (c1[1] - c0[1]) * fr; b = c0[2] + (c1[2] - c0[2]) * fr;
        const shade = clamp(1 + (-vx - vz) / (m * 2.2) * 0.9, 0.45, 1.5); r *= shade; g *= shade; b *= shade;
        const c = Math.floor(v / 25); if (Math.floor(hs[Math.min(w - 1, i + 1) + j * w] / 25) !== c || Math.floor(hs[i + Math.min(h - 1, j + 1) * w] / 25) !== c) { r *= 0.72; g *= 0.72; b *= 0.72; } }
      const o = k * 4; d[o] = r; d[o + 1] = g; d[o + 2] = b; d[o + 3] = 255;
    }
    this.ctx.putImageData(this.img, 0, 0); this.cx = this.gcx; this.cz = this.gcz; this.mpp = this.gm; this.done = true;
  }
  /** draw into ctx centred on (cx,cz) at scale px-per-metre, rotated by rot (radians, map-up) */
  draw(ctx, x, y, w, h, cx, cz, ppm, rot = 0) {
    if (!this.done) { ctx.fillStyle = '#0a1420'; ctx.fillRect(x, y, w, h); return; }
    ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
    ctx.translate(x + w / 2, y + h / 2); ctx.rotate(rot); ctx.scale(ppm * this.mpp, ppm * this.mpp);
    ctx.translate(-(cx - this.cx) / this.mpp - this.w / 2, -(cz - this.cz) / this.mpp - this.h / 2);
    ctx.imageSmoothingEnabled = true; ctx.drawImage(this.cv, 0, 0); ctx.restore();
  }
}

function calibInput(dt) {
  if (IN.pressed(BTN.B) || IN.pressed(BTN.MENU)) { closeOverlay(); return; }
  const kb = (a, b) => (IN.down(a) ? 1 : 0) - (IN.down(b) ? 1 : 0);
  CAL.a = clamp(CAL.a + (IN.ly + kb(BTN.DUP, BTN.DDOWN)) * 0.5 * dt, 0.1, 1);
  CAL.f = clamp(CAL.f + (IN.lx + kb(BTN.DRIGHT, BTN.DLEFT)) * 1.4 * dt, 0.5, 5.5);
  CAL.p = (CAL.p + (IN.rx + kb(BTN.RB, BTN.LB) + IN.mouse.dx * 0.01) * 2.2 * dt + TAU) % TAU;
  let diff = 0; for (let i = 0; i <= 64; i++) { const x = i / 64; diff += Math.abs(CAL.a * Math.sin(CAL.f * x * TAU + CAL.p) - CAL.ta * Math.sin(CAL.tf * x * TAU + CAL.tp)); }
  CAL.match = clamp(1 - diff / 65 / 1.1, 0, 1);
  if (CAL.match > 0.93) { CAL.hold += dt; IN.rumble(0, 0.2, 60); } else CAL.hold = 0;
  drawCalib();
  if (CAL.hold >= 1) { const p = PANEL.data.project; G.data -= p.cost; G.activeResearch = { id: p.id, t: 0, total: p.time }; toast('LOCKED ON · ' + p.name + ' RUNNING ' + p.time + ' S', 'g'); SFX.anomaly(); closeOverlay(); }
}

  <h3>6 · LANDING</h3><p>Lower the gear and set her down gently: under 2.5 m/s across the ground and 3 m/s down. Too fast and she bounces or collides. Gear up and slow, she belly-lands with a knock. AUTO LAND finds dry, level ground clear of trees with all four feet within 2 m, turns into the wind and lets down. Within 900 m of a base it moors on the pad.</p>
  <h3>7 · ROLES AND VIEWS</h3><p>Hold ${g('LB')} for the role wheel, ${g('RB')} for the camera wheel. Tap them to swap back or to step to the next view. In SHIP CHASE the right stick orbits her; ${g('RS')} at the helm cycles the distance.</p>
  <h3>8 · THE DRONE</h3><p>Launch it from the drone console on the work deck, or pick DRONE on the role wheel. SCOUT holds itself level and still. FPV is a racing drone: the left stick is throttle and yaw, the right stick pitches and rolls, and a crash over 9 m/s tumbles it.</p><table>${row(g('RT') + ' / ' + g('LT'), 'Climb / sink: speed builds over 3 s')}${row(g('X'), 'Thermal camera')}${row(g('Y'), 'SCOUT ⇄ FPV')}${row(g('A'), 'Land on the platform · tracks · rotors · hold to seal a leak')}${row(g('B'), 'Back to your body. Hold: recall it home.')}</table>

/* ---------------------------------- boot -------------------------------------- */
const BOOT = { t: 0, done: false, status: 'WAKING THE SHIP' };
function bootFrame(dt, progress) {
  const cv = $('#bootc'); const c = cv.getContext('2d');
  const W = cv.width = window.innerWidth * Math.min(2, devicePixelRatio), H = cv.height = window.innerHeight * Math.min(2, devicePixelRatio);
  BOOT.t += dt; const t = BOOT.t;
  c.fillStyle = '#000'; c.fillRect(0, 0, W, H);
  const k = Math.min(W, H) / 900; const pull = clamp(t / 4.5, 0, 1); const ease = 1 - Math.pow(1 - pull, 3);
  const sc = lerp(5.6, 1, ease) * k; const rot = (1 - ease) * 0.6 + Math.sin(t * 0.6) * 0.04;
  c.save(); c.translate(W / 2, H / 2 + 20 * k); c.rotate(rot); c.scale(sc, sc);
  // lid (screen half), tilted back
  const neon = `hsl(${(t * 90) % 360},90%,60%)`;
  c.save(); c.transform(1, 0, -0.08, 0.86, 0, -10);
  rr(c, -150, -330, 300, 300, 34); c.fillStyle = '#1b1f27'; c.fill(); c.lineWidth = 4; c.strokeStyle = neon; c.shadowColor = neon; c.shadowBlur = 20; c.stroke(); c.shadowBlur = 0;
  // screen tunnel (recursive frames, hue shifting)
  c.save(); rr(c, -120, -300, 240, 240, 10); c.clip(); c.fillStyle = '#05060a'; c.fillRect(-120, -300, 240, 240);
  for (let i = 18; i >= 0; i--) { const s = (i + (t * 2.2) % 1) / 18; const z = Math.pow(s, 1.7); c.strokeStyle = `hsla(${(t * 80 + i * 22) % 360},95%,${45 + 20 * (1 - s)}%,${1 - s * 0.7})`; c.lineWidth = 3 * (1 - s) + 0.6; c.strokeRect(-120 * z, -180 - 120 * z, 240 * z, 240 * z); }
  c.restore(); c.restore();
  // base (controls half)
  rr(c, -150, -10, 300, 290, 34); c.fillStyle = '#20252e'; c.fill(); c.lineWidth = 4; c.strokeStyle = neon; c.shadowColor = neon; c.shadowBlur = 20; c.stroke(); c.shadowBlur = 0;
  c.fillStyle = '#0d1016'; c.fillRect(-95, 80, 22, 66); c.fillRect(-117, 102, 66, 22);
  [[70, 84, '#5fd068'], [100, 112, '#ff5a52'], [40, 112, '#3f9cff'], [70, 140, '#ffd23f']].forEach(([x, y, col]) => { c.beginPath(); c.arc(x, y, 14, 0, TAU); c.fillStyle = col; c.fill(); });
  c.fillStyle = '#596170'; c.font = 'bold 18px "B612 Mono", monospace'; c.textAlign = 'center'; c.fillText('FUNKEY', 0, 240);
  c.restore();
  // the ship bursts out of the screen a third of the way in
  const bt = t - 1.6;
  if (bt > 0) {
    const p = clamp(bt / 3.2, 0, 1); const ang = p * Math.PI * 1.5; const sx = W / 2 + Math.sin(ang) * W * 0.32 * p, sy = H / 2 - 240 * k + Math.cos(ang) * -H * 0.12 * p - p * 60 * k; const ss = (0.2 + p * 1.1) * k;
    for (let i = 0; i < 26; i++) { const q = Math.max(0, p - i * 0.012); const a2 = q * Math.PI * 1.5; const tx = W / 2 + Math.sin(a2) * W * 0.32 * q, ty = H / 2 - 240 * k + Math.cos(a2) * -H * 0.12 * q - q * 60 * k; c.fillStyle = `hsla(${(i * 14 + t * 120) % 360},90%,60%,${0.5 - i * 0.018})`; c.beginPath(); c.arc(tx, ty, (10 - i * 0.3) * k * (0.3 + q), 0, TAU); c.fill(); }
    c.save(); c.translate(sx, sy); c.rotate(Math.cos(ang) * 0.5 + 0.3); c.scale(ss, ss);
    c.fillStyle = '#e6e1d6'; c.beginPath(); c.ellipse(0, 0, 120, 26, 0, 0, TAU); c.fill(); c.fillStyle = '#2b3138'; c.beginPath(); c.ellipse(0, 6, 118, 20, 0, 0.08, Math.PI - 0.08); c.fill();
    c.fillStyle = '#c4842a'; c.fillRect(-95, 2, 190, 4); c.fillStyle = '#6ecdff'; c.fillRect(-90, 9, 175, 2);
    c.fillStyle = '#cfd1c9'; c.fillRect(40, 22, 44, 10); c.fillStyle = '#3d7bff'; [-60, -10, 40].forEach((x) => { c.fillRect(x - 12, 18, 18, 7); });
    c.fillStyle = '#d9d5c9'; c.beginPath(); c.moveTo(-110, 0); c.lineTo(-140, -30); c.lineTo(-122, -2); c.fill(); c.beginPath(); c.moveTo(-110, 4); c.lineTo(-140, 32); c.lineTo(-122, 6); c.fill();
    c.restore();
  }
  // status
  const status = progress < 0.3 ? 'WAKING THE SHIP' : progress < 0.7 ? 'SEEDING THE WORLD' : 'BUILDING THE LAND';
  c.fillStyle = '#FFB028'; c.font = `${Math.round(18 * k * 1.3)}px "B612 Mono", monospace`; c.textAlign = 'center';
  c.fillText(status + ' ' + '·'.repeat(1 + Math.floor(t * 3) % 3), W / 2, H - 70 * k);
  c.fillStyle = 'rgba(255,176,40,.25)'; c.fillRect(W / 2 - 160 * k, H - 50 * k, 320 * k, 4 * k); c.fillStyle = '#FFB028'; c.fillRect(W / 2 - 160 * k, H - 50 * k, 320 * k * progress, 4 * k);
  // CRT collapse
  if (BOOT.collapse != null) {
    const q = clamp((t - BOOT.collapse) / 0.7, 0, 1);
    c.fillStyle = '#000'; const lh = H * (1 - Math.min(1, q * 2)) / 2; c.fillRect(0, 0, W, H / 2 - lh - 2); c.fillRect(0, H / 2 + lh + 2, W, H / 2);
    if (q > 0.5) { const lw = W * (1 - (q - 0.5) * 2); c.fillRect(0, H / 2 - 4, W / 2 - lw / 2, 8); c.fillRect(W / 2 + lw / 2, H / 2 - 4, W, 8); c.fillStyle = '#fff'; c.fillRect(W / 2 - lw / 2, H / 2 - 1, lw, 2); }
    if (q >= 1) return true;
  }
  return false;
}
function rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
