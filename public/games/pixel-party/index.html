<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Pixel Party · Game Lab</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    html, body {
      margin: 0; min-height: 100%;
      background: #140f2b; color: #f4efff;
      font-family: "Press Start 2P", monospace;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .back {
      position: fixed; top: 12px; left: 12px; z-index: 5;
      color: #a99fd6; font-size: 10px; text-decoration: none;
      padding: 8px; background: rgba(20,15,43,.7);
    }
    .hidden { display: none !important; }
    .center { min-height: 100vh; display: grid; place-items: center; padding: 60px 14px 20px; box-sizing: border-box; }
    .box {
      width: min(360px, 94vw); box-sizing: border-box;
      background: #1f1842; border: 4px solid #3a2e6e; box-shadow: 8px 8px 0 #0b0820;
      padding: 22px 18px; text-align: center;
    }
    h1 { margin: 0 0 6px; font-size: 22px; color: #4dd4ff; text-shadow: 3px 3px 0 #ff4d6d; }
    .sub { font-size: 9px; color: #a99fd6; line-height: 1.8; margin-bottom: 18px; }
    label { display: block; text-align: left; font-size: 9px; color: #a99fd6; margin: 0 0 6px; }
    input {
      width: 100%; box-sizing: border-box; padding: 10px; margin-bottom: 14px;
      font: 12px "Press Start 2P", monospace; text-transform: none;
      background: #140f2b; color: #f4efff; border: 3px solid #3a2e6e; outline: none;
    }
    input:focus { border-color: #4dd4ff; }
    #codeInput { text-transform: uppercase; letter-spacing: 4px; text-align: center; }
    .btn {
      width: 100%; padding: 12px; font: 11px "Press Start 2P", monospace; cursor: pointer;
      background: #4dd4ff; color: #140f2b; border: 0; box-shadow: 3px 3px 0 #0b0820; margin-bottom: 10px;
    }
    .btn.pink { background: #ff4d6d; color: #fff; }
    .btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #0b0820; }
    .or { font-size: 9px; color: #5d5394; margin: 6px 0 14px; }
    .err { font-size: 9px; color: #ff4d6d; min-height: 12px; line-height: 1.6; }

    /* game screen */
    .game { min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 56px 10px 20px; box-sizing: border-box; gap: 14px; }
    .bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; font-size: 10px; }
    .code { color: #ffd23f; font-size: 16px; letter-spacing: 4px; }
    .small { padding: 8px 10px; font: 9px "Press Start 2P", monospace; cursor: pointer; background: #3a2e6e; color: #f4efff; border: 0; box-shadow: 2px 2px 0 #0b0820; }
    .screen { position: relative; }
    canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; border: 4px solid #3a2e6e; box-shadow: 8px 8px 0 #0b0820; cursor: pointer; }
    .labels { position: absolute; left: 4px; top: 4px; pointer-events: none; }
    .tag { position: absolute; transform: translate(-50%, -100%); font-size: 8px; white-space: nowrap; text-shadow: 1px 1px 0 #0b0820, -1px -1px 0 #0b0820; }
    .bubble { position: absolute; transform: translate(-50%, -100%); font-size: 18px; animation: pop .25s; }
    @keyframes pop { from { transform: translate(-50%, -60%) scale(.3); } }
    .emotes { display: flex; gap: 8px; }
    .emotes button { font-size: 20px; padding: 6px 10px; background: #1f1842; border: 3px solid #3a2e6e; cursor: pointer; }
    .players { font-size: 9px; line-height: 2; color: #a99fd6; text-align: center; }
    .hint { font-size: 8px; color: #5d5394; text-align: center; line-height: 1.8; }
  </style>
</head>
<body>
  <a class="back" href="/">&lt; games</a>

  <!-- lobby -->
  <div class="center" id="lobby">
    <div class="box">
      <h1>PIXEL PARTY</h1>
      <div class="sub">multiplayer test room<br>walk around together</div>
      <label for="nameInput">YOUR NAME</label>
      <input id="nameInput" maxlength="16" autocomplete="off" placeholder="name">
      <button class="btn" id="createBtn" type="button">CREATE ROOM</button>
      <div class="or">— or join a friend —</div>
      <label for="codeInput">ROOM CODE</label>
      <input id="codeInput" maxlength="8" autocomplete="off" placeholder="ABCD">
      <button class="btn pink" id="joinBtn" type="button">JOIN ROOM</button>
      <div class="err" id="err"></div>
    </div>
  </div>

  <!-- game -->
  <div class="game hidden" id="game">
    <div class="bar">
      <span>ROOM</span><span class="code" id="codeLabel"></span>
      <button class="small" id="shareBtn" type="button">COPY LINK</button>
    </div>
    <div class="screen">
      <canvas id="c" width="160" height="120"></canvas>
      <div class="labels" id="labels"></div>
    </div>
    <div class="emotes">
      <button type="button" data-e="👋">👋</button>
      <button type="button" data-e="❤️">❤️</button>
      <button type="button" data-e="😂">😂</button>
      <button type="button" data-e="⭐">⭐</button>
    </div>
    <div class="players" id="players"></div>
    <div class="hint">tap the floor to walk · arrow keys work too</div>
  </div>

  <script src="/lib/gamelab.js"></script>
  <script>
  (() => {
    const GAME = 'pixel-party';
    const W = 160, H = 120;
    const COLORS = ['#ffd23f', '#4dd4ff', '#ff4d6d', '#7cff6b', '#c58cff', '#ff9f43', '#ffffff', '#ff7ad9'];
    const SPRITE = ["..1111..", ".111111.", ".1.11.1.", ".111111.", "..1111..", ".111111.", "1.1111.1", "..1..1.."];

    const $ = id => document.getElementById(id);
    const canvas = $('c'), ctx = canvas.getContext('2d');
    let scale = 4, room = null, me = null;
    const players = new Map();   // id -> { name, color, x, y, tx, ty, emote, emoteUntil, tagEl }

    // ---------- lobby ----------
    $('nameInput').value = GameLab.playerName();
    const params = new URLSearchParams(location.search);
    if (params.get('room')) $('codeInput').value = params.get('room').toUpperCase();

    function start(code) {
      const name = $('nameInput').value.trim();
      if (!name) { $('err').textContent = 'type your name first'; $('nameInput').focus(); return; }
      code = code.trim().toUpperCase();
      if (!/^[A-Z0-9]{3,8}$/.test(code)) { $('err').textContent = 'room code: 3-8 letters/numbers'; return; }
      GameLab.setPlayerName(name);
      $('err').textContent = 'connecting...';
      join(code, name);
    }
    $('createBtn').onclick = () => start(GameLab.newRoomCode());
    $('joinBtn').onclick = () => start($('codeInput').value);
    $('codeInput').addEventListener('keydown', e => { if (e.key === 'Enter') start($('codeInput').value); });

    $('shareBtn').onclick = () => {
      const link = location.origin + location.pathname + '?room=' + room.code;
      (navigator.clipboard ? navigator.clipboard.writeText(link) : Promise.reject())
        .then(() => { $('shareBtn').textContent = 'COPIED!'; })
        .catch(() => { prompt('Send this link to a friend:', link); });
      setTimeout(() => { $('shareBtn').textContent = 'COPY LINK'; }, 1500);
    };

    // ---------- multiplayer ----------
    function colorFor(id) {
      let h = 0;
      for (const ch of id) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
      return COLORS[h % COLORS.length];
    }
    function addPlayer(p) {
      if (players.has(p.id)) return players.get(p.id);
      const tag = document.createElement('div');
      tag.className = 'tag';
      tag.textContent = p.name;
      tag.style.color = colorFor(p.id);
      $('labels').appendChild(tag);
      const x = 20 + Math.random() * (W - 40), y = 30 + Math.random() * (H - 50);
      const obj = { name: p.name, color: colorFor(p.id), x, y, tx: x, ty: y, emote: null, emoteUntil: 0, tagEl: tag, bubbleEl: null };
      players.set(p.id, obj);
      renderList();
      return obj;
    }
    function removePlayer(id) {
      const p = players.get(id);
      if (!p) return;
      p.tagEl.remove();
      if (p.bubbleEl) p.bubbleEl.remove();
      players.delete(id);
      renderList();
    }
    function renderList() {
      $('players').innerHTML = '';
      const title = document.createElement('div');
      title.textContent = players.size + (players.size === 1 ? ' PLAYER' : ' PLAYERS');
      $('players').appendChild(title);
      for (const [id, p] of players) {
        const d = document.createElement('div');
        d.style.color = p.color;
        d.textContent = p.name + (id === me ? ' (you)' : '');
        $('players').appendChild(d);
      }
    }
    function myPos() { const p = players.get(me); return { t: 'pos', x: Math.round(p.tx), y: Math.round(p.ty) }; }

    function join(code, name) {
      room = GameLab.joinRoom(GAME, code, {
        name,
        onOpen(id, list) {
          me = id;
          list.forEach(addPlayer);
          $('lobby').classList.add('hidden');
          $('game').classList.remove('hidden');
          $('codeLabel').textContent = room.code;
          history.replaceState(null, '', '?room=' + room.code);
          $('err').textContent = '';
          fit();
          room.send(myPos());
        },
        onJoin(p) {
          addPlayer(p);
          // tell the newcomer where I am
          room.sendTo(p.id, { ...myPos(), jump: true });
        },
        onLeave: removePlayer,
        onMessage(data, from) {
          const p = players.get(from);
          if (!p || !data) return;
          if (data.t === 'pos') {
            p.tx = clampX(data.x); p.ty = clampY(data.y);
            if (data.jump) { p.x = p.tx; p.y = p.ty; }
          } else if (data.t === 'emote') {
            showEmote(p, String(data.e).slice(0, 4));
          }
        },
        onError(message) { $('err').textContent = message; },
        onClose() {
          if (!$('game').classList.contains('hidden')) {
            alert('Disconnected from the room.');
            location.href = location.pathname + '?room=' + room.code;
          } else {
            $('err').textContent = 'could not connect';
          }
        },
      });
    }

    const clampX = v => Math.max(4, Math.min(W - 4, Number(v) || 0));
    const clampY = v => Math.max(14, Math.min(H - 6, Number(v) || 0));

    function moveTo(x, y) {
      const p = players.get(me);
      if (!p) return;
      p.tx = clampX(x); p.ty = clampY(y);
      room.send(myPos());
    }

    canvas.addEventListener('pointerdown', e => {
      const r = canvas.getBoundingClientRect();
      moveTo((e.clientX - r.left - 4) / scale, (e.clientY - r.top - 4) / scale);
    });
    addEventListener('keydown', e => {
      const p = players.get(me);
      if (!p || document.activeElement.tagName === 'INPUT') return;
      const step = 12;
      const d = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step],
                  KeyA: [-step, 0], KeyD: [step, 0], KeyW: [0, -step], KeyS: [0, step] }[e.code];
      if (d) { e.preventDefault(); moveTo(p.tx + d[0], p.ty + d[1]); }
    });

    function showEmote(p, e) {
      p.emote = e;
      p.emoteUntil = performance.now() + 1800;
      if (p.bubbleEl) p.bubbleEl.remove();
      p.bubbleEl = document.createElement('div');
      p.bubbleEl.className = 'bubble';
      p.bubbleEl.textContent = e;
      $('labels').appendChild(p.bubbleEl);
    }
    document.querySelectorAll('.emotes button').forEach(b => {
      b.onclick = () => {
        const p = players.get(me);
        if (!p) return;
        showEmote(p, b.dataset.e);
        room.send({ t: 'emote', e: b.dataset.e });
      };
    });

    // ---------- drawing ----------
    function fit() {
      scale = Math.max(2, Math.floor(Math.min((innerWidth - 28) / W, (innerHeight - 300) / H)));
      canvas.style.width = W * scale + 'px';
      canvas.style.height = H * scale + 'px';
    }
    addEventListener('resize', fit);

    function draw(now) {
      // floor
      for (let y = 0; y < H; y += 8) for (let x = 0; x < W; x += 8) {
        ctx.fillStyle = ((x + y) / 8) % 2 ? '#241c4d' : '#2a2156';
        ctx.fillRect(x, y, 8, 8);
      }
      ctx.fillStyle = '#3a2e6e'; ctx.fillRect(0, 0, W, 6);

      // move everyone toward their target
      const list = [...players.entries()].sort((a, b) => a[1].y - b[1].y);
      for (const [id, p] of list) {
        const dx = p.tx - p.x, dy = p.ty - p.y, dist = Math.hypot(dx, dy);
        const sp = 1.2;
        if (dist > sp) { p.x += dx / dist * sp; p.y += dy / dist * sp; } else { p.x = p.tx; p.y = p.ty; }
        const moving = dist > sp;
        const px = Math.round(p.x - 4), py = Math.round(p.y - 8) - (moving && Math.floor(now / 120) % 2 ? 1 : 0);

        // shadow
        ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(Math.round(p.x - 3), Math.round(p.y), 6, 1);
        // body
        ctx.fillStyle = p.color;
        for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) if (SPRITE[r][c] === '1') ctx.fillRect(px + c, py + r, 1, 1);
        ctx.fillStyle = '#140f2b'; ctx.fillRect(px + 2, py + 2, 1, 1); ctx.fillRect(px + 5, py + 2, 1, 1);
        // marker over yourself
        if (id === me) { ctx.fillStyle = '#ffffff'; ctx.fillRect(px + 2, py - 4, 4, 1); ctx.fillRect(px + 3, py - 3, 2, 1); }

        p.tagEl.style.left = (p.x * scale) + 'px';
        p.tagEl.style.top = ((py - 4) * scale) + 'px';
        if (p.bubbleEl) {
          if (now > p.emoteUntil) { p.bubbleEl.remove(); p.bubbleEl = null; }
          else { p.bubbleEl.style.left = (p.x * scale) + 'px'; p.bubbleEl.style.top = ((py - 9) * scale) + 'px'; }
        }
      }
      requestAnimationFrame(draw);
    }
    requestAnimationFrame(draw);
  })();
  </script>
</body>
</html>
