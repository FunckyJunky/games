<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, viewport-fit=cover, user-scalable=no">
<title>Вгадай що?!</title>
<meta name="theme-color" content="#1c1230">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Вгадай що?!">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/vgadai-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/vgadai-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Pixelify+Sans:wght@400;600&family=M+PLUS+Rounded+1c:wght@500;700;800;900&family=Rubik+Bubbles&display=block" rel="stylesheet">
<style>
  :root {
    --fg: #39ff7a; --dim: #1b7a3c; --bg: #031208; --glow: rgba(57,255,122,.55); --neon: #ffe23a;
    --ink: #33241b; --paper: #fbf4e2; --paper2: #f1e4c4; --red: #cf3a2a; --green: #3ad06a; --plum: #1c1230;
    --round: 'M PLUS Rounded 1c', 'Pixelify Sans', sans-serif; --bubble: 'Rubik Bubbles', 'M PLUS Rounded 1c', sans-serif;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: var(--plum); }
  /* behaves like an app: no double-tap zoom, no pinch zoom, no text selection */
  * { touch-action: manipulation; -webkit-touch-callout: none; box-sizing: border-box; }
  body {
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
    font-family: var(--round); color: #f4efe0; touch-action: none;
    background: radial-gradient(ellipse at 50% 0%, #3a2160 0%, var(--plum) 60%) fixed;
  }
  button { font: inherit; }
  .ekb .k { font-family: 'VT323', 'Pixelify Sans', ui-monospace, monospace; }

  .screen { position: fixed; inset: 0; display: none; flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  .screen.show { display: flex; }

  /* ================= LOBBY: pick a season and an episode ================= */
  #lobby { overflow: hidden; }
  #lobby .burst {
    position: absolute; left: 50%; top: 28%; width: 260vmax; height: 260vmax; margin: -130vmax 0 0 -130vmax; z-index: 0; pointer-events: none;
    background: repeating-conic-gradient(from 0deg, rgba(255,226,58,.09) 0 7.5deg, rgba(255,255,255,0) 7.5deg 15deg);
    animation: spin 60s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #lobby .lobIn { position: relative; z-index: 1; flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y; padding: 8px 14px 22px; }
  .lhead { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
  .lhead .tg { display: flex; gap: 6px; }
  .logo { position: relative; margin: 10px auto 6px; width: min(100%, 460px); padding: 16px 12px 14px; text-align: center; border-radius: 22px;
    background: radial-gradient(ellipse at 50% 30%, #3a1d6e, #1c0f38); border: 4px solid var(--ink); box-shadow: 0 0 0 5px #cf3a2a, 0 0 0 9px var(--ink), 0 10px 0 9px var(--ink), 0 0 40px rgba(255,226,58,.35); }
  /* chasing light bulbs around the sign */
  .logo .bulbs { position: absolute; inset: 4px; border-radius: 18px; pointer-events: none;
    background:
      radial-gradient(circle, #fff6b0 0 2.5px, transparent 3.5px) 0 0 / 18px 18px repeat-x,
      radial-gradient(circle, #fff6b0 0 2.5px, transparent 3.5px) 9px 100% / 18px 18px repeat-x;
    animation: chase .5s steps(2) infinite; filter: drop-shadow(0 0 4px #ffe23a); }
  @keyframes chase { to { background-position: 18px 0, -9px 100%; } }
  .logo h1 { margin: 6px 0 0; font-family: var(--bubble); font-weight: 400; font-size: clamp(44px, 14vw, 76px); line-height: 1; letter-spacing: .01em; }
  .logo h1 span { display: inline-block; -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; text-shadow: 0 5px 0 var(--ink); animation: bob 1.6s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-6px) rotate(-4deg); } }
  .logo .sub { margin-top: 8px; font-weight: 900; font-size: 12px; letter-spacing: .25em; color: #ffd6f0; }
  .me { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 14px 0 6px; }
  .me canvas { width: 92px; height: 110px; }
  .me .nm { font-family: var(--bubble); font-size: 30px; line-height: 1; text-shadow: 0 3px 0 var(--ink); }
  .me .who { font-size: 13px; font-weight: 800; color: #d8c8f0; margin: 4px 0 8px; }
  .dials { display: flex; justify-content: center; gap: 14px; margin: 12px 0 6px; }
  .dial { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .dial label { font-weight: 900; font-size: 13px; letter-spacing: .2em; color: var(--neon); text-shadow: 0 2px 0 var(--ink); }
  .dial .flaps { display: flex; gap: 4px; }
  /* split-flap digits, like an old TV studio board */
  .flap { position: relative; width: 50px; height: 66px; border-radius: 9px; background: linear-gradient(#2a2238 0 49%, #120c1c 51% 100%);
    border: 3px solid var(--ink); box-shadow: 0 5px 0 var(--ink); display: grid; place-items: center;
    font-family: 'VT323', monospace; font-size: 64px; line-height: 1; color: #fff6b0; text-shadow: 0 0 10px rgba(255,226,58,.6); overflow: hidden; }
  .flap::after { content: ''; position: absolute; left: 0; right: 0; top: 50%; height: 2px; background: #000; opacity: .7; }
  .flap.flip { animation: flip .32s ease-in; }
  @keyframes flip { 0% { transform: rotateX(0); } 50% { transform: rotateX(90deg); filter: brightness(.4); } 100% { transform: rotateX(0); } }
  .dial .arr { all: unset; cursor: pointer; width: 108px; text-align: center; font-size: 20px; line-height: 30px; border-radius: 10px; color: var(--ink);
    background: var(--paper); border: 2px solid var(--ink); box-shadow: 0 3px 0 var(--ink); }
  .dial .arr:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
  .codeLine { text-align: center; font-weight: 800; font-size: 14px; color: #d8c8f0; margin: 6px 0 12px; }
  .codeLine b { font-family: 'VT323', monospace; font-size: 24px; color: var(--neon); letter-spacing: .1em; }
  .lrow { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .lmsg { min-height: 22px; text-align: center; font-weight: 800; font-size: 15px; margin: 10px 0 4px; color: #ffd6a0; }
  .lmsg.err { color: #ff9a8a; }
  .peek { width: min(100%, 460px); margin: 8px auto 0; }
  .lob h4, .peek h4 { margin: 18px 0 8px; font-family: var(--bubble); font-weight: 400; font-size: 21px; color: var(--neon); text-shadow: 0 2px 0 var(--ink); text-align: center; }
  .live { display: flex; flex-direction: column; gap: 8px; width: min(100%, 460px); margin: 0 auto; }
  .liveRow { all: unset; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 12px; background: var(--paper); color: var(--ink);
    border: 2px solid var(--ink); box-shadow: 0 3px 0 var(--ink); font-weight: 800; }
  .liveRow:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
  .liveRow .ep { font-family: 'VT323', monospace; font-size: 24px; color: var(--red); }
  .liveRow .ps { flex: 1; min-width: 0; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .liveRow .dot { width: 10px; height: 10px; border-radius: 50%; background: #ff3a3a; box-shadow: 0 0 8px #ff3a3a; animation: blink 1s steps(1) infinite; }

  /* ================= STUDIO ================= */
  #hud { flex: none; display: flex; align-items: center; gap: 5px; padding: 6px 8px 4px; }
  .dosb {
    all: unset; cursor: pointer; flex: none; padding: 4px 8px; font-family: 'VT323', monospace; font-size: 20px; line-height: 1;
    color: var(--fg); background: var(--bg); border: 2px solid var(--dim); border-radius: 5px; text-shadow: 0 0 5px var(--glow);
  }
  .dosb:active { filter: brightness(1.5); transform: translateY(1px); }
  #scores { flex: 1; min-width: 0; display: flex; gap: 4px; justify-content: center; }
  .chip {
    position: relative; flex: 1 1 0; min-width: 0; max-width: 140px; display: flex; align-items: center; gap: 4px;
    padding: 2px 7px 2px 2px; border: 2px solid var(--ink); border-radius: 22px; background: var(--paper); color: var(--ink);
    box-shadow: 0 3px 0 var(--ink); transition: opacity .3s, filter .3s;
  }
  .chip canvas { flex: none; width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--ink); }
  .chip .nm { flex: 1; min-width: 0; font-size: 10px; font-weight: 900; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip .sc { font-family: var(--bubble); font-size: 20px; line-height: 1; color: var(--ink); }
  #scores.compact .chip { padding-right: 5px; } #scores.compact .chip .nm { display: none; } #scores.compact .chip canvas { width: 24px; height: 24px; }
  .chip.off { opacity: .45; filter: grayscale(.8); }
  .chip.host { background: #fff1b8; }
  .chip .badge { position: absolute; top: -9px; left: 18px; font-size: 13px; filter: drop-shadow(0 1px 0 var(--ink)); }
  .chip.pop { animation: chippop .7s cubic-bezier(.2, 1.8, .4, 1); }
  @keyframes chippop { 0% { transform: scale(1); } 30% { transform: scale(1.3) rotate(-4deg); background: #c8ffc0; } 100% { transform: scale(1); } }
  .hbtn {
    all: unset; cursor: pointer; flex: none; padding: 4px 8px; border: 2px solid var(--ink); border-radius: 10px; color: var(--ink);
    font-weight: 900; font-size: 15px; background: var(--paper); box-shadow: 0 3px 0 var(--ink); white-space: nowrap;
  }
  .hbtn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
  .hbtn.on { background: #c8f5c0; }

  #main { flex: 1; min-height: 0; display: flex; gap: 12px; padding: 0 8px 6px; justify-content: center; }
  #col { flex: 1; min-width: 0; max-width: 700px; display: flex; flex-direction: column; gap: 7px; }
  #stageWrap { position: relative; flex: 1 1 auto; min-height: 120px; border-radius: 12px; overflow: hidden;
    box-shadow: 0 0 0 3px var(--ink), 0 8px 24px rgba(0,0,0,.5); background: #1a0d33; }
  #stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  /* the full screen switch (on a computer): ⛶ F */
  .fsb { all: unset; cursor: pointer; z-index: 75; padding: 3px 9px; border-radius: 9px; font-family: 'VT323', monospace; font-size: 18px; line-height: 1.1;
    color: #fbf4e2; background: rgba(20,10,36,.6); border: 2px solid rgba(251,244,226,.35); white-space: nowrap; }
  .fsb:hover { background: rgba(251,244,226,.25); } .fsb:active { transform: translateY(1px); }
  #fsBtn { position: absolute; left: 6px; bottom: 6px; z-index: 4; }
  #fsFix { position: fixed; }
  body[data-screen="login"] #fsFix { top: calc(env(safe-area-inset-top) + 12px); right: calc(env(safe-area-inset-right) + 14px); color: var(--fg); border-color: var(--dim); background: var(--bg); }
  body[data-screen="lobby"] #fsFix { left: calc(env(safe-area-inset-left) + 10px); bottom: calc(env(safe-area-inset-bottom) + 10px); }
  body[data-screen="app"] #fsFix { display: none !important; }
  #reacts { position: absolute; right: 6px; bottom: 6px; z-index: 4; display: flex; gap: 4px; }
  #reacts button {
    all: unset; cursor: pointer; width: 32px; height: 30px; display: grid; place-items: center; font-size: 17px; border-radius: 10px;
    background: rgba(20,10,36,.55); border: 2px solid rgba(251,244,226,.35);
  }
  #reacts button:active { transform: scale(1.35) rotate(-10deg); background: rgba(251,244,226,.4); }

  /* the rubber stamp: ТАК! / НІ! */
  #stamp { position: absolute; left: 50%; top: 44%; z-index: 3; pointer-events: none; text-align: center; opacity: 0; }
  #stamp .s {
    display: inline-block; font-family: var(--bubble); font-size: clamp(54px, 15vw, 96px); line-height: 1; padding: 2px 18px 8px;
    border: 6px solid currentColor; border-radius: 18px; background: rgba(251,244,226,.9); white-space: nowrap;
    box-shadow: 0 0 0 3px var(--ink), 0 8px 0 var(--ink);
  }
  #stamp .sub { display: block; margin-top: 10px; font-weight: 900; font-size: 18px; color: var(--paper); text-shadow: 0 2px 0 var(--ink), 0 0 6px var(--ink); }
  #stamp.yes .s { color: #1f9e4a; } #stamp.no .s { color: var(--red); }
  #stamp.go { animation: stampIn 1.9s cubic-bezier(.2, 1.4, .4, 1) forwards; }
  @keyframes stampIn {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(3) rotate(-35deg); }
    18% { opacity: 1; transform: translate(-50%, -50%) scale(.92) rotate(-9deg); }
    26% { transform: translate(-50%, -50%) scale(1.04) rotate(-12deg); }
    80% { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(-12deg); }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(1.15) rotate(-12deg); }
  }
  /* a ribbon across the studio: РАУНД 3, ПІДКАЗКА! ... */
  #banner { position: absolute; left: 0; right: 0; top: 34%; z-index: 2; pointer-events: none; display: flex; justify-content: center; opacity: 0; }
  #banner span {
    font-family: var(--bubble); font-size: clamp(26px, 7vw, 42px); color: #fff6b0; padding: 4px 30px 8px; background: var(--red);
    border: 3px solid var(--ink); border-radius: 6px; box-shadow: 0 5px 0 var(--ink); text-shadow: 0 3px 0 var(--ink); white-space: nowrap;
    clip-path: polygon(0 0, 100% 0, 96% 50%, 100% 100%, 0 100%, 4% 50%);
  }
  #banner.go { animation: ribbon 2.1s ease-in-out forwards; }
  @keyframes ribbon {
    0% { opacity: 1; transform: translateX(-120%) rotate(-4deg); }
    20%, 75% { opacity: 1; transform: translateX(0) rotate(-3deg); }
    100% { opacity: 1; transform: translateX(120%) rotate(-4deg); }
  }

  /* ---------- the question card ---------- */
  #qcard {
    flex: none; position: relative; margin: 8px 4px 0; padding: 13px 14px 9px; border: 3px solid var(--ink); border-radius: 14px 10px 16px 9px;
    background: var(--paper); color: var(--ink); box-shadow: 0 5px 0 var(--ink); transform: rotate(-.6deg);
    background-image: radial-gradient(circle at 15% 20%, rgba(214,190,150,.3), transparent 40%), radial-gradient(circle at 85% 80%, rgba(214,190,150,.25), transparent 45%);
  }
  #qcard .tab {
    position: absolute; top: -13px; left: 12px; padding: 1px 10px 2px; font-size: 12px; font-weight: 900; letter-spacing: .04em;
    background: var(--ink); color: var(--paper); border-radius: 8px; white-space: nowrap; max-width: calc(100% - 70px); overflow: hidden; text-overflow: ellipsis;
  }
  #qcard .tab b { color: var(--neon); }
  #qcard .seal {
    position: absolute; top: -16px; right: 10px; width: 38px; height: 38px; border-radius: 50%; background: var(--red); color: var(--paper);
    border: 3px solid var(--ink); display: grid; place-items: center; font-family: var(--bubble); font-size: 24px; line-height: 1;
    animation: sealwob 2.6s ease-in-out infinite; box-shadow: 0 3px 0 var(--ink);
  }
  @keyframes sealwob { 50% { transform: rotate(14deg) scale(1.08); } }
  #qtext { font-weight: 900; font-size: clamp(17px, 4.6vw, 23px); line-height: 1.25; min-height: 1.25em; overflow-wrap: anywhere; }
  #qtext.wait { color: #9a8068; font-weight: 800; font-size: 16px; }
  #qtext .w { display: inline-block; white-space: nowrap; }
  #qtext .ch { display: inline-block; animation: chin .45s cubic-bezier(.2, 1.9, .4, 1) both; }
  @keyframes chin { 0% { opacity: 0; transform: translateY(-14px) scale(.2) rotate(-30deg); } 100% { opacity: 1; transform: none; } }
  #qhint { display: none; margin-top: 6px; padding: 3px 8px; border-radius: 8px; background: #fff1b8; border: 2px dashed #c9a24a; font-weight: 800; font-size: 14px; color: #6a4a20; }
  #qhint.show { display: block; animation: chin .5s cubic-bezier(.2, 1.9, .4, 1) both; }
  .dots::after { content: ''; display: inline-block; width: 1.4em; text-align: left; animation: dots 1.2s steps(4) infinite; }
  @keyframes dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }

  /* guesses this round */
  #tries { flex: none; display: flex; flex-wrap: wrap; gap: 5px; padding: 0 4px; }
  #tries:empty { display: none; }
  .try { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 14px; border: 2px solid var(--ink); background: var(--paper); color: var(--ink); font-weight: 800; font-size: 14px; }
  .try i { font-style: normal; font-weight: 900; font-size: 10px; }
  .try.no { background: #ffd6d0; } .try.no s { text-decoration-color: var(--red); text-decoration-thickness: 2px; }
  .try.ok { background: #c8f5c0; }
  .try.new { animation: tryin .6s cubic-bezier(.2, 1.8, .4, 1); }
  .try.no.new { animation: tryin .6s cubic-bezier(.2, 1.8, .4, 1), shake .4s .3s; }
  @keyframes tryin { 0% { transform: scale(0) rotate(-20deg); } 100% { transform: none; } }
  @keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

  /* ---------- controls ---------- */
  #ctrl { flex: none; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 2px 4px; }
  .say { text-align: center; font-weight: 900; font-size: 17px; color: var(--paper); text-shadow: 0 2px 0 rgba(0,0,0,.5); }
  .say small { display: block; font-weight: 700; font-size: 13px; color: #c8b8e0; }
  .say .nm { font-family: var(--bubble); font-weight: 400; font-size: 1.15em; }
  .row { display: flex; gap: 8px; width: 100%; justify-content: center; flex-wrap: wrap; }
  .btn {
    all: unset; cursor: pointer; text-align: center; padding: 10px 16px; border: 3px solid var(--ink); border-radius: 14px;
    font-weight: 900; font-size: 17px; color: var(--ink); background: linear-gradient(var(--paper), var(--paper2)); box-shadow: 0 5px 0 var(--ink);
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
  .btn.go { background: linear-gradient(#ffe98a, #f5c23a); }
  .btn.small { padding: 6px 11px; font-size: 14px; border-width: 2px; box-shadow: 0 3px 0 var(--ink); border-radius: 11px; }
  .btn.small:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
  .btn.yes { flex: 1; max-width: 200px; font-size: 22px; background: linear-gradient(#8af0a4, #2fb85c); color: #fff; text-shadow: 0 2px 0 var(--ink); }
  .btn.no { flex: 1; max-width: 200px; font-size: 22px; background: linear-gradient(#ff9a8a, #d8402e); color: #fff; text-shadow: 0 2px 0 var(--ink); }
  .btn.dis { opacity: .5; pointer-events: none; }
  /* what you type (with the on-screen keyboard) */
  .fieldRow { display: flex; gap: 10px; width: 100%; align-items: center; }
  .field {
    flex: 1; min-width: 0; min-height: 52px; padding: 8px 12px; border: 3px solid var(--ink); border-radius: 14px; background: #fffaf0; color: var(--ink);
    font-weight: 800; font-size: 18px; line-height: 1.2; overflow-wrap: anywhere; box-shadow: inset 0 3px 0 rgba(51,36,27,.12), 0 0 0 3px rgba(58,208,106,.35);
    display: flex; align-items: center; flex-wrap: wrap;
  }
  .field.word { font-size: 26px; justify-content: center; letter-spacing: .03em; font-weight: 900; }
  .field.q { min-height: 66px; align-items: flex-start; }
  .field .ph { color: #b09a80; font-weight: 700; font-size: 16px; letter-spacing: 0; }
  .field .cur { display: inline-block; width: 3px; height: 1.05em; margin-left: 2px; background: #1f9e4a; animation: blink 1s steps(1) infinite; vertical-align: -2px; }
  .count { align-self: flex-end; font-size: 11px; color: #c8b8e0; font-weight: 700; margin-top: -5px; }
  #kbd { flex: none; width: 100%; padding: 2px 4px 4px; display: none;
    --fg: #fbf4e2; --dim: #6a5090; --bg: #1c1230; --glow: rgba(255,240,200,.25); }
  #kbd.show { display: flex; }
  #kbd .ekb .k { height: clamp(34px, 5.6dvh, 48px); }
  #kbd .ekb .k.send { --fg: #3ad06a; color: #fff; text-shadow: 0 1px 0 var(--ink); }
  .big-word {
    font-family: var(--bubble); font-size: clamp(34px, 10vw, 52px); line-height: 1.05; color: #fff6b0; text-shadow: 0 3px 0 var(--ink), 0 0 14px rgba(255,226,58,.5);
    animation: wiggle 1.6s ease-in-out infinite; overflow-wrap: anywhere; text-align: center; max-width: 100%;
  }
  @keyframes wiggle { 25% { transform: rotate(-3deg) scale(1.03); } 75% { transform: rotate(3deg) scale(1.03); } }
  .drum { display: inline-block; font-size: 28px; animation: drum .18s linear infinite alternate; }
  @keyframes drum { to { transform: translateY(-4px) rotate(8deg); } }

  /* THE GREEN BUTTON: you type your answer first, then press it */
  .buzz {
    --bz: 86px;
    all: unset; flex: none; position: relative; cursor: pointer; width: var(--bz); height: var(--bz); border-radius: 50%; display: grid; place-items: center;
    background: radial-gradient(circle at 36% 28%, #e0ffe8 0 7%, #6af096 22%, #2cc35e 55%, #158a3e 85%, #0f6a2f 100%);
    border: 4px solid var(--ink); box-shadow: 0 8px 0 #0b4a22, 0 8px 0 4px var(--ink), 0 14px 20px rgba(0,0,0,.5);
    font-family: var(--bubble); font-size: 22px; color: #fff; text-shadow: 0 3px 0 var(--ink); text-align: center; line-height: .95;
    animation: buzzIdle 1.2s ease-in-out infinite; transition: filter .2s; margin-bottom: 8px;
  }
  .buzz::before { content: ''; position: absolute; inset: -4px; border-radius: 50%; border: 4px solid #6af096; animation: ring 1.2s ease-out infinite; pointer-events: none; }
  @keyframes buzzIdle { 50% { transform: translateY(-3px) scale(1.04); } }
  @keyframes ring { 0% { transform: scale(1); opacity: .9; } 100% { transform: scale(1.5); opacity: 0; } }
  .buzz.down { transform: translateY(7px); box-shadow: 0 1px 0 #0b4a22, 0 1px 0 4px var(--ink), 0 4px 10px rgba(0,0,0,.5); animation: none; }
  .buzz.off { filter: grayscale(.9) brightness(.65); animation: none; pointer-events: none; }
  .buzz.off::before, .buzz.taken::before { display: none; }
  .buzz.taken { animation: none; pointer-events: none; font-size: 14px; background: radial-gradient(circle at 36% 28%, #fff 0 7%, var(--tc, #ffd34a) 34%, #6a5080 100%); }

  /* ---------- history and leaderboard (side panel on a big screen, a sheet on a phone) ---------- */
  #side { display: none; flex: none; width: 320px; flex-direction: column; min-height: 0; }
  .tabs { display: flex; gap: 6px; padding: 4px 4px 8px; align-items: center; }
  .tabs .t { all: unset; cursor: pointer; flex: 1; text-align: center; padding: 6px 4px; border-radius: 11px; font-weight: 900; font-size: 14px;
    color: var(--paper); border: 2px solid rgba(251,244,226,.3); }
  .tabs .t.on { background: var(--paper); color: var(--ink); border-color: var(--ink); box-shadow: 0 3px 0 var(--ink); }
  .panel { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 4px 10px; -webkit-overflow-scrolling: touch; touch-action: pan-y; }
  .rnd { margin: 0 0 10px; padding: 9px 11px; border: 2px solid var(--ink); border-radius: 12px; background: var(--paper); color: var(--ink); box-shadow: 0 3px 0 var(--ink); }
  .rnd:nth-child(odd) { transform: rotate(-.5deg); } .rnd:nth-child(even) { transform: rotate(.4deg); }
  .rnd .top { display: flex; justify-content: space-between; font-size: 11px; font-weight: 900; color: #8a6a50; letter-spacing: .04em; }
  .rnd .q { font-weight: 900; font-size: 15px; margin: 3px 0 5px; line-height: 1.25; overflow-wrap: anywhere; }
  .rnd .h { font-size: 12px; font-weight: 700; color: #8a6a30; margin: -2px 0 5px; }
  .rnd .gs { display: flex; flex-wrap: wrap; gap: 4px; }
  .rnd .gs .try { font-size: 12px; padding: 1px 7px; }
  .rnd .res { margin-top: 6px; font-weight: 900; font-size: 13px; }
  .lead { display: flex; align-items: center; gap: 10px; margin: 0 0 8px; padding: 6px 10px; border: 2px solid var(--ink); border-radius: 12px; background: var(--paper); color: var(--ink); box-shadow: 0 3px 0 var(--ink); }
  .lead .rk { width: 30px; text-align: center; font-family: var(--bubble); font-size: 22px; }
  .lead canvas { width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--ink); flex: none; }
  .lead .nm { flex: 1; min-width: 0; font-weight: 900; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lead .nm small { display: block; font-weight: 700; font-size: 11px; color: #8a6a50; }
  .lead .pts { font-family: var(--bubble); font-size: 26px; }
  .lead.first { background: #fff1b8; }
  .empty { text-align: center; color: #c8b8e0; font-weight: 700; padding: 20px 10px; }
  #sheet {
    position: fixed; z-index: 40; left: 0; right: 0; bottom: 0; top: 12%; display: flex; flex-direction: column;
    background: #2a1a44; border-top: 3px solid var(--ink); border-radius: 20px 20px 0 0; box-shadow: 0 -10px 30px rgba(0,0,0,.6);
    padding: 10px 12px env(safe-area-inset-bottom); transform: translateY(105%); transition: transform .35s cubic-bezier(.2, 1.2, .4, 1);
  }
  #sheet.show { transform: none; }
  #veil { position: fixed; inset: 0; z-index: 35; background: rgba(10,4,20,.55); display: none; }
  #veil.show { display: block; }
  @media (min-width: 900px) and (min-height: 520px) {
    #side { display: flex; }
    #histBtn { display: none; }
    #main { padding-bottom: 12px; }
  }
  @media (max-height: 640px) { .field.q { min-height: 52px; } #qcard { padding: 11px 12px 7px; } #qtext { font-size: 16px; } }

  /* ---------- dialogs, settings and toasts ---------- */
  #dlg {
    position: fixed; z-index: 80; left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(-.5deg); width: min(92vw, 390px); display: none;
    background: var(--paper); color: var(--ink); border: 3px solid var(--ink); border-radius: 16px 12px 18px 10px; box-shadow: 0 6px 0 var(--ink), 0 16px 40px rgba(0,0,0,.6);
    padding: 16px; text-align: center; max-height: 86%; overflow-y: auto;
  }
  #dlg.show { display: block; animation: chin .4s cubic-bezier(.2, 1.6, .4, 1); }
  #dlg h3 { margin: 0 0 6px; font-family: var(--bubble); font-weight: 400; font-size: 26px; }
  #dlg p { margin: 0 0 14px; font-weight: 700; font-size: 15px; color: #5a4030; }
  #dlg .opt { all: unset; cursor: pointer; display: flex; align-items: center; gap: 10px; width: 100%; box-sizing: border-box; margin: 0 0 8px; padding: 9px 12px;
    border: 2px solid var(--ink); border-radius: 12px; background: #fffaf0; box-shadow: 0 3px 0 var(--ink); font-weight: 900; font-size: 15px; text-align: left; }
  #dlg .opt:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
  #dlg .opt:disabled { pointer-events: none; }
  #dlg .steps { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 0 0 8px; font-weight: 900; }
  #dlg .steps span { width: 70px; text-align: right; font-size: 13px; letter-spacing: .1em; color: #8a6a50; }
  #dlg .steps b { font-family: 'VT323', monospace; font-size: 34px; width: 46px; line-height: 1; }
  #dlg .eps { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; margin: 4px 0 12px; max-height: 120px; overflow-y: auto; touch-action: pan-y; }
  #dlg .chipEp { all: unset; cursor: pointer; padding: 2px 8px; border: 2px solid var(--ink); border-radius: 9px; font-family: 'VT323', monospace; font-size: 18px; background: #fffaf0; }
  #dlg .chipEp.on { background: #ffd34a; }
  /* press and hold: the button fills up red */
  #dlg .btn.hold { --p: 0%; background: linear-gradient(90deg, #a81e12 var(--p), #ff9a8a var(--p)); color: #fff; text-shadow: 0 2px 0 var(--ink); user-select: none; -webkit-user-select: none; touch-action: none; }
  #dlg .opt.sel, #dlg .btn.sel { background: #ffe7a8; outline: 3px solid #f5c23a; outline-offset: 1px; }
  #dlg .opt .ico { font-size: 22px; width: 28px; text-align: center; }
  #dlg .opt small { display: block; font-weight: 700; font-size: 12px; color: #8a6a50; }
  #dlg .opt .sw { margin-left: auto; padding: 2px 8px; border-radius: 8px; font-size: 12px; background: #ddd; border: 2px solid var(--ink); }
  #dlg .opt .sw.on { background: #3ad06a; color: #fff; }
  #toast { position: fixed; z-index: 90; left: 50%; top: calc(env(safe-area-inset-top) + 56px); transform: translateX(-50%); pointer-events: none; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  #toast div {
    padding: 6px 14px; border-radius: 18px; background: var(--paper); color: var(--ink); border: 2px solid var(--ink); box-shadow: 0 3px 0 var(--ink);
    font-weight: 900; font-size: 15px; white-space: nowrap; animation: toast 2.8s ease forwards; max-width: 92vw; overflow: hidden; text-overflow: ellipsis;
  }
  @keyframes toast { 0% { opacity: 0; transform: translateY(-14px) scale(.7); } 12%, 82% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateY(-8px); } }

  /* ---------- the DOS login (the same as in TUSA) ---------- */
  .dos {
    z-index: 70; background: var(--bg); color: var(--fg); font-family: 'VT323', 'Pixelify Sans', monospace; text-shadow: 0 0 5px var(--glow);
    padding: calc(env(safe-area-inset-top) + 14px) calc(env(safe-area-inset-right) + 14px) calc(env(safe-area-inset-bottom) + 10px) calc(env(safe-area-inset-left) + 14px);
  }
  .dos::after { content: ''; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(to bottom, rgba(0,0,0,.28) 0 1px, transparent 1px 3px); }
  #term { flex: 1; min-height: 0; overflow: hidden; white-space: pre-wrap; font-size: clamp(16px, min(5vw, 3.3vh), 28px); line-height: 1.12; }
  #term .big { font-family: var(--bubble); font-size: 1.6em; color: var(--neon); text-shadow: 0 0 8px rgba(255,226,58,.7); }
  #term .dim { color: var(--dim); text-shadow: none; }
  #term .err { color: #ff5a6a; text-shadow: 0 0 6px rgba(255,90,106,.6); }
  #term .cur { background: var(--fg); color: var(--bg); animation: blink 1.06s steps(1) infinite; }
  @keyframes blink { 50% { background: transparent; opacity: .35; } }
  #loginKbd { flex: none; margin-top: 8px; position: relative; z-index: 2; }
</style>
<script src="/lib/nozoom.js"></script>
</head>
<body>
  <!-- 1. login -->
  <div class="screen dos" id="login">
    <div id="term"></div>
    <div id="loginKbd"></div>
  </div>

  <!-- 2. lobby: season + episode -->
  <div class="screen" id="lobby">
    <div class="burst"></div>
    <div class="lobIn">
      <div class="lhead">
        <button class="dosb" id="lobDos">◄ DOS</button>
        <div class="tg"><button class="hbtn" id="lobSet" aria-label="instellingen">⚙ НАЛАШТУВАННЯ</button></div>
      </div>
      <div class="logo"><div class="bulbs"></div><h1 id="logoTxt"></h1><div class="sub">ТЕЛЕШОУ · LIVE OP ERROR.BLUE</div></div>
      <div class="me">
        <canvas id="meCv"></canvas>
        <div><div class="nm" id="meName"></div><div class="who" id="meWho"></div><button class="btn small" id="reroll">🎲 інший вигляд</button></div>
      </div>
      <div class="dials">
        <div class="dial" id="dialS"><label>СЕЗОН</label><button class="arr up">▲</button><div class="flaps"><div class="flap">0</div><div class="flap">1</div></div><button class="arr dn">▼</button></div>
        <div class="dial" id="dialE"><label>ЕПІЗОД</label><button class="arr up">▲</button><div class="flaps"><div class="flap">0</div><div class="flap">1</div></div><button class="arr dn">▼</button></div>
      </div>
      <div class="codeLine">КОД КІМНАТИ <b id="codeTxt">0101</b> <button class="hbtn" id="rndBtn" aria-label="випадковий епізод">🎲</button></div>
      <div class="lrow">
        <button class="btn go" id="createBtn">🎬 НОВИЙ ЕПІЗОД</button>
        <button class="btn" id="joinBtn">📺 ПРИЄДНАТИСЯ</button>
      </div>
      <div class="lmsg" id="lobMsg"></div>
      <div class="peek" id="peek"></div>
      <div class="lob"><h4>📡 ЗАРАЗ В ЕФІРІ</h4></div>
      <div class="live" id="liveList"></div>
    </div>
  </div>

  <!-- 3. the studio -->
  <div class="screen" id="app">
    <header id="hud">
      <button class="dosb back" id="exitBtn" aria-label="вийти">◄</button>
      <div id="scores"></div>
      <button class="hbtn" id="setBtn" aria-label="instellingen">⚙</button>
      <button class="hbtn" id="histBtn" aria-label="історія">🏆</button>
    </header>
    <main id="main">
      <section id="col">
        <div id="stageWrap">
          <canvas id="stage" aria-label="студія"></canvas>
          <div id="banner"><span></span></div>
          <div id="stamp"><span class="s"></span><span class="sub"></span></div>
          <div id="reacts"></div>
          <button class="fsb" id="fsBtn" style="display:none" aria-label="повний екран">⛶ F</button>
        </div>
        <div id="qcard">
          <div class="tab"></div>
          <div class="seal">?</div>
          <div id="qtext" class="wait"></div>
          <div id="qhint"></div>
        </div>
        <div id="tries"></div>
        <div id="ctrl"></div>
        <div id="kbd"></div>
      </section>
      <aside id="side">
        <div class="tabs" data-for="side"><button class="t on" data-tab="lead">🏆 ЛІДЕРИ</button><button class="t" data-tab="hist">📜 ІСТОРІЯ</button></div>
        <div class="panel" id="panelSide"></div>
      </aside>
    </main>
  </div>

  <button class="fsb" id="fsFix" style="display:none" aria-label="повний екран">⛶ F</button>
  <div id="veil"></div>
  <div id="sheet">
    <div class="tabs" data-for="sheet"><button class="t on" data-tab="lead">🏆 ЛІДЕРИ</button><button class="t" data-tab="hist">📜 ІСТОРІЯ</button><button class="hbtn" id="sheetClose" aria-label="sluiten">✕</button></div>
    <div class="panel" id="panelSheet"></div>
  </div>
  <div id="dlg"></div>
  <div id="toast"></div>

  <script>
    // no zooming in by double-tapping or pinching, like a real app
    (() => {
      let last = 0;
      document.addEventListener('touchend', e => { const n = Date.now(); if (n - last < 320 && e.cancelable && !e.target.closest('.panel, .lobIn')) e.preventDefault(); last = n; }, { passive: false });
      for (const ev of ['gesturestart', 'gesturechange', 'dblclick']) document.addEventListener(ev, e => e.preventDefault(), { passive: false });
      document.addEventListener('touchmove', e => { if (e.touches.length > 1 && e.cancelable) e.preventDefault(); }, { passive: false });
    })();
  </script>
  <script src="/lib/errorkbd.js"></script>
  <script src="/tusa/art.js"></script>
  <script src="vgadai.js"></script>
</body>
</html>
