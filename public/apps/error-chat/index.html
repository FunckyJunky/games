<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no, interactive-widget=resizes-content">
<title>ERROR-CHAT</title>
<meta name="theme-color" content="#000000">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root { --fg: #39ff7a; --dim: #1b7a3c; --bg: #031208; --glow: rgba(57,255,122,.55); }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body {
    display: grid; place-items: center;
    height: 100dvh;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation;
    font-family: 'VT323', ui-monospace, monospace;
  }
  #tube {
    position: relative; overflow: hidden; background: #000;
    width: min(100vw - 16px, 980px); height: calc(100dvh - 16px);
    border-radius: 18px / 22px;
    box-shadow: 0 0 0 3px #0c0c0c, 0 0 0 7px #161616, 0 0 80px rgba(0,0,0,.9);
  }
  @media (min-width: 700px) { #tube { width: min(100vw - 60px, 980px); height: calc(100dvh - 60px); } }
  #tube.flat { border-radius: 3px; }
  #crt {
    position: absolute; inset: 0; background: var(--bg); color: var(--fg);
    display: flex; flex-direction: column;
    padding: clamp(10px, 2.2vw, 22px) clamp(12px, 2.6vw, 26px);
    box-sizing: border-box;
    font-size: clamp(18px, 4.9vw, 27px); line-height: 1.1;
    text-shadow: 0 0 5px var(--glow);
    transform-origin: 50% 50%;
  }
  #crt.flicker { animation: flicker .12s steps(2) infinite; }
  @keyframes flicker { 50% { opacity: .965; } }

  .bar {
    display: flex; justify-content: space-between; gap: 10px;
    background: var(--fg); color: var(--bg); text-shadow: none; padding: 0 .4em;
    box-shadow: 0 0 8px var(--glow); white-space: nowrap; overflow: hidden; flex: none;
  }
  .bar .r { display: flex; gap: .8em; }
  .bar button { all: unset; cursor: pointer; padding: 0 .2em; }
  .bar button:active { background: var(--bg); color: var(--fg); }

  #main { flex: 1; min-height: 0; position: relative; margin: .35em 0 .2em; }
  #log {
    position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden;
    white-space: pre-wrap; word-break: break-word; touch-action: pan-y;
    scrollbar-width: none; -webkit-user-select: text; user-select: text;
  }
  #log::-webkit-scrollbar { display: none; }
  #log .sys { color: var(--dim); text-shadow: none; }
  #log .me { background: var(--fg); color: var(--bg); text-shadow: none; padding: 0 .15em; }
  #log .nm { font-weight: normal; }
  #log .t { color: var(--dim); text-shadow: none; }
  #log .act { font-style: normal; }
  #lobby { position: absolute; inset: 0; overflow-y: auto; scrollbar-width: none; white-space: pre-wrap; }
  .field { cursor: pointer; }
  .field.on .val { border-bottom: 2px solid var(--fg); }
  .btn {
    display: inline-block; padding: 0 .5em; border: 2px solid var(--fg); cursor: pointer;
    box-shadow: 0 0 6px var(--glow), inset 0 0 6px var(--glow); margin: .2em .5em .2em 0;
  }
  .btn:active, .btn.hot { background: var(--fg); color: var(--bg); text-shadow: none; }
  .cur { background: var(--fg); color: var(--bg); animation: blink 1.06s steps(1) infinite; text-shadow: none; }
  @keyframes blink { 50% { background: transparent; color: var(--fg); } }
  .err { color: var(--fg); }
  .dim { color: var(--dim); text-shadow: none; }

  /* ---------- camera / microphone ---------- */
  .bar button.on { background: var(--bg); color: var(--fg); }
  .bar button[hidden] { display: none; }
  #media { flex: none; display: none; gap: .4em; height: clamp(84px, 27dvh, 260px); margin-top: .35em; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
  #media::-webkit-scrollbar { display: none; }
  #media.on { display: flex; }
  #media.big { height: clamp(150px, 58dvh, 620px); }
  .tile { position: relative; flex: none; height: 100%; aspect-ratio: 4 / 3; box-sizing: border-box; border: 2px solid var(--fg); box-shadow: 0 0 8px var(--glow); background: var(--bg); overflow: hidden; cursor: pointer; }
  .tile.nocam { aspect-ratio: 1; border-style: dashed; }
  .tile video, .tile canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) contrast(1.3) brightness(1.15); }
  .tile canvas { image-rendering: pixelated; filter: none; }
  .tile.nocam video, .tile.nocam canvas, .tile.nocam .tint { visibility: hidden; }
  .tile.self video { transform: scaleX(-1); }
  .tile .tint { position: absolute; inset: 0; background: var(--fg); mix-blend-mode: multiply; pointer-events: none; }
  .tile .tn { position: absolute; left: 0; top: 0; max-width: 100%; overflow: hidden; white-space: nowrap; background: var(--fg); color: var(--bg); text-shadow: none; padding: 0 .3em; font-size: 75%; }
  .tile .big { position: absolute; inset: 0; display: grid; place-items: center; font-size: 160%; }
  .tile:not(.nocam) .big { display: none; }
  .tile .lv { position: absolute; left: 5px; right: 5px; bottom: 5px; height: 5px; border: 1px solid var(--fg); background: rgba(0,0,0,.5); display: none; }
  .tile.mic .lv { display: block; }
  .tile .lv i { display: block; height: 100%; width: 0; background: var(--fg); box-shadow: 0 0 6px var(--glow); }
  .tile .tx { position: absolute; right: 0; top: 0; background: var(--bg); color: var(--fg); padding: 0 .3em; font-size: 70%; display: none; }
  .tile.sending .tx { display: block; animation: blink 1.06s steps(1) infinite; }
  .tile .msg { position: absolute; left: 0; right: 0; bottom: 14px; text-align: center; font-size: 70%; color: var(--fg); background: rgba(0,0,0,.55); }
  .tile .msg:empty { display: none; }

  #input { flex: none; white-space: pre-wrap; word-break: break-word; max-height: 4.6em; overflow: hidden; padding-top: .15em; border-top: 1px dashed var(--dim); }
  #input .count { color: var(--dim); float: right; text-shadow: none; }

  /* ---------- the on-screen keyboard ---------- */
  #kbd { flex: none; margin-top: .45em; display: flex; flex-direction: column; gap: clamp(4px, .9vh, 7px); touch-action: none; }
  #kbd.hidden { display: none; }
  .krow { display: flex; gap: clamp(3px, 1vw, 7px); }
  .k {
    flex: 1 1 0; min-width: 0; position: relative;
    height: clamp(34px, 6.1dvh, 54px);
    display: grid; place-items: center;
    font-size: clamp(19px, 5.2vw, 28px); line-height: 1;
    color: var(--fg); border: 2px solid var(--dim); border-bottom-width: 4px; border-radius: 4px;
    background: linear-gradient(to bottom, rgba(255,255,255,.04), rgba(0,0,0,.25));
    box-shadow: inset 0 0 8px rgba(0,0,0,.6);
    cursor: pointer; text-transform: none;
  }
  .k.sm { font-size: clamp(14px, 3.6vw, 20px); letter-spacing: .04em; }
  .k.fn { height: clamp(26px, 4.4dvh, 38px); border-bottom-width: 2px; border-style: dashed; font-size: clamp(14px, 3.6vw, 20px); }
  .k.w15 { flex-grow: 1.5; } .k.w2 { flex-grow: 2.2; } .k.w5 { flex-grow: 5.5; }
  .k.send { background: var(--fg); color: var(--bg); text-shadow: none; border-color: var(--fg); box-shadow: 0 0 10px var(--glow); }
  .k.down { background: var(--fg); color: var(--bg); text-shadow: none; border-color: var(--fg); box-shadow: 0 0 14px var(--glow); transform: translateY(2px); border-bottom-width: 2px; }
  .k.send.down { filter: brightness(1.5); }
  .k .led { position: absolute; top: 4px; right: 5px; width: 6px; height: 6px; border-radius: 50%; border: 1px solid var(--dim); }
  .k .led.on { background: var(--fg); box-shadow: 0 0 6px var(--fg); border-color: var(--fg); }
  .k .led.lock { box-shadow: 0 0 6px var(--fg), 0 0 0 2px var(--bg), 0 0 0 3px var(--fg); }
  .k .sub { position: absolute; left: 4px; top: 2px; font-size: 55%; color: var(--dim); text-shadow: none; }
  #hint { flex: none; color: var(--dim); text-shadow: none; font-size: 80%; margin-top: .3em; display: none; }

  /* glass */
  #scan { position: absolute; inset: 0; z-index: 6; pointer-events: none; background: repeating-linear-gradient(to bottom, rgba(0,0,0,.28) 0 1px, rgba(0,0,0,0) 1px 3px); }
  #roll { position: absolute; left: 0; right: 0; height: 14%; z-index: 7; pointer-events: none; background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,.04) 60%, rgba(255,255,255,0)); animation: roll 7s linear infinite; }
  @keyframes roll { from { top: -15%; } to { top: 101%; } }
  #glass { position: absolute; inset: 0; z-index: 8; pointer-events: none; border-radius: inherit;
    background: radial-gradient(ellipse 120% 90% at 30% 8%, rgba(255,255,255,.05), rgba(255,255,255,0) 40%), radial-gradient(ellipse at center, rgba(0,0,0,0) 60%, rgba(0,0,0,.5) 100%);
    box-shadow: inset 0 0 70px rgba(0,0,0,.8); }
  #tube.flat #glass { background: none; box-shadow: inset 0 0 25px rgba(0,0,0,.6); }
  #noise { position: absolute; inset: 0; z-index: 9; pointer-events: none; width: 100%; height: 100%; }

  #crt.jitter { animation: jitter .07s steps(2) infinite; }
  @keyframes jitter { 0% { transform: translate(1.5px, 0); } 100% { transform: translate(-1.5px, 1px); } }
  #crt.rollslip { animation: rollslip .45s cubic-bezier(.3,.7,.4,1); }
  @keyframes rollslip { 0% { transform: translateY(0); } 25% { transform: translateY(-18%); } 26% { transform: translateY(14%); } 100% { transform: translateY(0); } }
  #crt.rgb { text-shadow: -2px 0 rgba(255,40,80,.85), 2px 0 rgba(40,140,255,.85); }
  #crt.off { animation: poweroff .42s ease-in forwards; }
  @keyframes poweroff { 0% { transform: scale(1,1); filter: brightness(1); } 55% { transform: scale(1,.004); filter: brightness(4); } 85% { transform: scale(.12,.004); filter: brightness(6); } 100% { transform: scale(0,0); filter: brightness(0); } }
  #crt.on { animation: poweron .5s ease-out; }
  @keyframes poweron { 0% { transform: scale(0,.004); filter: brightness(6); } 35% { transform: scale(1,.004); filter: brightness(4); } 100% { transform: scale(1,1); filter: brightness(1); } }
</style>
<script src="/lib/nozoom.js"></script>
<script src="/lib/fullscreen.js"></script>
<script src="/lib/online.js" defer></script>
</head>
<body>
<div id="tube">
  <div id="crt">
    <div class="bar" id="status"><span id="stL">ERROR-CHAT 1.1</span><span class="r"><button id="bCam" hidden>CAM</button><button id="bMic" hidden>MIC</button><span id="stOn"></span><span id="stClock"></span></span></div>
    <div id="media"></div>
    <div id="main">
      <div id="lobby"></div>
      <div id="log" hidden></div>
    </div>
    <div id="input" hidden></div>
    <div id="kbd"></div>
    <div id="hint">F1 on-screen keyboard · /help commands · /cam /mic share · Esc leaves</div>
  </div>
  <div id="scan"></div>
  <div id="roll"></div>
  <div id="glass"></div>
  <canvas id="noise"></canvas>
</div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const crt = $('crt'), tube = $('tube'), log = $('log'), lobbyEl = $('lobby'), inputEl = $('input'), kbd = $('kbd');

// ---------- settings shared with the ERROR-DOS menu ----------
const SCHEMES = [
  { name: 'GREEN',    fg: '#39ff7a', dim: '#1b7a3c', bg: '#031208', glow: 'rgba(57,255,122,.55)' },
  { name: 'AMBER',    fg: '#ffb43a', dim: '#8a5a12', bg: '#120a02', glow: 'rgba(255,180,58,.5)' },
  { name: 'WHITE',    fg: '#e9f0ff', dim: '#6b7080', bg: '#08090d', glow: 'rgba(233,240,255,.4)' },
  { name: 'DOS BLUE', fg: '#f2f2ff', dim: '#8d98ff', bg: '#0019a6', glow: 'rgba(200,210,255,.35)' },
  { name: 'CYAN',     fg: '#45f0ff', dim: '#157a85', bg: '#021014', glow: 'rgba(69,240,255,.5)' },
];
let S = { color: 0, glitch: 1, curved: true, sound: true };
try { Object.assign(S, JSON.parse(localStorage.getItem('errordos-settings') || localStorage.getItem('fk' + 'dos-settings') || '{}')); } catch (e) {}
function saveSettings() { try { localStorage.setItem('errordos-settings', JSON.stringify(S)); } catch (e) {} }
function applyColors() {
  const c = SCHEMES[S.color % SCHEMES.length], st = document.documentElement.style;
  st.setProperty('--fg', c.fg); st.setProperty('--dim', c.dim); st.setProperty('--bg', c.bg); st.setProperty('--glow', c.glow);
  tube.classList.toggle('flat', !S.curved);
  noiseColor = c.fg;
}
let noiseColor = '#39ff7a';

// ---------- sound ----------
let ac = null, unlocked = false;
function audio() {
  if (!S.sound || !unlocked) return null;
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
  if (ac.state === 'suspended') ac.resume();
  return ac;
}
function tone(f, d, v, type, when) {
  const a = audio(); if (!a) return;
  const t = a.currentTime + (when || 0), o = a.createOscillator(), g = a.createGain();
  o.type = type || 'square'; o.frequency.value = f;
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + d + 0.02);
}
let nb = null;
function noise(d, v, f, q, when) {
  const a = audio(); if (!a) return;
  if (!nb) { nb = a.createBuffer(1, a.sampleRate, a.sampleRate); const x = nb.getChannelData(0); for (let i = 0; i < x.length; i++) x[i] = Math.random() * 2 - 1; }
  const t = a.currentTime + (when || 0), s = a.createBufferSource(), bf = a.createBiquadFilter(), g = a.createGain();
  s.buffer = nb; bf.type = 'bandpass'; bf.frequency.value = f; bf.Q.value = q;
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  s.connect(bf).connect(g).connect(a.destination); s.start(t, Math.random() * .5); s.stop(t + d + .02);
}
const SND = {
  key() { noise(0.022, 0.22, 3600, 0.8); tone(1900, 0.008, 0.012); },
  space() { noise(0.03, 0.25, 1600, 0.7); },
  send() { tone(880, 0.05, 0.035); tone(1320, 0.07, 0.035, 'square', 0.05); },
  incoming() { tone(1568, 0.04, 0.03); tone(2093, 0.06, 0.025, 'square', 0.05); },
  join() { tone(660, 0.05, 0.02, 'triangle'); tone(990, 0.07, 0.02, 'triangle', 0.06); },
  crackle() { for (let i = 0; i < 3; i++) noise(0.03 + Math.random() * 0.05, 0.05 + Math.random() * 0.07, 900 + Math.random() * 3000, 0.6, Math.random() * 0.1); },
  err() { tone(220, 0.15, 0.04); },
};

// ---------- glitches (lighter than the menu) ----------
const ncv = $('noise'), nctx = ncv.getContext('2d');
let staticUntil = 0;
function cls(c, ms) { crt.classList.add(c); setTimeout(() => crt.classList.remove(c), ms); }
function glitch(k) {
  k = k || ['jitter', 'rgb', 'static', 'static', 'roll'][Math.random() * 5 | 0];
  if (k === 'jitter') cls('jitter', 220);
  else if (k === 'rgb') cls('rgb', 160);
  else if (k === 'static') staticUntil = performance.now() + 160;
  else if (k === 'roll') { crt.classList.remove('rollslip'); void crt.offsetWidth; cls('rollslip', 460); }
  SND.crackle();
}
let nextGlitch = 0;
function scheduleGlitch(now) { const m = [0, 14000, 6000, 2200][S.glitch | 0]; nextGlitch = m ? now + m * (0.4 + Math.random() * 1.2) : Infinity; }
function drawStatic(now) {
  if (ncv.width !== tube.clientWidth) { ncv.width = tube.clientWidth; ncv.height = tube.clientHeight; }
  nctx.clearRect(0, 0, ncv.width, ncv.height);
  if (now > staticUntil) return;
  nctx.fillStyle = noiseColor;
  for (let i = 0; i < 22; i++) { nctx.globalAlpha = Math.random() * .5; nctx.fillRect(Math.random() * ncv.width * .5, Math.random() * ncv.height, Math.random() * ncv.width, 1 + Math.random() * 2); }
  nctx.globalAlpha = 1;
}

// ---------- state ----------
const store = {
  get(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};
const st = {
  screen: 'lobby',             // lobby | chat
  focus: 'handle',             // handle | code | msg
  handle: store.get('gamelab-player-name'),
  code: '',
  msg: '',
  lobbyMsg: '',
  who: [],
  lastId: 0,
  unread: 0,
};
const params = new URLSearchParams(location.search);
if (params.get('c')) st.code = params.get('c').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8);
let ws = null, ping = null, reconnectTimer = null, wantOpen = false;

// ---------- lobby ----------
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function cursorFor(f) { return st.focus === f ? '<span class="cur"> </span>' : ''; }
function drawLobby() {
  const h = st.handle, c = st.code;
  lobbyEl.innerHTML =
    'ERROR-CHAT 1.1 <span class="dim">' + esc(location.host.toUpperCase() || 'ERROR.BLUE') + ' BBS</span>\n\n' +
    '<span class="field' + (st.focus === 'handle' ? ' on' : '') + '" data-f="handle">HANDLE  : <span class="val">' + esc(h) + cursorFor('handle') + (h || st.focus === 'handle' ? '' : '<span class="dim">tap to type</span>') + '</span></span>\n' +
    '<span class="field' + (st.focus === 'code' ? ' on' : '') + '" data-f="code">CHANNEL : <span class="val">' + esc(c) + cursorFor('code') + (c || st.focus === 'code' ? '' : '<span class="dim">----</span>') + '</span></span>\n\n' +
    '<span class="btn" data-a="new">NEW CHANNEL</span><span class="btn" data-a="join">JOIN</span>\n' +
    (st.lobbyMsg ? '<span class="err">' + esc(st.lobbyMsg) + '</span>' : '') + '\n\n' +
    '<span class="dim">Everyone with the same channel code talks together. Messages are kept 7 days.</span>';
}
lobbyEl.addEventListener('pointerdown', e => {
  unlock();
  const f = e.target.closest('[data-f]'), a = e.target.closest('[data-a]');
  if (f) { st.focus = f.dataset.f; SND.key(); drawLobby(); }
  if (a) { e.preventDefault(); a.classList.add('hot'); setTimeout(() => a.classList.remove('hot'), 150); a.dataset.a === 'new' ? newChannel() : join(); }
});
function newCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', b = new Uint8Array(4);
  crypto.getRandomValues(b);
  return Array.from(b, x => chars[x % chars.length]).join('');
}
function newChannel() { st.code = newCode(); join(); }
function join() {
  st.handle = st.handle.trim();
  if (!st.handle) { st.lobbyMsg = 'Type a handle first.'; st.focus = 'handle'; SND.err(); glitch('jitter'); drawLobby(); return; }
  if (!/^[A-Z0-9]{3,8}$/.test(st.code)) {
    if (!st.code) { st.code = newCode(); }
    else { st.lobbyMsg = 'Channel code: 3-8 letters or digits.'; st.focus = 'code'; SND.err(); drawLobby(); return; }
  }
  store.set('gamelab-player-name', st.handle);
  window.errorOnline = { name: st.handle }; window.ErrorOnline && ErrorOnline.update();
  st.lobbyMsg = '';
  st.screen = 'chat'; st.focus = 'msg'; st.msg = ''; st.lastId = 0;
  history.replaceState(null, '', '?c=' + st.code);
  lobbyEl.hidden = true; log.hidden = false; inputEl.hidden = false;
  log.innerHTML = '';
  sys('ERROR-CHAT 1.1 · channel #' + st.code);
  sys('Share the code ' + st.code + ' or press LINK to invite.');
  sys('Connecting...');
  glitch('roll');
  connect();
  drawInput(); drawStatus(); setShift(true);
}

// ---------- chat ----------
function connect() {
  wantOpen = true;
  clearTimeout(reconnectTimer);
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(proto + '//' + location.host + '/api/chat/' + st.code + '?name=' + encodeURIComponent(st.handle) + (window.RTCPeerConnection ? '&rtc=1' : ''));
  ws.onmessage = ev => { let m; try { m = JSON.parse(ev.data); } catch (e) { return; } onMsg(m); };
  ws.onopen = () => { clearInterval(ping); ping = setInterval(() => ws && ws.readyState === 1 && ws.send('{"type":"ping"}'), 25000); };
  ws.onclose = () => {
    clearInterval(ping);
    if (!wantOpen) return;
    sys('*** connection lost, redialling...');
    glitch('static');
    reconnectTimer = setTimeout(connect, 2500);
  };
}
function onMsg(m) {
  if (m.type === 'hello') {
    st.who = m.who || [];
    const fresh = (m.history || []).filter(h => h.id > st.lastId);
    if (st.lastId === 0) {
      if (fresh.length) sys('--- last ' + fresh.length + ' message(s) ---');
      else sys('No messages yet. Say hi!');
    }
    fresh.forEach(h => addLine(h, true));
    if (st.lastId === 0 && fresh.length) sys('--- you are in #' + m.code + ' ---');
    sys('*** ' + whoLine());
    SND.join();
    rtcHello(m);
  } else if (m.type === 'msg') {
    if (m.id <= st.lastId) return;
    addLine(m, false);

    const got = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { exact: facing }, width: { ideal: 640 }, height: { ideal: 480 } } });
    const nt = got.getVideoTracks()[0], old = RTC.local.getVideoTracks()[0];
    for (const p of RTC.peers.values()) if (p.pc) for (const s of p.pc.getSenders()) if (s.track === old) await s.replaceTrack(nt);
    if (old) { old.stop(); RTC.local.removeTrack(old); }
    RTC.local.addTrack(nt); RTC.facing = facing;
    sys('*** ' + (facing === 'user' ? 'front' : 'back') + ' camera');
  } catch (e) { sys('*** no other camera'); }
  RTC.busy = false;
  drawMedia();
}

// ---------- tiles ----------
function makeTile(id, self) {
  const t = document.createElement('div');
  t.className = 'tile' + (self ? ' self' : '');
  t.dataset.id = id;
  t.innerHTML = '<video playsinline autoplay' + (self ? ' muted' : '') + '></video><canvas width="' + FW + '" height="' + FH + '" hidden></canvas><div class="tint"></div><div class="big"></div><div class="tn"></div><div class="tx">TX</div><div class="msg"></div><div class="lv"><i></i></div>';
  t.addEventListener('pointerdown', e => {
    e.preventDefault(); unlock();
    const v = t.querySelector('video');
    if (v.paused && v.srcObject) { v.play().catch(() => {}); t.querySelector('.msg').textContent = ''; return; }
    if (self) flipCam(); else { mediaEl.classList.toggle('big'); log.scrollTop = log.scrollHeight; }
  });
  return t;
}
function setStream(tile, stream, sound) {
  const v = tile.querySelector('video');
  // a track came or went: give the stream to the video again (not every browser follows by itself)
  const key = stream ? stream.getTracks().map(t => t.id).join() : '';
  if (v.srcObject !== stream || tile.dataset.tracks !== key) {
    tile.dataset.tracks = key;
    v.srcObject = null;
    v.srcObject = stream || null;
    if (stream) v.play().catch(() => { if (sound) tile.querySelector('.msg').textContent = 'TAP FOR SOUND'; });
  }
  meterFor(tile, stream);
}
function drawTile(p, fresh) {
  const show = p.cam || p.mic;
  if (!show) { removeTile(p); return; }
  if (!p.tile) { p.tile = makeTile(p.id, false); mediaEl.appendChild(p.tile); }
  const t = p.tile, connected = p.pc && p.pc.connectionState === 'connected';
  t.classList.toggle('nocam', !p.cam);
  t.classList.toggle('mic', p.mic);
  t.querySelector('.tn').textContent = p.name + (p.mic ? ' ♪' : '');
  t.querySelector('.big').textContent = p.name.slice(0, 2).toUpperCase();
  const useRelay = p.cam && p.relay && !connected;
  t.querySelector('canvas').hidden = !useRelay;
  t.querySelector('video').style.visibility = useRelay ? 'hidden' : '';
  let msg = t.querySelector('.msg').textContent;
  if (msg !== 'TAP FOR SOUND') msg = connected ? '' : useRelay ? 'TINY PICTURE MODE' : p.late ? 'NO DIRECT LINE' : p.pc ? 'CONNECTING...' : 'WAITING...';
  t.querySelector('.msg').textContent = msg;
  if (p.stream || fresh) setStream(t, p.stream, p.mic);
  drawMedia();
}
function removeTile(p) { if (p.tile) { meterFor(p.tile, null); p.tile.remove(); p.tile = null; } }
function drawMedia() {
  if (sharing()) {
    if (!RTC.selfTile) { RTC.selfTile = makeTile('me', true); mediaEl.prepend(RTC.selfTile); }
    const t = RTC.selfTile;
    t.classList.toggle('nocam', !RTC.cam);
    t.classList.toggle('mic', RTC.mic);
    t.classList.toggle('self', RTC.facing === 'user');
    t.querySelector('.tn').textContent = 'YOU' + (RTC.mic ? ' ♪' : '');
    t.querySelector('.big').textContent = 'ME';
    setStream(t, RTC.local, false);
  } else if (RTC.selfTile) { meterFor(RTC.selfTile, null); RTC.selfTile.remove(); RTC.selfTile = null; }
  mediaEl.classList.toggle('on', mediaEl.children.length > 0);
  if (!mediaEl.children.length) mediaEl.classList.remove('big');
}

// ---------- microphone meters ----------
let meterAc = null;
const meters = new Map();                       // tile -> {an, src, buf, bar}
function meterFor(tile, stream) {
  const m = meters.get(tile);
  const track = stream && stream.getAudioTracks()[0];
  if (m && m.track === track) return;
  if (m) { try { m.src.disconnect(); } catch (e) {} meters.delete(tile); }
  if (!track) return;
  try {
    if (!meterAc) meterAc = new (window.AudioContext || window.webkitAudioContext)();
    if (meterAc.state === 'suspended') meterAc.resume();
    const src = meterAc.createMediaStreamSource(new MediaStream([track])), an = meterAc.createAnalyser();
    an.fftSize = 256; src.connect(an);
    meters.set(tile, { an, src, track, buf: new Uint8Array(an.fftSize), bar: tile.querySelector('.lv i'), lv: 0 });
  } catch (e) {}
}
function drawMeters() {
  for (const m of meters.values()) {
    m.an.getByteTimeDomainData(m.buf);
    let s = 0;
    for (let i = 0; i < m.buf.length; i++) { const v = (m.buf[i] - 128) / 128; s += v * v; }
    const lv = Math.min(1, Math.sqrt(s / m.buf.length) * 4);
    m.lv = Math.max(lv, m.lv * 0.85);
    m.bar.style.width = (m.lv * 100).toFixed(1) + '%';
  }
}

// ---------- tiny pictures (for pocket.DOS, and browsers that can't connect directly) ----------
let fcv = null, fctx = null;
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
function grabFrame() {
  const v = RTC.selfTile && RTC.selfTile.querySelector('video');
  if (!v || v.readyState < 2 || !v.videoWidth) return null;
  if (!fcv) { fcv = document.createElement('canvas'); fcv.width = FW; fcv.height = FH; fctx = fcv.getContext('2d', { willReadFrequently: true }); }
  const vw = v.videoWidth, vh = v.videoHeight, a = FW / FH;
  let sw = vw, sh = vw / a;
  if (sh > vh) { sh = vh; sw = vh * a; }
  fctx.drawImage(v, (vw - sw) / 2, (vh - sh) / 2, sw, sh, 0, 0, FW, FH);
  const d = fctx.getImageData(0, 0, FW, FH).data, n = FW * FH, g = new Uint8Array(n), hist = new Uint32Array(256);
  for (let i = 0; i < n; i++) { const y = (d[i * 4] * 77 + d[i * 4 + 1] * 150 + d[i * 4 + 2] * 29) >> 8; g[i] = y; hist[y]++; }
  let lo = 0, hi = 255, acc = 0;                          // stretch: 2% darkest -> 0, 2% brightest -> 15
  while (lo < 254 && (acc += hist[lo]) < n * 0.02) lo++;
  acc = 0;
  while (hi > lo + 1 && (acc += hist[hi]) < n * 0.02) hi--;
  if (hi - lo < 40) { const mid = (hi + lo) / 2; lo = mid - 20; hi = mid + 20; }
  const k = 15 / (hi - lo), out = new Uint8Array(n >> 1);
  for (let y = 0, i = 0; y < FH; y++)
    for (let x = 0; x < FW; x++, i++) {
      let q = Math.floor((g[i] - lo) * k + (BAYER[(y & 3) * 4 + (x & 3)] + 0.5) / 16);
      q = q < 0 ? 0 : q > 15 ? 15 : q;
      out[i >> 1] |= i & 1 ? q : q << 4;
    }
  let s = '';
  for (let i = 0; i < out.length; i++) s += String.fromCharCode(out[i]);
  return btoa(s);
}
function hexRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
function rtcFrame(m) {
  const p = m.id && RTC.peers.get(m.id);
  if (!p || !p.tile || !m.data) return;
  const cv = p.tile.querySelector('canvas'), w = m.w, h = m.h;
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  const c = cv.getContext('2d'), img = c.createImageData(w, h), bin = atob(m.data);
  const sc = SCHEMES[S.color % SCHEMES.length], A = hexRgb(sc.bg), B = hexRgb(sc.fg);
  for (let i = 0; i < w * h; i++) {
    const b = bin.charCodeAt(i >> 1), q = (i & 1 ? b & 15 : b >> 4) / 15;
    img.data[i * 4] = A[0] + (B[0] - A[0]) * q; img.data[i * 4 + 1] = A[1] + (B[1] - A[1]) * q;
    img.data[i * 4 + 2] = A[2] + (B[2] - A[2]) * q; img.data[i * 4 + 3] = 255;
  }
  c.putImageData(img, 0, 0);
}
let lastFrameSent = 0, lastRelayAsk = 0;
function mediaTick(now) {
  drawMeters();
  if (RTC.selfTile) RTC.selfTile.classList.toggle('sending', RTC.cam && now < RTC.watchUntil);
  // someone watches my tiny pictures: about 5 a second
  if (RTC.cam && now < RTC.watchUntil && now - lastFrameSent > 200 && ws && ws.readyState === 1 && ws.bufferedAmount < 40000) {
    lastFrameSent = now;
    const data = grabFrame();
    if (data) ws.send(JSON.stringify({ t: 'frame', w: FW, h: FH, data }));
  }
  // cameras I can't get directly after 9 seconds: watch the tiny pictures instead
  if (now - lastRelayAsk > 300 && ws && ws.readyState === 1) {
    lastRelayAsk = now;
    for (const p of RTC.peers.values()) {
      const ok = p.pc && p.pc.connectionState === 'connected', late = !ok && now - Math.max(p.since || 0, p.pcAt || 0) > 9000;
      if (late !== !!p.late) { p.late = late; if (p.tile) drawTile(p); }
      if (!p.cam) continue;
      if (!ok && !p.relay && now - Math.max(p.since || 0, p.pcAt || 0) > 9000) { p.relay = true; drawTile(p); }
      if (ok && p.relay) { p.relay = false; drawTile(p); }
      if (p.relay && !ok) ws.send(JSON.stringify({ t: 'getframe', id: p.id }));
    }
  }
}
$('bCam').addEventListener('pointerdown', e => { e.preventDefault(); toggleCam(); });
$('bMic').addEventListener('pointerdown', e => { e.preventDefault(); toggleMic(); });

// ---------- start ----------
applyColors();
buildKbd();
crt.classList.add('flicker');
crt.classList.add('on'); setTimeout(() => crt.classList.remove('on'), 520);
if (!st.handle) st.focus = 'handle';
else if (!st.code) st.focus = 'code';
drawLobby(); drawStatus(); setShift(!st.handle);
if (st.handle && st.code) join();
scheduleGlitch(performance.now());
(function loop(now) {
  drawStatic(now);
  mediaTick(now);
  if (now > nextGlitch) { glitch(); scheduleGlitch(now); }
  requestAnimationFrame(loop);
})(performance.now());
setInterval(drawStatus, 15000);
addEventListener('pageshow', e => { if (e.persisted) { crt.classList.remove('off'); if (st.screen === 'chat' && (!ws || ws.readyState > 1)) connect(); } });
})();
</script>
