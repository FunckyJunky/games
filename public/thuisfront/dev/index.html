<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<title>HOME FRONT · screen</title>
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect width=%2716%27 height=%2716%27 rx=%273%27 fill=%27%23031208%27/%3E%3Cpath d=%27M3 8l5-4 5 4v5H3z%27 fill=%27none%27 stroke=%27%2339ff7a%27 stroke-width=%271.5%27/%3E%3C/svg%3E">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: grid; place-items: center; height: 100dvh; font-family: ui-monospace, Menlo, Consolas, monospace; color: #39ff7a;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #scr { image-rendering: pixelated; image-rendering: crisp-edges; width: min(100vw, calc(100dvh * 320 / 172)); aspect-ratio: 320 / 172; display: block; background: #000; }
  #gear { position: fixed; right: 10px; bottom: 10px; width: 40px; height: 40px; border: 2px solid #1b7a3c; background: #031208; color: #39ff7a;
    font: 22px/36px monospace; text-align: center; opacity: 0; transition: opacity .4s; cursor: pointer; padding: 0; }
  body.hover #gear { opacity: .9; }
  #set { position: fixed; inset: 0; display: none; place-items: center; background: rgba(0,0,0,.75); }
  #set.on { display: grid; }
  #set form { background: #031208; border: 2px solid #39ff7a; box-shadow: 0 0 24px rgba(57,255,122,.35); padding: 18px 20px; width: min(92vw, 420px); box-sizing: border-box; font-size: 16px; }
  #set h1 { margin: 0 0 12px; font-size: 18px; background: #39ff7a; color: #031208; padding: 2px 8px; }
  #set label { display: block; margin: 10px 0 4px; color: #1b7a3c; }
  #set input { width: 100%; box-sizing: border-box; background: #000; border: 2px solid #1b7a3c; color: #39ff7a; font: inherit; padding: 6px 8px; text-transform: uppercase; }
  #set .row { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
  #set button { flex: 1; background: #031208; border: 2px solid #39ff7a; color: #39ff7a; font: inherit; padding: 8px; cursor: pointer; }
  #set button:active { background: #39ff7a; color: #031208; }
  #set .id { margin-top: 10px; color: #1b7a3c; font-size: 13px; }
</style>
</head>
<body>
<canvas id="scr" width="320" height="172"></canvas>
<button id="gear" title="settings">&#9881;</button>
<div id="set"><form id="f">
  <h1>HOME FRONT SCREEN</h1>
  <label for="nm">NAME OF THIS SCREEN</label><input id="nm" maxlength="20" autocomplete="off">
  <label for="hm">HOME CODE (empty = none)</label><input id="hm" maxlength="12" autocomplete="off">
  <div class="id" id="idl"></div>
  <div class="row"><button type="submit">SAVE</button><button type="button" id="fs">FULL SCREEN</button><button type="button" id="cl">CLOSE</button></div>
</form></div>
<script type="module">
import { Screen, decodeText, decodeFrame, animParse } from './render.js';

const VER = 'web-1.1';
const store = {
  get(k, d) { try { const v = localStorage.getItem('hfdev.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('hfdev.' + k, JSON.stringify(v)); } catch { /* full or private */ } },
};
const hex = (n) => [...crypto.getRandomValues(new Uint8Array(n))].map((b) => b.toString(16).padStart(2, '0')).join('').toUpperCase();
let id = store.get('id', '');
if (!/^WEB-[A-F0-9]{6}$/.test(id)) { id = 'WEB-' + hex(3); store.set('id', id); }
const q = new URLSearchParams(location.search);
if (q.has('name')) store.set('name', q.get('name').toUpperCase().slice(0, 20));
if (q.has('home')) store.set('home', q.get('home').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 12));
let name = store.get('name', '') || id, home = store.get('home', '');

const cv = document.getElementById('scr');
const scr = new Screen(cv);
scr.info = { id, name, wifi: '', ip: 'BROWSER', online: false };

// the last web app and its settings: shown straight away, also without a connection
const last = store.get('state', null);
let tbHave = '';
if (last) {
  scr.setState(last);
  const tb = store.get('text', '');
  if (tb && last.comm && last.comm.tb) {
    try { const t = decodeText(Uint8Array.from(atob(tb), (c) => c.charCodeAt(0))); if (t) { scr.setText(t); tbHave = last.comm.tb; } } catch { /* broken */ }
  }
}
// JPEG bytes -> {w, h, data RGBA}
const jc = document.createElement('canvas');
async function jpegRGBA(bytes, own) {
  const bm = await createImageBitmap(new Blob([bytes], { type: 'image/jpeg' }));
  const c = own ? document.createElement('canvas') : jc;
  if (c.width !== bm.width || c.height !== bm.height) { c.width = bm.width; c.height = bm.height; }
  const x = c.getContext('2d', { willReadFrequently: true });
  x.drawImage(bm, 0, 0); bm.close();
  return { w: c.width, h: c.height, data: x.getImageData(0, 0, c.width, c.height).data };
}
// a photo as it came: a JPEG, or "HFA1" frames -> what the screen shows ({w, h, data, frames?})
async function photoOf(bytes) {
  const anim = animParse(bytes);
  if (!anim) return jpegRGBA(bytes, true);
  const frames = [];
  for (const f of anim) { const p = await jpegRGBA(f.jpg, true); frames.push({ data: p.data, delay: f.delay, w: p.w, h: p.h }); }
  return { w: frames[0].w, h: frames[0].h, data: frames[0].data, frames };
}
const b64 = (u8) => { let b = ''; for (let i = 0; i < u8.length; i += 8192) b += String.fromCharCode(...u8.subarray(i, i + 8192)); return btoa(b); };
let pbHave = '';
if (last && last.comm && last.comm.pb && store.get('photopb', '') === last.comm.pb) {
  try { const j = Uint8Array.from(atob(store.get('photo', '')), (c) => c.charCodeAt(0)); photoOf(j).then((p) => { scr.setPhoto(p); pbHave = last.comm.pb; }).catch(() => {}); } catch { /* broken */ }
}
// this device's movement (phones and tablets), for CLOCK "on when moved"; a tap on the screen wakes it too
let grav = null, askedMotion = false;
// iPhones report accelerationIncludingGravity the other way round (down instead of up)
const IOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
// device directions -> screen directions (the page may be turned sideways)
function toScreen(v) {
  const a = (((screen.orientation && screen.orientation.angle) || window.orientation || 0) * Math.PI) / 180, c = Math.cos(a), s = Math.sin(a);
  return [v[0] * c - v[1] * s, v[0] * s + v[1] * c, v[2]];
}
window.addEventListener('devicemotion', (e) => {
  const a = e.accelerationIncludingGravity;
  if (!a || a.x == null || a.y == null || a.z == null) return;
  const x = a.x / 9.81, y = a.y / 9.81, z = a.z / 9.81;
  if (!grav) grav = { x, y, z };
  scr.motion(Math.hypot(x - grav.x, y - grav.y, z - grav.z));
  grav.x += (x - grav.x) * 0.04; grav.y += (y - grav.y) * 0.04; grav.z += (z - grav.z) * 0.04;
  // FOX: what is felt (1 g up when still) and the turning, in screen directions
  const sg = IOS ? -1 : 1, r = e.rotationRate || {}, d2r = Math.PI / 180;
  scr.foxSensor(toScreen([x * sg, y * sg, z * sg]), toScreen([(r.beta || 0) * d2r, (r.gamma || 0) * d2r, (r.alpha || 0) * d2r]));
});
// FOX: while a phone watches, send it the fox's pose 12 times a second
let foxWatch = 0;
setInterval(() => {
  if (foxWatch > 0 && ws && ws.readyState === 1 && scr.state && scr.state.app === 'fox') ws.send(JSON.stringify({ t: 'fox', p: scr.foxPacket(), u: scr.foxLevel() || undefined }));
}, 83);
// FOX: a tap on the screen sends the fox to that spot on its floor
cv.addEventListener('pointerdown', (e) => {
  if (!scr.state || scr.state.app !== 'fox') return;
  const r = cv.getBoundingClientRect();
  if (r.width > 0) scr.foxTap(((e.clientX - r.left) * 320) / r.width, ((e.clientY - r.top) * 172) / r.height);
});
document.addEventListener('pointerdown', () => {
  if (!askedMotion && typeof DeviceMotionEvent !== 'undefined' && DeviceMotionEvent.requestPermission) {   // iPhone / iPad ask first
    askedMotion = true; DeviceMotionEvent.requestPermission().catch(() => {});
  }
  scr.motion(9);
}, { passive: true });
let pendingPhoto = null, videoBusy = false;
let pendingText = null, pendingRaw = null, ws = null, everConnected = false, frames = 0, fps = 0, retry = 1000, lastMsg = 0;

function connect() {
  const u = new URL('ws/', location.href);
  u.pathname = '/thuisfront/dev/ws';
  u.protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
  u.search = '?id=' + encodeURIComponent(id);
  ws = new WebSocket(u);
  ws.binaryType = 'arraybuffer';
  ws.onopen = () => {
    retry = 1000; lastMsg = Date.now();
    ws.send(JSON.stringify({ t: 'hi', id, name, kind: 'web', ver: VER, wifi: '', ip: 'BROWSER', rssi: 0, home, rename: store.get('renamed', 0), tb: tbHave, rev: (scr.state && scr.state.rev) || 0, pb: pbHave }));
  };
  ws.onmessage = (ev) => {
    lastMsg = Date.now();
    if (typeof ev.data !== 'string') {
      const u8 = new Uint8Array(ev.data), kind = String.fromCharCode(u8[0], u8[1], u8[2], u8[3]);
      const got = (s) => { try { ws && ws.send(JSON.stringify({ t: 'got', s })); } catch { /* closed */ } };
      if (kind === 'HFV1') {                            // a grey video frame
        const f = decodeFrame(u8);
        if (f) { scr.setFrame(f); frames++; got(f.seq); }
      } else if (kind === 'HFV2') {                     // a colour video frame: a JPEG
        const seq = new DataView(u8.buffer, u8.byteOffset).getUint32(8, true);
        if (videoBusy) { got(seq); return; }
        videoBusy = true;
        jpegRGBA(u8.subarray(12)).then((f) => { scr.setColorFrame(f); frames++; }).catch(() => {}).finally(() => { videoBusy = false; got(seq); });
      } else if (kind === 'HFP1') pendingPhoto = u8.slice(4);                    // a photo, named by the next state
      else if (kind === 'HFA1') pendingPhoto = u8.slice();                       // an animated photo (GIF), the same
      else if (kind === 'HFT1') { pendingText = decodeText(u8); pendingRaw = u8; }   // text, named by the next state
      return;
    }
    let m; try { m = JSON.parse(ev.data); } catch { return; }
    if (m.t === 'watch') { foxWatch = m.fox | 0; return; }
    if (m.t === 'foxgo') { scr.foxGo(+m.x || 0, +m.z || 0); return; }   // a tap on a phone's FOX preview
    if (m.t !== 'state') return;
    const s = m.state;
    if (pendingText && s.comm && s.comm.tb) {
      scr.setText(pendingText); tbHave = s.comm.tb;
      let b = ''; for (let i = 0; i < pendingRaw.length; i += 8192) b += String.fromCharCode(...pendingRaw.subarray(i, i + 8192));
      store.set('text', btoa(b));
      pendingText = pendingRaw = null;
    }
    if (pendingPhoto && s.comm && s.comm.pb) {
      const j = pendingPhoto, pb = s.comm.pb;
      pendingPhoto = null;
      photoOf(j).then((p) => {
        scr.setPhoto(p); pbHave = pb;
        const s64 = b64(j);                       // remember it for a reload (a big GIF may not fit: then the server sends it again)
        store.set('photopb', ''); store.set('photo', s64);
        if (store.get('photo', '') === s64) store.set('photopb', pb); else store.set('photo', '');
      }).catch(() => {});
    }
    store.set('renamed', 0);
    if (s.name && s.name !== name) { name = s.name; store.set('name', name); }
    scr.info.name = name;
    scr.setState(s); store.set('state', s); light();
    scr.info.online = true; scr.offline = false;
    if (!everConnected) { everConnected = true; scr.setPhase('connected'); setTimeout(() => scr.setPhase('run'), 3000); }
  };
  ws.onclose = () => {
    scr.info.online = false; ws = null;
    setTimeout(connect, retry); retry = Math.min(15000, retry * 2);
  };
}
connect();
if (last) { everConnected = true; scr.setPhase('run'); }   // known settings: no "connected" screen, go straight on
setInterval(() => {
  fps = frames / 15; frames = 0;
  if (ws && ws.readyState === 1) ws.send(JSON.stringify({ t: 'ping', rssi: 0, fps: Math.round(fps), heap: 0 }));
}, 15000);
setInterval(() => { scr.offline = !ws || ws.readyState !== 1 || Date.now() - lastMsg > 40000; }, 1000);

let lastDraw = 0;
function light() { cv.style.opacity = scr.state && !scr.state.screen ? '0' : String(0.25 + 0.75 * ((scr.state && scr.state.bright) || 100) / 100); }
function loop(now) {
  requestAnimationFrame(loop);
  if (now - lastDraw < 30) return;                      // about 30 frames a second, like the board
  lastDraw = now;
  scr.render(now);
  light();
}
requestAnimationFrame(loop);

// keep the screen awake
let lock = null;
async function wake() { try { if ('wakeLock' in navigator && document.visibilityState === 'visible') lock = await navigator.wakeLock.request('screen'); } catch { /* not allowed */ } }
document.addEventListener('visibilitychange', wake); wake();

// settings: move the mouse or tap to see the gear
const set = document.getElementById('set');
let hoverT = 0;
const showGear = () => { document.body.classList.add('hover'); clearTimeout(hoverT); hoverT = setTimeout(() => document.body.classList.remove('hover'), 2500); };
addEventListener('pointermove', showGear); addEventListener('pointerdown', showGear);
document.getElementById('gear').onclick = () => {
  document.getElementById('nm').value = name; document.getElementById('hm').value = home;
  document.getElementById('idl').textContent = 'ID ' + id + ' · ' + VER;
  set.classList.add('on');
};
document.getElementById('cl').onclick = () => set.classList.remove('on');
document.getElementById('fs').onclick = () => { const el = document.documentElement; (el.requestFullscreen || el.webkitRequestFullscreen || (() => {})).call(el); set.classList.remove('on'); wake(); };
document.getElementById('f').onsubmit = (e) => {
  e.preventDefault();
  name = document.getElementById('nm').value.toUpperCase().trim().slice(0, 20) || id;
  home = document.getElementById('hm').value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 12);
  store.set('name', name); store.set('home', home); store.set('renamed', 1); scr.info.name = name;
  set.classList.remove('on');
  if (ws) ws.close();                                   // reconnect with the new name and home code
};
cv.ondblclick = () => document.getElementById('fs').onclick();
</script>
</body>
</html>
