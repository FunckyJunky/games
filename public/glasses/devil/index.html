<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=600, height=600, initial-scale=1.0, user-scalable=no">
<meta name="mrbd-web-app-capable" content="yes">
<meta name="description" content="DEVIL.EXE: the devil rises 200 m away and walks toward you at 4 km/h. Keep moving.">
<title>DEVIL.EXE</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #000; }
  body { width: 600px; height: 600px; overflow: hidden; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; width: 600px; height: 600px; image-rendering: pixelated; }
</style>
<script src="/glasses/presence.js" data-app="devil"></script>
</head>
<body>
<canvas id="screen" aria-label="DEVIL.EXE"></canvas>
<script>
/* DEVIL.EXE: run from the devil.
   He rises 200 m from you (a real GPS spot) and walks straight at you at 4 km/h, day and night, until he
   takes you. Walk faster than him and you live. Get 400 m away and he loses your trail... for a while.
   The view is world-locked like VR: the black of the display is see-through, so all you see is him,
   standing where he really is, at his real size (REAL SIZE view; VR WIDE squeezes 40 degrees in).
   Sensors: location from the paired phone (navigator.geolocation); head turn/tilt from the glasses'
   gyroscope + accelerometer (deviceorientation); steps from the accelerometer and head-turn speed from
   the gyroscope (devicemotion), used to learn which way is north while you walk when there's no compass.
   TITLE  pinch = start, swipe right = menu (TEST RUN works without GPS)
   PLAY   pinch = where is he?  swipe left = HUD full/min/off  swipe up/down = REAL SIZE / VR WIDE
          swipe right or back = menu (give up)
   A run survives the display going off or the page reloading: he keeps walking meanwhile. */
(() => {
  "use strict";
  const G = 300, CX = 150, CY = 150;
  const RED = "#ff3322", HOT = "#ffae3b", BRIGHT = "#ffe8d2", MID = "#c42a17", DIM = "#6e150b", YEL = "#fff27a", GREEN = "#7dff8a";
  const D2R = Math.PI / 180;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const wrap360 = (a) => ((a % 360) + 360) % 360;
  const angDiff = (a, b) => ((((a - b) % 360) + 540) % 360) - 180;
  const pad = (n, l = 2) => String(n).padStart(l, "0");
  const store = {
    get(k, f) { try { const v = localStorage.getItem(k); return v === null ? f : JSON.parse(v); } catch { return f; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
    del(k) { try { localStorage.removeItem(k); } catch {} },
  };
  const EYE = 1.62, CATCH_M = 2, STRIDE = 0.68, RISE_S = 3.2, LOST_S = 12, NEAR = 0.06;
  const VIEWS = [{ name: "REAL SIZE", fov: 14.3 }, { name: "VR WIDE", fov: 40 }];   // the lens shows about 14 x 14 degrees
  const SPEEDS = [3, 4, 5, 6], DISTS = [100, 200, 300, 500], HUDS = ["FULL", "MIN", "OFF"];
  const glassesSounds = store.get("glasses.settings", {}).sounds !== false;
  const cfg = Object.assign({ sound: glassesSounds, voice: true, hud: "MIN", view: 0, speed: 4, dist: 200 }, store.get("devil.cfg", {}));
  const saveCfg = () => store.set("devil.cfg", cfg);
  const hfov = () => VIEWS[cfg.view % VIEWS.length].fov;
  const focal = () => CX / Math.tan((hfov() / 2) * D2R);

  /* ---------------- head motion + compass (same as the other glasses apps) ---------------- */
  function createMotion() {
    const AXES = [
      { name: "A", f: [0, 0, -1], u: [0, 1, 0] },
      { name: "B", f: [0, 1, 0],  u: [0, 0, 1] },
      { name: "C", f: [0, 0, 1],  u: [0, 1, 0] },
    ];
    let axis = (store.get("glasses.axis", 0) | 0) % AXES.length;
    let live = false, raw = null, needZero = true, zp = 0, zr = 0, zh = 0, listening = false;
    const att = { h: 0, p: 0, r: 0 };
    const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
    function attitude(al, be, ga) {
      const cA = Math.cos(al * D2R), sA = Math.sin(al * D2R);
      const cB = Math.cos(be * D2R), sB = Math.sin(be * D2R);
      const cG = Math.cos(ga * D2R), sG = Math.sin(ga * D2R);
      const R = [                                   // W3C: R = Rz(alpha) Rx(beta) Ry(gamma)
        [cA * cG - sA * sB * sG, -sA * cB, cA * sG + sA * sB * cG],
        [sA * cG + cA * sB * sG,  cA * cB, sA * sG - cA * sB * cG],
        [-cB * sG,                sB,      cB * cG],
      ];
      const mul = (v) => R.map((row) => row[0] * v[0] + row[1] * v[1] + row[2] * v[2]);
      const ax = AXES[axis];
      const f = mul(ax.f), u = mul(ax.u), r = mul(cross(ax.f, ax.u));   // world: x east, y north, z up
      return {
        heading: wrap360(Math.atan2(f[0], f[1]) / D2R),
        pitch: Math.asin(clamp(f[2], -1, 1)) / D2R,   // + = looking up
        roll: Math.atan2(-r[2], u[2]) / D2R,          // + = head tilted right
      };
    }
    function onOrient(e) {
      if (e.alpha == null && e.beta == null && e.gamma == null) return;
      raw = [e.alpha || 0, e.beta || 0, e.gamma || 0];
      live = true;
    }
    let compass = null, compassAt = 0;
    function onAbsolute(e) {
      let h = null;
      if (typeof e.webkitCompassHeading === "number") h = e.webkitCompassHeading;      // iOS
      else if ((e.type === "deviceorientationabsolute" || e.absolute) && e.alpha != null) h = attitude(e.alpha, e.beta || 0, e.gamma || 0).heading;
      if (h === null) return;
      compass = compass === null ? h : wrap360(compass + angDiff(h, compass) * 0.25);
      compassAt = performance.now();
    }
    function listen() {
      if (listening) return;
      listening = true;
      window.addEventListener("deviceorientation", onOrient);
      window.addEventListener("deviceorientation", onAbsolute);
      window.addEventListener("deviceorientationabsolute", onAbsolute);
    }
    async function enable() {   // call from a pinch / tap
      try {
        if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") {
          if ((await DeviceOrientationEvent.requestPermission()) !== "granted") return "denied";
        }
        if (typeof DeviceMotionEvent !== "undefined" && typeof DeviceMotionEvent.requestPermission === "function") await DeviceMotionEvent.requestPermission();
      } catch (err) { return "error"; }
      listen();
      return "ok";
    }
    listen();
    function update(dt) {
      if (!live || !raw) return false;
      const a = attitude(raw[0], raw[1], raw[2]);
      if (needZero) {   // "level" = how you hold your head right now
        zp = a.pitch; zr = a.roll; zh = a.heading;
        att.h = a.heading; att.p = a.pitch; att.r = a.roll;
        needZero = false;
      }
      const k = 1 - Math.exp(-dt * 26);              // quick: the devil has to stay put while you turn
      att.h = wrap360(att.h + angDiff(a.heading, att.h) * k);
      att.p += (a.pitch - att.p) * k;
      att.r = angDiff(att.r + angDiff(a.roll, att.r) * k, 0);
      return true;
    }
    return {
      get live() { return live; },
      get pending() { return needZero; },
      get axisName() { return AXES[axis].name; },
      get yaw() { return angDiff(att.h, zh); },
      get compass() { return performance.now() - compassAt < 3000 ? compass : null; },
      get pitch() { return att.p - zp; },
      get roll() { return angDiff(att.r, zr); },
      enable, update,
      zero() { needZero = true; },
      nextAxis(d) { axis = (axis + d + AXES.length) % AXES.length; store.set("glasses.axis", axis); needZero = true; return AXES[axis].name; },
    };
  }
  const motion = createMotion();

  /* ---------------- accelerometer (steps) + gyroscope (head-turn speed) ---------------- */
  const imu = { seen: false, gyro: false, g: 9.81, s: 0, armed: true, steps: 0, lastStep: -99, times: [], turn: 0 };
  function onDeviceMotion(e) {
    const now = performance.now() / 1000;
    let dt = e.interval || 16;
    dt = clamp(dt > 1 ? dt / 1000 : dt, 0.004, 0.1);           // ms in Chrome, seconds in old Safari
    const a = e.accelerationIncludingGravity && e.accelerationIncludingGravity.x != null ? e.accelerationIncludingGravity
            : e.acceleration && e.acceleration.x != null ? e.acceleration : null;
    if (a) {
      const m = Math.hypot(a.x || 0, a.y || 0, a.z || 0);
      if (!imu.seen) { imu.g = m; imu.seen = true; }
      imu.g += (m - imu.g) * (1 - Math.exp(-dt / 1.2));          // gravity (or zero) baseline
      imu.s += (m - imu.g - imu.s) * (1 - Math.exp(-dt / 0.06));  // the bounce of each step
      if (imu.armed && imu.s > 1.15 && now - imu.lastStep > 0.27) {
        imu.armed = false; imu.steps++; imu.lastStep = now; imu.times.push(now);
        while (imu.times.length && imu.times[0] < now - 4) imu.times.shift();
      } else if (!imu.armed && imu.s < 0.2) imu.armed = true;
    }
    const r = e.rotationRate;
    if (r && (r.alpha != null || r.beta != null || r.gamma != null)) {
      imu.gyro = true;
      const w = Math.hypot(r.alpha || 0, r.beta || 0, r.gamma || 0);   // degrees per second
      imu.turn += (w - imu.turn) * (1 - Math.exp(-dt / 0.15));
    }
  }
  window.addEventListener("devicemotion", onDeviceMotion);
  const stepping = () => performance.now() / 1000 - imu.lastStep < 1.4;
  const cadence = () => { const now = performance.now() / 1000; return imu.times.filter((t) => t > now - 4).length * 15; };

  /* ---------------- canvas + VGA 8x14 font ---------------- */
  const cv = document.getElementById("screen");
  const K = Math.min(3, Math.max(1, Math.round(window.devicePixelRatio || 1)));
  const W = 600 * K;
  cv.width = cv.height = W;
  const ctx = cv.getContext("2d");
  const loC = document.createElement("canvas"); loC.width = loC.height = G;
  const lo = loC.getContext("2d");
  const sl = document.createElement("canvas"); sl.width = 1; sl.height = 2 * K;
  const slg = sl.getContext("2d"); slg.fillStyle = "rgba(0,0,0,.32)"; slg.fillRect(0, K, 1, K);
  const scan = ctx.createPattern(sl, "repeat");
  const FONT_HEX = "00000000000000000000000000000000080808080808080008080000222222220000000000000000000000001212127e24247e48484800000000083e4948380e09493e0800000000314a4a34080816292946000000001c22221418294542463900000808080800000000000000000000000408081010101010100808040000201010080808080808101020000000000008492a1c2a4908000000000000000808087f0808080000000000000000000000000018080810000000000000003c000000000000000000000000000000001818000000000202040808101020404000000000182442464a5262422418000000000818280808080808083e000000003c4242020c102040407e000000003c4242021c020242423c00000000040c142444447e040404000000007e4040407c020202423c000000001c2040407c424242423c000000007e020204040408080808000000003c4242423c424242423c000000003c4242423e0202020438000000000000181800000018180000000000000018180000001808081000000000020408102010080402000000000000007e0000007e00000000000000402010080408102040000000003c424202040808000808000000001c224a565252524e201e0000000018242442427e42424242000000007c4242427c424242427c000000003c42424040404042423c0000000078444242424242424478000000007e4040407c404040407e000000007e4040407c4040404040000000003c424240404e4242463a00000000424242427e4242424242000000003e08080808080808083e000000001f0404040404044444380000000042444850606050484442000000004040404040404040407e00000000424266665a5a424242420000000042626252524a4a464642000000003c42424242424242423c000000007c4242427c4040404040000000003c4242424242425a663c030000007c4242427c4844444242000000003c424240300c0242423c000000007f080808080808080808000000004242424242424242423c000000004141412222221414080800000000424242425a5a6666424200000000424224241818242442420000000041412222140808080808000000007e02020408102040407e0000000e080808080808080808080e000000404020101008080402020000007010101010101010101010700018244200000000000000000000000000000000000000000000007f001008000000000000000000000000000000003c42023e4242463a0000004040405c6242424242625c0000000000003c4240404040423c0000000202023a4642424242463a0000000000003c42427e4040423c0000000c1010107c1010101010100000000000023a44444438203c42423c004040405c62424242424242000000080800180808080808083e0000000404000c040404040404044830004040404448506050484442000000180808080808080808083e00000000000076494949494949490000000000005c624242424242420000000000003c4242424242423c0000000000005c6242424242625c4040000000003a4642424242463a0202000000005c624240404040400000000000003c4240300c02423c000000001010107c10101010100c000000000000424242424242463a0000000000004242422424241818000000000000414949494949493600000000000042422418182442420000000000004242424242261a02023c000000007e0204081020407e0000000c10100808102010080810100c080808080808080808080808080800300808101008040810100808300031494600000000000000000000";
  const atlases = {};
  function atlas(color) {
    if (atlases[color]) return atlases[color];
    const a = document.createElement("canvas"); a.width = 95 * 8; a.height = 14;
    const g = a.getContext("2d"); g.fillStyle = color;
    for (let i = 0; i < 95; i++) for (let r = 0; r < 14; r++) {
      const bits = parseInt(FONT_HEX.substr((i * 14 + r) * 2, 2), 16);
      for (let x = 0; x < 8; x++) if (bits & (128 >> x)) g.fillRect(i * 8 + x, r, 1, 1);
    }
    return (atlases[color] = a);
  }
  function text(s, x, y, color = RED, a = 1, scale = 1) {
    const at = atlas(color);
    lo.globalAlpha = a;
    s = String(s).toUpperCase();
    for (let i = 0; i < s.length; i++) {
      const c = s.charCodeAt(i) - 32;
      if (c > 0 && c < 95) lo.drawImage(at, c * 8, 0, 8, 14, Math.round(x + i * 8 * scale), Math.round(y), 8 * scale, 14 * scale);
    }
    lo.globalAlpha = 1;
  }
  const textW = (s, scale = 1) => String(s).length * 8 * scale;
  const textC = (s, cx, y, color, a, scale = 1) => text(s, cx - textW(s, scale) / 2, y, color, a, scale);
  const textR = (s, rx, y, color, a, scale = 1) => text(s, rx - textW(s, scale), y, color, a, scale);
  function band(y, h, a = 0.72) { lo.fillStyle = "#000"; lo.globalAlpha = a; lo.fillRect(0, y, G, h); lo.globalAlpha = 1; }
  function tri(x, y, ang, size, color, a = 1) {                 // ang: 0 = up, clockwise degrees
    const r = ang * D2R, c = Math.cos(r), s = Math.sin(r);
    const P = [[0, -1], [0.75, 0.75], [0, 0.3], [-0.75, 0.75]].map(([u, v]) => [x + (u * c - v * s) * size, y + (u * s + v * c) * size]);
    lo.globalAlpha = a; lo.fillStyle = color; lo.beginPath();
    P.forEach((p, i) => (i ? lo.lineTo(p[0], p[1]) : lo.moveTo(p[0], p[1])));
    lo.closePath(); lo.fill(); lo.globalAlpha = 1;
  }
  function glow(x, y, r, rgb, a) {
    if (!(r > 0.3) || !(a > 0.004)) return;
    const g = lo.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, `rgba(${rgb},${a})`); g.addColorStop(0.35, `rgba(${rgb},${a * 0.45})`); g.addColorStop(1, `rgba(${rgb},0)`);
    lo.fillStyle = g; lo.fillRect(x - r, y - r, r * 2, r * 2);
  }
  const fmtTime = (s) => { s = Math.max(0, Math.floor(s)); const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60); return (h ? h + ":" + pad(m) : pad(m)) + ":" + pad(s % 60); };
  function fmtDist(m) {
    if (m < 10) return m.toFixed(1) + " M";
    if (m < 1000) return Math.round(m) + " M";
    return (m / 1000).toFixed(2) + " KM";
  }

  /* ---------------- 3D math ---------------- */
  const rx = (a) => { const c = Math.cos(a), s = Math.sin(a); return [1, 0, 0, 0, c, -s, 0, s, c]; };
  const ry = (a) => { const c = Math.cos(a), s = Math.sin(a); return [c, 0, s, 0, 1, 0, -s, 0, c]; };
  const rz = (a) => { const c = Math.cos(a), s = Math.sin(a); return [c, -s, 0, s, c, 0, 0, 0, 1]; };
  const mul = (A, B) => {
    const R = new Array(9);
    for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) R[i * 3 + j] = A[i * 3] * B[j] + A[i * 3 + 1] * B[3 + j] + A[i * 3 + 2] * B[6 + j];
    return R;
  };
  const ap = (M, v) => [M[0] * v[0] + M[1] * v[1] + M[2] * v[2], M[3] * v[0] + M[4] * v[1] + M[5] * v[2], M[6] * v[0] + M[7] * v[1] + M[8] * v[2]];
  const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
  const add3 = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const norm = (a) => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };
  const ID = [1, 0, 0, 0, 1, 0, 0, 0, 1];
  // joints: [rotation, translation]; at(parent, x, y, z, R) = a child joint at (x, y, z) in the parent, turned by R
  const xmul = (A, B) => [mul(A[0], B[0]), add3(ap(A[0], B[1]), A[1])];
  const xap = (A, v) => add3(ap(A[0], v), A[1]);
  const at = (A, x, y, z, R) => xmul(A, [R || ID, [x, y, z]]);

  // the camera: you, at the eye, turned by your head
  let cam = null;
  function setCam(me, H, P, R, F) {
    cam = { me, F, sh: Math.sin(H * D2R), ch: Math.cos(H * D2R), sp: Math.sin(P * D2R), cp: Math.cos(P * D2R), sr: Math.sin(R * D2R), cr: Math.cos(R * D2R) };
  }
  function camDir(e, n, u) {                                     // a world direction (east, north, up) in camera space
    const x = e * cam.ch - n * cam.sh, z = e * cam.sh + n * cam.ch;
    return [x, u * cam.cp - z * cam.sp, u * cam.sp + z * cam.cp];
  }
  const toCam = (e, n, u) => camDir(e - cam.me[0], n - cam.me[1], u - EYE);
  function proj(c) {                                             // camera space -> screen (head roll turns the picture)
    const ix = c[0] / c[2], iy = c[1] / c[2];
    return [CX + (ix * cam.cr - iy * cam.sr) * cam.F, CY - (ix * cam.sr + iy * cam.cr) * cam.F, c[2]];
  }

  /* ---------------- the devil: a jointed low-poly model (y up, z = the way he faces, x = his right) ---------------- */
  const QUADS = [[0, 1, 2, 3], [4, 7, 6, 5], [0, 4, 5, 1], [1, 5, 6, 2], [2, 6, 7, 3], [3, 7, 4, 0]];
  function seg(m, X, y0, y1, sx, sz, k, taper = 1, dx = 0, dz = 0) {    // a (tapered) block from y0 to y1 along the joint
    const b = m.v.length;
    for (const [yy, s] of [[y0, 1], [y1, taper]]) for (const [ux, uz] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) m.v.push(xap(X, [dx + ux * sx * 0.5 * s, yy, dz + uz * sz * 0.5 * s]));
    const c = xap(X, [dx, (y0 + y1) / 2, dz]);
    for (const q of QUADS) m.f.push({ i: [b + q[0], b + q[1], b + q[2], b + q[3]], c, k });
    return b;
  }
  function flat(m, X, pts, k) {                                    // a thin two-sided shape (wings, tail tip)
    const b = m.v.length;
    for (const p of pts) m.v.push(xap(X, p));
    for (let i = 1; i < pts.length - 1; i++) m.f.push({ i: [b, b + i, b + i + 1], c: null, k, two: true });
  }
  function buildDevil(ph, t) {
    const m = { v: [], f: [], hoof: [], eyes: [], feet: [] };
    const sw = Math.sin(ph), cw = Math.cos(ph);
    const hip = at([ID, [0, 0, 0]], 0, 1.0, 0, mul(ry(sw * 0.1), rz(sw * 0.04)));
    seg(m, hip, -0.12, 0.1, 0.38, 0.24, "skin", 1.05);
    for (const side of [1, -1]) {                                  // goat legs: thigh forward, shin back, hoof
      const s = side * sw, lift = Math.max(0, side * cw);
      const th = at(hip, side * 0.12, -0.04, 0, rx(-0.28 - s * 0.42 - lift * 0.25));
      seg(m, th, -0.46, 0, 0.12, 0.14, "skin", 1.45);
      const sh = at(th, 0, -0.46, 0, rx(0.62 + lift * 0.55));
      seg(m, sh, -0.42, 0, 0.085, 0.1, "skin", 1.3);
      const pa = at(sh, 0, -0.42, 0, rx(-0.5 - lift * 0.35));
      seg(m, pa, -0.15, 0, 0.065, 0.07, "dark", 1.1);
      const ho = at(pa, 0, -0.15, 0.01, rx(0.16 + s * 0.42 + lift * 0.05));
      const hb = seg(m, ho, -0.07, 0, 0.11, 0.15, "dark", 0.85, 0, 0.02);
      for (let k = 0; k < 4; k++) m.hoof.push(hb + k);
      m.feet.push(m.v.length); m.v.push(xap(ho, [0, -0.07, 0.02]));
    }
    const sp = at(hip, 0, 0.08, 0, mul(rx(0.14 + 0.025 * Math.sin(t * 1.7)), ry(-sw * 0.16)));   // hunched chest
    seg(m, sp, 0, 0.6, 0.34, 0.22, "skin", 1.8);
    seg(m, at(sp, 0, 0.06, 0.125, rx(0.15)), 0, 0.3, 0.2, 0.03, "dark", 1.25);                    // belly
    const nk = at(sp, 0, 0.6, 0.03, rx(-0.2 + 0.04 * Math.sin(t * 0.9)));

    }
    items.push({ label: () => "VIEW: " + VIEWS[cfg.view].name, run: () => { cfg.view = (cfg.view + 1) % VIEWS.length; saveCfg(); }, stay: true });
    items.push({ label: () => "HUD: " + cfg.hud, run: () => { cfg.hud = cycle(HUDS, cfg.hud); saveCfg(); }, stay: true });
    items.push({ label: () => "SOUND: " + (cfg.sound ? "ON" : "OFF"), run: () => { cfg.sound = !cfg.sound; saveCfg(); if (cfg.sound) { audio(); click(); if (screen === "PLAY") droneOn(); } else droneSet(0); }, stay: true });
    items.push({ label: () => "DEVIL VOICE: " + (cfg.voice ? "ON" : "OFF"), run: () => { cfg.voice = !cfg.voice; saveCfg(); if (cfg.voice) say("I hear you.", true); }, stay: true });
    if (screen === "PLAY") items.push({ label: () => "LEVEL MY HEAD AGAIN", run: () => { recentre(); flash("HEAD LEVELLED", 1.2); } });
    items.push({ label: () => "HEAD SENSOR: " + motion.axisName, run: () => { recentreH = viewHeading(); motion.nextAxis(1); }, stay: true });
    if (screen === "PLAY" || screen === "INTRO") items.push({ label: () => "GIVE UP", run: () => endRun("GIVE UP") });
    else items.push({ label: () => "CLOSE", run: () => {} });
    menu = { items, sel: 0 };
  }
  function primary() {
    if (screen === "TITLE") begin(false);
    else if (screen === "PLAY") sayWhere();
    else if (screen === "TAKEN" && (run.how !== "TAKEN" || clock - takenAt > 1.6)) begin(run.test);
  }
  function back() {
    if (screen === "TITLE") { history.back(); return; }
    if (screen === "PLAY" || screen === "INTRO") { openMenu(); return; }
    if (screen === "TAKEN" && run.how === "TAKEN" && clock - takenAt < 1.6) return;
    screen = "TITLE"; wakeOff();
  }
  document.addEventListener("keydown", (e) => {
    const k = e.key;
    if (!["Enter", "Escape", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].includes(k)) return;
    e.preventDefault();
    audio(); motion.enable();
    if (menu) {
      if (k === "ArrowUp") menu.sel = (menu.sel + menu.items.length - 1) % menu.items.length;
      else if (k === "ArrowDown") menu.sel = (menu.sel + 1) % menu.items.length;
      else if ((k === "Enter" || k === " ") && !e.repeat) { const it = menu.items[menu.sel]; if (!it.stay) menu = null; it.run(); }
      else menu = null;
      click();
      return;
    }
    if (k === "Escape") { back(); return; }
    if (k === "Enter" || k === " ") { if (!e.repeat) primary(); return; }
    if (k === "ArrowRight") { openMenu(); click(); return; }
    if (screen !== "PLAY") { if (k === "ArrowLeft" && screen !== "TITLE") back(); return; }
    if (k === "ArrowLeft") { cfg.hud = cycle(HUDS, cfg.hud); saveCfg(); flash("HUD: " + cfg.hud, 1); click(); return; }
    if (run && run.test) {                                          // TEST RUN: swipe up/down walks you 4 m
      const H = viewHeading() * D2R, s = k === "ArrowUp" ? 4 : -4;
      me = [me[0] + Math.sin(H) * s, me[1] + Math.cos(H) * s];
      flash(s > 0 ? "4 M FORWARD" : "4 M BACK", 0.8); click();
      return;
    }
    cfg.view = (cfg.view + 1) % VIEWS.length; saveCfg(); flash("VIEW: " + VIEWS[cfg.view].name, 1.2); click();
  });
  let touch = null;
  const key = (k) => document.dispatchEvent(new KeyboardEvent("keydown", { key: k, cancelable: true }));
  cv.addEventListener("touchstart", (e) => { const t = e.changedTouches[0]; touch = { x: t.clientX, y: t.clientY }; }, { passive: true });
  cv.addEventListener("touchend", (e) => {
    if (!touch) return;
    const t = e.changedTouches[0], dx = t.clientX - touch.x, dy = t.clientY - touch.y;
    touch = null; e.preventDefault();
    if (Math.hypot(dx, dy) < 20) key("Enter");
    else if (Math.abs(dx) > Math.abs(dy)) key(dx > 0 ? "ArrowRight" : "ArrowLeft");
    else key(dy < 0 ? "ArrowUp" : "ArrowDown");
  });
  cv.addEventListener("click", (e) => { if (e.detail) key("Enter"); });
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) { saveRun(); if (ac && ac.state === "running") ac.suspend().catch(() => {}); }
    else { startGps(); if (ac) ac.resume().catch(() => {}); if (screen === "PLAY" || screen === "INTRO") wakeOn(); }
  });
  window.addEventListener("pagehide", saveRun);

  /* ---------------- loop ---------------- */
  let last = performance.now();
  function frame(now) {
    requestAnimationFrame(frame);
    const ms = now - last;
    if (ms < 18) return;
    last = now;
    const real = ms / 1000, dt = Math.min(0.1, real);
    clock += dt;
    motion.update(dt);
    if (real > 1.5 && screen === "PLAY" && devil && !run.test) { pendingCatch += real; catchFixes = fixes; catchWaitUntil = clock + 5; }
    tick(dt, real > 1.5 ? 0 : real);
    draw(dt);
  }
  requestAnimationFrame(frame);
  startGps();

  window.__devil = {
    get screen() { return screen; }, get devil() { return devil; }, get me() { return me; }, get run() { return run; },
    get off() { return off; }, get offSrc() { return offSrc; }, get imu() { return imu; }, get vis() { return devilVis; },
    get heading() { return viewHeading(); }, dist: devDist, onFix, begin, cfg,
    place(dist, rel) { if (!devil) return; const b = (viewHeading() + rel) * D2R; devil.e = me[0] + Math.sin(b) * dist; devil.n = me[1] + Math.cos(b) * dist; devil.rise = 1; },
  };
})();
</script>
</body>
</html>
