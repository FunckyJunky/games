<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  /* touch-action: none opts into the Neural Band pinch-and-move stream
     (pointerdown / pointermove with movementX/Y / pointerup). */
  html, body { background: #000; touch-action: none; }
  body {
    width: 600px; height: 600px; overflow: hidden;
    user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; width: 600px; height: 600px; image-rendering: pixelated; }
</style>

<body>
<canvas id="screen"></canvas>
<script>
/* SYNTH.EXE: a synth sequencer + drum machine for Meta Ray-Ban Display, in lo-res 3D DOS style.

   Hands play it:
     Pinch                    play / stop
     Pinch + move hand        up/down = melody higher/lower, left/right = beat calmer/busier,
                              moving faster = more notes
     Neural Band wrist        (when the glasses expose it) raise/lower hand = melody, twist = beat
     Swipe up / down          mood (key, chords, tempo)
     Swipe left / right       lead sound
     Back                     exit

   It always sounds good because nothing is free: every note comes from the mood's scale,
   strong beats land on chord tones, melodies move in small steps and repeat their rhythm,
   and drum/bass patterns only change on the beat grid, between hand-picked patterns. */
(() => {
  "use strict";
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerpK = (dt, rate) => 1 - Math.exp(-dt * rate);
  const store = {
    get(k, f) { try { const v = localStorage.getItem(k); return v === null ? f : JSON.parse(v); } catch { return f; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };

  /* ============================== MUSIC ============================== */
  const SCALES = { minor: [0, 2, 3, 5, 7, 8, 10], major: [0, 2, 4, 5, 7, 9, 11], dorian: [0, 2, 3, 5, 7, 9, 10] };
  const PENTA = { minor: [0, 2, 3, 4, 6], major: [0, 1, 2, 4, 5], dorian: [0, 2, 3, 4, 6] };   // scale-degree indices
  const MOODS = [
    { name: "NIGHT DRIVE", bpm: 104, key: 57, scale: "minor",  prog: [0, 5, 2, 6], lead: 0, swing: 0 },    // Am F C G
    { name: "8-BIT QUEST", bpm: 124, key: 60, scale: "major",  prog: [0, 5, 3, 4], lead: 1, swing: 0 },    // C Am F G
    { name: "DEEP SPACE",  bpm: 90,  key: 52, scale: "dorian", prog: [0, 3, 0, 6], lead: 3, swing: 0.12 }, // Em A Em D
    { name: "DUNGEON",     bpm: 98,  key: 50, scale: "minor",  prog: [0, 5, 6, 4], lead: 2, swing: 0.08 }, // Dm Bb C Am
  ];
  const LEADS = ["SAW", "CHIP", "PLUCK", "BELL"];
  const NOTE_NAMES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];

  let moodIdx = clamp(store.get("synth.mood", 0) | 0, 0, MOODS.length - 1);
  let mood = MOODS[moodIdx];
  let leadIdx = store.get("synth.lead", mood.lead) | 0;

  const mod7 = (d) => ((d % 7) + 7) % 7;
  const degNote = (deg) => mood.key + SCALES[mood.scale][mod7(deg)] + 12 * Math.floor(deg / 7);
  const chordDegs = (bar) => { const d = mood.prog[bar % 4]; return [d, d + 2, d + 4]; };
  const mtof = (n) => 440 * Math.pow(2, (n - 69) / 12);
  function chordName(bar) {
    const [a, b] = chordDegs(bar);
    const root = degNote(a), third = degNote(b);
    return NOTE_NAMES[root % 12] + ((third - root + 12) % 12 === 3 ? " MIN" : " MAJ");
  }

  // drum patterns by energy level (16 steps)
  const ALL16 = [...Array(16).keys()];
  const EIGHTHS = [0, 2, 4, 6, 8, 10, 12, 14];
  const DRUMS = [
    { k: [0],                s: [],       h: [0, 4, 8, 12], o: [],              c: [], g: [] },
    { k: [0, 8],             s: [4, 12],  h: EIGHTHS,       o: [],              c: [], g: [] },
    { k: [0, 8, 10],         s: [4, 12],  h: EIGHTHS,       o: [14],            c: [], g: [7, 15] },
    { k: [0, 3, 8, 10],      s: [4, 12],  h: ALL16,         o: [6, 14],         c: [12], g: [14] },
    { k: [0, 4, 8, 12, 14],  s: [4, 12],  h: ALL16,         o: [2, 6, 10, 14],  c: [4, 12], g: [] },
  ];
  // bass patterns by energy level: [step, tone, length in steps]; r = root, f = fifth, o = octave
  const BASS = [
    [[0, "r", 15]],
    [[0, "r", 6], [8, "r", 6]],
    [[0, "r", 2], [2, "r", 2], [4, "r", 2], [6, "o", 2], [8, "r", 2], [10, "r", 2], [12, "f", 2], [14, "o", 2]],
    [[0, "r", 3], [3, "r", 2], [6, "f", 2], [8, "r", 3], [11, "r", 2], [14, "o", 2]],
    [[0, "r", 2], [2, "o", 1], [4, "r", 2], [6, "o", 1], [8, "r", 2], [10, "o", 1], [12, "f", 2], [14, "o", 1]],
  ];
  const RHYTHM_W = [1, 0.15, 0.45, 0.2, 0.8, 0.15, 0.5, 0.3, 0.9, 0.15, 0.45, 0.2, 0.75, 0.3, 0.55, 0.35];

  /* ============================== CONTROLS ============================== */
  // pitch: -1 low .. +1 high melody;  beat: 0 calm .. 1 busy;  motion: 0 still .. 1 lively
  const ctl = { pitch: 0, beat: 0.45, motion: 0.3 };
  const target = { pitch: 0, beat: 0.45 };
  let dragMotion = 0, wristMotion = 0, lastInputAt = -1e9, auto = true;

  /* ============================== AUDIO ============================== */
  let ac = null, master, drumBus, leadFilter, leadOut, padFilter, delaySend, noiseBuf;

  function buildGraph(ctx) {
    ac = ctx;
    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -16; comp.knee.value = 10; comp.ratio.value = 4;
    comp.attack.value = 0.004; comp.release.value = 0.18;
    master = ac.createGain(); master.gain.value = 0.76;
    master.connect(comp); comp.connect(ac.destination);

    drumBus = ac.createGain(); drumBus.gain.value = 0.9; drumBus.connect(master);

    // echo: dotted-eighth feedback delay, darkened
    const delay = ac.createDelay(1.5), fb = ac.createGain(), dl = ac.createBiquadFilter();
    dl.type = "lowpass"; dl.frequency.value = 2400; fb.gain.value = 0.33;
    delay.connect(dl); dl.connect(fb); fb.connect(delay); dl.connect(master);
    delaySend = ac.createGain(); delaySend.gain.value = 0.26; delaySend.connect(delay);
    setDelayTime(delay);
    buildGraph.delay = delay;

    leadFilter = ac.createBiquadFilter(); leadFilter.type = "lowpass"; leadFilter.frequency.value = 2400; leadFilter.Q.value = 2;
    leadOut = ac.createGain(); leadOut.gain.value = 0.9;
    leadFilter.connect(leadOut); leadOut.connect(master); leadOut.connect(delaySend);

    padFilter = ac.createBiquadFilter(); padFilter.type = "lowpass"; padFilter.frequency.value = 1200;
    padFilter.connect(master); padFilter.connect(delaySend);

    noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  function setDelayTime(delay) {
    const t = (60 / mood.bpm) * 0.75;
    if (delay) delay.delayTime.setValueAtTime(t, ac.currentTime);
  }

  function ensureAudio() {           // must run inside a pinch / key / tap handler
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      buildGraph(new AC());
    }
    if (ac.state === "suspended" && ac.resume) ac.resume();
    return true;
  }

  // ---- instruments ----
  function env(g, t, peak, a, d, sus, rel, end) {
    end = Math.max(end, t + a + 0.01);
    const s = Math.max(0.0002, peak * sus);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + a);
    if (t + a + d < end) {
      g.gain.exponentialRampToValueAtTime(s, t + a + d);
      g.gain.setValueAtTime(s, end);
    } else {                                   // note ends during the decay
      g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak * Math.pow(sus, (end - t - a) / d)), end);
    }
    g.gain.exponentialRampToValueAtTime(0.0001, end + rel);
  }
  function osc(type, freq, t, stop, dest, detune = 0) {
    const o = ac.createOscillator();
    o.type = type; o.frequency.setValueAtTime(freq, t); o.detune.value = detune;
    o.connect(dest); o.start(t); o.stop(stop);
    return o;
  }
  function noise(t, dur, type, freq, q, v) {
    const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = noiseBuf; s.loop = true; f.type = type; f.frequency.value = freq; f.Q.value = q;
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(drumBus);
    s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
  }
  function kick(t, v) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.frequency.setValueAtTime(160, t); o.frequency.exponentialRampToValueAtTime(44, t + 0.11);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.42);
    o.connect(g); g.connect(drumBus); o.start(t); o.stop(t + 0.45);
  }
  function snare(t, v) {
    noise(t, 0.2, "bandpass", 1900, 0.8, 0.55 * v);
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = "triangle"; o.frequency.setValueAtTime(200, t); o.frequency.exponentialRampToValueAtTime(140, t + 0.08);
    g.gain.setValueAtTime(0.35 * v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
    o.connect(g); g.connect(drumBus); o.start(t); o.stop(t + 0.14);
  }
  const hat = (t, v) => noise(t, 0.045, "highpass", 7800, 0.7, 0.22 * v);
  const openHat = (t, v) => noise(t, 0.28, "highpass", 7000, 0.7, 0.16 * v);
  function clap(t, v) {
    for (let i = 0; i < 3; i++) noise(t + i * 0.011, 0.03, "bandpass", 1300, 1.2, 0.35 * v);
    noise(t + 0.033, 0.16, "bandpass", 1300, 1.0, 0.3 * v);
  }
  const crash = (t) => noise(t, 1.3, "highpass", 5200, 0.5, 0.2);

  function bass(t, note, dur) {
    const end = t + dur, g = ac.createGain(), f = ac.createBiquadFilter();
    f.type = "lowpass"; f.Q.value = 6;
    const cut = 260 + 1300 * ctl.beat;
    f.frequency.setValueAtTime(cut * 2.4, t); f.frequency.exponentialRampToValueAtTime(cut, t + 0.12);
    env(g, t, 0.34, 0.005, 0.12, 0.7, 0.08, end);
    f.connect(g); g.connect(master);
    osc("sawtooth", mtof(note), t, end + 0.12, f);
    osc("sine", mtof(note - 12), t, end + 0.12, g);
  }
  function pad(t, notes, dur) {
    for (const n of notes) {
      const g = ac.createGain();
      env(g, t, 0.045, 0.3, 0.4, 0.8, 0.6, t + dur);
      g.connect(padFilter);
      osc("triangle", mtof(n), t, t + dur + 0.7, g, -4);
      osc("triangle", mtof(n), t, t + dur + 0.7, g, 4);
    }
  }
  function lead(t, note, dur) {
    const f = mtof(note), end = t + dur, g = ac.createGain();
    g.connect(leadFilter);
    if (leadIdx === 0) {            // SAW: two detuned saws
      env(g, t, 0.16, 0.012, 0.25, 0.55, 0.14, end);
      osc("sawtooth", f, t, end + 0.2, g, -9); osc("sawtooth", f, t, end + 0.2, g, 9);
    } else if (leadIdx === 1) {     // CHIP: square, short and bright
      env(g, t, 0.11, 0.002, 0.05, 0.8, 0.03, Math.min(end, t + 0.22));
      osc("square", f, t, t + 0.3, g);
    } else if (leadIdx === 2) {     // PLUCK: own filter sweep, no sustain
      const pf = ac.createBiquadFilter();
      pf.type = "lowpass"; pf.Q.value = 4;
      pf.frequency.setValueAtTime(4200, t); pf.frequency.exponentialRampToValueAtTime(320, t + 0.35);
      pf.connect(g);
      env(g, t, 0.22, 0.003, 0.4, 0.05, 0.2, t + 0.45);
      osc("sawtooth", f, t, t + 0.7, pf); osc("triangle", f * 2, t, t + 0.7, pf);
    } else {                         // BELL: 2-op FM
      const mod = ac.createOscillator(), mg = ac.createGain();
      mod.frequency.setValueAtTime(f * 3.5, t);
      mg.gain.setValueAtTime(f * 2.2, t); mg.gain.exponentialRampToValueAtTime(f * 0.05, t + 0.9);
      mod.connect(mg);
      const c = osc("sine", f, t, t + 1.4, g);
      mg.connect(c.frequency); mod.start(t); mod.stop(t + 1.4);
      env(g, t, 0.2, 0.004, 1.1, 0.01, 0.2, t + 1.1);
    }
  }

  /* ============================== SEQUENCER ============================== */
  let playing = false, step = 0, nextTime = 0, timer = 0, level = 1;
  let motif = makeMotif(0.6), motifDensity = 0.6, melDeg = 9, lastBar = -1;
  const DEG_LO = 3, DEG_HI = 19;                 // melody range in scale degrees above the key
  const events = [];             // what to animate, and when
  const stepDur = () => 60 / mood.bpm / 4;

  function makeMotif(density) {
    let m;
    do { m = RHYTHM_W.map((w) => Math.random() < clamp(w * density, 0.04, 0.95)); }
    while (m.filter(Boolean).length < 2);
    return m;
  }
  function mutateMotif(n) {
    for (let i = 0; i < n; i++) {
      const s = Math.floor(Math.random() * 16);
      motif[s] = Math.random() < RHYTHM_W[s] * (0.4 + ctl.motion);
    }
  }
  const melodyTarget = () => 5 + Math.round(((ctl.pitch + 1) / 2) * 12);   // scale degrees 5..17

  function nextMelodyDeg(strong, chord) {
    const pent = PENTA[mood.scale], T = melodyTarget(), chordI = chord.map(mod7);
    const cands = [];
    for (let d = melDeg - 4; d <= melDeg + 4; d++) {
      if (d < DEG_LO || d > DEG_HI) continue;
      const di = mod7(d), isChord = chordI.includes(di), isPent = pent.includes(di);
      if (strong ? !isChord : !(isPent || isChord)) continue;     // strong beats: chord tones only
      const w = Math.exp(-Math.abs(d - T) * 0.55                    // drift toward the hand
                         - Math.abs(d - melDeg) * (0.55 - ctl.motion * 0.3)   // small steps
                         - (d === melDeg ? 0.7 : 0)                 // don't drone
                         + Math.random() * 1.1);
      cands.push([d, w]);
    }
    if (!cands.length) return melDeg;
    let r = Math.random() * cands.reduce((a, c) => a + c[1], 0);
    for (const [d, w] of cands) { r -= w; if (r <= 0) return d; }
    return cands[cands.length - 1][0];
  }

  function scheduleStep(s, t) {
    const sb = s % 16, bar = Math.floor(s / 16), sd = stepDur();
    const chord = chordDegs(bar);

    if (sb === 0 || sb === 8) {
      // pattern changes only on the half bar, so the groove never stumbles
      const want = clamp(Math.floor(ctl.beat * 5), 0, 4);
      if (want !== level && Math.abs(ctl.beat * 5 - (level + 0.5)) > 0.75) level = want;
    }
    if (sb === 0 && bar !== lastBar) {
      lastBar = bar;
      const density = 0.3 + ctl.motion * 1.0;
      if (bar % 2 === 0 || Math.abs(density - motifDensity) > 0.3) { motif = makeMotif(density); motifDensity = density; }
      else if (ctl.motion > 0.5) mutateMotif(2);
      const padNotes = chord.map((d) => { let n = degNote(d); while (n > 64) n -= 12; while (n < 52) n += 12; return n; });
      pad(t, padNotes, sd * 16);
      if (level >= 3 && bar % 4 === 0) crash(t);
      events.push({ t, kind: "bar", bar });
    }

    // drums
    const P = DRUMS[level];
    const accent = sb % 4 === 0 ? 1 : 0.75;
    if (P.k.includes(sb)) { kick(t, 0.95); events.push({ t, kind: "kick" }); }
    if (P.s.includes(sb)) { snare(t, 1); events.push({ t, kind: "snare" }); }
    if (P.c.includes(sb)) clap(t, 0.8);
    if (P.g.includes(sb)) snare(t, 0.25);
    if (P.o.includes(sb)) openHat(t, 1);
    else if (P.h.includes(sb)) { hat(t, sb % 2 === 0 ? accent : 0.45); events.push({ t, kind: "hat" }); }
    if (level >= 3 && bar % 4 === 3 && sb >= 13) snare(t, 0.35 + (sb - 12) * 0.2);    // fill into the next phrase

    // bass
    for (const [bs, tone, len] of BASS[level]) {
      if (bs !== sb) continue;
      let n = degNote(tone === "f" ? chord[2] : chord[0]);
      while (n > 52) n -= 12;
      if (tone === "o") n += 12;
      bass(t, n, len * sd * 0.92);
      events.push({ t, kind: "bass" });
    }

    // melody
    let hit = motif[sb];
    if (bar % 4 === 3 && sb >= 12 && Math.random() < 0.6) hit = false;     // let phrases breathe
    if (hit) {
      melDeg = nextMelodyDeg(sb % 4 === 0, chord);
      let len = 1;
      while (len < 4 && !motif[(sb + len) % 16]) len++;
      const note = degNote(melDeg);
      lead(t, note, len * sd * (leadIdx === 1 ? 0.6 : 0.9));
      events.push({ t, kind: "note", deg: melDeg, note });
    }
    events.push({ t, kind: "step", sb });
  }

  function scheduler() {
    const sd = stepDur();
    while (nextTime < ac.currentTime + 0.12) {
      const swing = step % 2 === 1 ? mood.swing * sd : 0;
      scheduleStep(step, nextTime + swing);
      nextTime += sd;
      step++;
    }
  }
  function startPlay() {
    if (!ensureAudio()) return;
    playing = true;
    step = 0; lastBar = -1;
    nextTime = ac.currentTime + 0.06;
    clearInterval(timer);
    timer = setInterval(scheduler, 25);
    scheduler();
    wristRecenter();
  }
  function stopPlay() {
    playing = false;
    clearInterval(timer);
    events.length = 0;
  }
  const togglePlay = () => (playing ? stopPlay() : startPlay());

  /* ============================== WRIST (Meta Neural Band) ==============================
     RelativeOrientationSensor({ sensorId: 'emg-wrist' }) on the glasses. Detect it with the
     runtime marker RelativeOrientationSensor.__imuQuatWrapped (desktop Chrome has its own
     constructor that would read the computer instead). Readings arrive w-first [w, x, y, z]. */
  const wrist = { status: "...", available: false, sensor: null, q0: null, prev: null, prevT: 0,
                  startT: 0, anchor: null, stableSince: 0, rx: 0, ry: 0, speed: 0, retries: 0, lastAt: 0 };
  const hasWrist = () => typeof window.RelativeOrientationSensor === "function" &&
                         window.RelativeOrientationSensor.__imuQuatWrapped === true;
  (async () => {
    const until = performance.now() + 5000;
    while (performance.now() < until && !hasWrist()) await new Promise((r) => setTimeout(r, 250));
    wrist.available = hasWrist();
    wrist.status = wrist.available ? "READY" : "N/A";
  })();

  const qmul = (a, b) => [
    a[3] * b[0] + a[0] * b[3] + a[1] * b[2] - a[2] * b[1],
    a[3] * b[1] - a[0] * b[2] + a[1] * b[3] + a[2] * b[0],
    a[3] * b[2] + a[0] * b[1] - a[1] * b[0] + a[2] * b[3],
    a[3] * b[3] - a[0] * b[0] - a[1] * b[1] - a[2] * b[2],
  ];
  const qconj = (q) => [-q[0], -q[1], -q[2], q[3]];
  const qangle = (a, b) => 2 * Math.acos(clamp(Math.abs(a[0] * b[0] + a[1] * b[1] + a[2] * b[2] + a[3] * b[3]), 0, 1)) * 180 / Math.PI;
  function toW3C(raw) {
    if (!raw || raw.length < 4) return null;
    let q = [raw[1], raw[2], raw[3], raw[0]];
    if (!q.every(Number.isFinite)) return null;
    const len = Math.hypot(...q);
    if (len < 1e-6) return null;
    q = q.map((v) => v / len);
    return q[3] < 0 ? q.map((v) => -v) : q;
  }
  function wristRecenter() { wrist.q0 = null; wrist.anchor = null; wrist.rx = wrist.ry = 0; wrist.startT = performance.now(); if (wrist.sensor) wrist.status = "HOLD"; }
  function wristReading(raw, ts) {
    const t = Number.isFinite(ts) && ts > 0 ? ts : performance.now(), q = toW3C(raw);
    if (!q) return;
    wrist.lastAt = performance.now();
    if (wrist.prev) {
      const ang = qangle(wrist.prev, q), dt = Math.max(1, t - wrist.prevT) / 1000;
      // the frame can flip early in a stream while the band learns which wrist it is on
      if (performance.now() - wrist.sensorAt < 6000 && ang > 35 && ang / dt > 1500) wristRecenter();
      else wrist.speed += (ang / dt - wrist.speed) * 0.3;
    }
    wrist.prev = q; wrist.prevT = t;
    if (!wrist.q0) {                                                       // settle: 1 s warm-up, then 0.8 s steady

    "8": "75757", "9": "75717", A: "25755", B: "65656", C: "34443", D: "65556", E: "74647", F: "74644", G: "34553",
    H: "55755", I: "72227", J: "11152", K: "55655", L: "44447", M: "57755", N: "65555", O: "25552", P: "65644",
    Q: "25563", R: "65655", S: "34216", T: "72222", U: "55557", V: "55522", W: "55775", X: "55255", Y: "55222",
    Z: "71247", " ": "00000", "-": "00700", "+": "02720", ".": "00002", ":": "02020", "/": "11244", "%": "51245",
    "<": "12421", ">": "42124", "[": "64446", "]": "31113", "#": "57575", "=": "07070", "_": "00007", "!": "22202",

      const sd = stepDur();
      let t = 0.05, s = 0;
      while (t < seconds - 1) {
        if (script) script(s, ctl);
        const before = events.length;
        scheduleStep(s, t + (s % 2 ? mood.swing * sd : 0));
        for (const e of events.slice(before)) if (e.kind === "note") notes.push([e.note, s % 16, Math.floor(s / 16)]);
        events.length = before;
        if (s % 16 === 0) levels.push(level);
        t += sd; s++;
      }
      const buf = await oc.startRendering();
      ac = saved; if (saved) buildGraph(saved);
      const ch = [buf.getChannelData(0), buf.getChannelData(1)];
      let peak = 0, sum = 0, nan = 0;
      for (const c of ch) for (let i = 0; i < c.length; i++) { const v = c[i]; if (!Number.isFinite(v)) nan++; else { peak = Math.max(peak, Math.abs(v)); sum += v * v; } }
      const out = { peak, rms: Math.sqrt(sum / (ch[0].length * 2)), nan, notes, levels, steps: s };
      if (withData) {                                                 // 16-bit PCM, base64, for a WAV preview
        const L = ch[0], Rr = ch[1], pcm = new Int16Array(L.length * 2);
        for (let i = 0; i < L.length; i++) { pcm[2 * i] = clamp(L[i], -1, 1) * 32767; pcm[2 * i + 1] = clamp(Rr[i], -1, 1) * 32767; }
        let bin = ""; const bytes = new Uint8Array(pcm.buffer);
        for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
        out.pcm = btoa(bin); out.sr = sr;
      }
      return out;
    },
  };
})();
</script>
