<script>
/* ===== Shared: dot-matrix display, 3x5 pixel font, head-motion sensors ===== */
const DM = (() => {
  "use strict";
  const G = 120;                 // the display is G x G dots
  const CX = 60, CY = 60;
  const PITCH = 600 / G;         // 5 px per dot on the 600 x 600 lens
  const D2R = Math.PI / 180;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const wrap360 = (a) => ((a % 360) + 360) % 360;
  const angDiff = (a, b) => ((((a - b) % 360) + 540) % 360) - 180;

  const THEMES = [
    { name: "GREEN", c: "#36ff6b" },
    { name: "RED",   c: "#ff2b2b" },
    { name: "AMBER", c: "#ffae1a" },
  ];

  const store = {
    get(k, f) { try { const v = localStorage.getItem(k); return v === null ? f : JSON.parse(v); } catch { return f; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };

  /* 3x5 font: five rows, each a digit 0-7 whose bits are the three columns (left = 4). */
  const FONT = {
    "0": "75557", "1": "26227", "2": "71747", "3": "71317", "4": "55711",
    "5": "74717", "6": "74757", "7": "71122", "8": "75757", "9": "75717",
    A: "25755", B: "65656", C: "34443", D: "65556", E: "74647", F: "74644", G: "34553",
    H: "55755", I: "72227", J: "11152", K: "55655", L: "44447", M: "57755", N: "65555",
    O: "25552", P: "65644", Q: "25563", R: "65655", S: "34216", T: "72222", U: "55557",
    V: "55522", W: "55775", X: "55255", Y: "55222", Z: "71247",
    " ": "00000", "-": "00700", "+": "02720", ".": "00002", ":": "02020", "/": "11244",
    "%": "51245", "<": "12421", ">": "42124", "[": "64446", "]": "31113", "#": "57575",
    "=": "07070", "_": "00007", "!": "22202", "?": "71202", "*": "05250", "^": "25000", "'": "22000",
  };

  /* ---------- display: draw on a tiny canvas, show it as glowing dots ---------- */
  function createDisplay(canvas) {
    const K = Math.min(3, Math.max(1, Math.round(window.devicePixelRatio || 1)));
    const W = 600 * K;
    canvas.width = canvas.height = W;
    const ctx = canvas.getContext("2d");
    const loC = document.createElement("canvas");
    loC.width = loC.height = G;
    const lo = loC.getContext("2d");

    // one soft round LED, repeated across the screen
    const T = PITCH * K;
    const tile = document.createElement("canvas");
    tile.width = tile.height = T;
    const tg = tile.getContext("2d");
    const grad = tg.createRadialGradient(T / 2, T / 2, 0, T / 2, T / 2, T / 2);
    grad.addColorStop(0, "rgba(0,0,0,1)");
    grad.addColorStop(0.55, "rgba(0,0,0,1)");
    grad.addColorStop(0.85, "rgba(0,0,0,.35)");
    grad.addColorStop(1, "rgba(0,0,0,0)");
    tg.fillStyle = grad;
    tg.fillRect(0, 0, T, T);
    const mask = ctx.createPattern(tile, "repeat");

    function begin(color, dim = 0.07) {
      lo.setTransform(1, 0, 0, 1, 0, 0);
      lo.globalAlpha = 1;
      lo.setLineDash([]);
      lo.clearRect(0, 0, G, G);
      lo.fillStyle = color;
      lo.strokeStyle = color;
      lo.lineWidth = 1;
      if (dim > 0) { lo.globalAlpha = dim; lo.fillRect(0, 0, G, G); lo.globalAlpha = 1; }   // unlit LEDs
    }

    function present(bloom = 0.14) {
      ctx.globalCompositeOperation = "source-over";
      ctx.globalAlpha = 1;
      ctx.clearRect(0, 0, W, W);                       // transparent = see-through on the lens
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(loC, 0, 0, W, W);
      ctx.globalCompositeOperation = "destination-in"; // keep only the round dots
      ctx.fillStyle = mask;
      ctx.fillRect(0, 0, W, W);
      if (bloom > 0) {                                 // soft glow around lit dots
        ctx.globalCompositeOperation = "lighter";
        ctx.globalAlpha = bloom;
        ctx.imageSmoothingEnabled = true;
        ctx.drawImage(loC, 0, 0, W, W);
      }
      ctx.globalCompositeOperation = "source-over";
      ctx.globalAlpha = 1;
    }

    const tw = (s) => Math.max(0, String(s).length * 4 - 1);
    function text(str, x, y, a = 1) {
      const prev = lo.globalAlpha;
      lo.globalAlpha = a;
      x = Math.round(x); y = Math.round(y);
      for (const ch of String(str).toUpperCase()) {
        const g = FONT[ch];
        if (g) for (let r = 0; r < 5; r++) {
          const bits = g.charCodeAt(r) - 48;
          for (let c = 0; c < 3; c++) if (bits & (4 >> c)) lo.fillRect(x + c, y + r, 1, 1);
        }
        x += 4;
      }
      lo.globalAlpha = prev;
    }
    const textC = (s, cx, y, a) => text(s, Math.round(cx - tw(s) / 2), y, a);
    const textR = (s, rx, y, a) => text(s, rx - tw(s) + 1, y, a);

    return { lo, begin, present, text, textC, textR, tw };
  }

  /* ---------- head motion: DeviceOrientationEvent -> heading / pitch / roll ----------
     The glasses' sensor frame isn't documented, so three mappings are offered
     (swipe up/down in the apps). "A" treats the display like a phone held up
     in front of your eyes. The choice is shared by all the glasses apps. */
  function createMotion(onLive) {
    const AXES = [
      { name: "A", f: [0, 0, -1], u: [0, 1, 0] },
      { name: "B", f: [0, 1, 0],  u: [0, 0, 1] },
      { name: "C", f: [0, 0, 1],  u: [0, 1, 0] },
    ];
    let axis = (store.get("glasses.axis", 0) | 0) % AXES.length;
    let live = false, raw = null, needZero = true, zp = 0, zr = 0, zh = 0, listening = false;
    const att = { h: 0, p: 0, r: 0 };
    const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];

    function attitude(al, be, ga) {
      const cA = Math.cos(al * D2R), sA = Math.sin(al * D2R);
      const cB = Math.cos(be * D2R), sB = Math.sin(be * D2R);
      const cG = Math.cos(ga * D2R), sG = Math.sin(ga * D2R);
      const R = [                                   // W3C: R = Rz(alpha) Rx(beta) Ry(gamma)
        [cA * cG - sA * sB * sG, -sA * cB, cA * sG + sA * sB * cG],
        [sA * cG + cA * sB * sG,  cA * cB, sA * sG - cA * sB * cG],
        [-cB * sG,                sB,      cB * cG],
      ];
      const mul = (v) => R.map((row) => row[0] * v[0] + row[1] * v[1] + row[2] * v[2]);
      const ax = AXES[axis];
      const f = mul(ax.f), u = mul(ax.u), r = mul(cross(ax.f, ax.u));   // world: x east, y north, z up
      return {
        heading: wrap360(Math.atan2(f[0], f[1]) / D2R),
        pitch: Math.asin(clamp(f[2], -1, 1)) / D2R,   // + = looking up
        roll: Math.atan2(-r[2], u[2]) / D2R,          // + = head tilted right
      };
    }

    function onOrient(e) {
      if (e.alpha == null && e.beta == null && e.gamma == null) return;
      raw = [e.alpha || 0, e.beta || 0, e.gamma || 0];
      if (!live) { live = true; if (onLive) onLive(); }
    }
    function listen() {
      if (listening) return;
      listening = true;
      window.addEventListener("deviceorientation", onOrient);
    }
    async function enable() {   // call from a pinch / tap
      try {
        if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") {
          const res = await DeviceOrientationEvent.requestPermission();
          if (res !== "granted") return "denied";
        }
      } catch (err) { return "error"; }
      listen();
      return "ok";
    }
    listen();   // works right away where no permission is needed

    function update(dt) {
      if (!live || !raw) return false;
      const a = attitude(raw[0], raw[1], raw[2]);
      if (needZero) {   // "level" = how you hold your head right now
        zp = a.pitch; zr = a.roll; zh = a.heading;
        att.h = a.heading; att.p = a.pitch; att.r = a.roll;
        needZero = false;
      }
      const k = 1 - Math.exp(-dt * 12);
      att.h = wrap360(att.h + angDiff(a.heading, att.h) * k);
      att.p += (a.pitch - att.p) * k;
      att.r = angDiff(att.r + angDiff(a.roll, att.r) * k, 0);
      return true;
    }

    return {
      get live() { return live; },
      get axisName() { return AXES[axis].name; },
      get heading() { return att.h; },
      get yaw() { return angDiff(att.h, zh); },     // look left (-) / right (+) since the last zero
      get pitch() { return att.p - zp; },
      get roll() { return angDiff(att.r, zr); },
      enable, update, attitude,
      zero() { needZero = true; },
      nextAxis(d) {
        axis = (axis + d + AXES.length) % AXES.length;
        store.set("glasses.axis", axis);
        needZero = true;
        return AXES[axis].name;
      },
    };
  }

  /* ---------- 30 fps loop ---------- */
  function loop(fn) {
    let last = performance.now();
    function frame(now) {
      requestAnimationFrame(frame);
      const ms = now - last;
      if (ms < 30) return;
      last = now;
      fn(Math.min(0.1, ms / 1000), now / 1000);
    }
    requestAnimationFrame(frame);
  }

  return { G, CX, CY, D2R, clamp, wrap360, angDiff, THEMES, store, FONT, createDisplay, createMotion, loop };
})();
</script>
<script>
/* YARO-VISSION (glasses): someone on the CON page (error.blue/glasses/con) watches what you
   see and steers you like a game character. This screen shows their orders, and says them.

     Pinch               start; then DONE (tells CON you did it)
     Swipe up            voice on / off
     Swipe left / right  colour
     Swipe down twice    new link code
     Back                exit

   Orders: moves (forward, back, turn left/right, and forward/back while turning) last as long
   as CON holds the button; a move that isn't refreshed for 2.5 s stops by itself.
   Actions (take, jump, hug, dance) stay on screen until you pinch DONE. */
(() => {
  "use strict";
  const { G, clamp, THEMES, store, FONT } = DM;
  const disp = DM.createDisplay(document.getElementById("screen"));
  const { lo, begin, present, text, textC, textR } = disp;
  const PI = Math.PI;

  /* ---------- big text: every font pixel becomes k x k dots ---------- */
  const twS = (s, k) => Math.max(0, String(s).length * 4 * k - k);
  function textS(str, x, y, k, a = 1) {
    const prev = lo.globalAlpha;
    lo.globalAlpha = a;
    x = Math.round(x); y = Math.round(y);
    for (const ch of String(str).toUpperCase()) {
      const g = FONT[ch];
      if (g) for (let r = 0; r < 5; r++) {
        const bits = g.charCodeAt(r) - 48;
        for (let c = 0; c < 3; c++) if (bits & (4 >> c)) lo.fillRect(x + c * k, y + r * k, k, k);
      }
      x += 4 * k;
    }
    lo.globalAlpha = prev;
  }
  const textSC = (s, cx, y, k, a) => textS(s, Math.round(cx - twS(s, k) / 2), y, k, a);

  /* ---------- state ---------- */
  let theme = (store.get("glasses.theme", 0) | 0) % THEMES.length;
  let code = YaroLink.cleanCode(store.get("yaro.code", ""));
  if (code.length < 4) { code = YaroLink.newCode(); store.set("yaro.code", code); }
  let voice = store.get("yaro.voice", true) !== false;

  let started = false, clock = 0, flashMsg = "", flashUntil = 0, borderAt = -9;
  let link = null, netState = "connecting", conCount = 0, phoneCam = false;
  let myStream = null, camState = "off";          // off | asking | on | none
  let mv = { f: 0, r: 0, at: -99 };               // current move
  let act = null;                                  // current action { a, id, at }
  let stopAt = -99, stopHard = false, doneAt = -99, doneLabel = "", newCodeAt = -99, lostAt = -99;
  let bat = null, chg = false, telT = 0, lastSay = -9, lastSayText = "";
  const motion = DM.createMotion();
  const flash = (m, d = 1.6) => { flashMsg = m; flashUntil = clock + d; };

  const ACTS = {
    take:  { label: "TAKE",  say: "Take it" },
    jump:  { label: "JUMP",  say: "Jump" },
    hug:   { label: "HUG",   say: "Hug" },
    dance: { label: "DANCE", say: "Dance" },
  };
  function moveLabel(f, r) {
    if (!f) return { main: r < 0 ? "TURN LEFT" : "TURN RIGHT", sub: "", say: r < 0 ? "Turn left" : "Turn right" };
    const main = f > 0 ? "FORWARD" : "BACK";
    const side = r < 0 ? "LEFT" : r > 0 ? "RIGHT" : "";
    return { main, sub: side ? "+ " + side : "", say: (f > 0 ? "Forward" : "Back") + (side ? " " + side.toLowerCase() : "") };
  }

  /* ---------- sound and voice ---------- */
  let ac = null;
  function ensureAudio() {
    try {
      if (!ac) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) ac = new AC(); }
      if (ac && ac.state === "suspended") ac.resume().catch(() => {});
    } catch (e) { ac = null; }
  }
  function beep(freq, dur = 0.07, vol = 0.12) {
    if (!ac) return;
    try {
      const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
      o.type = "square"; o.frequency.value = freq;
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + dur + 0.02);
    } catch (e) {}
  }
  function say(words, force) {
    if (!voice || !window.speechSynthesis || !window.SpeechSynthesisUtterance) return;
    if (!force && (clock - lastSay < 0.5 || words === lastSayText && clock - lastSay < 2)) return;
    lastSay = clock; lastSayText = words;
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(words);
      u.rate = 1.1; u.lang = "en-US";
      speechSynthesis.speak(u);
    } catch (e) {}
  }
  function announce(words, important) {
    borderAt = clock;
    beep(important ? 990 : 740, important ? 0.09 : 0.05);
    say(words, important);
  }

  /* ---------- link ---------- */
  function connect() {
    if (link) link.close();
    conCount = 0; phoneCam = false; netState = "connecting";
    link = YaroLink.join(code, "glasses", {
      onStatus(s) { netState = s; },
      onPeers(peers) {
        const all = [...peers.values()];
        const c = all.filter((p) => p.role === "con").length;
        if (c > conCount && started) { beep(1180, 0.06); flash("CON LINKED"); }
        if (!c && conCount && (mv.f || mv.r)) { mv = { f: 0, r: 0, at: clock }; stopAt = clock; stopHard = false; }
        conCount = c;
        phoneCam = all.some((p) => p.role === "cam" && p.cam);
      },
      onMsg(d) {
        if (!started) return;
        if (d.t === "mv") onMove(d);
        else if (d.t === "act") onAct(d);
        else if (d.t === "stop") onStop(true);
      },
    });
    link.hi(undefined, { started, motion: motion.live });
    if (myStream) link.setStream(myStream);
  }

  function onMove(d) {
    const f = clamp(Math.round(+d.f || 0), -1, 1), r = clamp(Math.round(+d.r || 0), -1, 1);
    const was = mv;
    if (!f && !r) {
      if (was.f || was.r) { stopAt = clock; stopHard = false; announce("Stop", false); }
      mv = { f: 0, r: 0, at: clock };
      return;
    }
    mv = { f, r, at: clock };
    if (act) act = null;
    if (f !== was.f || r !== was.r) announce(moveLabel(f, r).say, !was.f && !was.r);
  }
  function onStop(hard) {
    mv = { f: 0, r: 0, at: clock };
    act = null;
    stopAt = clock; stopHard = hard;
    announce("Stop", true);
    if (hard) setTimeout(() => beep(660, 0.12), 120);
  }
  function onAct(d) {
    if (!ACTS[d.a]) return;
    mv = { f: 0, r: 0, at: clock };
    act = { a: d.a, id: d.id, at: clock };
    announce(ACTS[d.a].say, true);
    link.send({ t: "got", id: d.id, a: d.a });
  }
  function done() {
    if (act) {
      link.send({ t: "done", id: act.id, a: act.a });
      doneLabel = ACTS[act.a].label + " DONE";
      act = null;
    } else {
      link.send({ t: "done", id: null });
      doneLabel = "OK";
    }
    doneAt = clock;
    beep(1320, 0.05); setTimeout(() => beep(1760, 0.07), 70);
  }

  /* ---------- start: pinch (sound, voice, sensors and the camera need a gesture) ---------- */
  async function start() {
    started = true;
    ensureAudio();
    beep(880, 0.06);
    link.hi(undefined, { started: true });
    say("Yaro vission ready", true);
    motion.enable().then(() => { motion.zero(); setTimeout(() => link.hi(undefined, { motion: motion.live }), 1500); });
    try {
      if (navigator.getBattery) {
        const b = await navigator.getBattery();
        const upd = () => { bat = Math.round(b.level * 100); chg = !!b.charging; };
        upd(); b.addEventListener("levelchange", upd); b.addEventListener("chargingchange", upd);
      }
    } catch (e) {}
    tryCamera();
  }
  async function tryCamera() {
    if (myStream) return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { camState = "none"; return; }
    camState = "asking";
    try {
      const s = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 30 } },
        audio: false,
      });
      myStream = s; camState = "on";
      link.setStream(s);
      const tr = s.getVideoTracks()[0];
      if (tr) tr.addEventListener("ended", () => { myStream = null; camState = "none"; link.setStream(null); flash("CAMERA OFF"); });
      flash("CAMERA ON");
    } catch (e) {
      camState = "none";
      flash("NO GLASSES CAMERA", 2.4);
    }
  }

  /* ---------- update ---------- */
  function update(dt) {
    motion.update(dt);
    // a move nobody refreshes stops by itself (CON gone, or the link dropped)
    if ((mv.f || mv.r) && clock - mv.at > 2.5) {
      mv = { f: 0, r: 0, at: clock };
      stopAt = clock; stopHard = false; lostAt = clock;
      announce("Stop", true);
    }
    if (act && clock - act.at > 30) act = null;
    if (started && link && link.open && (telT -= dt) <= 0) {
      telT = motion.live ? 0.25 : 3;
      const m = { t: "tel", bat, chg };
      if (motion.live) { m.h = Math.round(motion.heading); m.p = Math.round(motion.pitch); }
      link.send(m);
    }
  }

  /* ---------- drawing helpers ---------- */
  function line(a, b) { lo.beginPath(); lo.moveTo(a[0], a[1]); lo.lineTo(b[0], b[1]); lo.stroke(); }
  const segEnd = (p, ang, len) => [p[0] + Math.sin(ang) * len, p[1] + Math.cos(ang) * len];   // ang 0 = straight down, + = to the right
  function arrowHead(x, y, dx, dy, size) {
    const l = Math.hypot(dx, dy) || 1; dx /= l; dy /= l;
    const nx = -dy, ny = dx;
    lo.beginPath();
    lo.moveTo(x + dx * size, y + dy * size);
    lo.lineTo(x + nx * size * 0.85, y + ny * size * 0.85);
    lo.lineTo(x - nx * size * 0.85, y - ny * size * 0.85);
    lo.closePath(); lo.fill();
  }
  const ease = (u) => u * u * (3 - 2 * u);

  /* stick figure, front view. Angles: 0 = hanging straight down, + = towards the right of the screen */
  function fig(x, footY, s, p, draw = true) {
    const L = 9 * s;
    const hip = [x + (p.dx || 0), footY - L * (Math.cos(p.tl) + Math.cos(p.sl)) + (p.dy || 0)];
    const kL = segEnd(hip, p.tl, L), fL = segEnd(kL, p.sl, L);
    const kR = segEnd(hip, p.tr, L), fR = segEnd(kR, p.sr, L);
    const up = [Math.sin(p.lean || 0), -Math.cos(p.lean || 0)];
    const at = (k) => [hip[0] + up[0] * L * k, hip[1] + up[1] * L * k];
    const neck = at(1.75), sh = at(1.55), head = [neck[0] + up[0] * 4.6 * s, neck[1] + up[1] * 4.6 * s];
    const eL = segEnd(sh, p.aul, L * 0.85), hL = segEnd(eL, p.afl, L * 0.8);
    const eR = segEnd(sh, p.aur, L * 0.85), hR = segEnd(eR, p.afr, L * 0.8);
    if (draw) {
      lo.lineWidth = 2.3 * s; lo.lineCap = "round"; lo.lineJoin = "round";
      line(hip, neck); line(hip, kL); line(kL, fL); line(hip, kR); line(kR, fR);
      line(sh, eL); line(eL, hL); line(sh, eR); line(eR, hR);
      lo.beginPath(); lo.arc(head[0], head[1], 4.2 * s, 0, PI * 2); lo.fill();
    }
    return { hL, hR, head, hip, fL, fR };
  }
  const STAND = { tl: -0.14, sl: -0.04, tr: 0.14, sr: 0.04, aul: -0.28, afl: -0.12, aur: 0.28, afr: 0.12, lean: 0 };
  const pose = (o) => Object.assign({}, STAND, o);

  function ground(y, x0 = 30, x1 = 90) {
    lo.save(); lo.globalAlpha = 0.45; lo.lineWidth = 1; lo.setLineDash([2, 2]);
    lo.beginPath(); lo.moveTo(x0, y + 0.5); lo.lineTo(x1, y + 0.5); lo.stroke(); lo.restore();
  }
  function heart(x, y, k) {
    lo.beginPath();
    lo.moveTo(x, y + 6 * k);
    lo.bezierCurveTo(x - 10 * k, y - 1 * k, x - 5 * k, y - 9 * k, x, y - 3 * k);
    lo.bezierCurveTo(x + 5 * k, y - 9 * k, x + 10 * k, y - 1 * k, x, y + 6 * k);
    lo.fill();
  }
  function note(x, y, a) {
    lo.save(); lo.globalAlpha = a; lo.lineWidth = 1;
    lo.beginPath(); lo.ellipse(x, y, 2.6, 2, -0.4, 0, PI * 2); lo.fill();
    lo.beginPath(); lo.moveTo(x + 2.2, y); lo.lineTo(x + 2.2, y - 9); lo.lineTo(x + 6, y - 6); lo.stroke();
    lo.restore();
  }

  /* ---------- screens ---------- */
  function header() {
    text("YARO", 2, 1);
    const blink = Math.floor(clock * 2.5) % 2 === 0;
    if (netState !== "open") { if (blink) text(netState === "full" ? "ROOM FULL" : "NET...", 22, 1); }
    else if (conCount) text(conCount > 1 ? "CON X" + conCount : "CON", 22, 1);
    else if (blink) text("NO CON", 22, 1, 0.8);
    if (camState === "on") { textR("CAM", 117, 1); if (blink) { lo.beginPath(); lo.arc(102, 3.5, 1.6, 0, PI * 2); lo.fill(); } }
    else if (phoneCam) textR("PHONE CAM", 117, 1);
    else textR(camState === "asking" ? "CAM?" : "NO CAM", 117, 1, 0.55);
    lo.save(); lo.globalAlpha = 0.3; for (let x = 1; x < G; x += 2) lo.fillRect(x, 8, 1, 1); lo.restore();
  }
  function footer() {
    text("CODE " + code, 2, 114, 0.7);
    textR(voice ? "VOICE" : "MUTE", 117, 114, 0.7);
  }

  function drawStart() {
    textSC("YARO", 60, 7, 3);
    textSC("VISSION", 60, 26, 2);
    textC("LINK CODE", 60, 44, 0.7);
    textSC(code, 60, 52, 3);
    textC("ON A PHONE OR PC OPEN", 60, 74, 0.7);
    textC("ERROR.BLUE/GLASSES/CON", 60, 81);
    if (Math.floor(clock * 2) % 2 === 0) {
      textC("PINCH TO START", 60, 98);
      lo.save(); lo.globalAlpha = 0.6; lo.lineWidth = 1; lo.strokeRect(29.5, 95.5, 61, 10); lo.restore();
    }
    if (conCount) textC("CON IS WAITING", 60, 110, 0.8);
  }

  function drawIdle() {
    if (!conCount) {
      textSC("WAITING", 60, 20, 2);
      textC("FOR CON", 60, 33, 0.8);
      textC("CODE", 60, 47, 0.7);
      textSC(code, 60, 55, 3);
      textC("ERROR.BLUE/GLASSES/CON", 60, 78, 0.85);
    } else {
      const pu = 0.5 + 0.5 * Math.sin(clock * 3);
      lo.lineWidth = 1;
      lo.beginPath(); lo.arc(60, 44, 11 + pu * 2, 0, PI * 2); lo.stroke();
      for (let i = 0; i < 4; i++) {
        const a = i * PI / 2 + clock * 0.6;
        line([60 + Math.cos(a) * 15, 44 + Math.sin(a) * 15], [60 + Math.cos(a) * 21, 44 + Math.sin(a) * 21]);
      }
      lo.fillRect(59, 43, 2, 2);
      textSC("READY", 60, 72, 2);
      textC("WAITING FOR ORDERS", 60, 87, 0.7);
    }
    if (camState === "none" && !phoneCam) textC("CAMERA: USE A PHONE", 60, 101, 0.55);
    if (clock - lostAt < 4) textC("LINK LOST", 60, 101);
  }

  function drawMove() {
    const { f, r } = mv;
    const L = moveLabel(f, r);
    lo.save();
    lo.lineCap = "round"; lo.lineJoin = "round";
    if (f) {
      const sy = f > 0 ? 80 : 16, ey = f > 0 ? 18 : 78;
      const p0 = [60, sy], p1 = [60, 48], p2 = [60 + r * 30, ey + (r ? (f > 0 ? 10 : -10) : 0)];
      const tx = p2[0] - p1[0], ty = p2[1] - p1[1];
      const tl = Math.hypot(tx, ty), end = [p2[0] - tx / tl * 6, p2[1] - ty / tl * 6];
      lo.globalAlpha = 0.18; lo.lineWidth = 11;
      lo.beginPath(); lo.moveTo(p0[0], p0[1]); lo.quadraticCurveTo(p1[0], p1[1], end[0], end[1]); lo.stroke();
      lo.globalAlpha = 1; lo.lineWidth = 6; lo.setLineDash([5, 4]); lo.lineDashOffset = -clock * 26;
      lo.beginPath(); lo.moveTo(p0[0], p0[1]); lo.quadraticCurveTo(p1[0], p1[1], end[0], end[1]); lo.stroke();
      lo.setLineDash([]);
      arrowHead(end[0], end[1], tx, ty, 13);
    } else {
      const R = 24, cy = 46, a0 = r < 0 ? 10 : 170, a1 = r < 0 ? -190 : 370, d = PI / 180;
      lo.globalAlpha = 0.18; lo.lineWidth = 11;
      lo.beginPath(); lo.arc(60, cy, R, a0 * d, a1 * d, r < 0); lo.stroke();
      lo.globalAlpha = 1; lo.lineWidth = 6; lo.setLineDash([5, 4]); lo.lineDashOffset = -clock * 26;
      lo.beginPath(); lo.arc(60, cy, R, a0 * d, a1 * d, r < 0); lo.stroke();
      lo.setLineDash([]);
      const th = a1 * d, ex = 60 + Math.cos(th) * R, ey = cy + Math.sin(th) * R;
      const dx = r < 0 ? Math.sin(th) : -Math.sin(th), dy = r < 0 ? -Math.cos(th) : Math.cos(th);
      arrowHead(ex, ey, dx, dy, 12);
    }
    lo.restore();
    textSC(L.main, 60, 89, 2);
    if (L.sub) textC(L.sub, 60, 103);
  }

  function drawStop() {
    const blink = stopHard && Math.floor(clock * 4) % 2 === 0;
    lo.beginPath();
    for (let i = 0; i < 8; i++) {
      const a = (i * 45 + 22.5) * PI / 180;
      lo[i ? "lineTo" : "moveTo"](60 + Math.cos(a) * 29, 46 + Math.sin(a) * 29);
    }
    lo.closePath();
    lo.save(); lo.globalAlpha = blink ? 0.45 : 0.22; lo.fill(); lo.restore();
    lo.lineWidth = 3; lo.stroke();
    textSC("STOP", 60, 41, 2);
    textC(stopHard ? "STAND STILL" : "STOPPED", 60, 86, 0.8);
  }

  function drawDone() {
    lo.save(); lo.lineWidth = 7; lo.lineCap = "round"; lo.lineJoin = "round";
    const k = clamp((clock - doneAt) / 0.25, 0, 1);
    lo.beginPath(); lo.moveTo(38, 46);
    lo.lineTo(52, 60);
    if (k > 0.4) lo.lineTo(52 + (84 - 52) * ((k - 0.4) / 0.6), 60 - (60 - 28) * ((k - 0.4) / 0.6));
    lo.stroke(); lo.restore();
    textSC(doneLabel, 60, 80, 2);
    textC("SENT TO CON", 60, 95, 0.7);
  }

  function drawAct() {
    const t = clock - act.at;
    lo.save();
    if (act.a === "jump") {
      const u = (t % 1.1) / 1.1;
      let c, air = 0;
      if (u < 0.25) c = u / 0.25;
      else if (u < 0.32) c = 1 - (u - 0.25) / 0.07;
      else if (u < 0.8) { c = 0.15; air = Math.sin(PI * (u - 0.32) / 0.48); }
      else if (u < 0.9) c = (u - 0.8) / 0.1 * 0.8;
      else c = 0.8 * (1 - (u - 0.9) / 0.1);
      const armsUp = u > 0.3 && u < 0.85;
      const p = pose({
        tl: -(0.14 + c * 0.75), sl: c * 0.75, tr: 0.14 + c * 0.75, sr: -c * 0.75,
        aul: armsUp ? -2.75 : -0.35 - c * 0.35, afl: armsUp ? -2.95 : -0.2,
        aur: armsUp ? 2.75 : 0.35 + c * 0.35, afr: armsUp ? 2.95 : 0.2,
        dy: -air * 22,
      });
      ground(84);
      lo.save(); lo.globalAlpha = 0.35 * (1 - air * 0.6);
      lo.beginPath(); lo.ellipse(60, 84, 12 - air * 6, 2, 0, 0, PI * 2); lo.fill(); lo.restore();
      fig(60, 84, 1.25, p);
      if (air > 0.25) { lo.save(); lo.globalAlpha = 0.5; lo.lineWidth = 1;
        for (const x of [44, 76]) line([x, 64 - air * 18], [x, 74 - air * 12]); lo.restore(); }
    } else if (act.a === "dance") {
      const b = t / 0.45, ph = Math.floor(b) % 2, bob = Math.abs(Math.sin(b * PI));
      const s = ph ? -1 : 1;
      const p = pose({
        dx: Math.sin(b * PI) * 3,
        lean: Math.sin(b * PI) * 0.14 * s,
        tl: s > 0 ? -0.5 : -0.14, sl: s > 0 ? 0.35 : -0.04,
        tr: s > 0 ? 0.14 : 0.5, sr: s > 0 ? 0.04 : -0.35,
        aul: s > 0 ? -2.5 : -1.2, afl: s > 0 ? -3.0 : -0.4,
        aur: s > 0 ? 1.2 : 2.5, afr: s > 0 ? 0.4 : 3.0,
        dy: -bob * 2,
      });
      ground(84);
      fig(60, 84, 1.2, p);
      for (let i = 0; i < 3; i++) {
        const k = ((t * 0.55 + i / 3) % 1);
        note([30, 88, 80][i] + Math.sin(k * 6 + i) * 3, 70 - k * 46, 1 - k);
      }
    } else if (act.a === "hug") {
      const u = (t % 2.6) / 2.6, a = ease(clamp(u / 0.45, 0, 1));
      const d = 25 - a * 14;
      const close = a > 0.92;
      ground(86, 24, 96);
      fig(60 - d, 86, 1.0, pose({ lean: a * 0.12, aur: close ? 1.45 : 0.6 + a * 0.9, afr: close ? 2.7 : 1.2 + a * 0.5 }));
      fig(60 + d, 86, 1.0, pose({ lean: -a * 0.12, aul: close ? -1.45 : -0.6 - a * 0.9, afl: close ? -2.7 : -1.2 - a * 0.5 }));
      if (close) heart(60, 22, 1 + 0.25 * Math.abs(Math.sin(t * 5)));
      else { lo.save(); lo.globalAlpha = 0.35; heart(60, 22, 0.7); lo.restore(); }
    } else if (act.a === "take") {
      const u = (t % 2.8) / 2.8;
      const reachEnd = pose({ lean: 0.5, aur: 0.95, afr: 0.75 });
      const boxAt = fig(48, 84, 1.2, reachEnd, false).hR;
      let p, carry;
      if (u < 0.35) { const k = ease(u / 0.35); p = pose({ lean: k * 0.5, aur: 0.28 + k * 0.67, afr: 0.12 + k * 0.63 }); carry = false; }
      else if (u < 0.7) { const k = ease((u - 0.35) / 0.35); p = pose({ lean: 0.5 - k * 0.5, aur: 0.95 + k * 1.35, afr: 0.75 + k * 1.75, aul: -0.28 - k * 0.2 }); carry = true; }
      else { const k = Math.sin((u - 0.7) * 20) * 0.08; p = pose({ aur: 2.3 + k, afr: 2.5 + k, aul: -0.48 }); carry = true; }
      ground(84);
      const j = fig(48, 84, 1.2, p);
      const bx = carry ? j.hR[0] : boxAt[0], by = carry ? j.hR[1] : boxAt[1];
      lo.fillRect(Math.round(bx - 4), Math.round(by - (carry ? 7 : 6)), 9, 8);
      if (u > 0.7) { lo.save(); lo.globalAlpha = 0.8;
        for (let i = 0; i < 3; i++) { const a = t * 3 + i * 2.1; lo.fillRect(Math.round(bx + Math.cos(a) * 10), Math.round(by - 4 + Math.sin(a) * 9), 1, 1); }
        lo.restore(); }
    }
    lo.restore();
    textSC(ACTS[act.a].label, 60, 90, 2);
    if (Math.floor(clock * 2) % 2 === 0) textC("PINCH WHEN DONE", 60, 104, 0.8);
  }

  function draw() {
    begin(THEMES[theme].c, 0.05);
    if (!started) drawStart();
    else {
      header();
      if (clock - doneAt < 1.3) drawDone();
      else if (act) drawAct();
      else if (mv.f || mv.r) drawMove();
      else if (clock - stopAt < (stopHard ? 2.5 : 1.4)) drawStop();
      else drawIdle();
      footer();
    }
    if (clock - borderAt < 0.4 && Math.floor((clock - borderAt) * 10) % 2 === 0) {
      lo.lineWidth = 1; lo.strokeRect(0.5, 0.5, G - 1, G - 1); lo.strokeRect(2.5, 10.5, G - 5, G - 22);
    }
    if (flashMsg && clock < flashUntil) {
      lo.clearRect(0, 10, G, 9);
      textC(flashMsg, 60, 12);
    }
    present(0.16);
  }

  /* ---------- input: Neural Band / captouch arrive as key events ---------- */
  function newCode() {
    code = YaroLink.newCode();
    store.set("yaro.code", code);
    mv = { f: 0, r: 0, at: clock }; act = null;
    connect();
    flash("NEW CODE " + code, 2.5);
  }
  document.addEventListener("keydown", (e) => {
    const k = e.key;
    if (k === "Escape") { e.preventDefault(); history.back(); return; }
    if (!["Enter", "ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"].includes(k)) return;
    e.preventDefault();
    ensureAudio();
    if (k === "Enter") { if (!started) start(); else done(); }
    else if (k === "ArrowLeft" || k === "ArrowRight") {
      theme = (theme + (k === "ArrowRight" ? 1 : -1) + THEMES.length) % THEMES.length;
      store.set("glasses.theme", theme);
      flash(THEMES[theme].name, 1.2);
    } else if (k === "ArrowUp") {
      voice = !voice; store.set("yaro.voice", voice);
      if (!voice && window.speechSynthesis) try { speechSynthesis.cancel(); } catch (err) {}
      flash(voice ? "VOICE ON" : "VOICE OFF");
      if (voice) say("Voice on", true);
    } else if (k === "ArrowDown") {
      if (clock - newCodeAt < 2.5) { newCodeAt = -99; newCode(); }
      else { newCodeAt = clock; flash("SWIPE DOWN AGAIN: NEW CODE", 2.5); }
    }
  });

  /* Touch / mouse, only for previewing on a phone or computer:
     tap = pinch, swipe = arrow. (The glasses send key events.) */
  let p0 = null;
  const cv = document.getElementById("screen");
  cv.addEventListener("pointerdown", (e) => { p0 = { x: e.clientX, y: e.clientY }; });
  window.addEventListener("pointerup", (e) => {
    if (!p0) return;
    const dx = e.clientX - p0.x, dy = e.clientY - p0.y;
    p0 = null;
    const key = Math.abs(dx) < 30 && Math.abs(dy) < 30 ? "Enter"
      : Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "ArrowRight" : "ArrowLeft") : (dy > 0 ? "ArrowDown" : "ArrowUp");
    document.dispatchEvent(new KeyboardEvent("keydown", { key, bubbles: true, cancelable: true }));
  });

  window.__yaro = {
    get state() { return { started, code, conCount, phoneCam, camState, netState, mv, act: act && act.a, voice }; },
    get link() { return link; },
  };

  connect();
  DM.loop((dt, t) => { clock = t; update(dt); draw(); });
})();
</script>
</body>
</html>
