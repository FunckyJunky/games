<body>
<canvas id="screen" aria-label="Room 404, a small 3D room"></canvas>
<script src="/glasses/presence.js" data-app="room404"></script>
<script>
/* ===== Shared: dot-matrix display, 3x5 pixel font, head-motion sensors ===== */
const DM = (() => {
  "use strict";
  const G = 120;                 // the display is G x G dots
  const CX = 60, CY = 60;
  const PITCH = 600 / G;         // 5 px per dot on the 600 x 600 lens
  const D2R = Math.PI / 180;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const wrap360 = (a) => ((a % 360) + 360) % 360;
  const angDiff = (a, b) => ((((a - b) % 360) + 540) % 360) - 180;

  const THEMES = [
    { name: "GREEN", c: "#36ff6b" },
    { name: "RED",   c: "#ff2b2b" },
    { name: "AMBER", c: "#ffae1a" },
  ];

  const store = {
    get(k, f) { try { const v = localStorage.getItem(k); return v === null ? f : JSON.parse(v); } catch { return f; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };

  /* 3x5 font: five rows, each a digit 0-7 whose bits are the three columns (left = 4). */
  const FONT = {
    "0": "75557", "1": "26227", "2": "71747", "3": "71317", "4": "55711",
    "5": "74717", "6": "74757", "7": "71122", "8": "75757", "9": "75717",
    A: "25755", B: "65656", C: "34443", D: "65556", E: "74647", F: "74644", G: "34553",
    H: "55755", I: "72227", J: "11152", K: "55655", L: "44447", M: "57755", N: "65555",
    O: "25552", P: "65644", Q: "25563", R: "65655", S: "34216", T: "72222", U: "55557",
    V: "55522", W: "55775", X: "55255", Y: "55222", Z: "71247",
    " ": "00000", "-": "00700", "+": "02720", ".": "00002", ":": "02020", "/": "11244",
    "%": "51245", "<": "12421", ">": "42124", "[": "64446", "]": "31113", "#": "57575",
    "=": "07070", "_": "00007", "!": "22202", "?": "71202", "*": "05250", "^": "25000", "'": "22000",
  };

  /* ---------- display: draw on a tiny canvas, show it as glowing dots ---------- */
  function createDisplay(canvas) {
    const K = Math.min(3, Math.max(1, Math.round(window.devicePixelRatio || 1)));
    const W = 600 * K;
    canvas.width = canvas.height = W;
    const ctx = canvas.getContext("2d");
    const loC = document.createElement("canvas");
    loC.width = loC.height = G;
    const lo = loC.getContext("2d");

    // one soft round LED, repeated across the screen
    const T = PITCH * K;
    const tile = document.createElement("canvas");
    tile.width = tile.height = T;
    const tg = tile.getContext("2d");
    const grad = tg.createRadialGradient(T / 2, T / 2, 0, T / 2, T / 2, T / 2);
    grad.addColorStop(0, "rgba(0,0,0,1)");
    grad.addColorStop(0.55, "rgba(0,0,0,1)");
    grad.addColorStop(0.85, "rgba(0,0,0,.35)");
    grad.addColorStop(1, "rgba(0,0,0,0)");
    tg.fillStyle = grad;
    tg.fillRect(0, 0, T, T);
    const mask = ctx.createPattern(tile, "repeat");

    function begin(color, dim = 0.07) {

    for (let i = 0; i < lat; i++) for (let j = 0; j < lon; j++) {
      const pts = i === 0 ? [P(0, 0), P(1, j + 1), P(1, j)]
                : i === lat - 1 ? [P(i, j), P(i, j + 1), P(lat, 0)]
                : [P(i, j), P(i, j + 1), P(i + 1, j + 1), P(i + 1, j)];
      const th = ((i + 0.5) / lat) * Math.PI, ph = ((j + 0.5) / lon) * TAU;
      face(pts, norm([Math.sin(th) * Math.cos(ph) / rx, Math.cos(th) / ryy, Math.sin(th) * Math.sin(ph) / rz]), colFn(i, j), o);

    }
  }

  /* ---------- lighting: one lamp over the table (or moonlight when it's off) ---------- */
  let lightOn = true;
  function lightK(n, c, two, on) {
    if (on) {

  function objLight(n, c, two) {                                       // things you can take stand out a bit

    const lx = LAMP[0] - c[0], ly = LAMP[1] - c[1], lz = LAMP[2] - c[2], dl = Math.hypot(lx, ly, lz) || 1;
    let d = (n[0] * lx + n[1] * ly + n[2] * lz) / dl;

  function recenter() {
    bodyYaw = bodyYawT = viewYaw(); dragYaw = 0; dragPitch = 0;
    motion.zero();
  }

  /* ---------- pinch counting: 1 pinch = walk / stop, 2 quick pinches = take / put ---------- */
  const DOUBLE_MS = 420;
  let tapN = 0, tapTimer = 0, undoWalk = null;
  function cancelPendingTap() { clearTimeout(tapTimer); tapN = 0; undoWalk = null; }
  function tap() {
    if (mode === "start") { enterRoom(); return; }
    if (clock - enteredAt < 0.45) return;                             // the double-tap that opened the room
    tapN++;
    if (tapN === 1) {
      undoWalk = walkToggle;
      if (walkToggle) { walkToggle = false; }                          // stopping happens at once
      tapTimer = setTimeout(() => {
        tapN = 0;
        if (!undoWalk) { walkToggle = true; sound("walk"); }            // starting waits for a possible 2nd pinch
        else sound("stop");
        undoWalk = null;
      }, DOUBLE_MS);
    } else {
      clearTimeout(tapTimer); tapN = 0;
      if (undoWalk) walkToggle = true;                                 // that was a double pinch, keep walking
      undoWalk = null;
      takeOrPut();
    }
  }
  function swipe(k) {
    if (mode === "start") {
      if (k === "ArrowDown") {
        if (clock - resetAskAt < 2.5) { resetAskAt = -99; resetRoom(); sound("put"); flash("ROOM TIDIED UP", 1.8); }
        else { resetAskAt = clock; flash("SWIPE DOWN AGAIN TO TIDY UP", 2.5); }
      }
      return;
    }
    if (k === "ArrowLeft" || k === "ArrowRight") { bodyYawT += ((k === "ArrowRight" ? 1 : -1) * Math.PI) / 4; sound("turn"); }
    else if (k === "ArrowUp") { recenter(); sound("turn"); flash("RECENTERED", 1); }
    else { const v = viewYaw(); const a = motion.nextAxis(1); bodyYaw = bodyYawT = v; dragYaw = 0; sound("turn"); flash("SENSOR AXIS " + a, 1.4); }
  }

  /* ---------- input ---------- */
  let ptr = null, lastPointerAt = -1e9, holdTimer = 0;
  const TAP_MOVE = onGlasses ? 40 : 10, HOLD_MS = 320, DRAG_K = 0.0045;
  cv.addEventListener("pointerdown", (e) => {
    lastPointerAt = performance.now();
    audio();
    if (!motion.live) motion.enable();                                 // sensor permission comes from a gesture
    ptr = { x: e.clientX, y: e.clientY, t: performance.now(), moved: 0, hold: false };
    try { cv.setPointerCapture(e.pointerId); } catch {}
    clearTimeout(holdTimer);
    holdTimer = setTimeout(() => {
      if (!ptr || ptr.moved >= TAP_MOVE || mode !== "room") return;
      ptr.hold = true; holdWalk = true; cancelPendingTap(); sound("walk");
    }, HOLD_MS);
  });
  cv.addEventListener("pointermove", (e) => {
    if (!ptr) return;
    lastPointerAt = performance.now();
    let dx = e.movementX, dy = e.movementY;
    if (typeof dx !== "number" || (dx === 0 && dy === 0)) { dx = e.clientX - ptr.x; dy = e.clientY - ptr.y; }
    if (Math.abs(dx) > 150 && Math.abs(e.clientX - 300) < 3) dx = 0;  // the EMG pointer can snap back to the centre
    if (Math.abs(dy) > 150 && Math.abs(e.clientY - 300) < 3) dy = 0;
    ptr.x = e.clientX; ptr.y = e.clientY; ptr.moved += Math.abs(dx) + Math.abs(dy);
    if (!onGlasses || !motion.live) { dragYaw -= dx * DRAG_K; dragPitch = clamp(dragPitch + dy * DRAG_K, -1.4, 1.4); }
  });
  function endPointer(cancel) {
    if (!ptr) return;
    lastPointerAt = performance.now();
    clearTimeout(holdTimer);
    const p = ptr; ptr = null;
    if (p.hold) { holdWalk = false; walkToggle = false; sound("stop"); return; }
    if (!cancel && p.moved < TAP_MOVE) tap();
  }
  cv.addEventListener("pointerup", () => endPointer(false));
  cv.addEventListener("pointercancel", () => endPointer(true));
  // On the glasses a pinch sends Enter AND (touch-action: none) a pointer press; the pointer
  // press counts, an Enter that comes with one is ignored.
  document.addEventListener("keydown", (e) => {
    const k = e.key;
    if (k === "Escape") { e.preventDefault(); save(); stopWrist(); history.back(); return; }
    if (k === "Enter") {
      e.preventDefault();
      if (e.repeat) return;
      const at = performance.now();
      audio();
      if (!motion.live) motion.enable();
      setTimeout(() => { if (ptr || Math.abs(lastPointerAt - at) < 450) return; tap(); }, 200);
      return;
    }
    if (k.startsWith("Arrow")) { e.preventDefault(); audio(); swipe(k); return; }
    if (k === "w" || k === "W") { keyWalk = mode === "room"; return; }
    if (k === "e" || k === "E" || k === " ") { e.preventDefault(); audio(); if (mode === "start") enterRoom(); else takeOrPut(); }
  });
  document.addEventListener("keyup", (e) => { if (e.key === "w" || e.key === "W") keyWalk = false; });
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) { walkToggle = holdWalk = keyWalk = false; save(); stopWrist(); if (ac && ac.suspend) ac.suspend(); }
  });
  if (window.GlassesPresence) GlassesPresence.onSettings(() => { S = DM.settings.get(); PAL = DM.dosPalette(S.color); });

  /* ============================== SIMULATION ============================== */
  function movePlayer(dt) {
    const want = mode === "room" && walking();
    const tx = want ? Math.sin(cam.yaw) * SPEED : 0, tz = want ? Math.cos(cam.yaw) * SPEED : 0;
    const k = 1 - Math.exp(-dt * (want ? 5 : 9));
    player.vx += (tx - player.vx) * k; player.vz += (tz - player.vz) * k;
    const ox = player.x, oz = player.z, wantD = want ? SPEED * dt : 0;
    player.x += player.vx * dt; player.z += player.vz * dt;
    for (let it = 0; it < 2; it++) {
      player.x = clamp(player.x, -RX + PR, RX - PR); player.z = clamp(player.z, -RZ + PR, RZ - PR);
      for (const b of SOLIDS) if (b.coll && b.y1 > 0.12 && b.y0 < 1.8) pushOut(player, b, PR);
    }
    const moved = Math.hypot(player.x - ox, player.z - oz);
    player.vx = (player.x - ox) / dt; player.vz = (player.z - oz) / dt;
    if (want && wantD > 0.01 && moved < wantD * 0.3) {
      blockedT += dt;
      if (blockedT > 0.35) {
        blockedT = -0.6;
        sound("bump");
        if (walkToggle) { walkToggle = false; flash("BUMP!", 0.9); }
      }
    } else if (blockedT > 0) blockedT = 0; else blockedT = Math.min(0, blockedT + dt);
    const spd = Math.hypot(player.vx, player.vz);
    stepPhase += ((spd * dt) / 0.65) * Math.PI;
    const st = Math.floor(stepPhase / Math.PI);
    if (st !== lastStep) { lastStep = st; if (spd > 0.4) sound("step"); }
    bob = (Math.abs(Math.sin(stepPhase)) - 0.5) * 0.022 * clamp(spd / SPEED, 0, 1);
    if (spd > 0.05) dirty = true;
  }
  function look() {
    const o = [cam.x, cam.y, cam.z], d = cam.f;
    target = null; farTarget = null; interact = null; place = null; dropAt = null;
    if (held) {
      const h = castRay(o, d, PLACE_REACH, held, false);
      if (h.kind === "sup") {
        let x = o[0] + d[0] * h.t, z = o[2] + d[2] * h.t;
        const r = held.d.r;
        if (h.obj) { x = h.obj.x; z = h.obj.z; }
        else if (h.rect) {
          const s = h.rect;
          x = s.x1 - s.x0 > 2 * r ? clamp(x, s.x0 + r, s.x1 - r) : (s.x0 + s.x1) / 2;
          z = s.z1 - s.z0 > 2 * r ? clamp(z, s.z0 + r, s.z1 - r) : (s.z0 + s.z1) / 2;
        }
        x = clamp(x, -RX + r, RX - r); z = clamp(z, -RZ + r, RZ - r);   // things stay inside the room
        if (h.name === "FLOOR") {                                      // not on your own feet
          const dx = x - player.x, dz = z - player.z, dd = Math.hypot(dx, dz), m = PR + r + 0.03;
          if (dd < m) { const a = dd > 1e-3 ? Math.atan2(dx, dz) : cam.yaw; x = player.x + Math.sin(a) * m; z = player.z + Math.cos(a) * m; }
        }
        place = { x, y: h.y, z, name: h.name };
      } else dropAt = { x: held.x, z: held.z, y: supportBelow(held.x, held.z, held.y, held).y };
      return;
    }
    const wall = castRay(o, d, 8, null, true);
    let bestT = 1e9;
    for (const ob of objs) {
      if (ob.held) continue;
      const c = [ob.x, ob.y + ob.d.h / 2, ob.z], rho = Math.max(ob.d.r, ob.d.h / 2) * 1.3 + 0.03;
      const oc = sub(c, o), dist = Math.hypot(oc[0], oc[1], oc[2]), tca = dot(oc, d);
      if (tca <= 0) continue;
      const d2 = dist * dist - tca * tca, ang = Math.acos(clamp(tca / dist, -1, 1));
      if (d2 > rho * rho && ang > 6 * D2R) continue;
      if (dist - rho > wall.t + 0.02) continue;                        // hidden behind something
      const t = d2 <= rho * rho ? tca - Math.sqrt(rho * rho - d2) : tca;
      if (dist <= REACH) { if (t < bestT) { bestT = t; target = ob; } }
      else if (!farTarget || dist < farTarget.dist) farTarget = { d: ob.d, dist };
    }
    if (target) farTarget = null;
    else if ((wall.name === "LAMP" || wall.name === "DOOR") && wall.t < REACH + 0.3) interact = wall.name;
  }
  function updateHeld(dt) {
    const o = held;
    if (!o) return;
    const ahead = castRay([cam.x, cam.y, cam.z], cam.f, 0.9, o, true);
    const dist = clamp(ahead.t - 0.14, 0.26, 0.52);
    const DN = 0.15, RT = 0.07;                                        // a bit low and to the right, like in your hand
    const hx = cam.x + cam.f[0] * dist - cam.u[0] * DN + cam.r[0] * RT, hz = cam.z + cam.f[2] * dist - cam.u[2] * DN + cam.r[2] * RT;
    let hy = cam.y + cam.f[1] * dist - cam.u[1] * DN + cam.r[1] * RT - o.d.h / 2;   // bottom of the thing
    for (const b of SOLIDS) if (b.coll && hx > b.x0 - o.d.r && hx < b.x1 + o.d.r && hz > b.z0 - o.d.r && hz < b.z1 + o.d.r && hy < b.y1 && hy + o.d.h > b.y0) hy = b.y1;
    hy = Math.max(0, hy);
    const k = 1 - Math.exp(-dt * 22);
    o.x += (hx - o.x) * k; o.y += (hy - o.y) * k; o.z += (hz - o.z) * k;
    o.M = mmul(ry(cam.yaw - o.takeYaw + wristSpin()), o.M0);
  }
  function landed(o) {
    if (!o.air && !o.spin) return;
    o.air = false;
    if (o.d.dice) {
      o.spin = null;
      o.snap = { from: o.M.slice(), to: snapMatrix(o.M), t: 0 };
      sound("dice");
    } else sound("land");
  }
  function physics(dt) {
    for (const o of objs) {
      if (o.held) continue;
      const d = o.d;
      if (o.spin) o.M = mmul(rotAxis(o.spin.a, o.spin.w * dt), o.M);
      if (o.snap) {
        o.snap.t += dt / 0.14;
        if (o.snap.t >= 1) { o.M = o.snap.to; o.snap = null; flash("YOU ROLLED A " + diceValue(o.M) + "!", 1.6); dirty = true; }
        else o.M = orthonormal(o.snap.from.map((v, i) => v + (o.snap.to[i] - v) * o.snap.t));
      }
      if (o.anim) {                                                    // gliding to where you put it
        const a = o.anim;
        a.t += dt / a.dur;
        const e = a.t >= 1 ? 1 : a.t < 0.5 ? 2 * a.t * a.t : 1 - 2 * (1 - a.t) * (1 - a.t);
        o.x = a.from[0] + (a.to[0] - a.from[0]) * e;
        o.z = a.from[2] + (a.to[2] - a.from[2]) * e;
        o.y = a.from[1] + (a.to[1] - a.from[1]) * e + Math.sin(Math.PI * Math.min(1, a.t)) * 0.08;
        if (a.t >= 1) { o.anim = null; o.y = a.to[1]; o.vx = o.vy = o.vz = 0; o.air = true; landed(o); dirty = true; }
        continue;
      }
      o.x += o.vx * dt; o.z += o.vz * dt;
      const e = d.bounce || 0.3;
      if (o.x < -RX + d.r) { o.x = -RX + d.r; o.vx = Math.abs(o.vx) * e; }
      if (o.x > RX - d.r) { o.x = RX - d.r; o.vx = -Math.abs(o.vx) * e; }
      if (o.z < -RZ + d.r) { o.z = -RZ + d.r; o.vz = Math.abs(o.vz) * e; }
      if (o.z > RZ - d.r) { o.z = RZ - d.r; o.vz = -Math.abs(o.vz) * e; }
      for (const b of SOLIDS) if (b.coll && b.y1 > o.y + 0.012 && b.y0 < o.y + d.h) pushOut(o, b, d.r, e);
      const sup = supportBelow(o.x, o.z, o.y, o);
      if (o.y > sup.y + 0.0005 || o.vy > 0) {
        o.air = true;
        o.vy -= 9.8 * dt; o.y += o.vy * dt;
        if (o.y <= sup.y) {
          o.y = sup.y;
          if (d.bounce && o.vy < -0.9) { sound("bounce", -o.vy / 3); o.vy = -o.vy * d.bounce; }
          else { o.vy = 0; landed(o); }
        }
      } else {
        o.y = sup.y; o.vy = 0;
        const f = Math.exp(-d.fric * dt);
        o.vx *= f; o.vz *= f;
        if (Math.hypot(o.vx, o.vz) < 0.02) o.vx = o.vz = 0;
      }
      const sp = Math.hypot(o.vx, o.vz);
      if (d.roll && sp > 0.01 && !o.air) o.M = mmul(rotAxis([o.vz / sp, 0, -o.vx / sp], (sp * dt) / d.r), o.M);
      if (sp > 0.01 || o.air) dirty = true;
    }
    // things resting side by side shove each other apart
    for (let i = 0; i < objs.length; i++) for (let j = i + 1; j < objs.length; j++) {
      const a = objs[i], b = objs[j];
      if (a.held || b.held || a.anim || b.anim || Math.abs(a.y - b.y) > 0.05) continue;
      let dx = b.x - a.x, dz = b.z - a.z, dd = Math.hypot(dx, dz);
      const m = a.d.r + b.d.r;
      if (dd >= m) continue;
      if (dd < 1e-6) { dx = 1; dz = 0; dd = 1e-6; }
      const nx = dx / dd, nz = dz / dd, push = (m - dd) / 2;
      a.x -= nx * push; a.z -= nz * push; b.x += nx * push; b.z += nz * push;
      const rv = (b.vx - a.vx) * nx + (b.vz - a.vz) * nz;
      if (rv < 0) { a.vx += nx * rv * 0.5; a.vz += nz * rv * 0.5; b.vx -= nx * rv * 0.5; b.vz -= nz * rv * 0.5; }
    }
    // walking into things on the floor kicks them
    for (const o of objs) {
      if (o.held || o.anim || o.y > 0.3) continue;
      const dx = o.x - player.x, dz = o.z - player.z, dd = Math.hypot(dx, dz), m = PR + o.d.r;
      if (dd >= m) continue;
      const nx = dd > 1e-6 ? dx / dd : Math.sin(cam.yaw), nz = dd > 1e-6 ? dz / dd : Math.cos(cam.yaw);
      o.x = player.x + nx * m; o.z = player.z + nz * m;
      const vn = player.vx * nx + player.vz * nz;
      if (vn > 0.05) {
        const want = vn * (o.d.roll ? 1.7 : 1.05), vo = o.vx * nx + o.vz * nz;
        if (vo < want) { o.vx += nx * (want - vo); o.vz += nz * (want - vo); }
        if (o.id === "ball" && want > 0.7 && o.vy <= 0 && !o.air) o.vy = 0.5 * want;
        if (clock - o.kickAt > 0.4) { sound(o.id === "ball" ? "kick" : "nudge"); o.kickAt = clock; }
      }
    }
  }

  /* ============================== LOOP ============================== */
  const perf = { ms: 0, n: 0 };
  function step(dt) {
    motion.update(dt);
    bodyYaw += (bodyYawT - bodyYaw) * (1 - Math.exp(-dt * 18));
    if (mode === "start") {
      const a = clock * 0.22, px = Math.sin(a) * 2.2, pz = 0.4 + Math.cos(a) * 1.85, py = 2.05;
      const dx = -px, dz = 0.4 - pz, dy = 0.8 - py;
      setCam(px, py, pz, Math.atan2(dx, dz), Math.atan2(dy, Math.hypot(dx, dz)), 0);
      physics(dt);
      return;
    }
    const pitch = clamp((motion.live ? motion.pitch * D2R : 0) + dragPitch, -1.45, 1.45);
    const roll = motion.live ? clamp(motion.roll * D2R, -0.8, 0.8) : 0;
    const yaw = viewYaw();
    cam.yaw = yaw;
    movePlayer(dt);
    setCam(player.x, EYE + bob, player.z, yaw, pitch, roll);
    look();
    updateHeld(dt);
    physics(dt);
    if (dirty && clock - savedAt > 3) save();
  }
  function draw() {
    const t0 = performance.now();
    renderScene();
    if (mode === "start") drawStart(); else hud();
    present();
    perf.ms += (performance.now() - t0 - perf.ms) * 0.1; perf.n++;
  }

  if (!load()) resetRoom();

  let lastT = performance.now();
  function frame(now) {
    requestAnimationFrame(frame);
    const ms = now - lastT;
    if (ms < 30) return;                                               // 30 Hz, like the other glasses apps
    lastT = now;
    const dt = Math.min(0.1, ms / 1000);
    clock += dt;
    step(dt);
    draw();
  }
  requestAnimationFrame(frame);

  // test hooks
  window.__room = {
    get mode() { return mode; }, get held() { return held; }, get target() { return target; }, get place() { return place; },
    get interact() { return interact; }, get walking() { return walking(); }, get lightOn() { return lightOn; },
    get flash() { return clock < flashUntil ? flashMsg : ""; }, get wrist() { return wrist; },
    player, cam, motion, perf, get objs() { return objs; }, tap, takeOrPut, swipe, enterRoom, resetRoom, save, diceValue,
    set dragYaw(v) { dragYaw = v; }, get dragYaw() { return dragYaw; }, set dragPitch(v) { dragPitch = v; }, get dragPitch() { return dragPitch; },
    set bodyYaw(v) { bodyYaw = bodyYawT = v; }, set walk(v) { walkToggle = v; }, set hold(v) { holdWalk = v; },
    step(dt, n = 1) { for (let i = 0; i < n; i++) { clock += dt; step(dt); } draw(); },
  };
})();
</script>
</body>
</html>
