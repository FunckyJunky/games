<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #000; }
  body { width: 600px; height: 600px; overflow: hidden; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; width: 600px; height: 600px; image-rendering: pixelated; }

<body>
<canvas id="screen" aria-label="Glasses home: swipe to choose an app, pinch to open"></canvas>
<script src="/glasses/presence.js" data-app="home"></script>
<script>
/* ===== Shared: dot-matrix display, 3x5 pixel font, head-motion sensors ===== */
const DM = (() => {
  "use strict";
  const G = 120;                 // the display is G x G dots
  const CX = 60, CY = 60;
  const PITCH = 600 / G;         // 5 px per dot on the 600 x 600 lens
  const D2R = Math.PI / 180;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const wrap360 = (a) => ((a % 360) + 360) % 360;
  const angDiff = (a, b) => ((((a - b) % 360) + 540) % 360) - 180;

  const THEMES = [
    { name: "GREEN", c: "#36ff6b" },
    { name: "RED",   c: "#ff2b2b" },
    { name: "AMBER", c: "#ffae1a" },
  ];

  const store = {
    get(k, f) { try { const v = localStorage.getItem(k); return v === null ? f : JSON.parse(v); } catch { return f; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };

  /* 3x5 font: five rows, each a digit 0-7 whose bits are the three columns (left = 4). */
  const FONT = {
    "0": "75557", "1": "26227", "2": "71747", "3": "71317", "4": "55711",
    "5": "74717", "6": "74757", "7": "71122", "8": "75757", "9": "75717",
    A: "25755", B: "65656", C: "34443", D: "65556", E: "74647", F: "74644", G: "34553",
    H: "55755", I: "72227", J: "11152", K: "55655", L: "44447", M: "57755", N: "65555",
    O: "25552", P: "65644", Q: "25563", R: "65655", S: "34216", T: "72222", U: "55557",
    V: "55522", W: "55775", X: "55255", Y: "55222", Z: "71247",
    " ": "00000", "-": "00700", "+": "02720", ".": "00002", ":": "02020", "/": "11244",
    "%": "51245", "<": "12421", ">": "42124", "[": "64446", "]": "31113", "#": "57575",
    "=": "07070", "_": "00007", "!": "22202", "?": "71202", "*": "05250", "^": "25000", "'": "22000",
  };

  /* ---------- display: draw on a tiny canvas, show it as glowing dots ---------- */
  function createDisplay(canvas) {
    const K = Math.min(3, Math.max(1, Math.round(window.devicePixelRatio || 1)));
    const W = 600 * K;
    canvas.width = canvas.height = W;
    const ctx = canvas.getContext("2d");
    const loC = document.createElement("canvas");
    loC.width = loC.height = G;
    const lo = loC.getContext("2d");

    // one soft round LED, repeated across the screen
    const T = PITCH * K;
    const tile = document.createElement("canvas");
    tile.width = tile.height = T;
    const tg = tile.getContext("2d");
    const grad = tg.createRadialGradient(T / 2, T / 2, 0, T / 2, T / 2, T / 2);
    grad.addColorStop(0, "rgba(0,0,0,1)");
    grad.addColorStop(0.55, "rgba(0,0,0,1)");
    grad.addColorStop(0.85, "rgba(0,0,0,.35)");
    grad.addColorStop(1, "rgba(0,0,0,0)");
    tg.fillStyle = grad;
    tg.fillRect(0, 0, T, T);
    const mask = ctx.createPattern(tile, "repeat");

    function begin(color, dim = 0.07) {
      lo.setTransform(1, 0, 0, 1, 0, 0);
      lo.globalAlpha = 1;
      lo.setLineDash([]);
      lo.clearRect(0, 0, G, G);
      lo.fillStyle = color;
      lo.strokeStyle = color;
      lo.lineWidth = 1;
      if (dim > 0) { lo.globalAlpha = dim; lo.fillRect(0, 0, G, G); lo.globalAlpha = 1; }   // unlit LEDs
    }

    function present(bloom = 0.14) {
      ctx.globalCompositeOperation = "source-over";
      ctx.globalAlpha = 1;
      ctx.clearRect(0, 0, W, W);                       // transparent = see-through on the lens
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(loC, 0, 0, W, W);
      ctx.globalCompositeOperation = "destination-in"; // keep only the round dots
      ctx.fillStyle = mask;
      ctx.fillRect(0, 0, W, W);
      if (bloom > 0) {                                 // soft glow around lit dots
        ctx.globalCompositeOperation = "lighter";
        ctx.globalAlpha = bloom;
        ctx.imageSmoothingEnabled = true;
        ctx.drawImage(loC, 0, 0, W, W);
      }
      ctx.globalCompositeOperation = "source-over";
      ctx.globalAlpha = 1;
    }

    const tw = (s) => Math.max(0, String(s).length * 4 - 1);
    function text(str, x, y, a = 1) {
      const prev = lo.globalAlpha;
      lo.globalAlpha = a;
      x = Math.round(x); y = Math.round(y);
      for (const ch of String(str).toUpperCase()) {
        const g = FONT[ch];
        if (g) for (let r = 0; r < 5; r++) {
          const bits = g.charCodeAt(r) - 48;
          for (let c = 0; c < 3; c++) if (bits & (4 >> c)) lo.fillRect(x + c, y + r, 1, 1);
        }
        x += 4;
      }
      lo.globalAlpha = prev;
    }
    const textC = (s, cx, y, a) => text(s, Math.round(cx - tw(s) / 2), y, a);
    const textR = (s, rx, y, a) => text(s, rx - tw(s) + 1, y, a);

    return { lo, begin, present, text, textC, textR, tw };
  }

  /* ---------- head motion: DeviceOrientationEvent -> heading / pitch / roll ----------
     The glasses' sensor frame isn't documented, so three mappings are offered
     (swipe up/down in the apps). "A" treats the display like a phone held up
     in front of your eyes. The choice is shared by all the glasses apps. */
  function createMotion(onLive) {
    const AXES = [
      { name: "A", f: [0, 0, -1], u: [0, 1, 0] },
      { name: "B", f: [0, 1, 0],  u: [0, 0, 1] },
      { name: "C", f: [0, 0, 1],  u: [0, 1, 0] },
    ];
    let axis = (store.get("glasses.axis", 0) | 0) % AXES.length;
    let live = false, raw = null, needZero = true, zp = 0, zr = 0, zh = 0, listening = false;
    const att = { h: 0, p: 0, r: 0 };
    const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];

    function attitude(al, be, ga) {
      const cA = Math.cos(al * D2R), sA = Math.sin(al * D2R);
      const cB = Math.cos(be * D2R), sB = Math.sin(be * D2R);
      const cG = Math.cos(ga * D2R), sG = Math.sin(ga * D2R);
      const R = [                                   // W3C: R = Rz(alpha) Rx(beta) Ry(gamma)
        [cA * cG - sA * sB * sG, -sA * cB, cA * sG + sA * sB * cG],
        [sA * cG + cA * sB * sG,  cA * cB, sA * sG - cA * sB * cG],
        [-cB * sG,                sB,      cB * cG],
      ];
      const mul = (v) => R.map((row) => row[0] * v[0] + row[1] * v[1] + row[2] * v[2]);
      const ax = AXES[axis];
      const f = mul(ax.f), u = mul(ax.u), r = mul(cross(ax.f, ax.u));   // world: x east, y north, z up
      return {
        heading: wrap360(Math.atan2(f[0], f[1]) / D2R),
        pitch: Math.asin(clamp(f[2], -1, 1)) / D2R,   // + = looking up
        roll: Math.atan2(-r[2], u[2]) / D2R,          // + = head tilted right
      };
    }

    function onOrient(e) {
      if (e.alpha == null && e.beta == null && e.gamma == null) return;
      raw = [e.alpha || 0, e.beta || 0, e.gamma || 0];
      if (!live) { live = true; if (onLive) onLive(); }
    }
    let compass = null, compassAt = 0;
    function onAbsolute(e) {
      let h = null;
      if (typeof e.webkitCompassHeading === "number") h = e.webkitCompassHeading;      // iOS
      else if ((e.type === "deviceorientationabsolute" || e.absolute) && e.alpha != null) h = attitude(e.alpha, e.beta || 0, e.gamma || 0).heading;
      if (h === null) return;
      compass = compass === null ? h : wrap360(compass + angDiff(h, compass) * 0.25);
      compassAt = performance.now();
    }
    function listen() {
      if (listening) return;
      listening = true;
      window.addEventListener("deviceorientation", onOrient);
      window.addEventListener("deviceorientation", onAbsolute);
      window.addEventListener("deviceorientationabsolute", onAbsolute);
    }
    async function enable() {   // call from a pinch / tap
      try {
        if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") {
          const res = await DeviceOrientationEvent.requestPermission();
          if (res !== "granted") return "denied";
        }
      } catch (err) { return "error"; }
      listen();
      return "ok";
    }
    listen();   // works right away where no permission is needed

    function update(dt) {
      if (!live || !raw) return false;
      const a = attitude(raw[0], raw[1], raw[2]);
      if (needZero) {   // "level" = how you hold your head right now
        zp = a.pitch; zr = a.roll; zh = a.heading;
        att.h = a.heading; att.p = a.pitch; att.r = a.roll;
        needZero = false;
      }
      const k = 1 - Math.exp(-dt * 12);
      att.h = wrap360(att.h + angDiff(a.heading, att.h) * k);
      att.p += (a.pitch - att.p) * k;
      att.r = angDiff(att.r + angDiff(a.roll, att.r) * k, 0);
      return true;
    }

    return {
      get live() { return live; },
      get axisName() { return AXES[axis].name; },
      get heading() { return att.h; },
      get yaw() { return angDiff(att.h, zh); },     // look left (-) / right (+) since the last zero
      get compass() { return performance.now() - compassAt < 3000 ? compass : null; },   // true heading, if the device has one
      get pitch() { return att.p - zp; },
      get roll() { return angDiff(att.r, zr); },
      enable, update, attitude,
      zero() { needZero = true; },
      nextAxis(d) {
        axis = (axis + d + AXES.length) % AXES.length;
        store.set("glasses.axis", axis);
        needZero = true;
        return AXES[axis].name;
      },
    };
  }

  /* ---------- settings shared by the glasses apps (Settings app writes them) ---------- */
  const SETTINGS_DEFAULT = { compass: true, head: true, speed: 1, invert: false, color: 0, sounds: true, full: false, hidden: [] };
  // The same settings live on the server under the glasses' pairing code, so the control
  // panel at error.blue/hud can change them; the newest change wins.
  const CODE_ALPHA = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  function hudCode() {
    let c = store.get("glasses.code", null);
    if (typeof c !== "string" || !/^[A-HJ-NP-Z2-9]{6}$/.test(c)) {
      const b = new Uint8Array(6);
      crypto.getRandomValues(b);
      c = Array.from(b, (x) => CODE_ALPHA[x % CODE_ALPHA.length]).join("");
      store.set("glasses.code", c);
    }
    return c;
  }
  const SYNC_KEYS = ["compass", "head", "speed", "invert", "color", "sounds", "full", "hidden"];
  const pick = (v) => { const o = {}; for (const k of SYNC_KEYS) if (k in v) o[k] = v[k]; return o; };
  function push(v) {
    try {
      fetch("/api/hud/" + hudCode(), { method: "PUT", headers: { "content-type": "application/json" },
        body: JSON.stringify({ settings: pick(v), updated: v.updatedAt || Date.now() }) }).catch(() => {});
    } catch {}
  }
  const settings = {
    get() { return Object.assign({}, SETTINGS_DEFAULT, store.get("glasses.settings", {})); },
    set(v) {
      v = Object.assign({}, v, { updatedAt: Date.now() }); store.set("glasses.settings", v); push(v);
      if (window.GlassesPresence) GlassesPresence.sendSettings(pick(v), v.updatedAt);   // live to error.blue/hud
    },
    code: hudCode,
    async sync() {                               // -> true when the server had newer settings
      try {
        const r = await fetch("/api/hud/" + hudCode(), { cache: "no-store" });
        if (!r.ok) return false;
        const j = await r.json(), local = settings.get(), lt = local.updatedAt || 0;
        if (j.settings && j.updated > lt) {
          store.set("glasses.settings", Object.assign({}, local, j.settings, { updatedAt: j.updated }));
          return true;
        }
        if (lt > (j.updated || 0)) push(local);
      } catch {}
      return false;
    },
  };
  // DOS phosphor colours: main, bright, mid, dim, dark
  const DOS_PALETTES = [
    { name: "GREEN", c: "#33ff66", b: "#d2ffdc", m: "#22b84e", d: "#0e5f27", k: "#031c0b" },
    { name: "AMBER", c: "#ffb000", b: "#ffe6b0", m: "#b87c00", d: "#5c3e00", k: "#1c1300" },
    { name: "CYAN",  c: "#33e6ff", b: "#d0f8ff", m: "#1fa3ba", d: "#0d505c", k: "#03171c" },
    { name: "RED",   c: "#ff4848", b: "#ffd6d6", m: "#b82a2a", d: "#5c1212", k: "#1c0505" },
    { name: "WHITE", c: "#e6e6e6", b: "#ffffff", m: "#a3a3a3", d: "#4d4d4d", k: "#161616" },
  ];
  const dosPalette = (i) => {
    const n = DOS_PALETTES.length, k = i === undefined ? settings.get().color : i;
    return DOS_PALETTES[(((k | 0) % n) + n) % n];
  };

  /* ---------- tiny UI sounds (only when Settings > SOUNDS is on) ---------- */
  let sfxCtx = null;
  const SFX = {                 // [from Hz, to Hz, seconds, wave, volume]
    tick: [1500, 1500, 0.02, "square", 0.04], row: [650, 950, 0.05, "square", 0.045],
    open: [420, 1700, 0.17, "sawtooth", 0.05], on: [880, 1320, 0.07, "square", 0.045],
    off: [1320, 660, 0.07, "square", 0.045], back: [900, 380, 0.09, "square", 0.04],
  };
  function sfx(kind) {
    if (!settings.get().sounds) return;
    try {
      if (!sfxCtx) { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return; sfxCtx = new AC(); }
      if (sfxCtx.state === "suspended") sfxCtx.resume();
      const P = SFX[kind] || SFX.tick, t = sfxCtx.currentTime + 0.005;
      const o = sfxCtx.createOscillator(), g = sfxCtx.createGain();
      o.type = P[3]; o.frequency.setValueAtTime(P[0], t); o.frequency.exponentialRampToValueAtTime(P[1], t + P[2]);
      g.gain.setValueAtTime(P[4], t); g.gain.exponentialRampToValueAtTime(0.0001, t + P[2] + 0.03);
      o.connect(g); g.connect(sfxCtx.destination); o.start(t); o.stop(t + P[2] + 0.05);
    } catch {}
  }

  /* ---------- 30 fps loop ---------- */
  function loop(fn) {
    let last = performance.now();
    function frame(now) {
      requestAnimationFrame(frame);
      const ms = now - last;
      if (ms < 30) return;
      last = now;
      fn(Math.min(0.1, ms / 1000), now / 1000);
    }
    requestAnimationFrame(frame);
  }

  return { G, CX, CY, D2R, clamp, wrap360, angDiff, THEMES, store, createDisplay, createMotion, loop,
           settings, DOS_PALETTES, dosPalette, sfx };
})();

</script>
<script>
/* GLASSES HOME: a 3D app slider in a green DOS look.
   Swipe left/right = slide through a row of apps.  Swipe up/down = change row.
   Head motion (Settings > HEAD MOTION): turn your head = slide, tilt it up/down = change row.
   Above the top row sits a big digital clock.      Pinch = open the app (on the clock: 12/24 h).
   Every app icon is a small live 3D model. */
(() => {
  "use strict";
  const G = 300, CX = 150, F = 330;
  let CY = 122;                                                         // 150 in FULL SCREEN HUD (no bars)
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  let S = DM.settings.get();                                          // written by the Settings app
  CY = S.full ? 150 : 122;
  const PAL = DM.dosPalette(S.color);
  const GREEN = PAL.c, BRIGHT = PAL.b, MID = PAL.m, DIM = PAL.d, DARK = PAL.k;
  const hexRgb = (h) => [1, 3, 5].map((i) => parseInt(h.substr(i, 2), 16));
  const RGB = { c: hexRgb(PAL.c), b: hexRgb(PAL.b), d: hexRgb(PAL.d), k: hexRgb(PAL.k) };
  const mix = (a, b, t) => "rgb(" + a.map((v, i) => Math.round(v + (b[i] - v) * clamp(t, 0, 1))).join(",") + ")";
  const motion = DM.createMotion();
  const store = {
    get(k, f, s = localStorage) { try { const v = s.getItem(k); return v === null ? f : JSON.parse(v); } catch { return f; } },
    set(k, v, s = localStorage) { try { s.setItem(k, JSON.stringify(v)); } catch {} },
  };

  /* ---------------- apps ---------------- */
  const ALL_ROWS = [
    { name: "APPS", apps: [
      { id: "flight", file: "FLIGHT.EXE", desc: "WIREFRAME FLIGHT SIM", url: "/glasses/flight/" },
      { id: "synth",  file: "SYNTH.EXE",  desc: "SEQUENCER + DRUMS",    url: "/glasses/synth/" },
      { id: "hud",    file: "HUD.EXE",    desc: "HORIZON + TARGETS",    url: "/glasses/hud/" },
      { id: "snake",  file: "SNAKE.EXE",  desc: "CLASSIC SNAKE",        url: "/glasses/mini/?app=snake" },
      { id: "yaro",   file: "YARO.EXE",   desc: "YARO-VISSION: TAKE ORDERS", url: "/glasses/yaro/" },
      { id: "mykolai", file: "MYKOLAI.EXE", desc: "FIND GIFTS LEFT FOR YARO", url: "/glasses/mykolai/" },
      { id: "drunk",   file: "DRUNK.EXE",   desc: "HOW DRUNK? WALK + EGG TEST", url: "/glasses/drunk/" },
      { id: "devil",   file: "DEVIL.EXE",   desc: "RUN! THE DEVIL WALKS TO YOU", url: "/glasses/devil/" },
      { id: "room404", file: "ROOM404.EXE", desc: "3D ROOM: LOOK, WALK, GRAB", url: "/glasses/room404/" },
    ] },
    { name: "TOOLS", apps: [
      { id: "crumbs",  file: "CRUMBS.EXE",  desc: "BREADCRUMB TRAIL MAP", url: "/glasses/crumbs/" },
      { id: "geolock", file: "GEOLOCK.EXE", desc: "LOCK A SPOT, FIND IT AGAIN", url: "/glasses/geolock/" },
      { id: "spectrum", file: "SPECTRUM.EXE", desc: "SPECTRUM ANALYZER + FILTERS", url: "/glasses/spectrum/" },
      { id: "clock",   file: "CLOCK.EXE",   desc: "TIME AND DATE",        url: "/glasses/mini/?app=clock" },
      { id: "counter", file: "COUNTER.EXE", desc: "TALLY COUNTER",        url: "/glasses/mini/?app=counter" },
      { id: "dice",    file: "DICE.EXE",    desc: "ROLL 1-3 DICE",        url: "/glasses/mini/?app=dice" },
    ] },
    { name: "SYSTEM", apps: [
      { id: "settings", file: "SETUP.EXE", desc: "HUD SETTINGS", url: "/glasses/settings/" },
    ] },
  ];
  // apps hidden in Settings (or at error.blue/hud) stay off the home screen; SETUP always stays
  const hiddenKey = (v) => JSON.stringify((v.hidden || []).slice().sort());
  const ROWS = (() => {
    const hid = new Set(S.hidden || []);
    return ALL_ROWS.map((r) => ({ name: r.name, apps: r.apps.filter((a) => a.id === "settings" || !hid.has(a.id)) })).filter((r) => r.apps.length);
  })();
  store.set("glasses.catalog", ALL_ROWS.map((r) => ({ name: r.name, apps: r.apps.map((a) => ({ id: a.id, file: a.file, desc: a.desc })) })));
  const nav = store.get("home.nav", { row: 0, cols: [0, 0] }, sessionStorage);
  let row = clamp(nav.row | 0, -1, ROWS.length - 1);
  const cols = ROWS.map((r, i) => clamp((nav.cols && nav.cols[i]) | 0, 0, r.apps.length - 1));
  let rowA = row;
  const colA = cols.slice();
  let h12 = store.get("home.h12", false);

  /* ---------------- canvas ---------------- */
  const cv = document.getElementById("screen");
  const K = Math.min(3, Math.max(1, Math.round(window.devicePixelRatio || 1)));
  const W = 600 * K;
  cv.width = cv.height = W;
  const ctx = cv.getContext("2d");
  const loC = document.createElement("canvas"); loC.width = loC.height = G;
  const lo = loC.getContext("2d");
  const sl = document.createElement("canvas"); sl.width = 1; sl.height = 2 * K;          // scanlines
  const slg = sl.getContext("2d"); slg.fillStyle = "rgba(0,0,0,.38)"; slg.fillRect(0, K, 1, K);

    for (let i = 0; i < N; i++) { const j = (i + 1) % N; m.f.push({ i: [b + i * 2, b + j * 2, b + j * 2 + 1, b + i * 2 + 1], c: [0, 0, 0], k: "solid" }); }
    for (let t = 0; t < 8; t++) {                                   // teeth: boxes turned around the axle
      const a = (t / 8) * Math.PI * 2, R1 = rz(a), start = m.v.length, fs = box(m, 0.86, 0, 0, 0.36, 0.3, D * 1.9, "on");
      for (let k = start; k < m.v.length; k++) m.v[k] = ap(R1, m.v[k]);
      for (const f of fs) f.c = ap(R1, [0.86, 0, 0]);
    }
    box(m, 0, 0, 0, 0.32, 0.32, D * 2.6, "off");                     // axle
    return m;
  }
  const GEAR = gearMesh();

  // SPECTRUM: rolling 3D spectrum ridges
  function spectrumMesh(t) {
    const m = mesh(), R = 6, N = 14;
    for (let j = 0; j < R; j++) {
      const z = -0.8 + j * 0.32, b = m.v.length;
      for (let i = 0; i < N; i++) {
        const x = -1 + (i / (N - 1)) * 2, ph = t * 3 - j * 0.7;
        const h = 0.12 + 0.75 * Math.pow(Math.abs(Math.sin(i * 0.9 + ph) * Math.cos(i * 0.37 - ph * 0.6)), 1.5) * (1 - Math.abs(x) * 0.35);
        m.v.push([x, -0.6 + h * 1.5, z]);
      }
      for (let i = 0; i < N - 1; i++) m.l.push([b + i, b + i + 1, j === 0 ? "hot" : "ring"]);
      const k = m.v.length; m.v.push([-1, -0.6, z], [1, -0.6, z]); m.l.push([k, k + 1, "ring"]);
    }
    return m;
  }

  // YARO: an eyeball that looks around
  function eyeMesh(t) {
    const m = mesh(), N = 10, Mr = 6, R = 1.0;
    const look = mul(ry(Math.sin(t * 0.9) * 0.7), rx(Math.sin(t * 1.3) * 0.35));
    const b = m.v.length;
    for (let j = 0; j <= Mr; j++) for (let i = 0; i < N; i++) {
      const th = (j / Mr) * Math.PI, ph = (i / N) * Math.PI * 2;
      m.v.push(ap(look, [Math.sin(th) * Math.cos(ph) * R, Math.cos(th) * R, -Math.sin(th) * Math.sin(ph) * R]));
    }
    for (let j = 0; j < Mr; j++) for (let i = 0; i < N; i++) {
      const a = b + j * N + i, c = b + j * N + ((i + 1) % N);
      m.f.push({ i: [a, c, c + N, a + N], c: [0, 0, 0], k: "solid" });
    }
    // iris + pupil as a decal ring facing where the eye looks
    const ib = m.v.length, IR = 0.42, PR = 0.18;
    for (let i = 0; i < 12; i++) { const a = (i / 12) * Math.PI * 2; m.v.push(ap(look, [Math.cos(a) * IR, Math.sin(a) * IR, -0.93])); }
    for (let i = 0; i < 8; i++) { const a = (i / 8) * Math.PI * 2; m.v.push(ap(look, [Math.cos(a) * PR, Math.sin(a) * PR, -1.0])); }
    m.f.push({ i: [...Array(12).keys()].map((k) => ib + k), c: ap(look, [0, 0, 0]), k: "on" });
    m.f.push({ i: [...Array(8).keys()].map((k) => ib + 12 + k), c: ap(look, [0, 0, 0]), k: "off" });
    return m;
  }

  // MYKOLAI: a little Saint Nicholas statue with mitre, crozier and a blinking present
  function mykolaiMesh(t) {
    const m = mesh();
    box(m, 0, -0.9, 0, 1.0, 0.16, 1.0);
    box(m, 0, -0.62, 0, 0.78, 0.4, 0.78);
    box(m, 0, -0.28, 0, 0.64, 0.3, 0.64);
    box(m, 0, 0.0, 0, 0.5, 0.28, 0.5);
    box(m, 0, -0.42, -0.39, 0.14, 0.72, 0.04, "on");                      // the stole down the front
    box(m, 0, 0.32, 0, 0.32, 0.32, 0.32);
    box(m, 0, 0.2, -0.11, 0.3, 0.26, 0.14, "on");                         // beard
    box(m, 0, 0.62, 0, 0.3, 0.28, 0.24, "on");                            // mitre
    box(m, 0, 0.82, 0, 0.16, 0.14, 0.14, "on");
    box(m, 0.42, -0.12, 0, 0.07, 1.46, 0.07, "on");                       // crozier
    box(m, 0.5, 0.6, 0, 0.2, 0.07, 0.07, "on");
    box(m, 0.58, 0.52, 0, 0.07, 0.18, 0.07, "on");
    box(m, -0.38, -0.18, -0.16, 0.26, 0.26, 0.26, Math.floor(t * 2) % 2 ? "on" : "solid");   // the present
    return m;
  }

  // DEVIL: a horned head with burning slanted eyes and a grin, a pitchfork behind it
  function devilMesh(t) {
    const m = mesh();
    const rbox = (R, cx, cy, cz, sx, sy, sz, k) => {                 // a box turned by R (every part stays convex)
      const start = m.v.length, fs = box(m, 0, 0, 0, sx, sy, sz, k);
      for (let i = start; i < m.v.length; i++) { const w = ap(R, m.v[i]); m.v[i] = [w[0] + cx, w[1] + cy, w[2] + cz]; }
      for (const f of fs) f.c = [cx, cy, cz];
    };
    const decal = (pts) => { const b = m.v.length; m.v.push(...pts); return [b, b + 1, b + 2, b + 3]; };
    const skull = box(m, 0, 0.12, 0, 0.86, 0.8, 0.76);
    const jaw = box(m, 0, -0.42, -0.08, 0.5, 0.34, 0.56);
    box(m, 0, -0.74, -0.2, 0.16, 0.32, 0.16, "on");                    // goatee
    if ((t % 4.2) < 4.05) skull[4].dec = [-1, 1].map((sd) =>          // slanted eyes, outer ends up (they blink)
      decal([[sd * 0.07, 0.12, -0.385], [sd * 0.34, 0.25, -0.385], [sd * 0.34, 0.14, -0.385], [sd * 0.07, 0.03, -0.385]]));
    if (Math.sin(t * 9) > -0.6) jaw[4].dec = [decal([[-0.21, -0.27, -0.365], [0.21, -0.27, -0.365], [0.13, -0.36, -0.365], [-0.13, -0.36, -0.365]])];   // grin
    for (const sd of [-1, 1]) {
      rbox(rz(-sd * 0.75), sd * 0.4, 0.62, 0, 0.22, 0.3, 0.22, "solid");                    // horns: out, up, in
      rbox(rz(-sd * 0.25), sd * 0.56, 0.88, 0, 0.16, 0.28, 0.16, "solid");
      rbox(rz(sd * 0.3), sd * 0.58, 1.12, 0, 0.1, 0.24, 0.1, "on");
      rbox(rz(-sd * 1.2), sd * 0.5, 0.18, 0.05, 0.12, 0.3, 0.06, "solid");                 // pointed ears
    }
    const fx = 0.78, fz = 0.45;                                        // the pitchfork behind
    box(m, fx, -0.1, fz, 0.07, 1.9, 0.07, "solid");
    box(m, fx, 0.85, fz, 0.5, 0.07, 0.07, "solid");
    for (const dx of [-0.21, 0, 0.21]) box(m, fx + dx, 1.04, fz, 0.06, dx ? 0.32 : 0.42, 0.06, "on");
    return m;
  }

  // ROOM404: a little room seen from above: low walls, a door, a table and a cube being carried
  function roomMesh(t) {
    const m = mesh();
    box(m, 0, -0.62, 0, 2.0, 0.08, 2.0, "off");                      // floor
    box(m, 0, -0.18, 0.97, 2.0, 0.8, 0.06, "solid");                 // back wall
    box(m, -0.97, -0.18, 0.03, 0.06, 0.8, 1.94, "solid");            // left wall
    box(m, 0.1, -0.06, 0.93, 0.7, 0.36, 0.02, "off");                // window
    box(m, -0.93, -0.3, -0.45, 0.02, 0.56, 0.36, "on");              // door
    box(m, 0.15, -0.3, 0.05, 0.95, 0.06, 0.6, "solid");              // table top
    for (const x of [-0.25, 0.55]) for (const z of [-0.17, 0.27]) box(m, x, -0.46, z, 0.06, 0.26, 0.06, "solid");
    const hop = Math.abs(Math.sin(t * 1.8)) * 0.42;                  // the cube hops off the table and back
    box(m, 0.32, -0.15 + hop, 0.02, 0.22, 0.22, 0.22, "on");
    return m;
  }

  function iconFor(id, t, now) {
    switch (id) {
      case "dice":    return [diceMesh, mul(ry(t * 0.9), mul(rx(t * 0.6), rz(t * 0.3))), 0.33];
      case "clock":   return [clockMesh(now), mul(ry(Math.sin(t * 0.8) * 0.6), rx(Math.sin(t * 0.5) * 0.2)), 0.4];
      case "counter": return [counterMesh(Math.floor(t) % 10), ry(Math.sin(t * 1.2) * 0.7), 0.32];
      case "snake":   return [snakeMesh(t), mul(rx(0.35), ry(t * 0.5)), 0.3];
      case "hud":     return [hudMesh(t), mul(ry(Math.sin(t * 0.4) * 0.4), rx(0.15)), 0.38];
      case "flight":  return [planeMesh, mul(rx(0.45), mul(ry(t * 0.7 + 2.2), mul(rx(Math.sin(t * 1.4) * 0.5), rz(Math.sin(t * 0.9) * 0.2 + 0.15)))), 0.4];
      case "synth":   return [synthMesh(t), mul(rx(0.38), ry(Math.sin(t * 0.6) * 0.6)), 0.37];
      case "crumbs":  return [crumbsMesh(t), mul(rx(0.55), ry(t * 0.35)), 0.36];
      case "geolock": return [geolockMesh(t), rx(-0.6), 0.36];
      case "drunk":   return [drunkMesh(t), mul(rx(0.55), ry(Math.sin(t * 0.5) * 0.5)), 0.4];
      case "yaro":    return [eyeMesh(t), ry(Math.sin(t * 0.3) * 0.3), 0.4];
      case "spectrum": return [spectrumMesh(t), mul(rx(0.45), ry(Math.sin(t * 0.5) * 0.6)), 0.34];
      case "settings": return [GEAR, mul(rx(0.5 + Math.sin(t * 0.6) * 0.2), mul(ry(Math.sin(t * 0.4) * 0.5), rz(t * 0.8))), 0.42];
      case "mykolai": return [mykolaiMesh(t), mul(rx(0.2), ry(Math.sin(t * 0.7) * 0.7)), 0.4];
      case "devil":   return [devilMesh(t), mul(ry(Math.sin(t * 0.6) * 0.32), rx(0.1 + Math.sin(t * 0.9) * 0.06)), 0.37];
      case "room404": return [roomMesh(t), mul(rx(-0.5), ry(0.62 + Math.sin(t * 0.5) * 0.3)), 0.36];
    }
  }

  /* ---------------- 3D drawing ---------------- */
  function poly(pts, fill, stroke, a, lw = 1) {
    lo.globalAlpha = a;
    lo.beginPath();
    pts.forEach((p, i) => (i ? lo.lineTo(p[0], p[1]) : lo.moveTo(p[0], p[1])));
    lo.closePath();
    if (fill) { lo.fillStyle = fill; lo.fill(); }
    if (stroke) { lo.strokeStyle = stroke; lo.lineWidth = lw; lo.stroke(); }
    lo.globalAlpha = 1;
  }
  function shadeColor(kind, s) {
    if (kind === "on") return mix(RGB.c, RGB.b, 0.2 + 0.8 * s);
    if (kind === "off") return mix(RGB.k, RGB.d, 0.3 + 0.5 * s);
    return mix(RGB.k, RGB.c, 0.12 + 0.72 * s);
  }
  function drawMesh(m, M, scale, P, alpha) {
    const vs = m.v.map((v) => { const w = ap(M, v); return [w[0] * scale + P[0], w[1] * scale + P[1], w[2] * scale + P[2]]; });
    const faces = [];
    for (const f of m.f) {
      const pts = f.i.map((k) => vs[k]);
      let n = cross(sub(pts[1], pts[0]), sub(pts[2], pts[0]));
      const fc = [0, 0, 0];
      for (const p of pts) { fc[0] += p[0] / pts.length; fc[1] += p[1] / pts.length; fc[2] += p[2] / pts.length; }
      const pcw = ap(M, f.c), pc = [pcw[0] * scale + P[0], pcw[1] * scale + P[1], pcw[2] * scale + P[2]];
      if (dot(n, sub(fc, pc)) < 0) n = [-n[0], -n[1], -n[2]];
      let facing = dot(n, fc) < 0;
      if (!facing && !f.two) continue;
      if (!facing) n = [-n[0], -n[1], -n[2]];
      const s = Math.max(0, dot(norm(n), LIGHT));
      faces.push({ f, pts, z: fc[2], s });
    }
    faces.sort((a, b) => b.z - a.z);
    for (const { f, pts, s } of faces) {
      const pp = pts.map(proj);
      poly(pp, shadeColor(f.k, s), f.k === "off" ? DIM : GREEN, alpha * (f.k === "off" ? 0.8 : 1));
      if (f.dec) for (const d of f.dec) poly(d.map((k) => proj(vs[k])), BRIGHT, null, alpha);
      if (f.decL) {
        lo.strokeStyle = BRIGHT; lo.globalAlpha = alpha; lo.lineWidth = 1.5;
        lo.beginPath();
        for (const [a2, b2] of f.decL) { const p0 = proj(vs[a2]), p1 = proj(vs[b2]); lo.moveTo(p0[0], p0[1]); lo.lineTo(p1[0], p1[1]); }
        lo.stroke(); lo.lineWidth = 1; lo.globalAlpha = 1;
      }
    }
    for (const [i, j, k] of m.l) {
      const a3 = vs[i], b3 = vs[j], p0 = proj(a3), p1 = proj(b3);
      const depth = clamp(1.4 - ((a3[2] + b3[2]) / 2 - P[2]) * 2.2, 0.25, 1);
      lo.strokeStyle = k === "hot" ? BRIGHT : GREEN; lo.globalAlpha = alpha * (k === "hot" ? 1 : depth);
      lo.lineWidth = k === "hot" ? 1.5 : 1.2;
      lo.beginPath(); lo.moveTo(p0[0], p0[1]); lo.lineTo(p1[0], p1[1]); lo.stroke();
    }
    lo.globalAlpha = 1; lo.lineWidth = 1;
  }

  /* ---------------- cards ---------------- */
  function pose(dc, dr) {
    const adc = Math.abs(dc), adr = Math.abs(dr);
    return {
      P: [dc * 1.18, -dr * 1.35, 3.0 + Math.min(adc, 2.5) * 0.85 + adr * 1.4],
      M: mul(ry(clamp(-dc, -1, 1) * 0.95), rx(clamp(-dr, -1, 1) * 0.6)),
      a: clamp(1.15 - adc * 0.3 - adr * 0.5, 0.06, 1),
      focus: Math.max(0, 1 - Math.hypot(dc, dr) * 1.6),
    };
  }
  function frameQuad(M, P, hw, hh, dz = 0) {
    return [[-hw, hh], [hw, hh], [hw, -hh], [-hw, -hh]].map(([x, y]) => { const w = ap(M, [x, y, dz]); return proj([w[0] + P[0], w[1] + P[1], w[2] + P[2]]); });
  }
  function drawCard(app, ps, t, now) {
    const { P, M, a, focus } = ps;
    const q = frameQuad(M, P, 0.56, 0.56);
    poly(q, DARK, focus > 0.5 ? GREEN : MID, a * 0.92, focus > 0.5 ? 1.5 : 1);
    if (focus > 0.5) {
      poly(frameQuad(M, P, 0.5, 0.5, -0.001), null, GREEN, a * 0.6);
      // corner brackets that breathe
      const g = 0.6 + 0.08 * Math.sin(t * 4);
      const corners = frameQuad(M, P, g, g, -0.01);
      lo.strokeStyle = BRIGHT; lo.globalAlpha = a; lo.lineWidth = 2;
      for (let i = 0; i < 4; i++) {
        const c = corners[i], n1 = corners[(i + 1) % 4], n0 = corners[(i + 3) % 4];
        lo.beginPath();
        lo.moveTo(c[0] + (n0[0] - c[0]) * 0.18, c[1] + (n0[1] - c[1]) * 0.18); lo.lineTo(c[0], c[1]);
        lo.lineTo(c[0] + (n1[0] - c[0]) * 0.18, c[1] + (n1[1] - c[1]) * 0.18);
        lo.stroke();
      }
      lo.lineWidth = 1; lo.globalAlpha = 1;
    }
    const [m, Ma, sc] = iconFor(app.id, t + app.id.length, now);
    const pc = ap(M, [0, 0.02, -0.25]);
    drawMesh(m, mul(M, Ma), sc * (1 + 0.15 * focus), [P[0] + pc[0], P[1] + pc[1], P[2] + pc[2]], a);
    if (focus < 0.5 && a > 0.25 && ps.sameRow) {                         // small name tag under side cards
      const tag = frameQuad(M, P, 0, 0.66)[2];
      textC(app.id.toUpperCase(), tag[0], tag[1], MID, a * 0.8);
    } else if (S.full && focus > 0.5) {                                    // full screen: the name under the card in view
      const tag = frameQuad(M, P, 0, 0.7)[2];
      textC(app.file, tag[0], tag[1], BRIGHT, a);
    }
  }

  // big 7-segment clock panel
  function segPolys(x, y, w, h, t) {   // hexagon segments of one digit cell (panel units, y up)
    const g = t * 0.12, hw = t / 2;
    const H = (x0, x1, yy) => [[x0 + g, yy], [x0 + g + hw, yy + hw], [x1 - g - hw, yy + hw], [x1 - g, yy], [x1 - g - hw, yy - hw], [x0 + g + hw, yy - hw]];
    const V = (xx, y0, y1) => [[xx, y0 - g], [xx + hw, y0 - g - hw], [xx + hw, y1 + g + hw], [xx, y1 + g], [xx - hw, y1 + g + hw], [xx - hw, y0 - g - hw]];
    const L = x + hw, R = x + w - hw, T = y - hw, B = y - h + hw, Mi = y - h / 2;
    return { a: H(L, R, T), b: V(R, T, Mi), c: V(R, Mi, B), d: H(L, R, B), e: V(L, Mi, B), f: V(L, T, Mi), g: H(L, R, Mi) };
  }
  function drawClockPanel(ps, t, now) {
    const { P, M, a, focus } = ps;
    const sc = S.compass ? 0.88 : 1;                                   // a little smaller when the compass sits below
    const place = (u, v) => { const w = ap(M, [u * sc, v * sc, 0]); return proj([w[0] + P[0], w[1] + P[1], w[2] + P[2]]); };
    poly(frameQuad(M, P, 1.25 * sc, 0.7 * sc), DARK, focus > 0.5 ? GREEN : MID, a * 0.92, 1.5);
    poly(frameQuad(M, P, 1.19 * sc, 0.64 * sc), null, GREEN, a * 0.45);
    let hh = now.getHours();
    const pm = hh >= 12;
    if (h12) hh = hh % 12 || 12;
    const digits = String(hh).padStart(2, "0") + String(now.getMinutes()).padStart(2, "0");
    const w = 0.42, h = 0.78, th = 0.1, gap = 0.1, colon = 0.18;
    const total = 4 * w + 2 * gap + colon + gap * 0;
    let x = -total / 2;
    const y = 0.5;
    for (let i = 0; i < 4; i++) {
      const segs = segPolys(x, y, w, h, th), on = SEG7[digits[i]];
      for (const [k, pts] of Object.entries(segs)) {
        const lit = on.includes(k) && !(i === 0 && h12 && digits[0] === "0");
        poly(pts.map(([u, v]) => place(u, v)), lit ? GREEN : DIM, lit ? BRIGHT : null, a * (lit ? 1 : 0.35));
      }
      x += w + (i === 1 ? colon + gap : gap);
      if (i === 1) {
        const cx = x - colon / 2 - gap / 2, blink = now.getMilliseconds() < 500;
        for (const cy of [y - h * 0.3, y - h * 0.7]) {
          const s = th * 0.6;
          poly([[cx - s, cy - s], [cx + s, cy - s], [cx + s, cy + s], [cx - s, cy + s]].map(([u, v]) => place(u, v)), blink ? GREEN : DIM, null, a);
        }
      }
    }
    // seconds: 60 ticks along the bottom
    const sec = now.getSeconds();
    for (let i = 0; i < 60; i++) {
      const u = -1.05 + (i / 59) * 2.1, v = -0.48;
      const p0 = place(u, v), p1 = place(u, v - (i % 5 === 0 ? 0.1 : 0.06));
      lo.strokeStyle = i <= sec ? GREEN : DIM; lo.globalAlpha = a * (i === sec ? 1 : i < sec ? 0.75 : 0.45);
      lo.beginPath(); lo.moveTo(p0[0], p0[1]); lo.lineTo(p1[0], p1[1]); lo.stroke();
    }
    lo.globalAlpha = 1;
    if (h12) { const p = place(1.08, 0.5); text(pm ? "PM" : "AM", p[0] - 16, p[1], GREEN, a); }
    const ca = a * clamp(focus * 1.6 - 0.2, 0, 1);                   // only when you look at the clock
    if (S.compass && ca > 0.03) drawCompassTape(place, ca);
  }

  // compass under the clock: tick lines on a drum that turns with your head
  const compassHeading = () => (motion.compass !== null ? motion.compass : motion.live ? motion.heading : null);
  function drawCompassTape(place, a) {
    const hd = compassHeading(), abs = motion.compass !== null;
    const spin = hd === null ? clock * 25 : hd;                        // no sensors: idle spin so you can see it
    for (let deg = 0; deg < 360; deg += 10) {
      const rel = DM.angDiff(deg, spin) * Math.PI / 180;
      if (Math.abs(rel) > 1.45) continue;
      const u = Math.sin(rel) * 1.2, fade = Math.cos(rel), major = deg % 30 === 0;
      const p0 = place(u, -0.8), p1 = place(u, major ? -0.97 : -0.9);
      lo.strokeStyle = major ? GREEN : MID; lo.globalAlpha = a * fade * (hd === null ? 0.5 : 1); lo.lineWidth = major ? 1.5 : 1;
      lo.beginPath(); lo.moveTo(p0[0], p0[1]); lo.lineTo(p1[0], p1[1]); lo.stroke();
      if (major && abs && fade > 0.35) {
        const lbl = { 0: "N", 90: "E", 180: "S", 270: "W" }[deg] || String(deg / 10);
        const q = place(u, -0.99);
        text(lbl, q[0] - textW(lbl) / 2, q[1], deg % 90 === 0 ? BRIGHT : GREEN, a * fade);
      }
    }
    lo.lineWidth = 1; lo.globalAlpha = 1;
    const c0 = place(0, -0.76), c1 = place(-0.04, -0.7), c2 = place(0.04, -0.7);     // centre marker
    poly([c0, c1, c2], BRIGHT, null, a);
  }

  /* ---------------- background + chrome ---------------- */
  const dots = (y0, y1) => {
    const c = document.createElement("canvas"); c.width = c.height = G;
    const g = c.getContext("2d"); g.fillStyle = DIM;
    for (let y = y0; y < y1; y += 12) for (let x = 6; x < G; x += 12) { g.globalAlpha = 0.35; g.fillRect(x, y, 1, 1); }
    return c;
  };
  const bg = dots(26, 226), bgFull = dots(6, G);                       // FULL SCREEN HUD: dots all the way

  const DAYS = ["SUNDAY", "MONDAY", "TUESDAY", "WEDNESDAY", "THURSDAY", "FRIDAY", "SATURDAY"];
  const MONTHS = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
  const pad = (n) => String(n).padStart(2, "0");

  function drawChrome(t, now) {
    if (S.full) return;                                                 // FULL SCREEN HUD: only the 3D grid, clock and compass
    // top bar: DOS prompt + small clock
    lo.fillStyle = "#000"; lo.fillRect(0, 0, G, 19);
    const cur = Math.floor(t * 2) % 2 ? "_" : " ";
    const where = row < 0 ? "TIME" : ROWS[row].name;
    text("C:\\GLASSES\\" + where + ">" + cur, 4, 3, GREEN);
    if (row >= 0) text(pad(now.getHours()) + ":" + pad(now.getMinutes()), G - 46, 3, MID);
    if (headActive()) text("HEAD", G - (row >= 0 ? 88 : 40), 3, BRIGHT, 0.8);
    lo.fillStyle = DIM; lo.fillRect(0, 19, G, 1);

    // row indicator on the right edge
    for (let r = -1; r < ROWS.length; r++) {
      const y = 100 + (r + 1) * 14, on = r === row;
      lo.fillStyle = on ? GREEN : DIM; lo.fillRect(G - 7, y, 4, on ? 8 : 4);
    }

    // bottom panel
    lo.fillStyle = "#000"; lo.globalAlpha = 0.85; lo.fillRect(0, 222, G, 78); lo.globalAlpha = 1;
    lo.fillStyle = DIM; lo.fillRect(0, 222, G, 1);
    if (row < 0) {
      text("> TIME" + (Math.floor(t * 2) % 2 ? "_" : ""), 8, 228, BRIGHT);
      text(`${DAYS[now.getDay()]} ${pad(now.getDate())} ${MONTHS[now.getMonth()]} ${now.getFullYear()}`, 8, 246, GREEN);
      const hd = S.compass ? compassHeading() : null;
      if (hd !== null) text("HEADING " + String(Math.round(hd) % 360).padStart(3, "0") + (motion.compass !== null ? "" : " (REL)"), 8, 260, MID);
      text("PINCH: " + (h12 ? "24H" : "12H") + (headActive() ? "  LOOK DOWN: APPS" : "   V APPS"), 8, 276, MID);
    } else {
      const app = ROWS[row].apps[cols[row]];
      text("> " + app.file + (Math.floor(t * 2) % 2 ? "_" : ""), 8, 228, BRIGHT);
      text(app.desc, 8, 246, GREEN);
      // position dots for the row
      const n = ROWS[row].apps.length;
      for (let i = 0; i < n; i++) { lo.fillStyle = i === cols[row] ? GREEN : DIM; lo.fillRect(G - 12 - (n - i) * 10, 251, i === cols[row] ? 6 : 4, i === cols[row] ? 6 : 4); }
      text(headActive() ? "PINCH RUN   LOOK AROUND OR SWIPE" : "PINCH RUN  <> SLIDE  ^V ROW", 8, 276, MID);
    }
  }

  /* ---------------- frame ---------------- */
  let clock = 0, launching = null;
  function draw(dt) {
    const now = new Date();
    lo.setTransform(1, 0, 0, 1, 0, 0);
    lo.clearRect(0, 0, G, G);
    CY += ((S.full ? 150 : 122) - CY) * 0.25;                            // glides when the setting changes
    lo.drawImage(S.full ? bgFull : bg, 0, 0);
    const items = [];
    for (let r = -1; r < ROWS.length; r++) {
      const dr = r - rowA;
      if (Math.abs(dr) > 1.9) continue;
      if (r < 0) {
        const ps = pose(0, dr);
        if (S.compass) ps.P[1] += 0.24 * clamp(1 - Math.abs(dr), 0, 1);   // lift it so the compass fits underneath
        items.push({ kind: "clock", ps }); continue;
      }
      ROWS[r].apps.forEach((app, c) => {
        const dc = c - colA[r];
        if (Math.abs(dc) > 2.6) return;
        const ps = pose(dc, dr); ps.sameRow = Math.abs(dr) < 0.5;
        items.push({ kind: "app", app, ps });
      });
    }
    if (launching) {                                                       // zoom the chosen card toward you
      const k = clamp((clock - launching.t0) / 0.35, 0, 1);
      for (const it of items) if (it.app === launching.app) { it.ps.P[2] -= 1.9 * k * k; it.ps.focus = 1; }
    }
    items.sort((a, b) => b.ps.P[2] - a.ps.P[2]);
    for (const it of items) it.kind === "clock" ? drawClockPanel(it.ps, clock, now) : drawCard(it.app, it.ps, clock, now);
    drawChrome(clock, now);
    if (launching) { lo.fillStyle = GREEN; lo.globalAlpha = clamp((clock - launching.t0) / 0.35, 0, 1) * 0.35; lo.fillRect(0, 0, G, G); lo.globalAlpha = 1; }

    ctx.globalCompositeOperation = "source-over";
    ctx.clearRect(0, 0, W, W);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(loC, 0, 0, W, W);
    ctx.globalCompositeOperation = "destination-out";
    ctx.fillStyle = scan; ctx.fillRect(0, 0, W, W);
    ctx.globalCompositeOperation = "lighter";                            // phosphor glow
    ctx.globalAlpha = 0.22; ctx.imageSmoothingEnabled = true;
    ctx.drawImage(loC, 0, 0, W, W);
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
  }

  /* ---------------- input ---------------- */
  function saveNav() { store.set("home.nav", { row, cols }, sessionStorage); }
  function move(dx, dy) {
    if (launching) return;
    const r0 = row, c0 = row >= 0 ? cols[row] : 0;
    if (dy) row = clamp(row + dy, -1, ROWS.length - 1);
    if (dx && row >= 0) cols[row] = clamp(cols[row] + dx, 0, ROWS[row].apps.length - 1);
    if (row !== r0) DM.sfx("row"); else if (row >= 0 && cols[row] !== c0) DM.sfx("tick");
    anchorHead();
    saveNav();
  }

  /* ---------------- head motion: turn = slide, tilt up/down = rows ---------------- */
  const SPEEDS = [[26, 20], [18, 14], [12, 10]];                       // degrees per card / per row
  let refCol = 0, refRow = 0, headLive = false, headCol = null, headRow = null;
  const headActive = () => S.head && motion.live && !launching;
  function headPose() {
    const inv = S.invert ? -1 : 1, sp = SPEEDS[S.speed] || SPEEDS[1];
    return { yaw: motion.yaw * inv, pit: motion.pitch * inv, sh: sp[0], sv: sp[1] };
  }
  function anchorHead() {                                               // the head pose right now = the current card
    if (!headActive()) return;
    const { yaw, pit, sh, sv } = headPose();
    refRow = row + pit / sv;
    refCol = (row >= 0 ? cols[row] : 0) - yaw / sh;
  }
  function headControl() {
    if (!headActive()) { headLive = false; headCol = headRow = null; return; }
    if (!headLive) { headLive = true; anchorHead(); }
    const { yaw, pit, sh, sv } = headPose();
    // rows: look up = row above (the clock is above the top row)
    let v = refRow - pit / sv;
    const vmin = -1 - 0.6, vmax = ROWS.length - 1 + 0.6;
    if (v < vmin) { refRow += vmin - v; v = vmin; }                     // sticky edges: no dead zone past the ends
    if (v > vmax) { refRow -= v - vmax; v = vmax; }
    const nr = clamp(Math.round(v), -1, ROWS.length - 1);
    if (nr !== row && Math.abs(v - row) > 0.62) {
      row = nr; DM.sfx("row");
      refCol = (row >= 0 ? cols[row] : 0) - yaw / sh;
      saveNav();
    }
    headRow = clamp(v, -1.25, ROWS.length - 0.75);
    if (row < 0) { headCol = null; return; }
    const n = ROWS[row].apps.length;
    let u = refCol + yaw / sh;
    const umin = -0.6, umax = n - 1 + 0.6;
    if (u < umin) { refCol += umin - u; u = umin; }
    if (u > umax) { refCol -= u - umax; u = umax; }
    const nc = clamp(Math.round(u), 0, n - 1);
    if (nc !== cols[row] && Math.abs(u - cols[row]) > 0.62) { cols[row] = nc; DM.sfx("tick"); saveNav(); }
    headCol = clamp(u, -0.3, n - 0.7);
  }
  function select() {
    if (launching) return;
    if (row < 0) { h12 = !h12; store.set("home.h12", h12); DM.sfx(h12 ? "on" : "off"); return; }
    const app = ROWS[row].apps[cols[row]];
    saveNav();
    DM.sfx("open");
    launching = { app, t0: clock };
    setTimeout(() => { location.href = app.url; }, 360);
  }
  document.addEventListener("keydown", (e) => {
    const k = e.key;
    if (S.head && !motion.live) motion.enable();                       // sensor permission comes from a gesture
    const map = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
    if (map[k]) { e.preventDefault(); move(...map[k]); }
    else if (k === "Enter") { e.preventDefault(); if (!e.repeat) select(); }
    else if (k === "Escape") { e.preventDefault(); DM.sfx("back"); history.back(); }
  });
  // previewing on a phone or computer: swipe / wheel / tap
  let touch = null;
  cv.addEventListener("touchstart", (e) => { const t = e.changedTouches[0]; touch = { x: t.clientX, y: t.clientY }; }, { passive: true });
  cv.addEventListener("touchend", (e) => {
    if (!touch) return;
    const t = e.changedTouches[0], dx = t.clientX - touch.x, dy = t.clientY - touch.y;
    touch = null;
    if (Math.hypot(dx, dy) < 20) { select(); e.preventDefault(); return; }
    if (Math.abs(dx) > Math.abs(dy)) move(dx < 0 ? 1 : -1, 0); else move(0, dy < 0 ? 1 : -1);
    e.preventDefault();
  });
  cv.addEventListener("click", (e) => { if (e.pointerType !== "touch" && e.detail) select(); });
  let wheelAt = 0;
  cv.addEventListener("wheel", (e) => {
    e.preventDefault();
    if (performance.now() - wheelAt < 250) return;
    wheelAt = performance.now();
    if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) move(e.deltaX > 0 ? 1 : -1, 0); else move(0, e.deltaY > 0 ? 1 : -1);
  }, { passive: false });
  function applyFresh() {                                               // settings changed (Settings app or the panel)
    const fresh = DM.settings.get();
    if (fresh.color !== S.color || hiddenKey(fresh) !== hiddenKey(S)) { location.reload(); return; }
    S = fresh;
  }
  window.addEventListener("pageshow", (e) => {
    if (!e.persisted) return;
    launching = null;
    applyFresh();
    DM.settings.sync().then((changed) => changed && applyFresh());
    motion.zero(); headLive = false;                                    // where you look now = the card you left from
  });
  // changes made at error.blue/hud: live over the panel link, plus a check on start and every 30 s
  if (window.GlassesPresence) GlassesPresence.onSettings(() => { if (!launching) applyFresh(); });
  DM.settings.sync().then((changed) => changed && applyFresh());
  setInterval(() => { if (!document.hidden && !launching) DM.settings.sync().then((changed) => changed && applyFresh()); }, 30000);

  /* ---------------- loop (30 Hz) ---------------- */
  let last = performance.now();
  function frame(now) {
    requestAnimationFrame(frame);
    const ms = now - last;
    if (ms < 30) return;
    last = now;
    const dt = Math.min(0.1, ms / 1000);
    clock += dt;
    motion.update(dt);
    headControl();
    if (window.GlassesPresence) GlassesPresence.focus(row < 0 ? "time" : ROWS[row].apps[cols[row]].id);
    const k = 1 - Math.exp(-dt * 9);
    rowA += ((headRow !== null ? headRow : row) - rowA) * k;
    for (let r = 0; r < ROWS.length; r++) colA[r] += ((headCol !== null && r === row ? headCol : cols[r]) - colA[r]) * k;
    draw(dt);
  }
  requestAnimationFrame(frame);

  // the control panel (error.blue/hud) drives its live preview of this screen with goto()
  function goto(id) {
    if (id === "time") { row = -1; saveNav(); return true; }
    for (let r = 0; r < ROWS.length; r++) {
      const c = ROWS[r].apps.findIndex((a) => a.id === id);
      if (c >= 0) { if (row !== r || cols[r] !== c) DM.sfx("tick"); row = r; cols[r] = c; anchorHead(); saveNav(); return true; }
    }
    return false;
  }
  window.__home = { get row() { return row; }, cols, ROWS, move, select, goto, get launching() { return launching; }, motion, get S() { return S; },
    get focus() { return row < 0 ? "time" : ROWS[row].apps[cols[row]].id; } };
})();
</script>
</body>
</html>
