<style>
  /* The lens is an additive display: pure black is see-through,
     so the background stays black and everything visible is bright. */
  :root {
    --text:   #ffffff;
    --dim:    #a9bccf;
    --cyan:   #4de8ff;
    --yellow: #ffd84d;
    --green:  #5cff8a;
    --pink:   #ff5ca8;
    --panel:  #121a24;   /* very dark = almost invisible on the lens */
    --edge:   #33495f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #000; }
  body {
    width: 600px;
    height: 600px;
    overflow: hidden;
    position: relative;
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 20px;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .screen {
    position: absolute; inset: 0;
    display: none;
    flex-direction: column; align-items: center; justify-content: center;
    padding: 32px;
  }
  .screen.active { display: flex; }

  .hint {
    position: absolute; left: 0; right: 0; bottom: 22px;
    text-align: center; font-size: 18px; color: var(--dim);
  }
  .title { font-size: 28px; font-weight: 700; color: var(--cyan); margin-bottom: 24px; letter-spacing: .5px; }

  /* ---------- Menu ---------- */
  .grid { display: grid; grid-template-columns: repeat(4, 130px); gap: 12px; }
  .tile {
    width: 130px; height: 150px;
    background: var(--panel);
    border: 3px solid var(--edge);
    border-radius: 24px;
    color: var(--text); font: inherit;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    outline: none; cursor: pointer;
    transition: transform .12s, border-color .12s, box-shadow .12s;
  }
  .tile .ico { font-size: 46px; line-height: 1; }
  .tile .lbl { font-size: 20px; font-weight: 600; }
  .tile:focus {
    border-color: var(--cyan);
    box-shadow: 0 0 0 4px rgba(77, 232, 255, .35);
    transform: scale(1.04);
  }

  /* ---------- Clock ---------- */
  .clock-time { font-size: 136px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
  .clock-sec  { font-size: 40px; color: var(--cyan); margin-top: 8px; font-variant-numeric: tabular-nums; }
  .clock-date { font-size: 26px; color: var(--yellow); margin-top: 28px; }

  /* ---------- Counter ---------- */
  .count {
    font-size: 180px; font-weight: 800; line-height: 1; color: var(--green);
    font-variant-numeric: tabular-nums; transition: transform .1s;
  }
  .count.bump { transform: scale(1.12); }
  .count-label { font-size: 24px; color: var(--dim); margin-top: 16px; }

  /* ---------- Dice ---------- */
  .dice-row { display: flex; gap: 20px; }
  .die {
    background: var(--panel);
    border: 4px solid var(--yellow);
    border-radius: 24px;
    display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
  }
  .die span { display: flex; align-items: center; justify-content: center; }
  .die span.on::after { content: ""; width: var(--pip); height: var(--pip); border-radius: 50%; background: #fff; }
  .die.rolling { border-color: var(--pink); }
  .dice-total { font-size: 30px; margin-top: 28px; color: var(--yellow); font-weight: 700; }

  /* ---------- Snake ---------- */
  #snake { justify-content: flex-start; padding-top: 22px; }
  .snake-score { font-size: 24px; height: 36px; color: var(--dim); }
  .snake-score b { color: var(--green); }
  #snakeCanvas { width: 450px; height: 450px; margin-top: 12px; }
</style>
<script src="/glasses/presence.js" data-app="mini"></script>
</head>
<body>

<!-- MENU -->
<section class="screen active" id="menu">
  <div class="title">Mini Hub</div>
  <div class="grid">
    <button class="tile focusable" data-go="clock"><span class="ico">🕒</span><span class="lbl">Clock</span></button>
    <button class="tile focusable" data-go="counter"><span class="ico">➕</span><span class="lbl">Counter</span></button>
    <button class="tile focusable" data-go="dice"><span class="ico">🎲</span><span class="lbl">Dice</span></button>
    <button class="tile focusable" data-go="snake"><span class="ico">🐍</span><span class="lbl">Snake</span></button>
    <button class="tile focusable" data-href="/glasses/hud/"><span class="ico">🎯</span><span class="lbl">HUD</span></button>
    <button class="tile focusable" data-href="/glasses/flight/"><span class="ico">✈️</span><span class="lbl">Flight</span></button>
    <button class="tile focusable" data-href="/glasses/synth/"><span class="ico">🎹</span><span class="lbl">Synth</span></button>
    <button class="tile focusable" data-href="/glasses/yaro/"><span class="ico">👁️</span><span class="lbl">Yaro</span></button>
    <button class="tile focusable" data-href="/glasses/mykolai/"><span class="ico">🎁</span><span class="lbl">Mykolai</span></button>
  </div>
  <div class="hint">Swipe to move · Pinch to open</div>
</section>

<!-- CLOCK -->
<section class="screen" id="clock">
  <div class="clock-time" id="clockTime">--:--</div>
  <div class="clock-sec" id="clockSec">:--</div>
  <div class="clock-date" id="clockDate"></div>
  <div class="hint">Back = menu</div>
</section>

<!-- COUNTER -->
<section class="screen" id="counter">
  <div class="count" id="countNum">0</div>
  <div class="count-label">tally</div>
  <div class="hint">Pinch / ↑ = +1 · ↓ = −1 · ← = reset · Back = menu</div>
</section>

<!-- DICE -->
<section class="screen" id="dice">
  <div class="dice-row" id="diceRow"></div>
  <div class="dice-total" id="diceTotal">Pinch to roll</div>
  <div class="hint">Pinch = roll · ↑ ↓ = number of dice · Back = menu</div>
</section>

<!-- SNAKE -->
<section class="screen" id="snake">
  <div class="snake-score" id="snakeScore"></div>
  <canvas id="snakeCanvas" width="450" height="450"></canvas>
  <div class="hint">Swipe = steer · Pinch = pause · Back = menu</div>
</section>

<script>
(() => {
  "use strict";

  /* ---------- small helpers ---------- */
  const $ = (id) => document.getElementById(id);
  const rand = (n) => Math.floor(Math.random() * n);
  const load = (key, fallback) => {
    try { const v = localStorage.getItem(key); return v === null ? fallback : JSON.parse(v); }
    catch { return fallback; }
  };
  const save = (key, value) => { try { localStorage.setItem(key, JSON.stringify(value)); } catch {} };

  /* ---------- screen switching ----------
     Each sub-screen gets a history entry, so the glasses' Back gesture
     (Escape key or browser back) always returns to the menu. */
  const tiles = [...document.querySelectorAll(".tile")];
  let current = "menu";
  let lastTile = tiles[0];
  const apps = {};          // per-screen { enter, leave, key }

  function show(name) {
    if (apps[current] && apps[current].leave) apps[current].leave();
    document.querySelectorAll(".screen").forEach((s) => s.classList.toggle("active", s.id === name));
    current = name;
    if (window.GlassesPresence) GlassesPresence.setApp(name === "menu" ? "mini" : name);
    if (name === "menu") lastTile.focus();
    else if (apps[name] && apps[name].enter) apps[name].enter();
  }

  function open(name) {
    history.pushState({ screen: name }, "");
    show(name);
  }

  window.addEventListener("popstate", () => show("menu"));
  history.replaceState({ screen: "menu" }, "");

  tiles.forEach((t, i) => t.addEventListener("click", () => {
    lastTile = t;
    if (t.dataset.href) {                 // HUD and Flight are their own pages; Back returns here
      try { sessionStorage.setItem("minihub.tile", i); } catch {}
      location.href = t.dataset.href;
    } else open(t.dataset.go);
  }));
  try {
    const saved = +sessionStorage.getItem("minihub.tile");
    if (saved > 0 && tiles[saved]) lastTile = tiles[saved];
  } catch {}

  /* ---------- input: Neural Band / captouch arrive as key events ---------- */
  const NAV_KEYS = ["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Enter"];

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      e.preventDefault();
      history.back();
      if (deep) setTimeout(() => { location.href = "/glasses/"; }, 400);   // opened directly: go home
      return;
    }
    if (!NAV_KEYS.includes(e.key)) return;
    e.preventDefault();                        // no scrolling, no double "click"
    if (apps[current] && apps[current].key) apps[current].key(e.key);
  });

  /* Touch / mouse fallback, only for previewing on a phone or computer:
     tap = Enter, swipe = arrow, long-press = Back. (The glasses never send these.) */
  let p0 = null;
  document.addEventListener("pointerdown", (e) => { p0 = { x: e.clientX, y: e.clientY, t: Date.now() }; });
  document.addEventListener("pointerup", (e) => {
    if (!p0 || current === "menu") { p0 = null; return; }
    const dx = e.clientX - p0.x, dy = e.clientY - p0.y, dt = Date.now() - p0.t;
    p0 = null;
    const k = Math.abs(dx) < 30 && Math.abs(dy) < 30
      ? (dt > 600 ? "Escape" : "Enter")
      : Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "ArrowRight" : "ArrowLeft") : (dy > 0 ? "ArrowDown" : "ArrowUp");
    document.dispatchEvent(new KeyboardEvent("keydown", { key: k, bubbles: true, cancelable: true }));
  });

  /* ---------- MENU (4 x 2 grid) ---------- */
  const COLS = 4;
  apps.menu = {
    key(k) {
      let i = Math.max(0, tiles.indexOf(document.activeElement));
      if (k === "Enter") { tiles[i].click(); return; }
      if (k === "ArrowRight" && i % COLS < COLS - 1 && i + 1 < tiles.length) i += 1;
      if (k === "ArrowLeft"  && i % COLS > 0) i -= 1;
      if (k === "ArrowDown"  && i + COLS < tiles.length) i += COLS;
      if (k === "ArrowUp"    && i - COLS >= 0) i -= COLS;
      tiles[i].focus();
    },
  };

  /* ---------- CLOCK ---------- */
  let clockTimer = null;
  function tickClock() {
    const now = new Date();
    // Big HH:MM; AM/PM (only in 12-hour locales) goes on the small line so it never wraps.
    const parts = new Intl.DateTimeFormat([], { hour: "2-digit", minute: "2-digit" }).formatToParts(now);
    const part = (type) => (parts.find((p) => p.type === type) || {}).value || "";
    $("clockTime").textContent = part("hour") + ":" + part("minute");
    $("clockSec").textContent = ":" + String(now.getSeconds()).padStart(2, "0") + (part("dayPeriod") ? " " + part("dayPeriod") : "");
    $("clockDate").textContent = now.toLocaleDateString([], { weekday: "long", day: "numeric", month: "long" });
  }
  apps.clock = {
    enter() { tickClock(); clockTimer = setInterval(tickClock, 1000); },
    leave() { clearInterval(clockTimer); },
  };

  /* ---------- COUNTER ---------- */
  let count = load("minihub.count", 0);
  function renderCount() {
    const el = $("countNum");
    el.textContent = count;
    el.classList.add("bump");
    setTimeout(() => el.classList.remove("bump"), 110);
    save("minihub.count", count);
  }
  apps.counter = {
    enter() { $("countNum").textContent = count; },
    key(k) {
      if (k === "Enter" || k === "ArrowUp" || k === "ArrowRight") count += 1;
      else if (k === "ArrowDown") count = Math.max(0, count - 1);
      else if (k === "ArrowLeft") count = 0;
      renderCount();
    },
  };

  /* ---------- DICE ---------- */
  const PIPS = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };
  let diceCount = load("minihub.dice", 2);
  let diceValues = [];
  let rolling = false;

  function renderDice(rollingNow) {
    const size = { 1: 220, 2: 180, 3: 140 }[diceCount];
    const row = $("diceRow");
    row.innerHTML = "";
    for (let i = 0; i < diceCount; i++) {
      const v = diceValues[i] || 1;
      const d = document.createElement("div");
      d.className = "die" + (rollingNow ? " rolling" : "");
      d.style.width = d.style.height = size + "px";
      d.style.padding = Math.round(size * 0.1) + "px";
      d.style.setProperty("--pip", Math.round(size * 0.17) + "px");
      for (let c = 0; c < 9; c++) {
        const s = document.createElement("span");
        if (PIPS[v].includes(c)) s.className = "on";
        d.appendChild(s);
      }
      row.appendChild(d);
    }
  }
  function rollDice() {
    if (rolling) return;
    rolling = true;
    let frames = 0;
    const spin = setInterval(() => {
      diceValues = Array.from({ length: diceCount }, () => 1 + rand(6));
      renderDice(true);
      if (++frames >= 8) {
        clearInterval(spin);
        rolling = false;
        renderDice(false);
        const total = diceValues.reduce((a, b) => a + b, 0);
        $("diceTotal").textContent = diceCount > 1 ? "Total: " + total : "You rolled " + total;
      }
    }, 60);
  }
  apps.dice = {
    enter() { renderDice(false); },
    key(k) {
      if (k === "Enter") return rollDice();
      if (rolling) return;
      if (k === "ArrowUp" && diceCount < 3) diceCount += 1;
      else if (k === "ArrowDown" && diceCount > 1) diceCount -= 1;
      else return;
      save("minihub.dice", diceCount);
      diceValues = diceValues.slice(0, diceCount);
      $("diceTotal").textContent = diceCount + (diceCount > 1 ? " dice" : " die") + " · pinch to roll";
      renderDice(false);
    },
  };

  /* ---------- SNAKE (wrap-around edges, forgiving for gesture input) ---------- */
  const N = 15, CELL = 30, PX = N * CELL;
  const cv = $("snakeCanvas");
  const ctx = cv.getContext("2d");
  const dpr = window.devicePixelRatio || 1;
  cv.width = PX * dpr; cv.height = PX * dpr;
  ctx.scale(dpr, dpr);

  const DIRS = { ArrowUp: { x: 0, y: -1 }, ArrowDown: { x: 0, y: 1 }, ArrowLeft: { x: -1, y: 0 }, ArrowRight: { x: 1, y: 0 } };
  let snake, dir, turns, food, state, speed, score, loop = null;
  let best = load("minihub.snakeBest", 0);

  function snakeReset() {
    snake = [{ x: 7, y: 7 }, { x: 6, y: 7 }, { x: 5, y: 7 }];
    dir = DIRS.ArrowRight; turns = []; score = 0; speed = 300;
    placeFood(); state = "ready"; drawSnake();
  }
  function placeFood() {
    const free = [];
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++)
      if (!snake.some((s) => s.x === x && s.y === y)) free.push({ x, y });
    food = free.length ? free[rand(free.length)] : null;
  }
  function startLoop() { clearTimeout(loop); loop = setTimeout(stepSnake, speed); }
  function stopLoop() { clearTimeout(loop); loop = null; }

  function stepSnake() {
    if (state !== "play") return;
    if (turns.length) dir = turns.shift();
    const head = { x: (snake[0].x + dir.x + N) % N, y: (snake[0].y + dir.y + N) % N };
    const eats = food && head.x === food.x && head.y === food.y;
    const body = eats ? snake : snake.slice(0, -1);
    if (body.some((s) => s.x === head.x && s.y === head.y)) {
      state = "over";
      if (score > best) { best = score; save("minihub.snakeBest", best); }
      drawSnake(); return;
    }
    snake.unshift(head);
    if (eats) {
      score += 1; speed = Math.max(150, speed - 8); placeFood();
      if (!food) { state = "won"; drawSnake(); return; }
    } else snake.pop();
    drawSnake();
    startLoop();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h);
    ctx.fill();
  }
  function drawSnake() {
    $("snakeScore").innerHTML = "Score <b>" + score + "</b> · Best " + Math.max(best, score);
    ctx.clearRect(0, 0, PX, PX);                       // transparent = see-through
    ctx.strokeStyle = "#33495f"; ctx.lineWidth = 3;
    ctx.strokeRect(1.5, 1.5, PX - 3, PX - 3);
    if (food) {
      ctx.fillStyle = "#ff5ca8";
      ctx.beginPath(); ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL / 2 - 4, 0, Math.PI * 2); ctx.fill();
    }
    snake.forEach((s, i) => {
      ctx.fillStyle = i === 0 ? "#d9ffe5" : "#5cff8a";
      roundRect(s.x * CELL + 2, s.y * CELL + 2, CELL - 4, CELL - 4, 7);
    });
    if (state !== "play") {
      ctx.fillStyle = "rgba(0,0,0,.6)"; ctx.fillRect(0, 0, PX, PX);
      const msg = { ready: ["SNAKE", "Pinch or swipe to start"], paused: ["Paused", "Pinch to continue"],
                    over: ["Game over", "Pinch to play again"], won: ["You win!", "Pinch to play again"] }[state];
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillStyle = "#ffffff"; ctx.font = "700 44px system-ui, sans-serif";
      ctx.fillText(msg[0], PX / 2, PX * 0.25);
      ctx.fillStyle = "#ffd84d"; ctx.font = "22px system-ui, sans-serif";
      ctx.fillText(msg[1], PX / 2, PX * 0.25 + 50);
    }
  }

  apps.snake = {
    enter() { if (!snake) snakeReset(); else drawSnake(); },
    leave() { if (state === "play") state = "paused"; stopLoop(); },
    key(k) {
      if (k === "Enter") {
        if (state === "play") { state = "paused"; stopLoop(); drawSnake(); }
        else if (state === "paused" || state === "ready") { state = "play"; drawSnake(); startLoop(); }
        else { snakeReset(); state = "play"; drawSnake(); startLoop(); }
        return;
      }
      const d = DIRS[k];
      if (state === "over" || state === "won" || state === "paused") return;
      const last = turns.length ? turns[turns.length - 1] : dir;
      if ((d.x === -last.x && d.y === -last.y) || (d.x === last.x && d.y === last.y)) {
        if (state === "ready") { state = "play"; drawSnake(); startLoop(); }
        return;
      }
      if (turns.length < 2) turns.push(d);
      if (state === "ready") { state = "play"; drawSnake(); startLoop(); }
    },
  };

  document.addEventListener("visibilitychange", () => {
    if (document.hidden && current === "snake" && state === "play") { state = "paused"; stopLoop(); drawSnake(); }
  });

  /* ---------- start ---------- */
  // /glasses/mini/?app=clock|counter|dice|snake opens that app straight from the home screen;
  // Back then returns to the home screen.
  const deep = new URLSearchParams(location.search).get("app");
  if (deep && apps[deep] && deep !== "menu") show(deep);
  else lastTile.focus();
})();
</script>
</body>
</html>
