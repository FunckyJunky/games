<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.webmanifest">
<title>Bad command or file name</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #000; touch-action: manipulation; }
  body { display: grid; place-items: center; font-family: VT323, ui-monospace, monospace; }
  .crt {
    width: min(640px, 92vw); padding: 28px 30px; box-sizing: border-box;
    background: #031208; color: #39ff7a; font-size: clamp(18px, 4.6vw, 28px); line-height: 1.25;
    text-shadow: 0 0 6px rgba(57,255,122,.55); border-radius: 16px / 20px;
    box-shadow: 0 0 0 3px #0c0c0c, 0 0 0 7px #161616, inset 0 0 60px rgba(0,0,0,.8);
    position: relative; overflow: hidden; white-space: pre-wrap;
  }
  .crt::after { content: ''; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,.3) 0 1px, transparent 1px 3px); }
  a { color: #031208; background: #39ff7a; text-decoration: none; padding: 0 6px; text-shadow: none; }
  .cur { animation: blink 1.06s steps(1) infinite; background: #39ff7a; }
  @keyframes blink { 50% { opacity: 0; } }
</style>
<script src="/lib/nozoom.js"></script>
</head>
<body>
<div class="crt">C:\&gt;<span id="cmd"></span>
Bad command or file name

C:\&gt;<a href="/">CD \GAMES</a> <span class="cur">&nbsp;</span></div>
<script>
  document.getElementById('cmd').textContent = location.pathname.replace(/^\//, '').toUpperCase().slice(0, 40) || 'RUN';
</script>
</body>
</html>
